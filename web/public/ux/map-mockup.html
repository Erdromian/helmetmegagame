<!doctype html>
<meta charset="utf-8">
<title>Ravenheart travel map — node mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0c1013; --surface:#14191d; --line:#2b3339; --ink:#d7dbd9; --dim:#7d8a90;
  --hot:#e0c468; --move:#87a9bc;
  --zone-fortress:#9c4132; --zone-town:#998d6b; --zone-forest:#7f8c64;
  --zone-hills:#79899b; --zone-marshes:#8d9384; --zone-caves:#939d9e;
  --zone-depths:#8f7f9c;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,sans-serif}
#app{display:flex;height:100%;overflow:hidden}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#side{width:320px;flex:none;border-left:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden}
#side header{padding:14px 16px;border-bottom:1px solid var(--line)}
#side h1{margin:0;font:600 15px/1.3 system-ui;letter-spacing:.02em}
#side h1 small{display:block;font:400 12px/1.4 system-ui;color:var(--dim);margin-top:3px}
.body{padding:14px 16px;overflow:auto;flex:1}
.sect{margin:0 0 18px}
.sect h2{margin:0 0 7px;font:600 11px/1 system-ui;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.k{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
.k b{font-weight:500;color:var(--dim)}
.k span{font-family:var(--font-mono);font-size:12px}
.exit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink);
  padding:6px 9px;margin-bottom:5px;cursor:pointer;font:inherit;font-size:13px}
.exit:hover{border-color:var(--move);background:#1b2226}
.exit .d{width:9px;height:9px;flex:none;transform:rotate(45deg)}
.exit .g{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--hot)}
.exit[disabled]{opacity:.45;cursor:default}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
button.t{background:none;border:1px solid var(--line);border-radius:4px;color:var(--dim);
  padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
button.t:hover{color:var(--ink)}
button.t[aria-pressed=true]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
#log{font-family:var(--font-mono);font-size:11px;color:var(--dim);max-height:140px;overflow:auto}
#log div{padding:1px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:8px;height:8px;transform:rotate(45deg);margin-right:5px}
.node{cursor:pointer}
.node .rh{stroke:#0c1013;stroke-width:4;transition:opacity .15s}
.node text{font:600 21px/1 system-ui;fill:var(--ink);paint-order:stroke;
  stroke:#0c1013;stroke-width:6;pointer-events:none;text-anchor:middle}
.node.far .rh{opacity:.62} .node.far text{opacity:.6;font-size:19px}
.node.adj .rh{stroke:var(--move);stroke-width:6}
.node.here .rh{stroke:var(--hot);stroke-width:8}
.node.sel .rh{stroke:#fff;stroke-width:6}
.edge{stroke:#8b9aa2;stroke-width:4;fill:none;opacity:.55}
.edge.gated{stroke-dasharray:14 11;stroke:var(--hot);opacity:.7}
.edge.on{stroke:var(--move);opacity:1;stroke-width:6}
#ring{fill:none;stroke:var(--hot);stroke-width:2;opacity:.8}
#hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim);
  background:rgba(12,16,19,.8);padding:5px 9px;border-radius:4px}
</style>
<div id="app">
  <div id="stage">
    <svg id="svg"></svg>
    <div id="hint"></div>
  </div>
  <aside id="side">
    <header>
      <h1>Ravenheart <small>travel-graph mockup over the prototype plate</small></h1>
    </header>
    <div class="body">
      <div class="sect">
        <h2>Standing in</h2>
        <div id="hereName" style="font:600 16px/1.3 system-ui;margin-bottom:6px"></div>
        <div class="k"><b>Zone</b><span id="hereZone"></span></div>
        <div class="k"><b>Slug</b><span id="hereSlug"></span></div>
        <div class="k"><b>Draft node</b><span id="hereNode"></span></div>
        <div class="k"><b>Rooms</b><span id="hereRooms"></span></div>
        <div class="k"><b>Pixel</b><span id="herePx"></span></div>
      </div>
      <div class="sect"><h2>Exits</h2><div id="exits"></div></div>
      <div class="sect"><h2>Legend</h2><div class="legend" id="legend"></div>
        <div style="margin-top:7px;font-size:11px;color:var(--dim)">
          A dashed edge is gated — locked, hidden, or a manned checkpoint.‡</div>
      </div>
      <div class="sect"><h2>Trail</h2><div id="log"></div></div>
    </div>
    <div class="bar">
      <button class="t" id="bSurface" aria-pressed="true">Surface</button>
      <button class="t" id="bUnder" aria-pressed="false">Underground</button>
      <button class="t" id="bArt" aria-pressed="true">Plate</button>
      <button class="t" id="bLabels" aria-pressed="true">Labels</button>
      <button class="t" id="bReset">Reset view</button>
      <button class="t" id="bEdit" aria-pressed="false">Nudge</button>
      <button class="t" id="bCopy">Copy coords</button>
    </div>
  </aside>
</div>

const SURFACE = ['fortress','town','forest','hills','marshes'];
const UNDER   = ['caves','depths'];
const ZC = {fortress:'--zone-fortress',town:'--zone-town',forest:'--zone-forest',
            hills:'--zone-hills',marshes:'--zone-marshes',caves:'--zone-caves',
            depths:'--zone-depths'};
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

const N = MAP.nodes, Z = MAP.zones, E = MAP.edges;
const adj = {};
for (const id in N) adj[id] = [];
for (const e of E) { adj[e.a].push(e); adj[e.b].push(e); }
const other = (e, id) => e.a === id ? e.b : e.a;

let layer = location.hash === '#under' ? 'under' : 'surface';  // which half is drawn
let here  = 'square';        // where the pretend character stands
let sel   = null;            // inspected, not travelled to
let showArt = true, showLabels = true, editing = false;
const trail = [];
let view = {x:0, y:0, k:1};  // pan/zoom of the plate

const svg = document.getElementById('svg');
const NS  = 'http://www.w3.org/2000/svg';
const el  = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };

const visibleZones = () => layer === 'surface' ? SURFACE : UNDER;
// Customs is a Caves-level Location whose building is drawn on the surface plate:
// it is the threshold, so it shows on both layers.
const BOTH = new Set(['customs']);
const isVisible = id => BOTH.has(id) || visibleZones().includes(N[id].zone);
const layerOf = id => SURFACE.includes(N[id].zone) ? 'surface' : 'under';

let root, plate;
function draw() {
  svg.setAttribute('viewBox', `0 0 ${MAP.w} ${MAP.h}`);
  svg.innerHTML = '';
  root = el('g', {transform:`translate(${view.x} ${view.y}) scale(${view.k})`});
  svg.append(root);

  plate = el('image', {x:0, y:0, width:MAP.w, height:MAP.h, href:MAP.img,
    opacity:(showArt && layer === 'surface') ? 1 : 0});
  plate.style.imageRendering = 'pixelated';
  root.append(plate);

  const gE = el('g'), gN = el('g');
  root.append(gE, gN);
  const near = new Set(adj[here].map(e => other(e, here)));

  for (const e of E) {
    if (!isVisible(e.a) || !isVisible(e.b)) continue;
    const A = N[e.a], B = N[e.b];
    gE.append(el('line', {x1:A.x, y1:A.y, x2:B.x, y2:B.y,
      class:'edge' + (e.gate ? ' gated' : '') +
            ((e.a === here || e.b === here) ? ' on' : '')}));
  }

  for (const id in N) {
    if (!isVisible(id)) continue;
    const n = N[id];
    const state = id === here ? 'here' : near.has(id) ? 'adj'
                : id === sel ? 'sel' : 'far';
    const g = el('g', {class:'node ' + state, 'data-id':id});
    const r = state === 'here' ? 30 : state === 'far' ? 20 : 26;
    g.append(el('rect', {x:n.x - r, y:n.y - r, width:r*2, height:r*2,
      transform:`rotate(45 ${n.x} ${n.y})`, class:'rh', fill:css(ZC[n.zone])}));
    if (showLabels) {
      const t = el('text', {x:n.x, y:n.y - r - 12});
      t.textContent = n.name;
      g.append(t);
    }
    gN.append(g);
  }
  paint();
}

function paint() {
  const n = N[sel || here];
  document.getElementById('hereName').textContent =
    n.name + (sel && sel !== here ? '  (looking)' : '');
  document.getElementById('hereZone').textContent  = Z[n.zone].name;
  document.getElementById('hereSlug').textContent  = n.id;
  document.getElementById('hereNode').textContent  = n.node ?? '—';
  document.getElementById('hereRooms').textContent = n.rooms;
  document.getElementById('herePx').textContent    = `${n.x}, ${n.y}`;

  const box = document.getElementById('exits');
  box.innerHTML = '';
  for (const e of adj[here].slice().sort((a, b) =>
        N[other(a, here)].name.localeCompare(N[other(b, here)].name))) {
    const to = N[other(e, here)];
    const b = document.createElement('button');
    b.className = 'exit';
    const d = document.createElement('span');
    d.className = 'd'; d.style.background = css(ZC[to.zone]);
    b.append(d, document.createTextNode(to.name));
    if (e.gate) {
      const g = document.createElement('span');
      g.className = 'g'; g.textContent = e.label || e.gate;
      b.append(g);
    }
    b.onclick = () => go(to.id);
    box.append(b);
  }

  const L = document.getElementById('legend');
  L.innerHTML = '';
  for (const z of visibleZones()) {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${css(ZC[z])}"></i>${Z[z].name}`;
    L.append(s);
  }
  document.getElementById('log').innerHTML =
    trail.slice(-40).reverse().map(t => `<div>${t}</div>`).join('');
  document.getElementById('hint').textContent = editing
    ? 'Drag a node to move it, then Copy coords.'
    : 'Click a lit node to travel. Wheel zooms, drag pans.';
}

function go(id) {
  if (id === here) { sel = null; draw(); return; }
  const e = adj[here].find(x => other(x, here) === id);
  if (!e) { sel = id; draw(); return; }
  trail.push(`${N[here].name} → ${N[id].name}` +
             (e.gate ? `  (${e.label || e.gate})` : ''));
  here = id; sel = null;
  if (!isVisible(id)) { layer = layerOf(id); syncButtons(); }
  draw();
}

// --- pan, zoom, drag --------------------------------------------------------
const toWorld = ev => {
  const b = svg.getBoundingClientRect();
  const s = Math.min(b.width / MAP.w, b.height / MAP.h);
  const vx = (ev.clientX - b.left - (b.width  - MAP.w * s) / 2) / s;
  const vy = (ev.clientY - b.top  - (b.height - MAP.h * s) / 2) / s;
  return {x:(vx - view.x) / view.k, y:(vy - view.y) / view.k, vx, vy};
};

let dragNode = null, panning = null;
svg.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('.node');
  if (editing && g) { dragNode = g.dataset.id; }
  else { const p = toWorld(ev); panning = {vx:p.vx, vy:p.vy, x:view.x, y:view.y}; }
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev => {
  if (dragNode) {
    const p = toWorld(ev);
    N[dragNode].x = Math.round(p.x); N[dragNode].y = Math.round(p.y);
    draw();
  } else if (panning) {
    const p = toWorld(ev);
    view.x = panning.x + (p.vx - panning.vx);
    view.y = panning.y + (p.vy - panning.vy);
    root.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
  }
});
addEventListener('pointerup', () => { dragNode = null; panning = null; });
svg.addEventListener('click', ev => {
  const g = ev.target.closest('.node');
  if (g && !editing) go(g.dataset.id);
});
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = toWorld(ev);
  const k = Math.min(6, Math.max(0.6, view.k * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
  view.x = p.vx - p.x * k; view.y = p.vy - p.y * k; view.k = k;
  root.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
}, {passive:false});

// --- controls ---------------------------------------------------------------
const btn = (id, fn) => document.getElementById(id).onclick = fn;
function syncButtons() {
  const set = (id, on) =>
    document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false');
  set('bSurface', layer === 'surface');
  set('bUnder',   layer === 'under');
  set('bArt',     showArt);
  set('bLabels',  showLabels);
  set('bEdit',    editing);
}
btn('bSurface', () => { layer = 'surface'; sel = null; syncButtons(); fit(); });
btn('bUnder',   () => { layer = 'under';   sel = null; syncButtons(); fit(); });
btn('bArt',     () => { showArt = !showArt; syncButtons(); draw(); });
btn('bLabels',  () => { showLabels = !showLabels; syncButtons(); draw(); });
btn('bEdit',    () => { editing = !editing; syncButtons(); paint(); });
btn('bReset',   () => { view = {x:0, y:0, k:1}; draw(); });
btn('bCopy',    () => {
  const out = Object.keys(N).sort().map(k => `    '${k}': (${N[k].x}, ${N[k].y}),`);
  navigator.clipboard.writeText('COORDS = {\n' + out.join('\n') + '\n}\n');
  const b = document.getElementById('bCopy');
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy coords', 1200);
});
addEventListener('keydown', ev => { if (ev.key === 'Escape') { sel = null; draw(); } });

// Frame whichever nodes the current layer shows, so the schematic underground
// fills the pane instead of sitting in one corner of the plate's footprint.
function fit() {
  const ids = Object.keys(N).filter(isVisible);
  if (layer === 'surface') { view = {x:0, y:0, k:1}; draw(); return; }
  const xs = ids.map(i => N[i].x), ys = ids.map(i => N[i].y);
  const pad = 190;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const k = Math.min(MAP.w / (x1 - x0), MAP.h / (y1 - y0));
  view = {k, x:(MAP.w - (x1 - x0) * k) / 2 - x0 * k,
             y:(MAP.h - (y1 - y0) * k) / 2 - y0 * k};
  draw();
}

syncButtons();
fit();
</script>
