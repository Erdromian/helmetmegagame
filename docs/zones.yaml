# The one-shot starting layout for the game's Zones, their Locations and each
# Location's Rooms, pushed with `npm run db:import-zones -- --apply`
# (db/lib/importZones.js). The database is the source of truth now — this
# file is only how a fresh game is stood up. The import is additive-only: an
# entry here creates its Zone/Location/Room by `id` slug if it doesn't exist
# yet and is skipped (reported, not upserted) if it does; it never updates an
# existing row and never deletes one. Editing a Zone, Location or Room after
# it exists is done live at `/gm/dev/zones`, which is also where a place gets
# retired or, for a superadmin, hard-deleted. Keeping Discord true to the
# database afterwards is `db/lib/discordMirror/` (`npm run db:mirror`, or
# "Reconcile now" on the dev panel) — it creates and renames Discord objects
# to match DB rows, but it never deletes one either.
#
# Zones, levels, locations and rooms are maps keyed by `id` (`town:`, not
# `- id: town`). See docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# A ZONE is a region: a Discord category, a #summary channel anyone in the
# zone reads, and a "Zone: {Name}" role. A LOCATION is where a character
# actually STANDS: one text channel under the zone's category. A Location
# wears NO role — the channel is opened to whoever is standing in it by a
# per-member permission overwrite, because 56 locations would otherwise have
# eaten 56 of the guild's 250 roles. A ROOM is a thread under its Location's
# channel — public (a public thread everyone in the Location sees) or private
# (a private thread whose members are exactly the characters holding one of
# its `access:` tag slugs; the bot adds and removes them as tags come and go).
# Every presence zone needs at least one Location, and a Location may have no
# Rooms.
#
# - id: a stable slug, used to match this entry to its DB row across syncs.
#   Zones, locations and rooms share ONE slug namespace.
#
#   **A SLUG IS THE MAP CODE, NOT THE NAME.** A Location's id is its zone
#   plus its system code off the Playscii plate — `town-1`, `fortress-3`,
#   `undertown-a` — and a Room's is its Location's id plus its own number
#   within that Location, in the order they are written here: `town-2-3`,
#   `fortress-4-b`. Codes run 1-9 then a-z, and every zone starts again at 1,
#   which is what the zone prefix is for.
#
#   The point is that a slug never moves. Renaming a place is a `name:` edit
#   and nothing else, so no code constant, test or doc that named the place
#   goes stale — and the plate in docs/assets/maps/nodes.yaml addresses the
#   same places by the same codes, so the map links straight at them with no
#   lookup table in between. Display `name` is entirely free: two rooms may
#   both be called "Street", and the Old Cock Inn is `town-7`.
#
#   The zones not yet renumbered — the Black Hills, the Caves, the Depths —
#   still carry descriptive slugs, and `nodes.yaml` carries a `slug:` override
#   for each. Those go away as each zone's pass lands.
#
#   Renaming an entry
#   later means changing `name` here, NOT `id` — a changed `id` is treated as
#   a brand-new entry (old one pruned, new one provisioned from scratch)
#   instead of a rename. A Location's id is also its Discord channel name.
# - name: display name (Title Case). Only used as the Discord channel/
#   category/role name the FIRST time an entry is provisioned — renaming it
#   here later does not rename already-provisioned Discord objects. The
#   channel doctor matches on these, so keep them plain.
# - description: prose. A Location's is the -# subtext on its channel's
#   pinned anchor and the channel topic; a Room's is its thread's starter
#   message.
# - indoors (locations only): true for a place you walk INTO rather than
#   across. Underground (a Location whose zone kind is CAVE_LEVEL — the Caves,
#   the Depths) a cart or a mount is unequipped on arrival, with a DM, and
#   cannot be equipped while a character stands here — so its carry bonus is
#   parked at the door with it (docs/systemdocs/CARRY.md §3). On the surface
#   this no longer costs anything: a horse and a cart ride into an indoors
#   Location same as the open ground outside it, and `indoors` only keeps
#   answering the roof questions there — the mood dial, whether a palisade
#   can be raised. Where it does park a mount, the anchor
#   message says so in a -# line of its own, written by the anchor builder, so
#   nobody has to be told twice. Default false; a Room never carries it, since a Room
#   is inside its Location by definition.
# - attributes (locations only): a map of extra facts about the place, keyed
#   by the registry in db/lib/locationAttributes.js. Each one the Examine
#   button turns into a sentence. A key the registry does not know is a sync
#   PROBLEM, not a silent skip, because a typo would otherwise be a place that
#   never says what it is. `indoors` is deliberately NOT one of these — it is a
#   real column that mounts and carts act on — but Examine prints it alongside
#   them as though it were.
# - stash (rooms only): what is simply THERE in the room, like the Sanctuary
#   operating theatre's surgical instruments. Two shapes, both accepted:
#
#       stash: [surgical-equipment]          # the short one: each slug, x1
#
#       stash:                               # the long one, with quantities
#         resources: 24
#         items:
#           obol: 3
#           cleaning-powder: 1
#
#   The importer records this on the Room as `stashSeed` but creates no items
#   from it. The items appear when the GAME STARTS — the lobby's Start Game
#   seeds every room's authored stash in one pass (db/lib/roomStashSeed.js), and
#   writes each slug into `Room.seededStashSlugs` as it goes. That list is the
#   whole guard: a slug already in it is never seeded again, so no later
#   import, re-run or press of the editor's "Seed these items now" button can
#   undo a player carrying the anvil off or quietly duplicate it.
#
#   So a stash edited here BEFORE the game opens lands by itself, and one
#   edited after it opens is a job for /gm/dev/zones.
# - structures (locations only): what was simply always STANDING there, like
#   the Square's cross. A flat list of tag slugs that carry a `placement:`
#   block in docs/tags.yaml:
#
#       structures: [crucifix]
#
#   Seeded as one COMPLETE Structure each, with no builder and no payer, and —
#   unlike stash — the importer still does this. Same FLOOR rule as a stash
#   used to be: nothing is created while one of that type is already standing
#   or going up. The importer is additive-only, though, so a razed or
#   abandoned one is NOT re-raised by running it again; that's a job for the
#   editor. Tag slugs are validated against docs/tags.yaml, so on a database
#   that has never had `db:sync-tags` the import warns and skips the
#   structure — run `db:sync-tags` and re-run the import (LAUNCH.md §5 does).
# - access (rooms only): a list of Tag slugs from docs/tags.yaml. Non-empty
#   makes the room PRIVATE, admitting anyone holding ANY of the listed tags.
#   Slugs aren't checked against the tag catalog here (tags sync after
#   zones); a typo is a room nobody can enter, reported by the channel doctor.
# - live (rooms only): a key from the registry in db/lib/roomLive.js. The
#   room's starter message gets one more line, read off live state and
#   re-rendered whenever that state moves — the Railyard saying whether the
#   train is at the platform. A Room's starter is otherwise written once and
#   never touched, so without this a live fact could only live on Examine, one
#   channel up from the room it is about. A key the registry does not know is a
#   sync PROBLEM, the same as an unknown attribute.
# - soundproof (rooms only): true means a shout in here never leaves the
#   room — db/lib/shout.js#soundproofAt reads it, and a Conversation held out
#   on the room inherits it. Prints on the room's own starter as
#   `**Muffled**: shouts do not carry out of here.` A Location is never
#   soundproof itself; only a Room can carry this.
# - phone (rooms only): the NAME of the telephone on this room's wall, as the
#   Phonebook prints it — `phone: "Baron's Phone"`. A name and not a flag.
#   Absent means no phone, which is nearly every room. Its four-digit NUMBER is
#   never written here: it is rolled at every Start Game, and this file is
#   public. See docs/systemdocs/PHONES.md.
# - payphone (rooms only): true makes that phone take an obol into the Keep's
#   Vault to dial out or to answer, each coin buying ten minutes on the line.
#   Requires `phone:`; a payphone with no name is a sync PROBLEM.
#
# PROSE STYLE — every prose value in this file is a `>-` folded block
# scalar, one physical line per paragraph, no hard wrapping, UNLESS it has
# real paragraph breaks, in which case it takes `|-` instead, with ONE blank
# line between paragraphs. An unwritten value is literally `""`.
#
# The dormant `map:` block is gone. It described the retired /map plate's four
# rhombi, and the geography it described no longer exists.
#
# THE SURFACE IS GONE. The setting went fully underground, so the `forest`
# and `marshes` zones were deleted outright with this rework — every place in
# them, and every edge to them. The Godard Factory is the one thing that
# survived the Marshes; it stands in the Black Hills now, which is where the
# plate has always drawn it. The Farms went the other way and became the
# Soilery inside the town walls, which is what its `soilery:` placeholder was
# always waiting for.
#
# The old naming rule — bare slugs for built places, zone-prefixed ones for
# open country — is retired for any zone that has been renumbered. The code
# rule above replaces it. What it was really solving was collisions between a
# ravine here and a ravine there, and a slug that is a coordinate cannot
# collide.
#
# ---------------------------------------------------------------------------
# connections: the whole travel graph. ONE entry per edge — it is undirected,
# and stating it twice is an error the parser catches. A hop between two
# Locations of the SAME zone is free, on the cooldown set on /gm/dev
# (GameConfig.locationMoveCooldownSeconds). A hop whose pair crosses into
# ANOTHER zone costs the character's Move — once a turn, twice with a mount.
# A `kind: group` zone's own id may never appear here; only its levels'
# locations are places.
#
# Two forms. A bare pair is a plain open road, which is most of the map:
#
#   - [town/square, town/cathedral]
#
# Anything else is a mapping. The keys compose, because one edge really is
# two things at once:
#
#   - pair: [fortress/gatehouse, fortress/road]
#     announce: true_name          # a MANNED gate. Posts the crosser's real
#                                  #   name into the destination zone's
#                                  #   #summary. /conceal does not help: there
#                                  #   is a Cerberus here reading papers.
#     announce: concealed          # an UNMANNED gate. Posts only what a
#                                  #   passer-by would have seen — "An old
#                                  #   woman has entered the Gate."
#     locked: <tag-slug>           # crossing needs the tag. LISTED, so a
#                                  #   player sees the door and learns what
#                                  #   opens it.
#     hidden: <tag-slug>           # crossing needs the tag AND the way is
#                                  #   absent from the travel list, so a
#                                  #   player without it never learns it is
#                                  #   there. Refuses in the same words a
#                                  #   nonexistent edge does, deliberately.
#     modular:                     # an Open/Close button on the WATCHTOWER at
#       open: true                 #   the gate. Impassable while shut. Getting
#                                  #   into the tower is the whole permission
#                                  #   model — there is no opener list, so the
#                                  #   tower's `access:` decides who may work
#                                  #   the winch. `open` is what the gate is
#                                  #   BORN as — a re-sync never reopens one
#                                  #   somebody shut in play.
#     on_foot: true                # too tight, steep or enclosed for a horse
#                                  #   or a cart. A MOUNTED character is
#                                  #   dismounted at the threshold.
#     keyed: true                 # on crossing, the KEY-HOLDER is DM'd "Leave
#                                  #   it open for the next 24 hours?". Yes and
#                                  #   the way ignores its tag and shows in
#                                  #   everyone's travel list until the window
#                                  #   lapses — which is how somebody without
#                                  #   the key follows them through. Needs a
#                                  #   locked or hidden tag to hold open.
#     tight_squeeze: true          # a hole no Giant fits through, full stop —
#                                  #   unconditional, not a skill check.
#                                  #   LISTED and refused to anyone holding
#                                  #   the giant tag; nobody else is touched,
#                                  #   but EVERYBODY sees it marked on the
#                                  #   map and in every travel list, so a
#                                  #   party knows where its Giant can't
#                                  #   follow.
#                                  #   Fixed to that one tag — there is
#                                  #   nothing else to author here. Use it
#                                  #   only where a Giant has some OTHER way
#                                  #   round (MAP.md's "Tight squeeze").
#
# `locked` and `hidden` are the same requirement with different visibility, so
# an entry may carry one or the other, never both. Role and Tag slugs are NOT
# validated here, because tags and roles sync AFTER zones (SYNC.md's working
# order) — the same trade the room `access:` list already makes. db:doctor
# checks them instead.
# ---------------------------------------------------------------------------
zones:
  town:
    name: Town
    kind: surface
    sort: 1
    description: >-
      The town of Ravenheart is built on top of itself. Many have basements, and there are stairs everywhere leading down to the Undertown. Decayed electric lights illuminate the narrow streets, while speakers blare the Baron's words.
    locations:
      town-1:
        name: Gatehouse
        description: >-
          A large gate with sharpened bars like spears. A grated metal bridge crosses the moat. There are murder holes in the roof and arrow slits in the walls, sufficient to repel invaders.
        # The Town Gatehouse (Incarn and gates.docx, docs/systemdocs/GATEHOUSE.md).
        # It is no longer the road out: the Bridge and the Square have their own
        # gate between them (`connections:` below), and this is the house that
        # works it. Its one way in is from the Square, behind the gatehouse-key
        # rings. The Gate and the Window open onto the Bridge and the Square as
        # well, so the people inside can talk to the people outside — and take
        # their requests to pass.
        rooms:
          # Request Passage (inward) on the Bridge side, and the finger-prick
          # terminal on either side (db/lib/placeAffordances.js).
          town-1-1:
            name: Gate
            sides:
              - location: bridge
            description: >-
              Great doors of steel loom, keeping the evils out of Ravenheart. A tiny window connects the gatehouse, allowing newcomers to be properly inspected. A small terminal is inlaid into the wall, with a small hole for you to insert your finger into if you are feeling brave. The metal floor of the fort's entryway sounds hollow and almost feels warm to the touch.
          # The lever for the Bridge–Square gate, Grant Passage and Documents.
          # The lever and the documents are anybody's who gets in
          # here; Grant Passage asks for a gatehouse-key ring. This row was
          # the Watchhouse, and keeps its slug and its phonebook.
          town-1-2:
            name: Gate Controls
            description: >-
              A room overlooking the gateway into the fortress. A terminal stands at the centre, allowing travellers to be easily processed, with some levers to the sides controlling the gate. Windows peer down at the bridge below.
            stash: [phonebook]
          town-1-3:
            name: Incarn's Chambers
            access: [incarns-key]
            description: >-
              Tucked inside the interior of the fortress walls is a cramped room with a bunk and a wooden table stained by countless spilt cups of tea.
          # Request Passage (outward) on the Square side.
          town-1-4:
            name: Gatehouse Window
            sides:
              - location: town-2
            description: >-
              A window between the streets of the fortress and the gatehouse gives a small glimpse into the inner machinations of the gate's mechanisms.
      town-2:
        name: Square
        # The public board (docs/systemdocs/PAPERWORK.md). The Square is where
        # everything in Town gets announced, so it is where things get nailed up.
        attributes:
          noticeboard: true
        # The cross the description promises is a real Structure, so the
        # Crucify button works here from day one.
        structures: [crucifix]
        description: >-
          An open clearing with a crucifix in the center. There's a stagnant pond, still and calm aside from the occasional rat seeking water. A solemn gargoyle perches on the central pillar, its eyes long dry since the waterworks broke down.
        rooms:
          town-2-1:
            name: Road
            description: >-
              Black cobblestones surrounded by squat homes. There is a crucifix on a platform. People often come to watch the executions. You can see the Cathedral up ahead, looming large.
          town-2-2:
            name: Courtyard
            description: >-
              A rectangular patch of salted earth. Spectator stands awaiting bloodshed surround it. Perfect place for a duel, competition or random bout of violence!
          town-2-3:
            name: Warehouse
            description: >-
              A long building storing food and other public goods.
            access: [smithy-key, sanctuary-key, barons-key, hands-key, bannerets-key, depot-keycard, soilers-key]
            stash:
              resources: 4
              items:
                cheese: 1
                paper: 12
                hatchet: 1
      town-3:
        name: Soilery
        # The Farms rework this Location's `soilery:` placeholder was waiting
        # for. `stable:` moved with it, onto town-3-3.
        attributes:
          soilery: true
        description: >-
          The soilery is a set of plots and sheds in the recess of the eastern walls. There are also stables with arelitz.
        rooms:
          town-3-1:
            name: Farms
            description: >-
              Low-set vines spread on trellises, mixing in a polyculture of plump helmets, potatoes, and carrots. UV lights powered by the Lifeweb simulate sunlight.
            stash:
              hidden:
                work-knife: 1
          town-3-2:
            name: Silo
            access: [barons-key, soilers-key, hands-key]
            description: >-
              Foodstuffs are stored here.
            stash:
              items:
                foodstuffs: 20
          # The Stable (ARELITZ.md). db/lib/stablePass.js follows the flag, so
          # it needed no code change to move here off the old farms-stable.
          town-3-3:
            name: Stable
            access: [barons-key, soilers-key, hands-key]
            stable: true
            # Three unruly arelitz to start (the Soilery Rework doc; ARELITZ.md).
            stash:
              items:
                unruly-arelitz: 3
            description: >-
              Where the arelitz are kept. Some of them are unruly, while others are tame. It smells like placenta.
      town-4:
        name: Cathedral
        indoors: true
        # The Shackle button works where Dungeons stand (docs/tags.yaml).
        structures: [dungeons]
        description: >-
          Stained limestone erected modestly upon a sedimentary-like stack of ancient buildings. Hundreds of candles light the ornate interior.
        rooms:
          town-4-1:
            name: Bell Tower
            description: >-
              A grand, bronze bell sits up here watching over the town, waiting for a tug from below to let it sound across the land. Some vagrant has painstakingly scraped their initials into it.
          town-4-2:
            name: Confessionals
            description: >-
              Cramped and dark, the confession box was the church's primary source of information until the arrival of the inquisition and their more proactive methods. If the bishop is feeling generous, he may even take your confession free of charge.
          # town-4-3 was the Order Chambers, a room in here. The Order moved
          # out into its own Location, undertown-b, and the room is retired
          # (migration 20261122000000_retire_cathedral_order_chambers). The
          # slug stays unused so it never comes back as some other room.
          town-4-4:
            name: Hall
            description: >-
              Lines of pews illuminated by stained glass, facing an ornate altar.
          town-4-5:
            name: Pantry
            description: >-
              Shelves of bread, oil, and candles.
            access: [cathedral-key, barons-key]
            stash:
              resources: 3
              items:
                cooking-all-you-need-to-know: 1
          town-4-6:
            name: Vestry
            phone: "Bishop"
            description: >-
              The Chaplains and Bishop privately congregate here.
            access: [cathedral-key, barons-key]
            stash:
              items:
                vestments: 2
                cross: 1
          town-4-7:
            name: Scriptorium
            description: >-
              It's a cavern: books and tables immaculately organized, but towards the back, the stench of old books hosting colonies of mold is overwhelming. Every surface is stacked with piles of long forgotten scrawlings of past generations. Holy seals bearing quotes of scripture are stamped haphazardly.
            access: [cathedral-key, barons-key]
            stash:
              items:
                paper: 20
      town-5:
        name: Alleys
        description: >-
          The shadowy alleyways between the homes are safer than anywhere in the Undertown, but still have their occasional shanking incidents. There are tunnels leading down into the sewers.
        rooms:
          town-5-1:
            name: Alleyways
            description: >-
              You can't see much further. You could explore here, but for what purpose?
          town-5-2:
            name: Art Gallery
            access: [tunnel-rat]
            description: >-
              An abandoned art gallery. Its paintings are mostly gone.
            stash: [painting]
          # The other end of the tunnels the Location's description promises.
          # Gated the same way the old Underquarter sewer grate was.
          town-5-3:
            name: Toilets
            access: [sewer, tunnel-rat, sewer-key]
            description: >-
              An old latrine system set up during the 1066 dysentery crisis, leading down into the sewers.
            stash:
              items:
                feces: 4
          # Was `underquarter-basements`, moved here whole when the
          # Underquarter came off the map. The Thanati grants are gone — it is
          # a room you reach by knowing the tunnels now, not a cult's hideout —
          # but the robes are still in the pile.
          town-5-4:
            name: Basements
            access: [caving]
            soundproof: true
            description: >-
              Four connected basements, their separating walls knocked down. Originally some sort of hidden den, this now is a perfect place for organizing. It's accessed through the sewers.
            stash:
              resources: 8
              items:
                sewer-key: 1
                obol: 4
                dagger: 1
                foodstuffs: 4
                paper: 19
              hidden:
                elevator-key: 1
                dagger: 3
                black-robes: 1
      town-6:
        name: Smithies
        # "Some possessing industrial forges" — one standing Forge, so every
        # workshop-gated recipe works here on day one (docs/tags.yaml `forge`).
        structures: [forge]
        description: >-
          A conglomeration of several smithery buildings, some possessing industrial forges.
        rooms:
          town-6-1:
            name: Blacksmiths
            description: >-
              The dull clanging ringing against your ears rises in intensity as you approach. Arms, armor and accoutrements are lined up behind the counter, waiting to be purchased.
          town-6-2:
            name: Storeroom
            access: [smithy-key, barons-key]
            description: >-
              A place to store the smiths' goods.
            stash:
              resources: 16
              items:
                workshop-equipment: 1
                iron: 1
                malachite: 2
      town-7:
        name: The Old Cock Inn
        # `kitchen`: a Lavish meal can be cooked here (COOKING.md) — the Inn's Kitchen, town-7-5.
        attributes:
          haven: true
          kitchen: true
        indoors: true
        description: >-
          The coziest part of Ravenheart, open all hours of the day. It draws people from all walks of life here with the promise of hot food and liquor. Alcohol heals the soul, and will surely help you win the bar fight that is no doubt brewing.
        rooms:
          town-7-1:
            name: Street
            description: >-
              The street outside the inn, where unlucky people end up. There's a porch — a fine place to smoke a cigarette.
          town-7-2:
            name: Bar
            phone: "Inn"
            payphone: true
            description: >-
              Stairs lead down into the general floor. It's cozy, with a pair of braziers opposite from the entrance. There are tables, a bar, and a rage cage (the bars are electrified). Usually for cock fights, but sometimes people get in there too. The Baron mandated that his intercom be installed in here too, which sometimes kills the mood. There's also a stage for minstrels and singers. There's an infoterminal here.
          town-7-3:
            name: Second Floor
            description: >-
              Upstairs, there's a felt-padded, multipurpose game table. It's quieter here. You can look down over the railing and onto the bar. A sign says: "DENNIS'S WING"
          town-7-4:
            name: Balcony
            description: >-
              Sometimes it's busy out here, sometimes relaxing. You can look out onto the streets.
          town-7-5:
            name: Kitchen
            description: >-
              Where the staff hangs out. There's a big oven.
            access: [inn-key]
          town-7-6:
            name: Cellar
            description: >-
              A low roof; you almost hit your head. Shelves and kegs illuminated by wall candles set in a ram's horn.
            access: [inn-key]
            stash:
              resources: 3
              items:
                cheese: 1
                alcohol: 1
                cigarette: 3
                phonebook: 1
          town-7-7:
            name: Room A
            description: >-
              A room to stay.
            access: [room-a-key]
          town-7-8:
            name: Room B
            description: >-
              A room to stay.
            access: [room-b-key]
          town-7-9:
            name: Room C
            description: >-
              A room to stay. Two beds.
            access: [room-c-key]
      town-8:
        name: Residences
        description: >-
          There's no need for pitched roofs underground, so most of the homes here have flat roofs. Chimneys are strictly banned due to the pollution. Some of the homes are boarded up.
        rooms:
          # The Gatehouse turret's gun stands over this room now
          # (db/lib/gatehouseTurret.js). Its switch is still the big red button
          # in the Censor's Office, a zone away.
          town-8-1:
            name: Fortress Stairs
            description: >-
              The fortress is set upon a hill. The stairs started all the way when you first entered the town, but they steeply increase here. A large turret looms above, watching the clearing.
          town-8-2:
            name: Street
            phone: "Residences"
            payphone: true
            description: >-
              The cobblestones outside of the homes.
          town-8-3:
            name: Garage Home
            access: [garage-home-key]
            description: >-
              A home with a winch-powered garage, formerly used as a shopfront. It has a terrace for overlooking the street.
            stash:
              items:
                starting-wares: 1
                old-coin: 1
          town-8-4:
            name: Squat Home
            access: [squat-home-key]
            description: >-
              A small home set into the side of another. It seems to have previously been used as a workshop.
            stash:
              resources: 8
              items:
                workshop-equipment: 1
          town-8-5:
            name: Painted Home
            access: [painted-home-key]
            description: >-
              It was painted green, but the paint is chipping. It has a terrace and a cellar.
            stash:
              items:
                obol: 1
          town-8-6:
            name: Painted Home Cellar
            access: [painted-home-key]
            description: >-
              A place for storing your goods.
            stash:
              items:
                ravenheart-red: 1
          town-8-7:
            name: Large Home
            access: [large-home-key]
            description: >-
              An unusually large home set right next to the fortress stairs. It has a good view of the surroundings.
      town-9:
        name: Sanctuary
        attributes:
          haven: true
        indoors: true
        # It's the hospital — the operating theater standing there always did
        # (medical pass, M3). The Structure itself is Location-scoped, not
        # Room-scoped, but its narrative home is the operating theater room
        # below, which already stashes the portable surgical-equipment.
        structures: [surgical-theater]
        description: >-
          A squat but elegant place built into the ruins of an old fort. Immaculately clean, bathed by light. The Barons funded it with electrical and mechanical equipment, but not all of it works — the wooden contraptions are more reliable.
        rooms:
          town-9-1:
            name: Ward
            phone: "Sanctuary"
            description: >-
              A long, tiled room. There are small bedframes on either side. Potted plants offer the patients a quiet hope.
          town-9-2:
            name: Esculap's Office
            phone: "Esculap"
            description: >-
              Furnished with wood, the office stands in stark contrast to the sanitized aesthetics of the rest of the Sanctuary. Shelves on the wall are lined with glassware and bottles containing hundreds of different reagents.
            access: [sanctuary-key, barons-key]
            soundproof: true
            stash:
              items:
                paper: 15
          town-9-3:
            name: Operating Theater
            description: >-
              A small room, windowless. A single surgery bed rests at the centre, surrounded by tables with all manner of instruments neatly arranged. An anaesthetic system is hooked up to the surgery bed, mercifully letting patients sleep through the operation. A freezer box sits in the corner awaiting generous organ donations.
            access: [sanctuary-key, barons-key]
            stash: [surgical-equipment]
          town-9-4:
            name: Supply Storage
            description: >-
              Neatly organized shelves, labeled, archived, illuminated by standardized electric lights. Possibly the most valuable place in Ravenheart.
            access: [sanctuary-key, barons-key]
            stash:
              resources: 24
              items:
                obol: 15
                cleaning-powder: 1
                surgical-equipment: 2
          town-9-5:
            name: Garden
            description: >-
              A nice place to sit and think.
      town-a:
        name: Graveyard
        description: >-
          The citizens of Ravenheart are buried here, usually with small wooden crucifixes. There are a couple of mass graves dug during previous calamities, when the Mortii couldn't keep up.
        rooms:
          town-a-1:
            name: Paths
            description: >-
              A path going through the graves. Plants manage to grow.
          town-a-2:
            name: Shrine to a Maiden
            description: >-
              It reads: PRISCILLA, 1013. Blessed are the pure in heart, for they shall see God.
  fortress:
    name: Fortress
    kind: surface
    sort: 2
    description: >-
      The fortress rises imposingly from a stone hill. The castle of Ravenheart was built a hundred years ago by Baron Casimir the Great, and has withstood many assaults from foul creatures. Its windows are barred by metal. Shrubby trees grow around its sides.
    locations:
      fortress-1:
        name: Garrison
        attributes:
          noticeboard: true
        # The Shackle button works where Dungeons stand (docs/tags.yaml).
        structures: [dungeons]
        description: >-
          The garrison tower and its offshoot buildings surround the training yard. A home for those who walk the cobbles at night.
        rooms:
          # The counter you talk to the garrison across. The only room here
          # anybody may simply walk into — everything past it is Cerberon.
          fortress-1-1:
            name: Entrance
            description: >-
              A wolf's head hangs over the counter, which is separated from the room by metal bars. There's a bust of a former baron.
          # The big red button is the turret's switch. The gun itself stands
          # over the Residences now (db/lib/gatehouseTurret.js); the switch
          # deliberately did not move with it.
          fortress-1-2:
            name: Censor's Office
            phone: "Censor"
            access: [censors-key, cerberus-key, barons-key]
            soundproof: true
            description: >-
              The Censor's office is spacious, with a small portrait of his beloved Baron perched on the wall. A caged window looks out over the training ground below. There is a big red button on the wall.
            stash:
              items:
                paper: 8
                phonebook: 1
          fortress-1-3:
            name: Barracks
            access: [cerberus-key, barons-key]
            description: >-
              Rows of bunks stand at attention. All but a handful are orderly and unused, might be a sign it's time to find some new recruits.
            stash:
              items:
                cigarette: 1
                radio-bracelet-cerberon: 2
                phonebook: 1
          # No door, deliberately. The Cerberon's goods sit in the open, where
          # anybody standing in the hall can walk off with them — the room is
          # the Garrison's common one, not a strongroom. A cerberus-key on it
          # would also be a key that works every gate in the game, handed out
          # for the sake of a bar and some tables.
          fortress-1-4:
            name: Mess Hall
            description: >-
              The Cerberon's few goods are stored here. There are tables, a bar, and a window looking into the courtyard.
            stash:
              hidden:
                resources: 2
                alcohol: 1
          fortress-1-5:
            name: Armory
            description: >-
              Gargoyles flank a statue of the good Baron Casimir the Great. Halberds, shields mounted on the walls, and a single electric chandelier hanging from the rafters.
            access: [armory-key, barons-key]
            stash:
              items:
                radio-bracelet-cerberon: 3
                truncheon: 4
                halberd: 2
                broadsword: 1
                gladius: 2
                mace: 3
                dagger: 2
                spear: 3
                buckler: 4
                shield: 3
                longbow: 2
                breastplate: 2
                simple-helm: 4
                cerberus-helmet: 4
                mail-coif: 3
                mail-shirt: 4
                padded-armor: 5
                padded-cap: 3
                phonebook: 1
          fortress-1-6:
            name: Dungeons
            access: [censors-key, incarns-key, cerberus-key, barons-key]
            soundproof: true
            description: >-
              Rows of cells behind iron bars, each with a lock only accessible by members of the garrison.
          fortress-1-7:
            name: Training Yard
            access: [cerberus-key, barons-key]
            description: >-
              In the garrison's central courtyard, surrounded by elevated platforms, a patch of packed earth serves as a sparring ground for recruits and veterans alike. There is a box of wooden training weapons.
            stash:
              items:
                truncheon: 4
          # No stash, on purpose. The Garrison's two hounds and its arelitz
          # start with the Censor and the Incarn (docs/roles.yaml), so the
          # first Cerberus through the door cannot ride off with them.
          fortress-1-8:
            name: Stables
            access: [cerberus-key, barons-key]
            description: >-
              A small stable. Most of the pens are empty. Those that aren't have old horses, lame and unable to bear the weight of a human. Good and mean dogs both are caged along the back wall, ready to hunt unruly peasants.
      # The Keep's gatehouse, renamed the Courtyard (Incarn and gates.docx).
      # The slug stays, as slugs always do.
      fortress-2:
        name: Courtyard
        attributes:
          noticeboard: true
        description: >-
          Grass rises rebelliously around the manicured paths, illuminated by searchlight. Past the portcullis, old stone stairs rise towards the Court, and further yet, to the Keep. The Gatehouse itself has several watchtowers and a murder hole over the gate. A winch system controls the portcullis.
        rooms:
          fortress-2-1:
            name: Gate
            description: >-
              Menacing iron, with several inset windows, built by a paranoid man. There are old logs to the side, piled and bound.
          fortress-2-2:
            name: Yard
            description: >-
              A former baroness raised vines across the fortress walls, which flower white and pink.
          # The portcullis is no longer worked from here: its gate button is on
          # the Courtyard's and the Residences' own anchors, and it answers to a
          # ring carrying portcullis-key (db/lib/gateControls.js).
          fortress-2-3:
            name: Watchtower
            access: [cerberus-key, cerberon, knighted, barons-key, hands-key, censors-key]
            description: >-
              A pair of thin, menacing watchtowers lined with spikes and draped with the Raven banner.
      fortress-3:
        name: Court
        attributes:
          haven: true
        indoors: true
        # "Stairs lead down into the Undercroft" — Bascinet wrote Underquarter,
        # which came off the map in this rework; the Undercroft is what the
        # stairs from here actually reach (see `connections:`).
        description: >-
          The interiors are kept warm and vibrant by old electric apparati. It's a haven away from the caves, comfortable, decked with pigtail rugs. Raven banners reminds the court of its lineage. Gargoyle-studded columns lead to the first room: the throne room. Stairs lead down into the Undercroft and further up into the keep.
        rooms:
          fortress-3-1:
            name: Throne Room
            description: |-
              Intimately small, with an ornately carved wooden throne. The floor is uniformly tiled with ceramite bricks aside from a trapdoor directly in front of the throne. Benches form concentric circles near the entrance. There's an elevated arcade to the left, and a hearth to the right.

              There's a trapdoor in the center. You can hear something rumbling in the darkness.
          fortress-3-2:
            name: Nook
            access: [behind-the-painting]
            description: >-
              An empty room. It has unfinished sketches of a nude man in various poses across the walls.
          fortress-3-3:
            name: Great Hall
            description: >-
              The roof vaults over rows of banqueted tables. There's a balcony; the view plunges downwards onto the town. There is a huge painting of Baron Casimir the Great.
          fortress-3-4:
            name: Terrace
            description: >-
              A sprawling terrace with herbs, flowers, and even a mini-hedge maze. The perfect place for a nighttime party.
          # The far end of the throne room's trapdoor. `in-the-pit` is GM-given
          # on the way down, which is the only way anybody arrives.
          fortress-3-5:
            name: Graga Pit
            access: [in-the-pit]
            description: >-
              A wet room. It smells like rotting bodies.
            stash:
              items:
                human-flesh: 1
                bone: 3
          fortress-3-6:
            name: Chapel of the Silver Cross
            description: >-
              Courtiers come here to pray. The Silver Cross of Ravenheart is locked away behind the altar, accessible by the Incarn's key.
          fortress-3-7:
            name: Cross Room
            access: [incarns-key]
            description: >-
              Behind the chapel, the cross itself is stored in an ornate altar.
            stash: [silver-cross]
      fortress-4:
        name: Keep
        # `kitchen`: the Keep's Kitchen, fortress-4-8 (COOKING.md).
        attributes:
          haven: true
          kitchen: true
        indoors: true
        description: >-
          Reinforced with ceramite, it has survived many assaults. A balcony overlooks the town. The interiors are less spacious than the Court's, but substantially more mazelike and defensible.
        rooms:
          fortress-4-1:
            name: Council Room
            access: [barons-key, hands-key, meisters-key, censors-key]
            description: >-
              A wide table. There's a holographic map of Ravenheart and a button for the intercom.
            stash:
              items:
                paper: 4
                phonebook: 1
          fortress-4-2:
            name: Library
            description: >-
              Rows upon rows of bookcases, most of which lie empty. Various offices of members of the court branch off from here.
            stash:
              items:
                paper: 23
                the-wise-plague-doctor: 1
                100-years-of-solitude: 1
                the-art-of-war: 1
                flatbreads-sweet-breads-and-red-breads: 1
                pancakes-cupcakes-and-cake-cakes: 1
                pastrys-crumblys-and-pies: 1
                the-bird: 1
                nillum: 1
                amour-et-socialisme-translated: 1
                a-murmur-darkly-last-call: 1
                a-murmur-darkly-aches-and-pains: 1
                10001-things-to-do-with-your-pet-rat: 1
                magical-code-of-regulations-part-xxxii: 1
                sword-in-high-heavens: 1
                basic-strategy: 1
              hidden:
                caspians-diary: 1
                prophecies-of-sir-thomast: 1
          # Was one "Noble Chambers". Three rooms now, each with its own key —
          # and the Baron's opens all three, which is rather the point of being
          # the Baron. The Baroness's key opens his chambers alone.
          fortress-4-3:
            name: Baron's Chambers
            access: [barons-key, baroness-key]
            description: >-
              The Baron's room opens into a large, ornately decorated bedroom with a stunningly comfortable bed at the center. A wardrobe built into the wall contains all manner of fine attire for both the Baron and Baroness.
            stash:
              items:
                obol: 19
                paper: 2
                dagger: 1
          fortress-4-4:
            name: Heir's Chamber
            access: [heirs-key, barons-key]
            description: >-
              Small and austere, with a map.
            stash:
              items:
                obol: 2
                broadsword: 1
          fortress-4-5:
            name: Successor's Chamber
            access: [successors-key, barons-key]
            description: >-
              A dresser and a mirror to allay her vanity.
            stash:
              items:
                obol: 1
                tea: 1
                love-lies-and-lays-of-larry-luca-life-1-royal-loyal-lynn: 1
          fortress-4-6:
            name: Baron's Study
            phone: "Baron's Phone"
            access: [barons-key]
            description: >-
              Scrolls, books, and the elegant skeleton of a cave beast. A balcony looks out onto Ravenheart.
            stash:
              items:
                elevator-key: 1
                paper: 20
                phonebook: 1
          fortress-4-7:
            name: Storehouse
            access: [barons-key, hands-key, servant-key]
            description: >-
              A larder and a cellar combined in one, holding the keep's goods.
            stash:
              resources: 3
              items:
                foodstuffs: 4
                paper: 5
                phonebook: 1
          fortress-4-8:
            name: Kitchen
            access: [barons-key, hands-key, servant-key]
            description: >-
              An industrial operation, with racks of ovens, a heavy granite table, and thick cleavers.
            stash: [work-knife]
          fortress-4-9:
            name: Workshop
            access: [barons-key, hands-key, servant-key]
            description: >-
              A place to sew, do laundry, and build simple things.
            stash: [workshop-equipment]
          # The second `destroys` room in the game, after the Factory's
          # Spillway. See docs/systemdocs/CARRY.md.
          fortress-4-a:
            name: Latrines
            description: >-
              A chute into the darkness. Anything stored here is lost permanently.
            destroys: true
          fortress-4-b:
            name: Servant's Quarters
            access: [servant-key, servant, barons-key, hands-key]
            description: >-
              It has bunked cots and a long table for the servants to share their meals.
            stash:
              items:
                cigarette: 1
                obol: 2
          # The sealed gate that used to stand here is gone. The Charon is a
          # real place now — fortress-6, below — and the Panic Room's own
          # button is the only door into it (docs/systemdocs/CHARON.md).
          fortress-4-d:
            name: Panic Room
            access: [barons-key, baroness-key]
            description: >-
              A hidden room for the Baron and Baroness to lie in wait should everything go wrong. It connects to the Charon.
            stash:
              items:
                ration-box: 3
                tinned-butter: 1
                paper: 3
          # The upper end of the Baron's lift; the cage at the bottom is in
          # the Refuse Pit. The edge itself is `hidden: elevator-key`.
          fortress-4-e:
            name: Elevator Room
            access: [elevator-key]
            description: >-
              A cage suspended over the darkness. Use the pressure plate to descend.
      fortress-5:
        name: Tower
        indoors: true
        description: >-
          A tall, solitary tower.
        rooms:
          fortress-5-1:
            name: Alchemist's Room
            access: [tunnel-rat, medical-expert]
            description: >-
              An abandoned room with medical components.
            stash:
              resources: 5
              items:
                graga-sac: 1
                cave-fungus: 1
                eth-lod: 1
              hidden:
                antibiotics: 1
                antidote: 1
                mulligan-potion: 1
          # The Meister's Terminal is on this room's wall (docs/systemdocs/MEISTERY.md),
          # and these keys are its gate: the Baron's, the Hand's and the Meister's rings.
          fortress-5-2:
            name: Meister's Study
            phone: "Meister"
            access: [meisters-key, hands-key, barons-key]
            soundproof: true
            description: >-
              A narrow office.
            stash:
              items:
                paper: 25
                states-of-matter: 1
          fortress-5-3:
            name: Hand's Study
            phone: "Hand"
            access: [hands-key, barons-key]
            soundproof: true
            description: >-
              A narrow office.
            stash:
              items:
                paper: 7
                cleaning-powder: 1
          # Meistery.docx: townsfolk speak with the Meister through it. Private
          # from the Tower (the three rings that work the terminal), public from
          # the Square; things pass through the hole in the glass
          # (docs/systemdocs/MEISTERY.md §2, MAP.md §2d). A running game got it
          # from migration 20261120000000_meistery, onto the Residences, and
          # 20261126000000_meistery_window_square moved it to the Square.
          fortress-5-4:
            name: Meistery Window
            access: [meisters-key, hands-key, barons-key]
            sides:
              - location: town-2
            description: >-
              At the bottom of one of the keep's many spires is a small, barred window level with the streets of the town. Inside sits the Meister's office. A small hole cut through the reinforced glass allows things to be passed through.
      # The ship, drawn one tile above the Keep on the barony1 plate. It has
      # NO entry in connections: below, on purpose — there is no road to it
      # and no edge to light it up, so it shows on the map only for the three
      # people who start knowing it is there (db/lib/startingMemories.js).
      # The way in is the Panic Room's own button, and the way out is the
      # Leave button on this Location. See docs/systemdocs/CHARON.md.
      fortress-6:
        name: Charon
        indoors: true
        description: >-
          A ship capable of taking its occupants to outer space. Its interiors are sleek and functional. It is the last option.
        rooms:
          fortress-6-1:
            name: Cockpit
            description: >-
              There's a terminal.
          fortress-6-2:
            name: Habitation
            description: >-
              A comfortable room. You hear the life support systems working.
            stash:
              items:
                tinned-butter: 10
      # The Undercroft is a FORTRESS Location, down the Court's stair. It was
      # in the Undertown until 2026-09-23, which made every trip down to the
      # Baron's own cellars a zone crossing — a Move each way for anybody who
      # lives in the Keep. Now the stair is a free hop and the two ways OUT
      # of the cellars (the pipes into the Hollows, the cellar door into the
      # Old Town) are the crossings that cost. The slug stays `undertown-1`:
      # it is the cell the barony2 plate draws it on (docs/assets/maps/
      # nodes.yaml), `undertown-1-7` is the Vault in db/lib/bankAccounts.js,
      # and a slug is a coordinate, not a zone (MAP.md §6g).
      undertown-1:
        name: Undercroft
        indoors: true
        description: >-
          Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
        rooms:
          undertown-1-1:
            name: Sauna
            description: >-
              A bath and a sauna. The Baron's preferred way to wash. The water is kept at a comfortably warm temperature, and is actually changed, unlike the public bathhouse.
          undertown-1-2:
            name: Cistern
            description: >-
              Dark, connected rooms with ornate pillars, full of knee-high water. A starry tile mosaic is visible beneath the water.
          undertown-1-3:
            name: Tombs
            description: >-
              The Baron's progenitors bear faces of varying humanity.
          undertown-1-4:
            name: Bricked-up Door
            description: >-
              Where does this go…? It wouldn't be easy to open this passageway.
          undertown-1-5:
            name: Ancient Shrine
            description: >-
              A shrine to Thoth, the Old God of art, magnificence, and inspiration. How has this not been destroyed yet?
          undertown-1-7:
            name: Vault
            access: [barons-key]
            description: >-
              A hydraulically-operated electric vault door seals off a deep room.
            stash:
              resources: 14
              items:
                # NO OBOLS HERE, on purpose. The town's money is stocked as the
                # town is made: each starting character's bank balance puts
                # GameConfig.vaultReservePercent of it into this room as coin
                # (25% by default, a knob on /gm/dev; the Baron's is left out,
                # and nobody who arrives after the Start Game roll adds any).
                # So the Vault opens holding that share of what the town started
                # with — DELIBERATELY SHORT OF THE CLAIMS, so a bank run is a
                # live possibility from day one. Every Treasury bank account is
                # a claim on this pile and nothing else, the infoterminal refuses rather
                # than clamps, and the money goes to whoever walks up first.
                # Do not add an `obol:` line back: Start Game would pour it on
                # top of the stock. See docs/systemdocs/DEPOT.md §0g, and
                # `npm run db:audit-vault-backing` for the ratio.
                painting: 1
                # The Hand's old one. Anybody who can already open the Vault
                # can have the run of the lift too — that is a short list, and
                # it is the Baron's own door either way.
                elevator-key: 1
  # The town under the town. Codes 1-H come from the barony2 plate in
  # docs/assets/maps/nodes.yaml, and every one of them has a Location so the
  # map can link to a real place — code 1, the Undercroft, is drawn on this
  # plate but lives in the Fortress above. Most are SKELETONS on purpose — a name
  # and a slug and nothing else — because Bascinet has not written the
  # Undertown's rooms yet. The two that arrived with prose already attached
  # (the Lifeweb out of the Fortress, the Depot out of the Caves) kept
  # theirs. An unwritten description is literally "".
  undertown:
    name: Undertown
    kind: surface
    sort: 3
    description: >-
      The Undertown is built below Ravenheart. It's where the population's poorer live. It's mostly built out of concrete and steel, with elements of ceramite below the keep. There are many forgotten rooms.
    locations:
      # The quarter that burnt. Nobody lives here, and the town says it is
      # cursed, which is most of why nobody has picked it over — the Burnt
      # Home is behind `tunnel-rat` and the cellar under it behind a key found
      # in that home, so the loot at the bottom is two gates deep.
      undertown-2:
        name: Old Town
        indoors: true
        description: >-
          Homes that were destroyed during a fire, this area is mostly uninhabited now and believed to be cursed.
        rooms:
          undertown-2-1:
            name: Streets
            description: >-
              Pillars uphold the roof from caving in. Old, burnt paneling barely separates homes that are glued together.
          undertown-2-2:
            name: Boiler Room
            description: >-
              Water is pumped from the lake and boiled here, supplying the Fortress with warm water.
          # Three keys rather than one: the cellar below is worth opening more
          # than once, and a single key would make the whole chain hostage to
          # whoever got here first.
          undertown-2-3:
            name: Burnt Home
            access: [tunnel-rat]
            description: >-
              A destroyed home, previously belonging to a merchant.
            stash:
              items:
                burnt-home-key: 3
              hidden:
                depot-keycard: 1
          undertown-2-4:
            name: Destroyed Cellar
            access: [burnt-home-key]
            description: >-
              The cellar caved in during the fires, trapping a mass of corpses. It seems nekkers came to scavenge here but were killed during a bloody fight.
            stash:
              items:
                nekker-corpse: 2
                mail-coif: 1
              hidden:
                longbow: 1
                gladius: 1
      undertown-3:
        name: Lifeweb
        description: >-
          The central machine awaits someone to plug into the seat. There are cords, ancient generators, and opaque tanks, all working in a mysterious way. Maintenance tunnels lead further inwards.
        attributes:
          noBuild: true
        # Seeded despite noBuild — nobody builds Dungeons; the sync warns and
        # seeds anyway. The Shackle button works here.
        structures: [dungeons]
        rooms:
          undertown-3-2:
            name: Inner Lifeweb
            description: >-
              Pistons and machinery connect to pumps and tubes, all terminating in the chair in the center of the room. Strap someone in, adjust the ventricles, prepare the injection site, and decide whether to drain them fully or leave them alive. Sealed hatches lead into maintenance tunnels.
          undertown-3-3:
            name: Mortus Shacks
            access: [mortus-key]
            description: >-
              Tucked into the wall. The Baron tolerates their presence, as pitiful as they are.
            stash:
              items:
                obol: 1
                paper: 4
                hatchet: 1
                cudgel: 1
                mortus-rags: 1
                shovel: 3
                corpse-salts: 1
                phonebook: 1
      undertown-4:
        name: Sewer
        indoors: true
        description: >-
          Automated machines used to provide plumbing, but now it's still and dirty. The sewer grate is locked.
        rooms:
          undertown-4-1:
            name: Sewage Flows
            description: >-
              Long pipes of sewage. Because it's no longer used, it doesn't smell as bad as you'd think. There are all sorts of side rooms.
            stash:
              items:
                feces: 8
          # Behind `tunnel-rat` rather than the Sewer Key: the grate is the
          # Lifeweb's door, and this is the room you reach by knowing the
          # pipes instead. Whoever used to meet here got in the same way.
          undertown-4-2:
            name: Grated Room
            access: [tunnel-rat]
            description: >-
              A room filled with crates. It overlooks the sewage pipes. It seems people used to gather here, because there are discarded clothes and robes, and a banner that says "LIBERACIÓN!"
            stash:
              items:
                flooded-crate: 1
              hidden:
                obol: 12
      # The freight end of the station: the platform and the train, the
      # Merchant's Terminal (a Location fixture, db/lib/placeAffordances.js),
      # the noticeboard, and since the Depot Overhaul the Merchant's Office
      # and the Cargo Bay. The Storefront's Merchant's Counter opens onto it
      # as well (a multi-locational room, MAP.md §2d). db/lib/train.js names
      # the Railway and db/lib/depot.js#INFOTERMINAL_ROOM_SLUGS its cash machine.
      undertown-5:
        name: Depot
        indoors: true
        attributes:
          depot: true
          noticeboard: true
        description: >-
          Sometimes, wealthier migrants arrive here, but mostly it's for cargo goods.
        rooms:
          # PUBLIC on purpose, and eyes open: crates land here, so anybody
          # can walk in and carry one off. That is a known hole nobody has
          # closed yet — the alternative was a cargo room only Dockers could
          # reach, which defeats opening the counter up in the first place.
          undertown-5-1:
            name: Railway
            phone: "Depot"
            payphone: true
            live: train
            description: >-
              Rusted overhangs, overgrown with wilted, sunthirsted vines, occlude the cargo hub. A deep railway bisects the platforms. Every other turn, a cargo train rolls in.
          # The Merchant's own two rooms moved here from the Storefront next
          # door with the Depot Overhaul (DEPOT.md §0a): the office with the
          # gun's red button, and the bay the crates are packed in. They keep
          # their undertown-6-* slugs, because a slug is an id and code names
          # both (db/lib/train.js, db/lib/wantedPoster.js).
          #
          # Nothing put down in the Railway or the Cargo Bay ever sinks under
          # the floor (db/lib/floorSettle.js#NEVER_SINKS_ROOM_SLUGS).
          undertown-6-2:
            name: Merchant's Office
            access: [merchants-license]
            soundproof: true
            description: >-
              A desk, filing cabinets, and a big red button.
            stash:
              items:
                paper: 32
                phonebook: 1
          undertown-6-3:
            name: Cargo Bay
            access: [depot-keycard]
            description: >-
              Shelves on either side, stacked high with crates.
            stash:
              resources: 4
              items:
                cheese: 1
                obol: 10
                cargo-crate: 1
                paper: 6
                # The Company's own crating bench, alongside the Factory's
                # in factory-logistics-room. The Depot sells the crates and
                # the Merchant fills them, so the outfit that ships the
                # goods can pack them without walking to the Black Hills.
                # Untradeable, so it is a fixture here and weighs nothing —
                # see the note on the tag in docs/tags.yaml.
                packaging-equipment: 1
      # The Merchant's shop front, moved out of the Caves with the rest of the
      # town and then out of the Depot itself. Called "Merchant" until the
      # Depot Overhaul renamed it; its office and cargo bay went back to the
      # Depot then, and the way through is locked to the Merchant's and the
      # Dockers' rings (connections: below). What joins the two is the
      # counter: the Merchant's Counter opens onto both.
      undertown-6:
        name: Storefront
        indoors: true
        description: >-
          Warm incandescent lights beckon travelers over a cave-river into the rusted, metal depot. It's bedecked in furs, banners, and comfortable chairs.
        rooms:
          # A multi-locational room (MAP.md §2d): anybody in the Storefront or
          # in the Depot stands at it, and Transfer reaches a person on the
          # other side of it (CARRY.md §6). Its fixtures — the vending machine
          # and the infoterminal — stay on the Storefront's side.
          undertown-6-1:
            name: Merchant's Counter
            vending: true
            sides:
              - location: undertown-5
            description: >-
              An unwashed rug and shelves with various goods, and also a bar for boozing up the patrons before they decide to buy. A vending machine stands against one wall, its front glassed over. A shutter can be raised and lowered to close the windows and protect the door. There's a turret on the roof. Stairs lead down to the railyard.
            stash:
              hidden:
                tea: 1
                sugar-candy: 1
      # The shelter, and the one place in the Undertown that asks nothing of
      # anybody. The key is lying in the bunks where anyone can pick it up —
      # it only opens the kitchen, and the food in there is the whole point of
      # it being findable.
      undertown-7:
        name: Poorhouse
        # `kitchen`: the Soup Kitchen, undertown-7-2 (COOKING.md).
        attributes:
          kitchen: true
        indoors: true
        description: >-
          A large shelter, cobbled together with some coherence with donations from the town long ago in times when such reckless expenditures could be afforded.
        rooms:
          undertown-7-1:
            name: Bunks
            description: >-
              Blankets sewn together from scraps of cloth adorn the handful of remaining rusting bedframes. Most here simply sleep on the floor.
            stash:
              hidden:
                poorhouse-key: 1
          undertown-7-2:
            name: Soup Kitchen
            access: [poorhouse-key]
            description: >-
              A simple cookhouse with everything needed to cook the most basic of meals.
            stash:
              items:
                foodstuffs: 10
          # The near end of the dug-through wall. The far end is the Hole in
          # the Wall, and the edge between them is `hidden: tunnel-rat`.
          undertown-7-3:
            name: Passage
            description: >-
              Tight and cramped, whoever went to the effort of digging through the wall was clearly not claustrophobic.
      # The Exactor's house, and the one place in the Undertown that is open
      # to anybody with coin. Three seats start standing in it (the Exactor,
      # the Pusher and the Courtesan, docs/roles.yaml), which is why it is the
      # first of the Undertown skeletons to get written.
      undertown-8:
        name: Den
        indoors: true
        description: >-
          The den's comfortable interior is separated by wooden dividers, sectioning off the booths from the hookah lounge and the bar. For the client's comfort, all the lights are dimmed, and there's soft music playing. There's private rooms further in.
        rooms:
          # The jukebox is a button on this room's starter post, not a stash
          # item — db/lib/jukebox.js, and the whole Den and Den Interior hear
          # it (docs/systemdocs/SOUND.md §6c).
          undertown-8-1:
            name: Bar
            phone: "Den"
            payphone: true
            description: >-
              You can buy all sorts of things here. There's a cash machine bolted to the wall at the end of the counter.
            stash:
              hidden:
                alcohol: 4
                cigarette: 6
          undertown-8-2:
            name: Dressing Room
            access: [courtesans-key]
            description: >-
              A room with mirrors and clothes, for preparing yourself before meeting customers.
            stash:
              items:
                bar-soap: 2
                perfume: 4
                cigarette: 1
                disguise-kit: 1
                phonebook: 1
          # The slot machine is a button on this room's starter post, not a
          # stash item — db/lib/slotMachine.js, and the affordance that draws
          # it in db/lib/placeAffordances.js.
          undertown-8-3:
            name: Casino
            description: >-
              A felt table for playing with dice. There's also a slot machine.
          undertown-8-4:
            name: Room A
            access: [room-a-key-den]
            description: >-
              A comfortable but cramped room.
          undertown-8-5:
            name: Room B
            access: [room-b-key-den]
            description: >-
              A comfortable but cramped room.
      # Behind the Den Key, and shuttable from inside: the edge up to the Den
      # is `modular:` and its winch is the Exactor's Office below, which is the
      # only room in the game that works a gate without being a watchtower.
      undertown-9:
        name: Den Interior
        indoors: true
        description: >-
          Stairs descend into a converted basement.
        rooms:
          undertown-9-1:
            name: Dining Room
            description: >-
              An unusually normal dining room, where the Den's staff meets and talks.
            stash:
              hidden:
                ration-box: 1
          # The Pusher's homebase. It wears no `access:` of its own — the whole
          # basement is already behind the Den Key, and the Pusher's Key it
          # used to want was removed from the game with this pass.
          undertown-9-2:
            name: Drug Lab
            description: >-
              The Pusher's homebase.
            stash:
              items:
                cave-fungus: 2
              hidden:
                resources: 8
                mindbreaker-toxin: 1
                nekker-pheromones: 1
          undertown-9-3:
            name: Exactor's Office
            phone: "Exactor"
            # The Black Market terminal stands here (DEPOT.md §0n). Its token
            # opens the door too, so the Pusher's ring gets to it.
            access: [exactors-key, black-market-key]
            soundproof: true
            description: >-
              A desk, a ledger, and a winch for the shutters over the stairs.
            stash:
              resources: 4
              items:
                obol: 39
                mulligan-potion: 2
                mace: 1
                light-infantry-armour: 1
                balaclava: 2
                room-a-key-den: 1
                room-b-key-den: 1
                # What the Slaves dig with. A pickaxe is the gate on mining now
                # (MINING.md §2), so the tools being in here rather than in
                # their hands is the Exactor's whole grip on them.
                pickaxe: 3
      undertown-a:
        name: Slums
        description: >-
          Dozens of makeshift dwellings shelter nameless vagrants and destitutes. Each structure looks just about ready to collapse in on itself.
        rooms:
          undertown-a-1:
            name: Firepit
            description: >-
              A smouldering hole in the ground, the meagre warmth it provides attracts all manner of the desperate.
          undertown-a-2:
            name: Shack
            description: >-
              One of the better constructed buildings, it is often fiercely contested by the local homeless.
          # The only private room in the Slums, and it is not behind a key —
          # it is behind the climb, which is the one thing nobody down at the
          # firepit can do.
          undertown-a-3:
            name: Perch
            access: [climbing]
            description: >-
              Held aloft by rope connected to the ceiling of the underfort, this little wooden platform stands as an ivory tower over the rest of the slums.
            stash:
              items:
                foodstuffs: 4
                moonshine: 1
      # The Order's own house. Both ways in are `locked: order-key` — the
      # stair down from the Cathedral and the door out into the Hollows — so
      # the Chambers are as shut as the Order's own roster is.
      undertown-b:
        name: Order Chambers
        indoors: true
        description: >-
          The heart of the Order. Rooms branch off in all directions, with whatever the order might need neatly tucked away in each.
        rooms:
          undertown-b-1:
            name: Interrogation Room
            description: >-
              Tool racks line the walls with cruel and unusual instruments. At the center sits a chair with straps. If you tell them what they want to hear, maybe your death will be painless.
            soundproof: true
            stash:
              hidden:
                torturing-equipment: 1
          undertown-b-2:
            name: Holding Cells
            description: >-
              A room lined with cramped cages, a few still trapping the long decayed remains of their inhabitants. They patiently await their next occupant.
            stash:
              items:
                feces: 2
                moldy-bread: 1
          undertown-b-3:
            name: Order Barracks
            access: [order-key]
            description: >-
              Small and spartan with bunks to provide well-earned sleep for the diligent members of the Order. Lockers are arrayed for any evidence or equipment to be stored and a desk sits at the end of the room, strewn with papers.
            stash:
              items:
                paper: 12
                bag: 1
                mace: 1
                padded-cap: 1
                phonebook: 1
      undertown-c:
        name: Lake
        description: >-
          A great black abyss of murky water, joined to the underfort by a small wooden peer.
        rooms:
          undertown-c-1:
            name: Pier
            description: >-
              A sturdy wooden frame for those who wish to fish. Frayed ropes are tied around bollards, waiting for boats long sunk to return to port.
          # Out on the water, which is the swim and nothing else — the fishing
          # boat this used to want is not in the game.
          undertown-c-2:
            name: Adrift
            access: [strong-swimmer]
            description: >-
              Out on the surface of the lake, shadows in the water below seem to watch you.
      # The Alleys, renamed. The slug does not move, so the Undercroft's
      # hidden `tunnel-rat` way into it is the same edge it always was.
      undertown-d:
        name: Hollows
        description: >-
          The crumbled ruins of an old undertown neighbourhood, the memories of what exactly happened here have been long suppressed.
        rooms:
          undertown-d-1:
            name: Rubble
            description: >-
              A path clear of rubble has been made through the centre of the neighbourhood. Great mounds of broken masonry and splintered wood encase the walkway.
          undertown-d-2:
            name: Defiant Ruin
            description: >-
              The decrepit structure of one of the larger buildings still manages to stand precariously on fractured foundations. It stands alone surrounded by fields of structures long collapsed.
          # The trapdoor is flavour. There is no forced-entry mechanic and the
          # room is not gated on one — whoever walks in, walks in.
          undertown-d-3:
            name: Buried Cellar
            description: >-
              Covered by a mound of rubble is a trapdoor leading into a cellar. The inside of the trapdoor is covered in scratch marks, and the cellar empty save for some skeletal remains.
          # `spotter` alone: there is no keen-eyes tag, and spotting the case
          # under the rubble is the whole of what the room asks.
          undertown-d-4:
            name: Deposit
            access: [spotter]
            description: >-
              Stuck under some of the rubble is a green metal case. The lock has rusted shut.
      undertown-e:
        name: Basements
        indoors: true
        description: >-
          Numerous cellars and underground sections of buildings above. Of the few which actually have doors into the underfort, all have either been broken into or firmly boarded up.
        rooms:
          undertown-e-1:
            name: Damp Cellar
            description: >-
              The masonry walls seep with moisture, creating a thick haze of mold spores. The stairway up has been bricked off, rendering this room accessible only through the broken down door to the underfort.
          undertown-e-2:
            name: Boarded Doors
            description: >-
              A cluster of doors, all seeming to have been recently boarded up. You could try to push them in.
          # The three rooms behind the boarded doors. Forcing them is flavour,
          # not a mechanic — none of these is gated.
          undertown-e-3:
            name: Hideout
            description: >-
              The burnt remains of candles have welded themselves to the floor in the same place they were carefully placed long ago.
            stash:
              hidden:
                dagger: 1
          undertown-e-4:
            name: Winery
            description: >-
              Broken glassware and equipment are scattered across the room. Unlabeled bottles stand on shelves, most empty.
            stash:
              hidden:
                moonshine: 4
          # The drop into the underground river, which comes out in the Lake.
          # A Room is not an edge endpoint, so the fall IS the plain
          # Basements-Lake crossing in `connections:` — this room is where the
          # fiction of it lives.
          undertown-e-5:
            name: Sinkhole
            description: >-
              The floor of this cellar has given way and collapsed into a deeper cave system. Peering down, you can't quite see the bottom.
      undertown-f:
        name: Hole in the Wall
        indoors: true
        description: >-
          A hole in the brick. You can see into the caves…
        rooms:
          undertown-f-1:
            name: Dark Entrance
            description: >-
              A respite before the darkness.
      # Out in the middle of the water. Both ways on are the swim — the
      # fishing boat that used to be the alternative is not in the game — so
      # the hut is the safest floor in the Undertown to leave anything on.
      undertown-h:
        name: Island
        description: >-
          A small fragment of solid land amidst the abyss. The rocky outcrops host colonies of lichen and small crustaceans.
        rooms:
          undertown-h-1:
            name: Fishing Hut
            description: >-
              A wooden shack at the island's edge with a wide open window overlooking the lake, perfect for casting a line. Hidden under a rock, a hollowed out space contains anything and everything not worth risking carrying around the rest of town.
            stash:
              items:
                moldy-bread: 2
              hidden:
                resources: 8
                flooded-crate: 1
                obol: 14
                crayfish: 2
                dustfish: 2
                fish-roe: 3
  hills:
    name: Black Hills
    kind: surface
    sort: 4
    description: >-
      Ancient buildings layer atop craggy, mossy rocks. You can see the rest of the barony between the caps of tall mushrooms.
    locations:
      # Every location in the Black Hills can be mined, thinly: 0.2 to 0.3,
      # against 0.9 in the Caves and 1.1 in the Depths (MINING.md §3). This is
      # shallow rock — worth working if you are already out here, never worth
      # the walk on its own. The spread inside that band is the ground's own:
      # the cut of the Grand Ravine and the Cliffs are the best of it, the
      # East River's soft banks the worst.
      #
      # Slugs here carry no zone prefix. The old rule gave wild Locations one
      # to keep a ravine here from colliding with a ravine there; the Forest
      # and the Marshes are gone, so there is nothing left to collide with.
      bridge:
        name: Bridge
        description: >-
          A weathered wooden bridge spans the canyon. The opposite bank from the town has rocks, shrubs, and stumps. It seems the terrain was cleared to allow easier firing by the archers.
        rooms:
          bridge-span:
            name: Bridge
            description: >-
              You can shout at the gates from here.
      west-river:
        name: West River
        attributes:
          wilderness: true
        description: >-
          The path ends. You could ford the river with some difficulty. The land continues into a depression to the north.
        # A unique spot rather than a milder one: the Gallows below is a real
        # grave (bones already sit there as a room's static stash), and
        # searching it has its own table (MINING.md §3b).
        mining: 0.25
        rooms:
          west-river-crumbled-post:
            name: Crumbled Post
            description: >-
              A stake planted into the Earth. It once had signs, but they were stolen.
          west-river-gallows:
            name: Forgotten Gallows
            description: >-
              A frayed noose hangs from a mushroom trunk. A pile of human bones rests below.
            access: [cruel, adventurer, torturer]
            stash:
              items:
                foot: 2
                eye: 1
                bone: 8
                ravens-eye: 1
      passageway:
        name: Passageway
        attributes:
          wilderness: true
        description: >-
          The ledge twists and turns around the cliff. You can look down on the town, you're eye level with the fortress. Far below, empty bottles gather in ditches right outside the wall, having stumbled down here after a dramatic toss from the fortress walls.
        # Heaping Trash, below, is already scavenged by lizards and rats for
        # "whatever missed morsels have yet to be plundered" — that's the
        # location's own words for digging.
        mining: 0.3
        rooms:
          passageway-dry-spring:
            name: Dry Spring
            description: >-
              Once a font of clear water, this rocky bed has long left weary travellers with parched throats.
          passageway-heaping-trash:
            name: Heaping Trash
            description: >-
              A great mound of garbage of all descriptions, dumped here far enough from town to be out of sight. Small lizards and mammals frantically appear and disappear in and out of the mound, seeking to find whatever missed morsels have yet to be plundered.
            stash:
              hidden:
                skinned-cave-rat: 1
          passageway-rat-warren:
            name: Rat Warren
            description: >-
              Thousands of rats scurry at the sight of you, this part of the mound being their place of shelter. Hundreds of apprehensive eyes watch you from the safety of their burrows.
            access: [caving, musician]
            stash:
              items:
                rat: 3
      # The bottom of the Baron's lift, and what the Keep throws away. The map
      # plate has called this the Refuse Pit since it was drawn
      # (docs/assets/maps/nodes.yaml).
      refuse-pit:
        name: Refuse Pit
        attributes:
          wilderness: true
          # The Marshes carried `godflesh` until they were deleted; the purple
          # masses surfacing in the Pits are where it is cut now.
          godflesh: true
        description: >-
          A depression in the cave floor. The path loses coherence as its stones drop into gravel and corroded earth. The wind kicks up a bad smell.
        mining: 0.25
        rooms:
          refuse-pit-pits:
            name: Pits
            description: >-
              There's bones, piles of decaying food that have started to turn into soil, and a lot of maggots. Deeper in the pits, wriggling masses of purple and red have begun to surface from the mud, feasting on the refuse.
          # The lower end of the Baron's lift; the cage at the top is in the
          # Keep. The edge itself is `hidden: elevator-key` in `connections:`.
          refuse-pit-elevator:
            name: Elevator Room
            access: [elevator-key]
            description: >-
              There's a cage with a pressure plate, looming over the dark. A winch will take you upwards.
      sparse-fields:
        name: Sparse Fields
        attributes:
          wilderness: true
        description: >-
          The forest gives way abruptly to an open waste of mud, stumps, and gray grass. Abandoned carts and rusted equipment lie scattered across the clearing. At its center sprawls an overgrown prison complex, its walls and watchtowers sinking slowly beneath vines, moss, and years of neglect.
        mining: 0.28
        rooms:
          sparse-fields-mushroom-field:
            name: Mushroom Field
            description: >-
              Rows of felled mushroom trunks lie half-sunk in the mud, many left where they fell when the work crews abandoned the clearing. Rusted saws and broken hauling chains disappear beneath the grass, while the remaining stumps have begun sprouting pale fungi from their cut faces.
          sparse-fields-cellblock:
            name: Cellblock
            description: >-
              Rows of narrow cells face a central corridor. Pale mycelium has overtaken the gaps in the rock, creating a superorganism. Several cells contain bodies dried against bunks or walls. The floors are metallic and grated, the same rusted ceramite featured in the Keep.
          sparse-fields-office:
            name: Office
            description: >-
              Broad windows overlook both the yard and work fields. A blackened ring of prison keys hangs behind the desk beneath a wall where somebody drove a blade directly through an old map of the forest.
            stash:
              items:
                paper: 9
          sparse-fields-property-room:
            name: Property Room
            description: >-
              Numbered shelves contain the property taken from Graywall's prisoners: boots, knives, jewelry, and letters.
            access: [graywall-key]
            stash:
              items:
                jewelry: 2
                trench-knife: 1
                work-knife: 2
                paper: 13
                obol: 6
                brigandine: 1
                supply-kit: 1
          sparse-fields-outcrop:
            name: Outcrop
            description: >-
              A cluster of granite boulders rises sharply above the stripped field, providing an uninterrupted view across Graywall, the old logging grounds, and the refuse pit. From this height, narrow trails and breaks in the path become visible that cannot be seen from below.
            access: [caving]
            stash:
              hidden:
                graywall-key: 1
      cliffs:
        name: Cliffs
        attributes:
          wilderness: true
        description: >-
          At the base of the mountains, tall walls of stone crush any hopes of travelling further east. High above some greenery has managed to grow, nestled in crags of the cliff faces.
        mining: 0.3
        rooms:
          cliffs-road:
            name: Road
            description: >-
              There's a cave mouth to the side of the road. The remnants of a camp setup before venturing inside are scattered about. A featureless wall of darkness awaits when looking inside, ready to consume any who venture too deep.
          cliffs-overlook:
            name: Overlook
            description: >-
              Making the more manageable climb up one of the shorter cliffs, the top gives a view of the barren hills and valleys to the West, and sodden marshes to the South. You can just about make out the town itself at the other end of the valley.
            access: [caving]
            stash:
              items:
                malachite: 3
                milk-quartz: 1
              hidden:
                silver: 2
      gullies:
        name: Gullies
        attributes:
          wilderness: true
        description: >-
          The remains of an ancient riverbed guide the passage of travellers, navigating between the domineering heights that surround it. It makes for an easier journey than scaling each of the many hills.
        mining: 0.28
        rooms:
          gullies-plateau:
            name: Wisened Plateau
            description: >-
              Where the slope encasing the road levels out, a small enclave forms to the side of the road. A large mushroom tree grows here.
          gullies-fissure:
            name: Fissure
            description: >-
              A crack has broken in the road about two feet wide. Looking down, you can't seem to see quite how deep it goes.
          gullies-burial-mound:
            name: Burial Mound
            description: >-
              Atop one of the heights beside the road sits a mound of earth many meters across. The dozens of small wooden crosses atop it give some hint as to what might lie beneath.
            access: [caving]
            stash:
              items:
                cross: 1
      grand-ravine:
        name: Grand Ravine
        attributes:
          wilderness: true
        description: >-
          Following the contours of the hills that surround it, the ravine is as constricting as it is expansive. A miasmic fog of decay sinks to the bottom, waiting to be blown away by winds that will never come.
        mining: 0.3
        rooms:
          grand-ravine-trickling-water:
            name: Trickling Water
            description: >-
              A small stream of water seeps through the rock wall of the ravine. A bloated humanoid corpse decays nearby. All manner of small skittering things make pilgrimages to both. Severed heads in various states of decomposition rest atop wooden spikes nearby.
          # An outlaw camp, abandoned now that nobody is seated here. It used
          # to be gated on a `ravine-camp` knowledge tag; the way in is the
          # climb, so the gate is `caving`.
          grand-ravine-camp:
            name: Ravine Camp
            description: >-
              Roots hang over the ravine ledge, further obscuring the hidden camp. There's meats drying on a rack, a couple of fires, and some stolen crates.
            access: [caving]
            stash:
              resources: 4
              items:
                spear: 2
                buckler: 2
                work-knife: 3
                padded-armor: 1
                padded-cap: 2
                skinned-cave-rat: 1
                paper: 4
              hidden:
                mace: 1
                shortbow: 1
                hood: 2
                brigandine: 1
                disguise-kit: 1
      east-river:
        name: East River
        attributes:
          wilderness: true
        description: >-
          Ravenheart's river rushes east into the caves.
        # The Black Hills' one real river — panning fits as well here as it
        # does at any other water location.
        mining: 0.2
        rooms:
          east-river-leopolds-bridge:
            name: "Leopold's Bridge"
            description: >-
              An ancient stone bridge originally dedicated to a revered Archbishop. It has fallen into disrepair, and a patchwork of wooden scaffolds cover the gaping hole that formed where the peak of the arch collapsed.
          east-river-eyot:
            name: Eyot
            description: >-
              Upstream of Leopold's Bridge, an island splits the river's stream in two before it reforms. A tiny, isolated ecosystem has formed here.
            access: [strong-swimmer]
            stash:
              resources: 5
              items:
                foodstuffs: 2
                cave-fungus: 2
      factory:
        name: Godard Factory
        indoors: true
        description: >-
          A huge, wooden warehouse elevated above a shallow lake. Rickety bridges connect the various sheds, barrels, and winches. Electric lamps hang overhead, holding back the darkness. You can hear the insects and frogs every night. `GODARD FACTORY` is printed in white. Raven banners hang over the entrance.
        # No `mining:` — refining is not a mining coefficient. `refinery` is
        # what puts the Refine button here at all, and what it pays in.
        attributes:
          refinery: true
          noticeboard: true
        rooms:
          factory-logistics-room:
            name: Logistics Room
            description: >-
              The Godflesh is prepared for production here while Squeeze is stacked into neat little crates. There's a ramp leading down to dry ground, where the cart is usually staged.
            access: [factory-key]
            # The spare gloves, the hatchet and the ration boxes start with
            # the Banneret (docs/roles.yaml) rather than on this floor, where
            # every Refugee holds the key. The Packaging Equipment stays: it
            # is the room's fixture, not anybody's kit (FACTORY.md).
            stash:
              resources: 2
              items:
                packaging-equipment: 1
          factory-main-floor:
            name: Main Floor
            description: >-
              The production room. Godflesh, suspended by hooks, slowly boils in big, wood-fired vats. Hydraulic pistons then senselessly compress it into cubes. Outside, the bridges have a few tables for people to kick their feet and relax. The Days Since Last Incident ticker is covered over by a hastily painted sign saying: "DO NOT EAT THE CUBES." A level up, the overseer box looks out onto the working floor.
            stash:
              hidden:
                hatchet: 1
          factory-pub:
            name: Pub
            description: >-
              An old barge converted into a pub for the factory workers. When the nearby village was more active, there was an actual bar. Well, at least you have moonshine, and some interesting folks still pass by.
            stash:
              hidden:
                hatchet: 1
          # `destroys` is the only room in the game with it. See CARRY.md.
          factory-spillway:
            name: Spillway
            description: >-
              An open-air wooden trough where acidic, pink-stained wastewater cascades into the lake. Anything you drop here is gone for good.
            destroys: true
          factory-overseer-box:
            name: Overseer Box
            phone: "Banneret"
            description: >-
              Clear sightways into the factory and out to the surrounding marsh, leading to a walkway that wraps around the factory's upper levels.
            access: [bannerets-key]
            soundproof: true
            stash:
              resources: 8
              items:
                obol: 5
                cleaning-powder: 1
                military-autoinjector: 1
                paper: 9
                cigarette: 1

  underground:
    name: Underground
    kind: group
    sort: 6
    description: >-
      The mouth to the other world.
    levels:
      caves:
        name: Caves
        sort: 1
        description: >-
          Wet, dimly-lit caves. The main paths have been smoothed down by centuries of traffic, but side paths and natural holes descend into darkness.
        locations:
          # The cave mouth, and it is not a post any more. The watchtower, the
          # floodlights, the manned gate and the winch are all gone: what is
          # left is a dark opening where people are camped, and the paperwork
          # happens there because it has to happen somewhere.
          #
          # It no longer opens onto the Depot (migration
          # 20261124000000_depot_storefront_only): the Depot's only way is the
          # Storefront. A migrant who has cleared customs walks up to the
          # Bridge and in through the gate like everybody else.
          caves-1:
            name: Entrance
            indoors: true
            attributes:
              noticeboard: true
            description: >-
              The caves are dark, but there are a few dying where mercenaries and migrants recently setup camp.
            rooms:
              caves-1-1:
                name: Customs
                description: >-
                  Migrants set up tents here, awaiting someone to create their necessary paperwork. It's not safe here.
                stash:
                  hidden:
                    skinned-cave-rat: 1
          # Underground is where mining actually pays: 0.9 in the Caves and
          # 1.1 in the Depths, against 0.2–0.3 on the surface of the Black
          # Hills (MINING.md §3). Mines, tunnels and an ore vein were already
          # the fiction down here — see the Old Mineshaft room below, and
          # depths-7-3 further down.
          caves-2:
            name: Approach
            indoors: true
            description: >-
              A long time ago, a great foe threatened Ravenheart from the caves. The mines laid by the Baron still patiently wait for the invading army. The stench of decaying remains scattered with explosive force is surprisingly meagre. Gnawed bones are the only proper remains to be seen.
            mining: 0.9
            rooms:
              caves-2-1:
                name: Abandoned Hut
                description: >-
                  A small structure, once built by someone exiled from Ravenheart. It now serves as a rest stop for migrants on their way through the caves.
                # One of five wheels of Cheese put away across the game's cellars and stores (docs/systemdocs/COOKING.md) — retired from Hard Cheese when that tag was removed (SOILERY.md). A seed, not a supply: the editor's seedRoomStash (web/app/(app)/gm/dev/zones/actions.js) never tops a room up, so once these five are eaten there are no more.
                stash:
                  hidden:
                    cheese: 1
              caves-2-2:
                name: Old Mineshaft
                description: >-
                  A winding mineshaft burrowed into the cave wall. It once brought great wealth and prosperity to Ravenheart. Most of it has collapsed in on itself since then.
                stash:
                  items:
                    rock: 3
                  hidden:
                    black-powder: 1
                    hematite: 1
              caves-2-3:
                name: Nekker Den
                description: >-
                  A host of Nekkers has made this secluded corner of the mineshaft home. They come scampering out at the sound of landmines going off, seeking to feast on the remains.
                access: [dwarf, tracking, tunnel-rat, caving]
                stash:
                  items:
                    nekker-pheromones: 1
                    nekker-corpse: 1
                    feces: 2
                    dagger: 1
          caves-3:
            name: Walkways
            indoors: true
            description: >-
              Numerous stone walkways connect side tunnel entrances over a large pit. At the centre of the chamber above the pit is a pillar of stone that serves as the point at which the walkways meet. It is impossible to say just how deep the pit is.
            mining: 0.9
            rooms:
              caves-3-1:
                name: Central Spire
                description: >-
                  A spire of stone, to which the walkways connect. Its several meter radius is a great relief after having had to walk so carefully over the narrow walkways. A burnt-out fire pit has been set up in the middle.
                stash:
                  items:
                    rock: 2
              caves-3-2:
                name: Walkways
                description: >-
                  With a width of only a few feet, the walkways require graceful footwork. Looking down below from the walkway, you can't help but notice how long of a way down it is below.
              # Enterable only by holding `cave-pit`, which nothing grants on
              # its own — a GM hands it out from /gm/dev when somebody falls.
              caves-3-3:
                name: Pit
                description: >-
                  The walkways overhead are a long way up. Let's hope you have the strength to reach them.
                access: [cave-pit]
                stash:
                  items:
                    feces: 1
                    skinless-corpse: 1
                    obol: 8
          caves-4:
            name: Brooding Grounds
            indoors: true
            description: >-
              A winding forest of mushrooms, home to every manner of skulking thing. Any attempt to establish a proper path through has been quashed by the fungi's competition over the limited space. Navigating through, you can hear the sound of things scraping through the forest around you.
            mining: 0.9
            rooms:
              caves-4-1:
                name: Burrows
                description: >-
                  Tucked into a long ditch in the Earth amongst the shrooms are rows of small holes into the ground. You can't see any of the burrow's residents, either none are home or they dashed inside long before you emerged into the clearing.
                stash:
                  items:
                    rock: 2
              caves-4-2:
                name: Dense Mycelium
                description: >-
                  A thick overgrowth of mycelial threads flow from the ceiling. You can barely see more than five feet ahead and moving through the dense fungi is a struggle.
                # Deep Morels, scattered by hand (docs/systemdocs/COOKING.md). Raw they are a bad night; cooked they are one of the better things in the game, and they only grow down here.
                stash:
                  hidden:
                    deep-morel: 1
              caves-4-3:
                name: Picnic Table
                description: >-
                  A simple wooden table set up with log stools arrayed around it. Any food set up has long since been pilfered by local creatures. You can feel an ancient presence watching and patiently observing.
                access: [esoteric, old-ways-sylvia, mad-doctor]
                stash:
                  items:
                    cave-fungus: 2
              caves-4-4:
                name: Godshroom
                description: >-
                  In an open clearing, a Godshroom rises above the shroom cap canopy. Its pores ooze a viscous orange liquid, dripping down onto the earth beneath it. You feel more watched than ever.
                access: [caving]
                stash:
                  items:
                    deep-morel: 4
                    cave-fungus: 6
          caves-5:
            name: Abandoned Camp
            indoors: true
            description: >-
              What remains of an old campsite, picked clean by years of travellers passing through. Everything of any value has long been scavenged, alongside many things of no value whatsoever.
            mining: 0.9
            rooms:
              caves-5-1:
                name: Main Camp
                description: >-
                  Some hefty stones are gathered in a circle at the centre. Dotted around are metal tent pegs buried too deeply in the stone to be stolen. The only other remaining evidence of this place ever being inhabited are the various piles of trash littering the campsite.
                stash:
                  items:
                    rock: 4
                  hidden:
                    obol: 2
              caves-5-2:
                name: Shroom Mound
                description: >-
                  Nearby to the former campsite are mounds of Earth have been piled up, with colonies of bright red mushrooms flourishing atop them. Clearly whatever is buried here is greatly to the mushroom's preference.
                # Deep Morels, scattered by hand (docs/systemdocs/COOKING.md). Raw they are a bad night; cooked they are one of the better things in the game, and they only grow down here.
                stash:
                  hidden:
                    deep-morel: 1
              caves-5-3:
                name: Stash
                description: >-
                  Hidden under a flat rock is an opening into the cave floor. Inside is a small room full of bottles of clear liquid.
                access: [caving, alcoholic]
                stash:
                  resources: 3
                  items:
                    cheese: 1
                    alcohol: 3
                    moonshine: 3
                  hidden:
                    ravenheart-red: 1
                    obol: 17
      depths:
        name: Depths
        sort: 2
        description: >-
          A place of true darkness. The end of the world.
        locations:
          depths-1:
            name: Steel Wall
            indoors: true
            attributes:
              noticeboard: true
            description: >-
              At the end of the cave system stands a wall of solid metal. Grime and rubble have piled up against it. The places where it remains bare, its surface is near perfectly smooth.
            mining: 1.1
            rooms:
              depths-1-1:
                name: Barren Perimeter
                description: >-
                  The opening around the wall itself is comparatively expansive for the cave. Worn down concrete spikes jut out from the floor, warding those who venture this far away. The walls are softly illuminated by pools of light, seeping from the rocks themselves.
                stash:
                  items:
                    rock: 3
              depths-1-2:
                name: Cave Wall Etchings
                description: >-
                  The walls are covered in etchings. The finer letters cannot be discerned, but you see crudely engraved images of structures, people and faces. You feel the sudden urge to contribute your own inane scrawling to this mosaic of nonsense.
              depths-1-3:
                name: Corridor
                description: >-
                  A dark, featureless corridor has opened in the wall. Going inside, your ears start to ring. Approaching the end of the corridor you reach a room with rows of broken terminals on the walls. Atop the tables and desks lining the edge of the room are strange objects. Two further doors at either side of the room are firmly shut.
                access: [ancient-keycard]
                stash:
                  items:
                    energy-shield: 1
                    paper: 29
                    old-coin: 45
          depths-2:
            name: Obelisk
            indoors: true
            description: >-
              A pillar of rusted steel sits in the centre of the chamber, surrounded by scattered pieces of metal and strange instruments. The stone on which the obelisk sits seems to have been stained black. You can taste metal in your mouth.
            mining: 1.1
            rooms:
              depths-2-1:
                name: Strange Machinery
                description: >-
                  Strewn across the floor around the Obelisk, odd gadgets and mechanical instruments whose purpose eludes you. You wonder what they might be for, and what they might be worth to someone.
              depths-2-2:
                name: Cove
                description: >-
                  A squat tunnel attached to the obelisk's chamber leads into a small open crawlspace. Metal boxes are strewn throughout the space, all of them are empty aside from a locked few whose contents are unknown. You feel clearheaded in here.
                access: [caving]
                stash:
                  items:
                    supply-kit: 3
                    old-coin: 9
                  hidden:
                    purse: 2
                    bastard-sword: 1
          depths-3:
            name: Last Chance
            indoors: true
            description: >-
              The great hollow chambers that dominate the depths to the East meet their end here. Crackling flashes of light illuminate the cavern wall as it makes a sharp turn north, leading upwards out of the depths. A tunnel has been bored into a smaller cavern system to the West, and a plaque inlaid into the wall beside it.
            mining: 1.1
            rooms:
              depths-3-1:
                name: Halls of Lightning
                description: >-
                  Tall shrooms sprout from the Earth and gather static charge. Occasionally a flash of light erupts as a current forms between two neighbouring stalks.
              depths-3-2:
                name: Western Warning
                description: >-
                  A great plaque of unrusting solid metal is implanted into the cave wall. It bears symbols and patterns completely alien to you. You have heard stories about this place, none of them good.
              depths-3-3:
                name: Lost Convoy
                description: >-
                  A collection of carts and wagons, bearing long spoiled produce. The carts stand on decayed crumbling wheels, surrounded by the remains of their owners. There is a trove of wooden crates untouched, waiting to be plundered. You feel strange.
                access: [tracking, spotter, convoy-directions]
                stash:
                  items:
                    cart: 1
                  hidden:
                    obol: 46
          depths-4:
            name: Fork
            indoors: true
            description: >-
              A simple choice awaits those who pass this way, the tunnel branches into two possible directions. Such a simple choice is complicated by the overwhelming smell of stagnant water and charred ash. The air itself seems thick.
            mining: 1.1
            rooms:
              depths-4-1:
                name: Brittle Cobbles
                description: >-
                  Something crunches underfoot here with each step. The air is thick is fine particles of dust disturbed by careless feet. Everything is coated with a thick layer of dirty grey dust, catching the light of passing torches.
                stash:
                  items:
                    rock: 3
              depths-4-2:
                name: Sullen Mist
                description: >-
                  The roaring of falling water as you enter the bottom of a great pit from a side entrance. Water falls from above crashing into the pit, filling it with a thick, choking mist, before streaming further down.
              depths-4-3:
                name: Charred Lair
                description: >-
                  Blacked bones crack and disintegrate under your weight with each step. The sound is deafening against the total silence in here.
                access: [sixth-sense, adventurer, brave]
                stash:
                  items:
                    iron: 6
                    saltpeter: 4
                  hidden:
                    black-powder: 8
          depths-5:
            name: Grand Chamber
            indoors: true
            description: >-
              A large singular open chamber held up by great pillars of stone. It must be hundreds of feet in height, and echos return minutes later from the other side.
            # The coefficient sits on the Location rather than on a room,
            # because what the ground is worth is a property of the place.
            mining: 1.1
            rooms:
              depths-5-1:
                name: Expanse
                description: >-
                  A whole word of darkness, you could walk for miles in any direction. Occasionally you will encounter one of the enormous pillars holding the ceiling up. The pillars seem to be of similar diameters but bear no discernible markings.
              depths-5-2:
                name: Slippery Slope
                description: >-
                  The southern edge of the chamber never seems to end but merely descends deeper. The floor falls into a steeper and steeper slope. Who knows where it leads.
                stash:
                  items:
                    rock: 2
              depths-5-3:
                name: Deep Sea
                description: >-
                  At the bottom of the slope rests a great lake, fed by trickling groundwater. Just at the water level someone has carved an indent in the slope to sit without sliding into the water. You can fish here.
                access: [caving]
                stash:
                  resources: 9
                  items:
                    deep-morel: 1
          depths-6:
            name: Crystal Chambers
            indoors: true
            description: >-
              A maze of interconnected chambers, all hosting great crystalline growths of varying colours and shapes. What light does make its way in here is reflected in every possible direction, creating strange constellations of reflections.
            mining: 1.1
            rooms:
              depths-6-1:
                name: Razor Tunnels
                description: >-
                  Tiny brittle crystals cut into your clothes as your brush past them. Scratches on the skin left by them itch for hours, giving no respite. The narrow tunnel requires you carefully climb through countless of these vicious crystals.
              depths-6-2:
                name: Screaming Room
                description: >-
                  You keep hearing shrill ringing from this part of the cavern but entering inside always find it perfectly quiet here. The inside appears identical to all the other cavern chambers you have passed through to get here.
              depths-6-3:
                name: Manifestation of Eusoch
                description: >-
                  A wrinkled stone face petrified before you. The chamber is filled with a ghostly light whose source you cannot pinpoint.
                access: [old-ways-eusoch]
              depths-6-4:
                name: Mirror Pool
                description: >-
                  A pool has formed at the centre of this room. Perfectly still, were you not in pitch darkness you would see your own tormented reflection.
                access: [caving, vain]
          # The Depths' best seam, 1.4 against 1.1 everywhere else down here:
          # this is the one place in the game with an actual named vein
          # (depths-7-3, below), and flattening it to the Depths' baseline
          # would have deleted the map's only authored "dig HERE".
          depths-7:
            name: Chasm
            indoors: true
            description: >-
              The Earth has been split here. This steep crack is what remains. The smell of sulfur flows out of the chasm from the numerous smaller tunnels that connect to it at its base. Some of these tunnels can lead even deeper into the depths, for better or worse.
            mining: 1.4
            rooms:
              depths-7-1:
                name: Outcrop
                description: >-
                  A ledge of rock provides a place of respite from the otherwise sheer walls of the chasm. Additionally, it serves as an approximate halfway point when climbing to or from the way out of the chasm and the multitude of side tunnels at the very bottom.
                stash:
                  items:
                    rock: 2
              depths-7-2:
                name: "Ravine's End"
                description: >-
                  The deepest extent of this rift in the land, looking up you can see a crack of light. Tunnels in the sides of the walls continue ever deeper, promising to deprive you of any sunlight at all.
              depths-7-3:
                name: Ore Vein
                description: >-
                  One of the many holes bored into in walls of the ravine reveals a trove of ore. We're rich!
                access: [prospecting, caving, prospectors-notes]
                stash:
                  resources: 95
              # The Pray button lives here and nowhere else — its slug is
              # hardcoded in db/lib/xom.js the way the bell's and the turret's
              # are, and db/lib/placeAffordances.js hangs the affordance off
              # it. Renaming this id moves the shrine to a room nobody can
              # reach; keep them in step.
              #
              # Deliberately not in the Crystal Chambers beside the
              # Manifestation of Eusoch: two god-faces in one Location teaches
              # players that the pantheon lives in exactly one room, and the
              # two shrines are inverses worth keeping apart — Eusoch's admits
              # only people who already believe, this one admits any caver and
              # hands the belief out.
              depths-7-4:
                name: Shrine of an Old Man
                description: >-
                  A shrine of a twisted-looking, aged face. It brims with crazed power.
                access: [caving]

  # Orbit. One Location, no plate marker, no connections, and no rooms of its
  # own — the Charon's Cockpit and Habitation are REPOINTED here when the ship
  # launches (db/lib/charon.js#completeLaunch), so the butter and everything
  # else aboard goes up with it rather than being duplicated.
  #
  # Its own zone rather than a sixth Fortress location, because a Zone owns
  # the Discord category and the access role: a Baron who has left the planet
  # must not still hold the role that opens the Keep's channels.
  #
  # `offMap` is what turns /map into the grey nothingness with one crosshair
  # in it (db/lib/locationAttributes.js, web/app/(app)/map/MapBoard.js).
  #
  # It gets no #summary channel, the one surface zone that does not: there is
  # one Location up here, so a zone channel above it would be a second room for
  # the same room. Like a cave level, whatever would have been posted to
  # #summary goes into the Location channel (db/lib/zoneSummary.js).
  space:
    name: Space
    kind: surface
    sort: 7
    description: >-
      Above everything, and colder than anywhere.
    locations:
      space-1:
        name: Charon (Space)
        indoors: true
        attributes:
          offMap: true
        description: >-
          The Charon has launched in space. You can see the barren surface of Evergreen below you. You will soon arrive at the Leviathan, you hope.

connections:
  # --- Town -------------------------------------------------------------
  # Into the Gatehouse: the rings that man the gate (docs/systemdocs/GATEHOUSE.md).
  - pair: [town/town-1, town/town-2]
    locked: gatehouse-key
  - [town/town-2, town/town-3]
  - [town/town-2, town/town-4]
  - [town/town-2, town/town-7]
  - [town/town-2, town/town-8]
  - [town/town-3, town/town-4]
  - [town/town-4, town/town-7]
  - [town/town-5, town/town-8]
  - [town/town-5, town/town-9]
  - [town/town-6, town/town-7]
  - [town/town-6, town/town-8]
  - [town/town-8, town/town-9]
  - [town/town-8, town/town-a]
  - [town/town-9, town/town-a]

  # --- Fortress ---------------------------------------------------------
  - [fortress/fortress-1, fortress/fortress-2]
  - [fortress/fortress-1, fortress/fortress-3]
  - [fortress/fortress-2, fortress/fortress-3]
  - [fortress/fortress-3, fortress/fortress-4]
  # Down the Court's stair into the Undercroft. A free hop since 2026-09-23;
  # it used to cost the Move, because the cellars sat in the Undertown.
  - [fortress/fortress-3, fortress/undertown-1]
  # Up into the Tower. Locked: the Baron, Hand, Meister and Censor carry
  # the Tower Key, and the Hand keeps two spares in their study.
  - pair: [fortress/fortress-4, fortress/fortress-5]
    locked: tower-key

  # --- Black Hills ------------------------------------------------------
  - [hills/bridge, hills/east-river]
  - [hills/bridge, hills/west-river]
  - [hills/west-river, hills/passageway]
  - [hills/passageway, hills/refuse-pit]
  - [hills/refuse-pit, hills/sparse-fields]
  - [hills/sparse-fields, hills/cliffs]
  - [hills/cliffs, hills/gullies]
  - [hills/gullies, hills/grand-ravine]
  - [hills/gullies, hills/east-river]
  - [hills/grand-ravine, hills/east-river]
  # The Factory came over from the Marshes with that zone's deletion — on the
  # plate it is Black Hills A, at the far end past the water.
  - [hills/sparse-fields, hills/factory]
  - [hills/cliffs, hills/factory]

  # The ravine's own way down into the Factory, for anyone who can make the
  # climb. Hidden, so nobody who cannot never learns the way is there.
  - pair: [hills/grand-ravine, hills/factory]
    hidden: caving
    on_foot: true

  # The East River no longer runs on into the Undertown's Lake. It was a way
  # into the fort round both gates, and is gone (migration
  # 20261123000000_lake_shores). The river still reaches the Walkways below.

  # --- Caves ------------------------------------------------------------
  # Plain, and deliberately so. There was a manned gate in the cave mouth here,
  # announcing every crosser into the zone and shuttable from the watchtower
  # above it. Both are gone with the post itself, so nothing now reads papers
  # or closes the way between the Entrance and the deep caves.
  - [caves/caves-1, caves/caves-2]
  - [caves/caves-2, caves/caves-5]
  - [caves/caves-3, caves/caves-4]
  # Plain on purpose. This was a tight squeeze once, and it sent a Giant six
  # hops and two zone crossings round through the Hills for one free hop.
  - [caves/caves-4, caves/caves-5]

  # --- Depths -----------------------------------------------------------
  - [depths/depths-1, depths/depths-2]
  - [depths/depths-2, depths/depths-3]
  # "A tunnel has been bored into a smaller cavern system to the West"
  # (depths-3's own description, of the Fork beyond it) — narrow enough that
  # a Giant does not force it. It's the only tight squeeze on the map, and
  # the detour is short: `caves-5 <-> depths-4`, further down among the
  # between-zone edges, reaches the Fork directly, so a Giant goes Last
  # Chance, Abandoned Camp, Fork. That's two hops instead of one, but both cross a zone line, so a
  # Giant pays the Move twice for what's a free same-zone hop for anyone
  # else.
  - pair: [depths/depths-3, depths/depths-4]
    tight_squeeze: true
  - [depths/depths-4, depths/depths-5]
  # The Razor Tunnels into the Crystal Chambers. Plain on purpose: as a tight
  # squeeze, with the Depot's rail tunnel gone, it shut a Giant without
  # climbing out of the Chambers and the Chasm altogether.
  - [depths/depths-5, depths/depths-6]
  - [depths/depths-6, depths/depths-7]

  # --- Between zones — each of these costs the Move ----------------------
  # There is exactly ONE plain way up from the Town into the Fortress, and it
  # is the portcullis (town-8 <-> fortress-2, among the manned gates below).
  # The Sanctuary and the Graveyard used to open onto the Courtyard (then the
  # Gatehouse) too, so
  # dropping the portcullis shut nothing: everyone walked round through the
  # graves, for free, since a hop inside the Town costs no Move. A gate is
  # only a gate if it is the only way across — db/lib/gateBypass.js, which
  # the doctor and the test suite both run, refuses a second one.
  - [town/town-2, undertown/undertown-a]
  - [caves/caves-5, depths/depths-3]
  # This is the way round the tight squeeze at depths-3 <-> depths-4 above,
  # so if you ever gate it, check what a Giant loses.
  - [caves/caves-5, depths/depths-4]
  # The Entrance no longer opens onto the Depot, and the Brooding Grounds no
  # longer open into its cargo bay: the Depot's only way is the Storefront
  # (migration 20261124000000_depot_storefront_only).

  # The two manned gates. A Cerberus on each reads everyone's papers.
  #
  # The Black Hills gate joins the Bridge straight to the Square. Its lever is
  # in the Town Gatehouse's Gate Controls (town-1-2), which stands at neither
  # end; while it is shut, the way through is to ask at the Gate or the
  # Gatehouse Window (docs/systemdocs/GATEHOUSE.md).
  #
  # The portcullis joins the Residences to the Courtyard. It has a gate button
  # on BOTH Location anchors, and it moves only for a ring carrying
  # portcullis-key (db/lib/gateControls.js).
  #
  # Both are born shut: a new game starts with the gates closed.
  - pair: [hills/bridge, town/town-2]
    announce: true_name
    modular:
      open: false
  - pair: [town/town-8, fortress/fortress-2]
    announce: true_name
    modular:
      open: false

  # The Baron's lift, top to bottom: the Keep's cage down into the Refuse Pit.
  # The Baron's signet ring opens it (docs/systemdocs/RINGS.md); an Elevator
  # Key found or bought opens it too.
  #
  # Keyed, so whoever rides it is asked whether to leave it open behind them
  # for 24 hours — which is how anybody without the key gets to follow.
  - pair: [fortress/fortress-4, hills/refuse-pit]
    hidden: elevator-key
    keyed: true
    on_foot: true

  # The Den, off the Slums. Without this the Den is an island, and the three
  # seats that start standing in it could never leave.
  - [undertown/undertown-a, undertown/undertown-8]

  # Down the stairs into the Exactor's basement. Locked AND modular at once:
  # the Den Key opens the door, and the winch in the Exactor's Office shuts it
  # to everybody, key or no key.
  - pair: [undertown/undertown-8, undertown/undertown-9]
    locked: den-key
    on_foot: true
    modular:
      open: true

  # The Den's back door, out through the water. Only ONE tag fits on an edge,
  # so this is `strong-swimmer` alone — the Den Key already opens the front,
  # and the swim is the half worth gating. Hidden, so nobody who cannot make
  # the swim ever learns the way is there.
  - pair: [undertown/undertown-9, undertown/undertown-c]
    hidden: strong-swimmer
    on_foot: true

  # The tunnels the Alleys' description promises, down into the Undertown's
  # sewers. Hidden, so a player who does not know the tunnels never learns
  # they are there. Only ONE tag fits on an edge, so this is `tunnel-rat`
  # alone; the Toilets room at the top of it still admits a sewer-key too.
  - pair: [town/town-5, undertown/undertown-4]
    hidden: tunnel-rat
    on_foot: true

  # The way down to the Lifeweb from among the graves. LOCKED rather than
  # hidden — everyone knows the Mortii go down there, and knows they cannot.
  - pair: [town/town-a, undertown/undertown-3]
    locked: mortus-key
    on_foot: true

  # The Storefront, off the freight platform and out into the Undertown
  # proper. The way through to the platform is the Merchant's and his
  # Dockers' alone (Depot Overhaul.docx): both their rings carry the
  # depot-keycard token (docs/roles.yaml). Everybody else deals with the
  # Depot across the Merchant's Counter.
  - pair: [undertown/undertown-5, undertown/undertown-6]
    locked: depot-keycard
  - [undertown/undertown-6, undertown/undertown-7]
  - [undertown/undertown-6, undertown/undertown-a]

  # The Undercroft's own way out into the Hollows, for somebody who knows the
  # pipes. Hidden, so a player without the knack never learns it is there.
  # A zone crossing: the Undercroft is Fortress, the Hollows are Undertown.
  - pair: [fortress/undertown-1, undertown/undertown-d]
    hidden: tunnel-rat
    on_foot: true

  # Out of the cellars into the burnt quarter. LOCKED rather than hidden:
  # everybody can see the door under the keep, and everybody knows whose key
  # opens it. A zone crossing, same as the pipes above.
  - pair: [fortress/undertown-1, undertown/undertown-2]
    locked: barons-key
    on_foot: true

  # The maintenance tunnels the Lifeweb's description promises, out into the
  # sewers. Locked for the same reason the graveyard stair is: the way is no
  # secret, the key is.
  - pair: [undertown/undertown-3, undertown/undertown-4]
    locked: sewer-key
    on_foot: true

  # --- The rest of the Undertown ----------------------------------------
  # The burnt quarter, off the Storefront and the Sewer. Plain, so the Old
  # Town is reachable without the Baron's key now that its other door is a
  # Fortress crossing — the Burnt Home and the cellar under it keep their own
  # gates. It used to open off the Depot instead, and the Sewer used to open
  # onto the Lake (migration 20261124000000_depot_storefront_only).
  - [undertown/undertown-2, undertown/undertown-6]
  - [undertown/undertown-2, undertown/undertown-4]

  # The shelter sits between the pipes and the shanties, which is most of why
  # anybody ends up in it.
  - [undertown/undertown-4, undertown/undertown-7]
  - [undertown/undertown-7, undertown/undertown-a]

  # The shanties out onto the cellars and the water. The Slums are the
  # Undertown's crossroads — nearly everything down here is one hop off them.
  - [undertown/undertown-a, undertown/undertown-e]
  - [undertown/undertown-a, undertown/undertown-c]
  - [undertown/undertown-a, undertown/undertown-d]

  # The cellars out into the burnt-out neighbourhood.
  - [undertown/undertown-e, undertown/undertown-d]

  # The sinkhole in the cellars drops into the underground river, and the
  # river comes out in the Lake (the Sinkhole room's own prose). Plain rather
  # than hidden: a hole in the floor is not a secret.
  - [undertown/undertown-e, undertown/undertown-c]

  # The wall somebody dug through, out of the Poorhouse. Hidden, so a player
  # without the knack never learns the passage is there — the same trade the
  # Undercroft's pipes make.
  - pair: [undertown/undertown-7, undertown/undertown-f]
    hidden: tunnel-rat
    on_foot: true

  # …and out the far side of that hole, into the deep. LOCKED rather than
  # hidden: standing in the Dark Entrance you can see perfectly well where it
  # goes, and the question is whether you can make the descent.
  - pair: [undertown/undertown-f, depths/depths-3]
    locked: caving
    on_foot: true

  # The Den's other back door, up into the shelter. Behind the same Den Key
  # the stairs are, so the Exactor's basement has two shut doors and no third.
  - pair: [undertown/undertown-7, undertown/undertown-9]
    locked: den-key
    on_foot: true

  # The Order's house, and both ways into it. LOCKED rather than hidden:
  # everybody knows where the Order sleeps, and everybody knows they cannot
  # follow them in.
  - pair: [town/town-4, undertown/undertown-b]
    locked: order-key
    on_foot: true
  - pair: [undertown/undertown-b, undertown/undertown-d]
    locked: order-key
    on_foot: true

  # Out to the island. LOCKED rather than hidden — everybody standing on the
  # pier can see the rock out there; the swim is the whole question.
  - pair: [undertown/undertown-c, undertown/undertown-h]
    locked: strong-swimmer
    on_foot: true

  # …and off the island the other way, under the Walkways, which hang over the
  # same water the Lake is. Hidden, because nobody looking at the lichen would
  # guess it comes out in the Caves.
  - pair: [undertown/undertown-h, caves/caves-3]
    hidden: strong-swimmer
    on_foot: true

  # --- Into the deep from the Black Hills --------------------------------
  # The Chasm used to open at the Cliffs. It opens at the Grand Ravine now, and
  # it is a climb rather than a walk: LOCKED rather than hidden, because the
  # hills are visibly full of holes and the question is whether you can make
  # the descent, not whether you know it is there.
  #
  # The Cliffs keep their cave-mouth prose and no longer have anything behind
  # it. That is deliberate.
  - pair: [depths/depths-7, hills/grand-ravine]
    locked: climbing

  # The walkways hang over the water the river runs into (hills/east-river's
  # own description: "Ravenheart's river rushes east into the caves").
  - [caves/caves-3, hills/east-river]

  # The road from the town bridge to the cave mouth. Until now the Entrance
  # could only be reached from the Depot — you had to already be inside
  # Ravenheart to arrive at the place people arrive at.
  - [caves/caves-1, hills/bridge]

  # The Grand Chamber's Deep Sea and the Undertown's Lake are the same water,
  # and the only way across is to swim it. LOCKED rather than hidden, like the
  # Island: everybody on either shore can see the water go on. It used to be
  # plain, which let anybody walk round the Bridge gate through the Caves.
  - pair: [undertown/undertown-c, depths/depths-5]
    locked: strong-swimmer
    on_foot: true
