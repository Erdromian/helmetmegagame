        - invisibility-potion  # unlabelled, and it works — sells 8 ⬢
        - basement-lockbox  # shelved in with the rest of the unlabelled tinctures — worth 61 ⬢ opened (sells 31 ⬢ locked)
      6:  # own EV 7.00 ⬢ · hit 100% · combined EV 6.13 ⬢ · hit 100%
        - bliss  # sells 3 ⬢
        - jewelry  # sells 8 ⬢
        - distilled-coca  # one more distillation, cooling on the shelf — sells 10 ⬢

    # The Black Hills' one real river (`yield.fishing: 0.8`) — panned the
    # same way a Forest stream is, but with its own finds: the fishing
    # table here already claims Salvage Plate and a Bastard Sword
    # (`laborTypeLocation.fishing.hills-waterway`), so Prospecting gets a
    # different pair.
    hills-waterway:  # ⬢ EV/labor 6.57 · hit 95%
      2:  # own EV 0.50 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
        - rock  # gravel the current never bothered to sort — not sellable
        - old-coin  # green with verdigris, worn past reading — sells 1 ⬢
      3:  # EV 5.00 ⬢ · hit 100%
        - silver  # a second seam, thinner than the one at 4 — sells 5 ⬢
      4:  # own EV 9.50 ⬢ · hit 100% · combined EV 7.67 ⬢ · hit 100%
        - silver  # panned straight out of the current — sells 5 ⬢
        - sword-cane  # an elegant thing, lost to the current — sells 14 ⬢
      5:  # own EV 29.00 ⬢ · hit 100% · combined EV 18.50 ⬢ · hit 100%
        - dagger  # sells 7 ⬢
        - waterlogged-lockbox  # rusted shut, but still holding what someone locked inside — worth 51 ⬢ opened (sells 26 ⬢ locked)
      6:  # own EV 8.67 ⬢ · hit 100% · combined EV 6.75 ⬢ · hit 100%
        - silver  # sells 5 ⬢
        - jewelry  # sells 8 ⬢
        - monkey  # someone's pet, swept downstream and somehow still holding on — sells 13 ⬢

    # The one real vein (`chasm-ore-vein`, a secret room gated on
    # `prospectors-notes`) — rare ground stays rare by what it can find,
    # not by a bigger number (LABORDROPS.md §2b). No new EV ceiling here,
    # just better odds at the same ore the rest of the Depths already pays.
    depths-chasm:  # ⬢ EV/labor 5.58 · hit 78%
      4:  # own EV 9.00 ⬢ · hit 100% · combined EV 6.50 ⬢ · hit 100%
        - ore-chunk  # sells 9 ⬢
      # The one true gem, not another guaranteed metal — the vein gives up
      # ore reliably (4 and 6, one guaranteed each), but on a 5 it's steel
      # or the one stone worth a trip to the Baron himself.
      5:  # own EV 31.50 ⬢ · hit 100% · combined EV 19.75 ⬢ · hit 100%
        - steel  # sells 18 ⬢
        - flawless-gem  # fit for a king. Or a Baron — sells 45 ⬢
      6:  # own EV 5.00 ⬢ · hit 100% · combined EV 5.50 ⬢ · hit 100%
        - silver  # sells 5 ⬢

    # Prospecting's first City ground (2026-09-10) — not rich, just an
    # interesting option to work while you're already in Town. "Squat
    # buildings, piled into discomfort" (zones.yaml) — scrap shacks, an
    # abandoned theater running a gambling den, a public bathhouse charging
    # by the coin. The Organ Shop and Pusher's Room are drawn on for flavor
    # rather than requiring their own gates (same convention as
    # hills-grand-ravine's brigand camp above); the Sewers and Basements
    # stay untouched — one's an access-gated stash, the other is Thanati's.
    underquarter:  # ⬢ EV/labor 3.88 · hit 95%
      3:  # EV 2.00 ⬢ · hit 100%
        - salvage-plate  # scrap off a Shack nobody's claimed this week — sells 3 ⬢
        - old-coin  # dropped somewhere in the Alleyways' dark — sells 1 ⬢
        - pawn-ticket  # a stub for something nobody came back to claim — sells 2 ⬢
      4:  # own EV 4.00 ⬢ · hit 100% · combined EV 4.00 ⬢ · hit 100%
        - cleaning-powder  # the Organ Shop keeps a shelf of it — sells 4 ⬢
        - sweets  # sold at the den's counter, same as everything else — sells 2 ⬢
        - music-box  # the Abandoned Theater's, still playing the same few bars — sells 6 ⬢
      5:  # own EV 12.00 ⬢ · hit 100% · combined EV 10.00 ⬢ · hit 100%
        - till-lockbox  # the gambling den's own cashbox, still locked — worth 16 ⬢ opened (sells 8 ⬢ locked)
        - jewelry  # a patron's ring, lost to the tables — sells 8 ⬢

    # "Pillars uphold the keep from collapsing onto the barrels of wine and
    # antiquities" (zones.yaml) — the Cistern's coin-flecked shallows and the
    # Ancient Shrine's own offerings, not the Vault down the hall. Not rich,
    # same as the Underquarter above; it's the Baron's basement, not his
    # treasury.
    undercroft:  # ⬢ EV/labor 4.55 · hit 95%
      3:  # EV 3.00 ⬢ · hit 100%
        - old-coin  # settled in the Cistern's shallows — sells 1 ⬢
        - silver  # fished up from beneath the starry mosaic — sells 5 ⬢
      4:  # own EV 5.33 ⬢ · hit 100% · combined EV 5.00 ⬢ · hit 100%
        - silver  # pried loose from a Tomb's own fittings — sells 5 ⬢
        - jewelry  # a shrine offering nobody's claimed — sells 8 ⬢
        - prayer-beads  # worn smooth by someone else's thumb, once — sells 3 ⬢
      5:  # own EV 16.00 ⬢ · hit 100% · combined EV 12.00 ⬢ · hit 100%
        - reliquary-lockbox  # left at the Ancient Shrine, still sealed — worth 20 ⬢ opened (sells 10 ⬢ locked)
        - heirloom  # a burial offering, taken anyway — sells 12 ⬢
