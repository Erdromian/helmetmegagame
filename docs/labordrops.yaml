    hills-north:  # ⬢ EV/labor 6.37 · hit 95%
      2:  # own EV 0.50 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
        - old-coin  # sells 1 ⬢
        - rock  # not sellable
      3:  # EV 3.00 ⬢ · hit 100%
        - bliss  # a second jar off the same shelf — sells 3 ⬢
