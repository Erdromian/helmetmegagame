    # zone-specific hunting tables below (laborTypeZone.hunting.*) are
    # where the genuinely dangerous game lives (LABORDROPS.md §2a-adjacent).
    1:  # own EV 0.00 ⬢ · hit 60% · combined EV 0.00 ⬢ · hit 65%
      - minor-bleeding  # a snare wire or a blade gets away from you — not sellable
      - minor-bleeding  # not sellable
      - minor-wound  # the animal gets one good hit in before it goes down — not sellable
      - minor-wound  # not sellable
      - sprained-ankle  # a bad step chasing something faster than you — not sellable
      - sprained-ankle  # not sellable
      - nothing
      - nothing
      - nothing
      - nothing
    6:  # own EV 2.14 ⬢ · hit 100% · combined EV 2.00 ⬢ · hit 100%
      - nightshade-herb  # a coil left behind at an old camp — sells 2 ⬢
      - poppy-pods  # sells 2 ⬢
      - coca-leaves  # sells 2 ⬢
      - ravens-eye  # sells 4 ⬢
      - leeches  # sells 2 ⬢
      - old-coin  # a coin the kill had swallowed, or a trapper lost — sells 1 ⬢
      - poppy-pods  # sells 2 ⬢
