    # dagger the last person through here didn't keep.
    caves-approach:  # ⬢ EV/labor 2.84 · hit 95%
      3:  # EV 0.00 ⬢ · hit 100%
        - rock  # not sellable
      4:  # own EV 2.50 ⬢ · hit 100% · combined EV 3.00 ⬢ · hit 100%
        - coal  # sells 4 ⬢
        - old-coin  # sells 1 ⬢
      5:  # own EV 5.50 ⬢ · hit 100% · combined EV 6.75 ⬢ · hit 100%
        - dagger  # a Nekker didn't leave much else worth taking — sells 7 ⬢
        - coal  # sells 4 ⬢

    # The Charred Lair (zones.yaml `fork-charred-lair`) already stashes coal,
    # black-powder AND saltpeter one-time, at unusually generous quantities
