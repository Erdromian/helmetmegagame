        - jewelry  # dropped by whoever built these walls, once — sells 8 ⬢
      6:  # own EV 4.33 ⬢ · hit 100% · combined EV 5.13 ⬢ · hit 100%
        - silver  # sells 5 ⬢
        - silver  # sells 5 ⬢
        - hat  # someone's lost hat, snagged on a rock — sells 3 ⬢
    # Every mushroom-flavored Forest location (forest-creekside's colonies,
