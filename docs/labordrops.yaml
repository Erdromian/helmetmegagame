# The labor drop die's config. Sole master for LaborDropOption, synced by
# `db:sync-labor-drops` — see docs/systemdocs/LABORDROPS.md, which is
# canonical for the shape below and how the six buckets combine.
#
# Six top-level buckets, one per legal scope. Each nests roll face (1-6) ->
# a pool (a plain list). A combined draw for one Labor payout pulls from
# whichever of the six buckets actually name that labor type/zone/location,
# all at the SAME roll face, and picks one entry uniformly from all of them
# pooled together — repeat an entry to weight it, the way the good tables
# below repeat "nothing" rather than carrying a weight field.
#
# One pool entry is one of three things:
#   - a Tag slug (docs/tags.yaml)              -> grants the tag
#   - "+N" / "-N"                               -> a ⬢ delta
#   - nothing                                   -> an explicit no-result pad
#
# laborType keys: basic, skilled, hunting, farming, fishing — the five
# Laboring tiers db/lib/laborAccess.js resolves a Labor payout to
# (LABORING.md §2). A refining Labor (the Godard Factory floor) never rolls
# at all — it pays in Squeeze, not the die.
#
# zone / location keys are slugs from docs/zones.yaml. laborTypeZone and
# laborTypeLocation nest labor type first, then place.
#
# A SEVENTH gate, orthogonal to all six buckets: nest `requiresTag:` under
# any roll-keyed node (a whole bucket, or one place/labor-type inside it) to
# add a skill-gated pool on top — a map of skill slug -> the same roll-keyed
# shape, recursively, so it can nest to any depth. A gated entry only joins
# the combined draw for a character who holds that tag too; every ungated
# entry at the same roll still applies to everyone, same as before. See
# LABORDROPS.md §2a.
#
# EVERY roll-1 bucket carries its own `nothing` pad, and that is not
# decoration. The draw is uniform over the CONCATENATION of whichever buckets
# match, so a pad in `global` alone is diluted the moment a zone bucket joins
# it — pad one bucket and a 1 still always hurts, for exactly the characters
# standing somewhere dangerous. The pads deepen as buckets stack (global 30%,
# hunting 40%, every zone and cross bucket 50%), which is why a hunter in the
# Depths is slightly SAFER per 1 than a labourer in Town. Add a wound to a
# roll-1 bucket and you must add pad with it, or you have quietly raised the
# wound rate everywhere that bucket applies.
#
# Basic/skilled on their own are still unconfigured — an unconfigured
# (bucket, roll) pair simply never contributes to the pool, so a character
# labors and finds nothing, same as an explicit "nothing" draw. That's the
# deliberate default while the rest of the table gets designed.
#
# Every pool entry below carries a short "why" blurb before its mechanical
# value (`slug  # blurb — value`, LABORDROPS.md §6b) — write the blurb
# yourself when you add an entry; `npm run db:audit-labor-drops -- --write`
# (which runs automatically on save, via .claude/hooks/labordrops-value-hint.py)
# preserves it and only refreshes what comes after " — ". Never hand-guess a
# number — run `--write` (or the plain read-only form) instead.

# Global entries combine into EVERY labor type's pool at the same roll face
# (LABORDROPS.md §2), which is exactly why the minor mishaps below live here
# instead of being copy-pasted into hunting/farming/fishing separately —
# there's no tag in the catalog that reads as hunting-specific-minor-injury
# vs farming-specific, so one shared "the day went a little wrong" pool
# covers all of them. All three are self-clearing in 2-3 turns with no
# mechanical cost beyond the flavor (LABORDROPS.md §6 has the reasoning) —
# `laborDrop` in db/lib/moveEffects.js stamps the catalog's durationTurns onto
# the grant, so they really do tick.
global:
  1:  # EV 0.00 ⬢ · hit 70%
    - bruised  # an ordinary knock, nothing dramatic — not sellable
    - bruised  # not sellable
    - bruised  # not sellable
    - vomiting  # something you ate, or just a bad morning — not sellable
    - vomiting  # not sellable
    - aching  # a long day, nothing more — not sellable
    - aching  # not sellable
    - nothing
    - nothing
    - nothing
  6:  # EV 1.00 ⬢ · hit 100%
    - obol  # someone dropped it and never noticed — the coin itself, worth 1 ⬢

