      5:  # own EV 25.50 ⬢ · hit 100% · combined EV 16.75 ⬢ · hit 100%
        - gladius  # one of the swords stabbed in the ground, still good — sells 9 ⬢
        - bastard-sword  # the other one, and it's the better blade — sells 42 ⬢
      6:  # own EV 7.00 ⬢ · hit 100% · combined EV 6.22 ⬢ · hit 100%
        - rope  # pulled off the old pans and tools left to rust — sells 4 ⬢
        - jewelry  # sells 8 ⬢
        - pocket-watch  # stopped, among the old pans and tools — sells 4 ⬢
        - heirloom  # something the desiccated corpse was still holding onto — sells 12 ⬢

    # "Ruined masonry, rusted weapons, and pieces of worked metal frequently
    # wash from upstream" — the location's own description (zones.yaml).
    forest-east-river:  # ⬢ EV/labor 6.26 · hit 95%
      2:  # own EV 0.50 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
        - rock  # not sellable
        - old-coin  # sells 1 ⬢
      3:  # EV 4.00 ⬢ · hit 100%
        - work-knife  # sells 4 ⬢
        - coal  # sells 4 ⬢
      4:  # own EV 7.50 ⬢ · hit 100% · combined EV 6.33 ⬢ · hit 100%
        - salvage-plate  # more of what washes down from upstream — sells 3 ⬢
