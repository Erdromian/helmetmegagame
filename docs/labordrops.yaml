  hills:  # ⬢ EV/labor 0.17 · hit 27%
    1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 60%
      - sprained-ankle  # the ground here doesn't forgive a bad step — not sellable
      - sprained-ankle  # not sellable
      - sprained-ankle  # not sellable
      - bruised  # loose stone, and a long way down to the next ledge — not sellable
      - bruised  # not sellable
      - nothing
      - nothing
      - nothing
      - nothing
      - nothing

