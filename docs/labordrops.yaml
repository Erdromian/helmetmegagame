        - rock  # not sellable
      4:  # own EV 24.00 ⬢ · hit 100% · combined EV 14.00 ⬢ · hit 100%
        - buried-lockbox  # wedged in wherever the digging turned it up — worth 24 ⬢ opened (sells 12 ⬢ locked)

laborTypeLocation:
  hunting:
    # The Cliffs' own den (zones.yaml room `cliffs-den`, under this
    # Location): "damp fur, old blood, and wet leaves... bones pushed
    # toward the edges." Forest stays the safe zone in general (see the
    # `zone.forest` comment above) — this is the one named exception, a
    # single dangerous den inside it, with the payout to match the risk.
    forest-cliffs:  # ⬢ EV/labor 0.38 · hit 27%
      1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 60%
        - deep-wound  # whatever denned here doesn't share — not sellable
        - deep-wound  # not sellable
        - minor-wound  # it was home, and it made that clear — not sellable
        - minor-wound  # not sellable
        - sprained-ankle  # the scree above the den goes out from under you — not sellable
        - nothing
        - nothing
        - nothing
        - nothing
        - nothing
      6:  # own EV 3.50 ⬢ · hit 100% · combined EV 2.30 ⬢ · hit 100%
        - hat  # a hunter's hat, dropped and not gone back for — sells 3 ⬢
        - cudgel  # someone else who came looking for this den didn't leave with it — sells 4 ⬢
  fishing:
    # hills-waterway / "Fracturing Waterway" (zones.yaml): its own bridge
    # "fallen into disrepair," patched scaffolding over a collapsed arch —
    # decayed infrastructure over real fishing water (`yield.fishing: 0.8`).
    # Salvage Plate and a Bastard Sword are both real catalog items
    # (CAVING.md's own Rare/Extremely-rare loot tiers), heavily padded with
    # `nothing` so a fishing trip here is ordinary nine times in ten and a
    # real find the rest.
    hills-waterway:  # ⬢ EV/labor 2.31 · hit 40%
      6:  # own EV 7.83 ⬢ · hit 50% · combined EV 3.88 ⬢ · hit 69%
        - salvage-plate  # scrap metal, snagged off the collapsed scaffolding — sells 3 ⬢
        - bastard-sword  # someone went into that water and didn't come out for it — sells 42 ⬢
        - nothing
        - nothing
        - nothing
        - fish-roe  # sells 2 ⬢
  prospecting:
    # The Forgotten Gallows (zones.yaml `west-hills-gallows`) is a real
    # grave, not milder ground like the rest of the Black Hills — the first
    # table built to LABORDROPS.md §2b's shape: faces 3-6 all pay, rising
    # toward the two tags minted for this spot alone (LABORDROPS.md §2b).
    hills-west:  # ⬢ EV/labor 6.08 · hit 95%
      2:  # own EV 0.00 ⬢ · hit 100% · combined EV 1.55 ⬢ · hit 100%
        - cross  # left where it was set down, or where it fell — not sellable
      3:  # EV 2.67 ⬢ · hit 100%
        - bone  # a bone out of the pile below, worth more whole than broken — sells 1 ⬢
        - foot  # a foot still in its boot — sells 4 ⬢
        - warding-bead  # didn't work, or the strand would still be whole — sells 3 ⬢
      4:  # own EV 6.67 ⬢ · hit 100% · combined EV 6.00 ⬢ · hit 100%
        - rope  # cut down from the tree itself — sells 4 ⬢
        - eye  # sells 8 ⬢
        - eye  # sells 8 ⬢
      # Two different prizes now, not two copies of the one — a labourer
      # camping this spot gets one or the other, never a guaranteed ring.
      # 5, not 6, is where a Prospecting table's great item lives from here
      # on — the global table only pays the Obol on a 6, and a 1 ⬢ coin
      # dragging a 35 ⬢ ring's average down was never the point (Bascinet,
      # 2026-09-09). Every big-ticket table below follows the same rule.
      5:  # own EV 26.50 ⬢ · hit 100% · combined EV 17.25 ⬢ · hit 100%
        - burial-ring  # the one real prize this grave has to give — sells 35 ⬢
        - gallows-charm  # sells 18 ⬢
      6:  # own EV 14.67 ⬢ · hit 100% · combined EV 9.00 ⬢ · hit 100%
        - gallows-charm  # a ward worn by someone it didn't save — sells 18 ⬢
        - gallows-charm  # sells 18 ⬢
        - eye  # sells 8 ⬢

    # Two rooms, two different finds — the Burial Mound's own crosses
    # (zones.yaml: "dozens of small wooden crosses"), and the brigand camp's
    # armory (grand-ravine-camp's stash, drawn on for flavor rather than
    # requiring the camp's own access gate).
    hills-grand-ravine:  # ⬢ EV/labor 4.78 · hit 78%
      2:  # own EV 0.00 ⬢ · hit 100% · combined EV 1.55 ⬢ · hit 100%
        - cross  # one of dozens on the mound above — not sellable
      4:  # own EV 6.33 ⬢ · hit 100% · combined EV 5.75 ⬢ · hit 100%
        - work-knife  # a brigand's, left behind — sells 4 ⬢
        - spear  # sells 7 ⬢
        - wedding-ring  # taken off someone who didn't need it anymore — sells 8 ⬢
      5:  # own EV 23.00 ⬢ · hit 100% · combined EV 15.50 ⬢ · hit 100%
        - brigandine  # the camp's best coat, and whoever wore it isn't asking for it back — sells 42 ⬢
        - shortbow  # sells 4 ⬢
      6:  # own EV 6.50 ⬢ · hit 100% · combined EV 5.86 ⬢ · hit 100%
        - buckler  # sells 4 ⬢
        - mace  # sells 9 ⬢

    # The Lower Baths' ruin (zones.yaml `headwaters-lower-baths`, an ancient
    # bathhouse) already stashes both one-time — this is the repeatable half
    # of the same find.
    forest-headwaters:  # ⬢ EV/labor 4.27 · hit 78%
      # Two outcomes, not one guaranteed helmet — the rest of that 32-obol
      # stash, or the helmet itself.
      5:  # own EV 21.00 ⬢ · hit 100% · combined EV 14.50 ⬢ · hit 100%
        - gladiator-helmet  # sells 27 ⬢
        - spectacles  # left on the bath's edge, lenses still clear — sells 15 ⬢
      6:  # own EV 5.00 ⬢ · hit 100% · combined EV 5.43 ⬢ · hit 100%
        - gladius  # left where the water took whoever carried it — sells 9 ⬢
        - old-coin  # a piece of the 32 obol still down there — sells 1 ⬢

    # Graywall's Property Room (zones.yaml `sparse-field-property`) held
    # what the prison confiscated — this is what's left scattered outside
    # the locked room itself.
    forest-sparse-field:  # ⬢ EV/labor 5.39 · hit 78%
      4:  # own EV 7.33 ⬢ · hit 100% · combined EV 6.50 ⬢ · hit 100%
        - work-knife  # sells 4 ⬢
        - jewelry  # confiscated and never returned — sells 8 ⬢
        - military-autoinjector  # confiscated medical kit, still sealed — sells 10 ⬢
      5:  # own EV 25.00 ⬢ · hit 100% · combined EV 16.50 ⬢ · hit 100%
        - brigandine  # sells 42 ⬢
        - jewelry  # a second confiscated piece, still tagged and shelved — sells 8 ⬢
      6:  # own EV 11.00 ⬢ · hit 100% · combined EV 7.63 ⬢ · hit 100%
        - trench-knife  # sells 12 ⬢
        - supply-kit  # confiscated stores, still packed — worth 8 ⬢ consumed
        - black-body-bag  # confiscated evidence, still tagged — sells 13 ⬢

    # "The mines laid by the Baron" (zones.yaml, the location's own words) —
