        - bastard-sword  # a better one than usually washes up — sells 42 ⬢
      6:  # own EV 6.67 ⬢ · hit 100% · combined EV 6.00 ⬢ · hit 100%
        - salvage-plate  # sells 3 ⬢
        - jewelry  # sells 8 ⬢
        - mining-helmet  # more worked metal, dented but whole — sells 9 ⬢

    # "Whatever missed morsels have yet to be plundered" (zones.yaml,
