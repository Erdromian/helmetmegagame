  depths:  # ⬢ EV/labor 0.17 · hit 27%
    1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 60%
      - deep-wound  # the dark gets a piece of you before you see what did it — not sellable
      - deep-wound  # not sellable
      - minor-wound  # you find the low ceiling with your head, again — not sellable
