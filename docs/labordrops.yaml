    4:  # EV 10.00 ⬢ · hit 100%
      - netted-lockbox  # netted up along with everything else — worth 18 ⬢ opened (sells 9 ⬢ locked)
      - fish-roe  # sells 2 ⬢
    6:  # own EV 1.56 ⬢ · hit 78% · combined EV 1.50 ⬢ · hit 80%
      - trout-heart  # sells 4 ⬢
      - poppy-pods  # sells 2 ⬢
      - leeches  # sells 2 ⬢
      - fish-roe  # sells 2 ⬢
      - old-coin  # sells 1 ⬢
      - nothing
      - nothing
      - tea  # steeped from something pulled off a snag — sells 1 ⬢
      - leeches  # sells 2 ⬢
  farming:  # ⬢ EV/labor 0.20 · hit 23%
    6:  # own EV 1.22 ⬢ · hit 67% · combined EV 1.20 ⬢ · hit 70%
      - nightshade-herb  # sells 2 ⬢
      - poppy-pods  # sells 2 ⬢
      - coca-leaves  # sells 2 ⬢
      - honey  # sells 2 ⬢
      - nothing
      - nothing
      - nothing
      - old-coin  # turned up by the plow — sells 1 ⬢
      - sweets  # a jar someone forgot in the field — sells 2 ⬢
  # Anywhere-and-everywhere Prospecting finds — the same forage herbs
  # Hunting/Farming already pay in (LABORDROPS.md §2b: searching is
  # searching, wherever it turns up plant matter) plus the general run of
  # small salvage a search anywhere might turn up. Faces 3-6 all pay, not
  # just 6, per §2b's design; the zone/location tables layer mining and
  # region-specific finds on top of this.
  prospecting:  # ⬢ EV/labor 3.22 · hit 78%
    # The cheap stuff lives on 2 now, not spread across 3-5 — every regional
    # and location table pools with this one, so a 1-2 ⬢ scrap dragged
    # EVERY Prospecting draw in the game down with it. 2 is still a real
    # face (nine chances at something), it's just the face that isn't
    # pretending to be worth rolling for (Bascinet, 2026-09-10).
    2:  # EV 1.70 ⬢ · hit 100%
      - sweets  # a rarity, tucked away and forgotten — sells 2 ⬢
      - old-coin  # dropped, lost, or never spent — sells 1 ⬢
      - bone  # sells 1 ⬢
      - nightshade-herb  # sells 2 ⬢
      - poppy-pods  # sells 2 ⬢
      - coca-leaves  # sells 2 ⬢
      - honey  # sells 2 ⬢
      - tea  # sells 1 ⬢
      - wild-mushroom  # sells 2 ⬢
      - faded-photograph  # whoever's in it isn't anymore — sells 2 ⬢
    4:  # EV 4.00 ⬢ · hit 100%
      - foot  # sells 4 ⬢
    5:  # EV 8.00 ⬢ · hit 100%
      - jewelry  # sells 8 ⬢
      - eye  # sells 8 ⬢
    6:  # own EV 6.75 ⬢ · hit 100% · combined EV 5.60 ⬢ · hit 100%
      - purse  # somebody's, once — worth 3 ⬢ consumed
      # Not held to the Caving Die's own rarity for this one — Prospecting's
      # its own structure, not bound by another table's tiers (Bascinet,
      # 2026-09-09).
      - salvage-plate  # scrap turns up anywhere something's been dug through — sells 3 ⬢
      - saltpeter  # a pinch swept up with the rest — sells 3 ⬢
      - silt-lockbox  # turns up wherever the digging is good — worth 18 ⬢ opened (sells 9 ⬢ locked)
    # Keen Eye (LABORDROPS.md §2a) — a WIDER pool at the same draw, not a
    # second roll: every ungated entry above still applies to a holder too,
    # this just adds one more good find at every real face. Face 2 is
    # deliberately untouched — Keen Eye finds better ground, not more junk.
    #
    # Reaches every Prospecting location in the game (this is the global
    # bucket), which is exactly why a modest addition doesn't work here — the
    # first pass (Silver/Heirloom/Jewelry) measurably DILUTED the richest
    # per-location tables (forest-east-river's own face 5 already averages
    # 19.75) while only helping the thinnest ones, a net -0.10 EV/labor
    # across all 29 locations. Each value below is set at or above the
    # single richest existing pool at that face anywhere in the game (4: 14,
    # 5: 19.75, 6: 8, per a full survey run 2026-09-10), so Keen Eye is a
    # true floor-raiser — it cannot make any location worse, only better or
    # unchanged. Crafting inputs rather than curios (2026-09-10 revision) —
    # Keen Eye is a Prospecting skill, so what it turns up should feed
    # Smithing the way the rest of this session's work does, not just sell
    # for ⬢ (Bascinet, 2026-09-10).
    requiresTag:
      keen-eye:  # ⬢ EV/labor 5.53 · hit 78%
        4:  # own EV 18.00 ⬢ · hit 100% · combined EV 11.00 ⬢ · hit 100%
          - steel  # you spot the good ground — sells 18 ⬢
        5:  # own EV 27.00 ⬢ · hit 100% · combined EV 14.33 ⬢ · hit 100%
          - ore-package  # sorted and ready for the forge — sells 27 ⬢
        6:  # own EV 9.00 ⬢ · hit 100% · combined EV 6.17 ⬢ · hit 100%
          - ore-chunk  # sells 9 ⬢
  basic: {}
  skilled: {}

zone:
  # Forester's own catalog line is "gaining an advantage in finding food,
  # water, or shelter" (docs/tags.yaml) — nothing read it before this. A
  # Forester working the Forest zone (any labor type — Basic and Skilled
  # included, same as Global) now draws from this pool ON TOP OF whatever
  # their labor type's own table already gives them. The Forest carries NO
  # ungated zone-wide entry of its own, on purpose: it's the safest zone to
  # work, so nothing extra applies to an ordinary character standing in it —
  # `laborTypeLocation.hunting.forest-cliffs` below is the one deliberate
  # exception, a single dangerous spot inside an otherwise uneventful zone.
  forest:  # ⬢ EV/labor 0.17 · hit 28%
    requiresTag:
      forester:  # ⬢ EV/labor 0.25 · hit 28%
        6:  # own EV 1.67 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
          - rope  # a coil left behind at an old camp — sells 4 ⬢
          - trail-ration  # provisions someone else didn't need any more — not sellable
          - old-coin  # a Forester's eye finds what others miss — sells 1 ⬢

  # Six of the marsh's seven locations carry `attributes.godflesh` in
  # zones.yaml — the whole zone sits on it, not one Location's labor, so the
  # find lives here rather than under laborTypeZone. "Thick reeds crowd
  # open-ended ponds... an endless landscape of purple wetness" (zones.yaml,
  # the zone's own words) is also where the two bad entries below come from:
  # a mire that hides more than mud (marshes-woods' sleeping thing, the
  # north marshes' scratched-up cages).
  marshes:  # ⬢ EV/labor 0.50 · hit 27%
    1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 60%
      - minor-bleeding  # the reeds and the leeches both bite — not sellable
      - minor-bleeding  # not sellable
      - minor-bleeding  # not sellable
      - deep-wound  # something under the water was not a root — not sellable
      - deep-wound  # not sellable
      - nothing
      - nothing
      - nothing
      - nothing
      - nothing
    6:  # own EV 3.67 ⬢ · hit 100% · combined EV 3.00 ⬢ · hit 100%
      - godflesh  # the mud gives up a piece of what it's fed on — assumed 8 ⬢ (not actually sellable yet)
      - old-coin  # lost in the mud, long before you got here — sells 1 ⬢
      - fish-roe  # scraped off a rock at the waterline — sells 2 ⬢

  # "Ancient buildings layer atop craggy, mossy rocks" (zones.yaml) — old
