    hills-underlocks:  # ⬢ EV/labor 6.57 · hit 95%
      2:  # own EV 0.50 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
        - old-coin  # sells 1 ⬢
        - rock  # not sellable
      3:  # EV 8.00 ⬢ · hit 100%
        - jewelry  # more of what's tossed from the walls above — sells 8 ⬢
      4:  # own EV 10.50 ⬢ · hit 100% · combined EV 8.33 ⬢ · hit 100%
        - jewelry  # tossed out with the rest, by mistake — sells 8 ⬢
        - poison-snooper  # a gadget somebody tossed rather than fixed — sells 13 ⬢
      5:  # own EV 24.00 ⬢ · hit 100% · combined EV 16.00 ⬢ · hit 100%
        - jewelry  # sells 8 ⬢
        - overspill-lockbox  # locked, and pitched over the wall along with everything else — worth 40 ⬢ opened (sells 20 ⬢ locked)
      6:  # own EV 5.50 ⬢ · hit 100% · combined EV 5.57 ⬢ · hit 100%
        - purse  # worth 3 ⬢ consumed
        - supply-kit  # worth 8 ⬢ consumed

    # The Abandoned Homestead's hidden hatch leads to a Basement full of
