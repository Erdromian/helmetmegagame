    # itself, and it plays that way here too.
    depths-fork:  # ⬢ EV/labor 2.65 · hit 95%
      3:  # EV 0.00 ⬢ · hit 100%
        - rock  # not sellable
      4:  # own EV 2.50 ⬢ · hit 100% · combined EV 3.00 ⬢ · hit 100%
        - coal  # sells 4 ⬢
        - old-coin  # sells 1 ⬢
      5:  # own EV 3.50 ⬢ · hit 100% · combined EV 5.75 ⬢ · hit 100%
        - saltpeter  # sells 3 ⬢
        - coal  # sells 4 ⬢
      6:  # own EV 5.00 ⬢ · hit 100% · combined EV 5.43 ⬢ · hit 100%
        - black-powder  # sells 6 ⬢
        - coal  # sells 4 ⬢

    # The six locations below are the coefficient-1.0+ ground: the six 1.0s
    # and Chasm at 1.4. Each got its own table (2026-09-09) rather than
    # leaning on the zone/global pools alone — that's the gap a location
    # this good is meant to close on its own. Two distinct outcomes at the
    # top of each, never a repeated single item, so nobody camps one spot
    # for a guaranteed prize (Bascinet's call). And the great item sits on
    # a 5, not a 6 (same rule as hills-west above) — 5 is now the one face
    # reserved for a table's high-EV zone-specific prize, kept clear of the
    # global table's 1 ⬢ Obol, which only pays on a 6 and would otherwise
    # drag every big number down toward it (Bascinet, 2026-09-09).

    # Split Rock's mushroom colonies and the Waystation's "old pans and
    # tools" (zones.yaml) are the everyday half; the "ancient swords…
    # stabbed into the ground" beside a desiccated corpse are the rare one.
    forest-creekside:  # ⬢ EV/labor 6.13 · hit 95%
      2:  # own EV 0.50 ⬢ · hit 100% · combined EV 1.50 ⬢ · hit 100%
        - rock  # not sellable
        - old-coin  # sells 1 ⬢
      3:  # EV 5.00 ⬢ · hit 100%
        - wild-mushroom  # sells 2 ⬢
        - jewelry  # the colonies aren't the only thing worth stooping for — sells 8 ⬢
      4:  # own EV 9.00 ⬢ · hit 100% · combined EV 7.33 ⬢ · hit 100%
        - wild-mushroom  # sells 2 ⬢
        - trapping-gear  # a trapper's kit, left by the old pans and tools — sells 16 ⬢
