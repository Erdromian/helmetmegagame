laborTypeZone:
  hunting:
    # cliffs-den (forest-cliffs' own room, zones.yaml) — "damp fur, old
    # blood, and wet leaves. Bones have been pushed toward the edges" — is
    # the reason forest-cliffs gets its own laborTypeLocation table below
    # instead of a zone-wide entry; this section is the OTHER three zones,
    # where the danger is the whole place rather than one den in it.
    marshes:  # ⬢ EV/labor 0.41 · hit 26%
      1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 57%
        - grievous-wound  # whatever sleeps in the mire wakes up wrong — not sellable
        - deep-wound  # it had hold of you before the water gave it away — not sellable
        - deep-wound  # not sellable
        - minor-wound  # you got clear, mostly — not sellable
        - minor-wound  # not sellable
        - nothing
        - nothing
        - nothing
        - nothing
        - nothing
    hills:  # ⬢ EV/labor 1.83 · hit 60%
      1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 57%
        - blunt-force-trauma  # gored, thrown, or both, before the kill lands — not sellable
        - sprained-ankle  # it went uphill, and you followed — not sellable
        - sprained-ankle  # not sellable
        - sprained-ankle  # not sellable
        - minor-wound  # it turned on you once and then ran — not sellable
        - nothing
        - nothing
        - nothing
        - nothing
        - nothing
      # The Hills aren't only hunted by people with a Location role — the
      # brigand camp at Grand Ravine (laborTypeLocation.prospecting) proves
      # poachers and snare-lines work this ground too, and a hunter's trail
      # crosses theirs often enough to be worth a face of its own.
      4:  # EV 2.50 ⬢ · hit 100%
        - old-coin  # dropped chasing something faster than you — sells 1 ⬢
        - ravens-eye  # sells 4 ⬢
      5:  # EV 6.50 ⬢ · hit 100%
        - jewelry  # a poacher's ring, lost setting a snare — sells 8 ⬢
        - silver  # a poacher's own take, never spent — sells 5 ⬢
    # Faces 5 and 6 are where the Depths pays for itself: something down here
    # is worth killing, and what you carry out is a body. Zone-scoped rather
    # than repeated across six Locations on purpose — laborAccess.js refuses a
    # tier whose location coefficient is missing, and depths-crystal-chambers
    # is the only Depths Location with no `yield:` block, so hunting is already
    # impossible there. "Zone-wide" and "every Depths Location with a yield"
    # are the same set.
    #
    # Deliberately NOT scaled to a Location's own hunting coefficient — the
    # corpse table prices what's down there in the dark, not how good the
    # hunting ground is. A 0.6-coefficient Depths Location pooling the same
    # table as depths-obelisk (1.8) is correct: the monsters don't care what
    # the yield says, and this is a different value philosophy than the
    # coefficient-scaled tables elsewhere (Bascinet, 2026-09-10).
    #
    # Face 5 is otherwise unconfigured everywhere, so a 5 is a clean draw from
    # this pool alone. A 6 pools with the global obol and the hunting table,
    # which halves it — deliberate: a 6 in the Depths is a body or an ordinary
    # find, a 5 is always a body.
    depths:  # ⬢ EV/labor 4.53 · hit 43%
      1:  # own EV 0.00 ⬢ · hit 50% · combined EV 0.00 ⬢ · hit 57%
        - grievous-wound  # something down here hunts back — not sellable
        - deep-wound  # it got a piece of you on the way down — not sellable
        - deep-wound  # not sellable
        - minor-wound  # you heard it before it reached you — not sellable
        - minor-wound  # not sellable
        - nothing
        - nothing
        - nothing
        - nothing
        - nothing
      5:  # EV 16.90 ⬢ · hit 100%
        - skinless-corpse  # pink and slimy, and still warm — assumed 25 ⬢ (not actually sellable yet)
        - skinless-corpse  # assumed 25 ⬢ (not actually sellable yet)
        - skinless-corpse  # assumed 25 ⬢ (not actually sellable yet)
        - nekker-corpse  # spindly, and lighter than it looked — assumed 5 ⬢ (not actually sellable yet)
        - nekker-corpse  # assumed 5 ⬢ (not actually sellable yet)
        - nekker-corpse  # assumed 5 ⬢ (not actually sellable yet)
        - graga-corpse  # bloated, and it will not be carried far — assumed 8 ⬢ (not actually sellable yet)
        - graga-corpse  # assumed 8 ⬢ (not actually sellable yet)
        - graga-corpse  # assumed 8 ⬢ (not actually sellable yet)
        - aberrant-heart  # an Aberrant fell here, and this is what was worth taking — sells 55 ⬢
      6:  # own EV 16.90 ⬢ · hit 100% · combined EV 10.28 ⬢ · hit 100%
        - skinless-corpse  # assumed 25 ⬢ (not actually sellable yet)
        - skinless-corpse  # assumed 25 ⬢ (not actually sellable yet)
        - skinless-corpse  # assumed 25 ⬢ (not actually sellable yet)
        - nekker-corpse  # assumed 5 ⬢ (not actually sellable yet)
        - nekker-corpse  # assumed 5 ⬢ (not actually sellable yet)
        - nekker-corpse  # assumed 5 ⬢ (not actually sellable yet)
        - graga-corpse  # assumed 8 ⬢ (not actually sellable yet)
        - graga-corpse  # assumed 8 ⬢ (not actually sellable yet)
        - graga-corpse  # assumed 8 ⬢ (not actually sellable yet)
        - aberrant-heart  # sells 55 ⬢

  # The ore side of Prospecting (LABORDROPS.md §2b) — Caves and Depths are
  # where the game's mining fiction already lives (the Baron's old mines,
  # the Charred Lair's own cache, `chasm-ore-vein`), and cave-fungus grows
  # in both. Deliberately spread across faces 3-5, not stacked on 6 — a dig
  # here is meant to pay off more often than it doesn't.
  prospecting:
    # Faces 3-5 also carry the Caving Die's own Ultracommon/Common/Uncommon
    # tiers (`db/lib/cavingLoot.js`, CAVING.md §3) — the same ground the
    # delve loot table already covers, without its Rare tier and up: Caves
    # sits at 1.95% Rare on that die, near enough to never, so this die
    # doesn't offer one here either. Depths, below, is where Rare joins.
    # Trimmed 2026-09-10 — several faces had the same value sitting under two
    # or three different slugs (Cudgel/Sling/Coal all at 4 ⬢, Cave Fungus
    # doubled against itself), which reads as more variety than it is. Cut
    # down to one representative per value tier, and put the weight that
    # freed up into more Coal and Ore Chunk instead (Bascinet's call).
    caves:  # ⬢ EV/labor 4.46 · hit 95%
      2:  # own EV 0.67 ⬢ · hit 100% · combined EV 1.46 ⬢ · hit 100%
        - leeches  # the same still water everything else here drinks from — sells 2 ⬢
        - rock  # the caves are made of it — not sellable
        - bear-trap  # still sprung, still sharp — not sellable
      3:  # EV 3.50 ⬢ · hit 100%
        - cave-fungus  # "a winding forest of mushrooms" — sells 3 ⬢
        - coal  # a seam still worth digging, in mines the Baron left behind — sells 4 ⬢
      4:  # own EV 5.33 ⬢ · hit 100% · combined EV 5.00 ⬢ · hit 100%
        - coal  # sells 4 ⬢
        - cave-fungus  # sells 3 ⬢
        - ore-chunk  # the seam and a paler vein, still stuck together — sells 9 ⬢
      5:  # own EV 9.33 ⬢ · hit 100% · combined EV 8.80 ⬢ · hit 100%
        - saltpeter  # sells 3 ⬢
        - cleaning-powder  # sells 4 ⬢
        - knuckle-duster  # sells 21 ⬢
      6:  # own EV 12.00 ⬢ · hit 100% · combined EV 8.00 ⬢ · hit 100%
        - buried-lockbox  # wedged in wherever the digging turned it up — worth 24 ⬢ opened (sells 12 ⬢ locked)
        - cave-fungus  # sells 3 ⬢
        - ore-chunk  # sells 9 ⬢
    # Richer than the Caves at every face — Depths already pays better for
    # everything else (LABORING.md §3a), and its Prospecting locations skew
    # higher too. Steel joins face 5 (2026-09-10) — it was Chasm-only before,
    # which made the whole Depths run thin on the one ingot Smithing actually
    # spends; the general table is where every plain Depths Location without
    # its own table draws from, so this is the real fix, not a one-off.
    depths:  # ⬢ EV/labor 4.48 · hit 93%
      2:  # own EV 0.00 ⬢ · hit 100% · combined EV 1.42 ⬢ · hit 100%
        - rock  # not sellable
        - bear-trap  # not sellable
      3:  # EV 3.50 ⬢ · hit 100%
        - cave-fungus  # sells 3 ⬢
        - coal  # sells 4 ⬢
      4:  # own EV 5.33 ⬢ · hit 100% · combined EV 5.00 ⬢ · hit 100%
        - coal  # sells 4 ⬢
        - cave-fungus  # sells 3 ⬢
        - ore-chunk  # richer down here than the Caves, same as everything else — sells 9 ⬢
      5:  # own EV 10.20 ⬢ · hit 100% · combined EV 9.57 ⬢ · hit 100%
        - saltpeter  # sells 3 ⬢
        - silver  # a real vein down here, same as the one at Chasm — sells 5 ⬢
        - cleaning-powder  # sells 4 ⬢
        - knuckle-duster  # sells 21 ⬢
        - steel  # not just Chasm's anymore — sells 18 ⬢
      # Depths carries the delve loot table's Rare tier too (25% on the
      # Caving Die, versus Caves' 1.95%) — Salvage Plate, Supply Kit and
      # Mining Helmet all stay off the Caves table above for the same reason.
      6:  # own EV 8.83 ⬢ · hit 100% · combined EV 7.36 ⬢ · hit 100%
        - silver  # sells 5 ⬢
        - coal  # sells 4 ⬢
        - salvage-plate  # sells 3 ⬢
        - supply-kit  # not sellable, but worth it opened — worth 8 ⬢ consumed
        - mining-helmet  # sells 9 ⬢
        - buried-lockbox  # wedged in wherever the digging turned it up — worth 24 ⬢ opened (sells 12 ⬢ locked)
    # "Ancient buildings layer atop craggy, mossy rocks" (zones.yaml) — rock
    # worth panning, not the mine shafts Caves/Depths have. Silver's the
    # headline, but not the only thing worth bending over for — and it's a
