    category: status
    group: status-buffs
    description: "You feel wired and intense."
    fighting: { tree: melee, tiers: 1.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 2

  # Heroin's other half. The dial goes to the top and the body goes slack.
  doped:
    catalog: gm
    name: Doped
    category: status
    group: status-debuffs
    description: "You feel tranquil and tired."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # Laid by the Bishop's Excommunicate button and lifted only by the Bishop who
