  hangover:
    catalog: gm
    name: Hangover
    category: status
    group: status-debuffs
    description: "Ugh…"
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1

  # Recreational intoxication, and deliberately a Status tag with NO
  # mechanical effect at all — unlike Tipsy above, which really does dull a
  # fight. High is a roleplaying state and something a GM
  # may weigh when adjudicating, nothing more. Its duration is set by whatever
  # produced it rather than by the number below: raw Cave Fungus leaves you
  # High for 2 turns, refined Bliss for 3, via the per-grant override in
  # consumesIntoDurations (see this file's header). The 2 here is only the
  # fallback for a grant that doesn't say.
  # --- Tonic effects ------------------------------------------------------
  # What the apothecary in items-drink turns into. None is purchasable and
