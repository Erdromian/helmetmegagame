  # --- Cooking ingredients (docs/systemdocs/COOKING.md) ---------------------
  #
  # Thirteen things worth putting in a pot, added with the cooking rework.
  # What makes each of them an ingredient is its `cooked:` block and nothing
  # else — there is no flag and no list, so a fourteenth is one entry here.
  #
  # NINE OF THEM DO NOTHING RAW. `consumable: true` with an empty
  # `consumesInto` is the honest way to write that: you can put a raw onion in
  # your mouth and the game will let you, and then nothing happens. It is not
  # the same claim as `consumable: false`, which would refuse the bite. The
  # two cave finds are worse than nothing raw and say so with `nauseous`.
  #
  # The four descriptions and the five tastes Bascinet has not written yet
  # each carry a note saying so.
  #
  # Restored 2026-09-20 — this whole block was deleted as collateral damage
  # in the commit that swept the dagger marks ("The draft marks come off"),
  # which broke the then-current drop tables and docs/zones.yaml's room
  # stashes (both still named several of these slugs) and made the entire
  # labor-drop sync throw on the first reference. Content
  # unchanged from before the deletion — a decision on whether to keep this
  # feature belongs to Bascinet, not to a sync-unblocking pass.

  # The one food the Farm button grows (the Soilery Rework doc;
  # docs/systemdocs/SOILERY.md). Replaces the six food crops and every seed
  # bag. Eaten raw it restores 4 hunger and costs 5 mood — `mealHunger` and
  # `mealMood` rather than a `cooked:` block, which keeps it out of a meal's
  # additional-ingredient slots: Foodstuffs are what a meal is cooked FROM
  # (the meal classes below), never something slotted on top. The turn close
  # eats these for anyone about to drop into Starving (db/lib/hungerPass.js).
