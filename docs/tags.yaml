  # An Instant Camera can be handed to anyone. Purchasable at
  # start like every other item (TAGS.md §4a: items are never
  # purchasableAfterStart).
  #
  # Reusable: the 📸 reaction reads the film-holder's camera as a gate and
  # never spends it. Not consumable: a Use button once swapped the camera
  # for a blank photo, and players ate cameras by mistake.
  instant-camera:
    catalog: all
    name: Instant Camera
    category: items
    group: items-gear
    sprite: camera
    description: "An instant camera. You can 📸 react a person's message to take a picture of them."
    pointCost: 3
    weight: 2
    stackable: true
    visible: false
    purchasable: true
    purchasableAfterStart: false
    consumable: false
    sellable: true
    sellablePrice: 16
    depotPrice: 27

  # Bespoke consume, same reason the camera above needs one: it mints two
