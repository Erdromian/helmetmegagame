  # MOOD_MAX every turn". It lives beside Imperturbable's pin-to-Fine in
  # db/lib/mood.js#applyMoodTerms, and the slug is in MULTIPLIER_SLUGS so the
  # nightly pass actually loads it.
  changa-high:
    catalog: gm
    name: Changa High
    category: status
    group: status-buffs
    description: "You are losing your mind and going crazy. You might die."
    fighting: { tree: melee, tiers: 1 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3
    expiresInto: [{ oneOf: [seizure, dead] }]

