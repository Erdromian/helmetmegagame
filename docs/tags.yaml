  # ---------------------------------------------------------------------
  # The Mining catalog (MINING.md, TRINKETS.md).
  #
  # Everything in `items-mining` is here for ONE job: a smith slots it into a
  # Trinket for its `inlayValue`. That is why every description ends with the
  # same sentence — a player who finds one should not have to go and read a
  # doc to learn what it is for. Selling one raw is a consolation prize, not
  # a living, and that is deliberate: the prospector is meant to go and find
  # a smith.
  #
  # Three shelves, and they price differently:
  #
  #   ORES (Hematite, Malachite, Garnierite) are ultracommon and nearly
  #   worthless raw — 1 ¢ and 1 inlay. All of their value is on the far side
  #   of a smelt.
  #
  #   METALS (Iron, Copper, Nickel, Silver, Platinum) are what a smelt
  #   produces, plus the two the ground gives up directly. Each one also
  #   Consumes straight into ⬢ — free, instant, no skill — so a metal is
  #   both a Trinket ingredient and a day's wage, and a prospector never has
  #   to find a buyer to eat.
  #
  #   GEMSTONES are pure inlay: no recipe, no consume, just a price and a
  #   number a smith cares about. They ladder with the loot table's tiers
  #   (db/lib/cavingLoot.js) — 3 ¢ common, 6 ¢ uncommon, 10 ¢ rare, and then
  #   the three at the bottom of the Depths that nobody should expect to see.
  #
  # Keep the ladder monotonic when retuning: a rarer stone must never be
  # worth less to a smith than a commoner one, or the table stops reading as
  # a table.
  # ---------------------------------------------------------------------

  # The three ores. Ultracommon in both cave zones, and priced like it: this
  # is the rock you come back up with on an ordinary day. The smelt is the
  # point — see {tag:iron} below for the shape all three recipes share.
  hematite:
    catalog: gm
    name: Hematite
    category: items
    group: items-mining
    sprite: ore-red
    description: "A red metal. It can be smithed into trinkets in order to increase their value."
    pointCost: 0
    weight: 1
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    sellable: true
    sellablePrice: 1
    inlayValue: 6

  malachite:
