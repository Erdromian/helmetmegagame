  # (docs/systemdocs/COLLAR.md).
  #
  # It is an ACCESSORY so it sits on the equip board round your neck, with the
  # collar's own sprite — but it stays in `general`, NOT `items`, on purpose.
  # An item is always tradeable (ALWAYS_TRADEABLE_CATEGORIES in
  # db/lib/syncTags.js), and a locked collar that could be handed over, stolen,
  # pickpocketed or looted off a neck would not be locked. `general` is what
  # keeps it off every one of those menus. Apply Collar writes it EQUIPPED, and
  # db/lib/equipSlots.js#LOCKED_ON_SLUGS is what refuses Unequip, keeps it out
  # of the four-accessory count, and leaves it on a corpse.
  #
  # NO `removable: false` line, and none is needed: Destroy is derived from the
  # category (DESTROYABLE_CATEGORIES, CRAFTING.md §5) and `general` never had
  # the button. The sync throws on the line rather than ignoring it, which is
  # how it caught this being written here in the first place. The only ways off
  # are the Exactor's or the Pusher's ring, and the detonator.
  bomb-collar-locked:
    catalog: gm
    name: Bomb Collar (Locked)
    category: general
    group: general-traits
    sprite: collar
    description: "You have a shock collar locked around your neck. Only the Exactor's ring, or the Pusher's, unlocks it."
    equippable: true
    equipSlot: ACCESSORY
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false

