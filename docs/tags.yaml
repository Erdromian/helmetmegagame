  moonshine:
    catalog: all
    name: Moonshine
    category: items
    group: items-drink
    sprite: vodkabottle
    description: "Freebase alcohol. Not good for one's vision."
    pointCost: 0
    weight: 2
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    craftable: true
    consumable: true
    consumesInto: [tipsy, damaged-vision]
    # Drinking it walks the ordinary drink ladder — tipsy, then wasted if you
    # keep going — and the eyes are what makes it moonshine rather than beer.
    # Costs no ⬢ at all — the marsh gives you the ingredient. One
    # {tag:godflesh} goes INTO the bottle now and does not come back, which is
    # what limits it: there is no ration on a 0-turn recipe, so the lump is the
    # whole throttle, and a lump made into 3 ¢ of drink is 40 ¢ of Squeeze not
    # made (docs/systemdocs/BREWING.md, FACTORY.md §8).
    requirement:
