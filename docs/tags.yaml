    description: "You mentally inflate minor scrapes and sicknesses into disastrous, incurable maladies. Unlocks desires related to hypochondria."
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  prudish:
    catalog: all
    name: Prudish
    psychological: true
    category: general
    group: general-personality
    description: "You disapprove of drinking, doping, gambling, and whoring, and you intend to let everybody know. Locks Desires about all four, but gives you some new ones."
