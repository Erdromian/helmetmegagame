  lazy:
    catalog: all
    name: Lazy
    category: general
    group: general-personality
    description: "You work less hard, producing fewer Resources than others."
    pointCost: -4
    psychological: true
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # Scripted: your first drink skips Tipsy and lands you Wasted, the next one
  # Unconscious; web/lib/consumeGrants.js. Excluded for anyone who couldn't
  # conceivably drink.
  lightweight:
    catalog: all
    name: Lightweight
    category: general
    group: general-personality
    description: "You get drunk very quickly."
    pointCost: -2
    conflictsWith: [prudish, iron-liver]
    excludedRoles: [chaplain, bishop]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # Scripted: starts with 20 obols; three DEBTOR notices go up at the Depot on
  # arrival, db/lib/wantedPoster.js.
  debtor:
    catalog: all
    name: Debtor (Merchant)
    # Named for its creditor once the Exactor's version arrived; the slug stays
    # `debtor` so characters already holding it keep it.
    keepSlug: true
    category: general
    group: general-personality
    description: "You owe the merchant a big debt, 40 obols. He's coming to collect, don't you know?"
    pointCost: -5
    conflictsWith: [debtor-exactor]
    excludedRoles: [merchant]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # The same debt owed to the other side of the Undertown: 20 obols to start,
  # and the notices go up in the Exactor's Den instead, db/lib/wantedPoster.js.
  debtor-exactor:
    catalog: all
    name: Debtor (Exactor)
    category: general
    group: general-personality
    description: "You owe the Exactor a big debt, 40 obols. He doesn't send letters about it."
    pointCost: -5
    excludedRoles: [exactor]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  ugly:
    catalog: all
    name: Ugly
    category: general
    group: general-traits
    description: "People wonder if you were dropped on your face as a child."
    pointCost: -1
    conflictsWith: [pretty, beautiful, disfigured]
    visible: face
    purchasable: true
    purchasableAfterStart: false

  unhygienic:
    catalog: all
    name: Unhygienic
    category: general
    group: general-traits
    description: "Many peasants can't bathe often. But you don't bathe, even when you have the option. You have a repellent odor."
    pointCost: -1
    visible: true
    purchasable: true
    purchasableAfterStart: false

  tremor:
    catalog: all
    name: Tremor
    category: general
    group: general-traits
    description: "You have an incurable shake in your hands, making it difficult to wield writing implements, delicate weapons, or precise tools."
    fighting: { tree: both, tiers: -0.4 }
    pointCost: -3
    visible: true
    purchasable: true
    purchasableAfterStart: false

  # Scripted: dropped from the room's "You hear … whispering…" notice.
  # bot/src/lib/whisperPoll.js.
  subtle:
    catalog: all
    name: Subtle
    category: general
    group: general-traits
    description: "Your whispers can't be heard by others."
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # conflictsWith tremor: that tag is this one's exact inverse, an incurable
  # shake in the same hands.
  steady:
    catalog: all
    name: Steady
    category: general
    group: general-traits
    description: "You move very deliberately, especially with your hands. Work that needs real precision comes easier to you."
    fighting: { tree: ranged, tiers: 0.1 }
    pointCost: 1
    conflictsWith: [tremor]
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # Unrelated to the `stupid` health tag, which is Squeeze damage and garbles
  # speech in db/lib/babble.js. This one is prose a GM weighs, nothing more.
  # Intelligent is this one's inverse; the edge is authored here on the
  # drawback side and mirrored by the sync.
  dense:
    catalog: all
    name: Dense
    category: general
    group: general-traits
    description: "You are somewhat stupid."
    pointCost: -3
    conflictsWith: [intelligent]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  relentless:
    catalog: all
    name: Relentless
    category: general
    group: general-traits
    description: "Get up, get up, it's not over yet — you must get up! You won't give up in a fight, no matter what, until the Lifeweb itself swallows you."
    fighting: { tree: both, tiers: 1 }
    pointCost: 7
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # Push on (MAP.md §3): keeps the better of two dice — db/lib/locationTravel.js.
  quick-footed:
    catalog: all
    name: Quick-Footed
    category: general
    group: general-traits
    description: "You run for fun; you run for sport; you run to flee your pursuers. Do your legs know the difference? You can outpace most anybody who doesn't have this trait."
    fighting: { tree: both, tiers: 0.3 }
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # Sign flip 2026-08-31 (Desires rework); text unchanged.
  hot-headed:
    catalog: all
    name: Hot-Headed
    category: general
    group: general-personality
    description: "You like split knuckles, cracked teeth, black eyes — though they look better on the other guy! You actively pick fights where they might not be necessary. Unlocks Desires related to picking fights."
    fighting: { situational: true }
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # --- Beliefs --------------------------------------------------------------
  # What a character actually believes. The setting has said so for a while —
  # #info's "most people are Post-Christian, but some people believe in the Old
  # Ways", the Post-Christianity document, the shrine to Thoth in the Caves —
  # and this is the first time any of it reaches a sheet.
  #
  # ONE BELIEF PER CHARACTER, enforced by `exclusive: true` below. A character
  # may hold at most one exclusive tag — the one exception being a pair joined
  # by requiredTag, which is how Fundamentalist stacks on Post-Christian.
  # Checked at creation, at /store checkout and in the Add Tag request; a GM
  # grant bypasses it like every other gate. Pilgrim and Saint sit in this same
  # group and are deliberately NOT exclusive: they stack on top of a belief.
  # See docs/systemdocs/TAGS.md §5.
  #
  # A belief cannot be dropped from the sheet. Destroy is for items now
  # (docs/systemdocs/CRAFTING.md §5), and these are not items, so converting
  # mid-game is a GM's to make rather than a thing a player does by buying
  # over the top of one. That also closes the farm the old pairing had to
  # argue its way out of: there is no drop step left to repeat.
  #
  # None is `visible`. You cannot tell an Atheist from a Post-Christian by
  # looking, and docs/tag-design.md sets that flag by whether a bystander
  # actually could. A belief is meant to come out in play, not off a inspect.
  post-christian:
    catalog: all
    name: Post-Christian
    category: general
    group: general-beliefs
    description: "You are protected by God. A reasonable decision, and potentially a path to Heaven."
    pointCost: 0
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  atheist:
    catalog: all
    name: Atheist
    category: general
    group: general-beliefs
    description: "You have abstained from choosing a religion, a choice in its own right."
    pointCost: 0
    # Pilgrim sits outside the one-Belief rule, so it is named here.
    conflictsWith: [pilgrim]
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  existentialist:
    catalog: all
    name: Existentialist
    category: general
    group: general-beliefs
    description: "You walk on firm ground — if you can be sure of one thing, it's of your responsibility."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  # Sign flip 2026-08-31 (Desires rework): removed and re-added under the
  # same slug as a +2 Interest rather than a -2 drawback. Existing holders
  # are grandfathered — they keep it free, no clawback.
  fundamentalist:
    catalog: all
    name: Fundamentalist
    category: general
    group: general-beliefs
    description: "Unlocks desires related to zealotry."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    requiredTag: post-christian
    exclusive: true

  old-ways-eusoch:
    catalog: gm
    name: Old Ways (Eusoch)
    category: general
    group: general-beliefs
    description: "The healer, the compassionate, the prolonger of life."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  old-ways-sylvia:
    catalog: gm
    name: Old Ways (Sylvia)
    category: general
    group: general-beliefs
    description: "The forest was here before us. Hear the cicadas, hearkening the storm."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  old-ways-thoth:
    catalog: gm
    name: Old Ways (Thoth)
    category: general
    group: general-beliefs
    description: "The boldness of excellence, inspiration, and artistic magnificence."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  #Unrelated to the formal bacchus cult
  old-ways-bacchus:
    catalog: gm
    name: Old Ways (Bacchus)
    category: general
    group: general-beliefs
    description: "A distant, mostly superstitious regard for Bacchus the Fertile, Bacchus the Shameless."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    exclusive: true

  # The fifth Old Way, and the only one nobody can buy: it is handed out by the
  # Pray button in the Shrine of an Old Man (docs/zones.yaml, depths-7) and
  # by nothing else. Holding it puts the character on db/lib/xomPass.js's
  # weighted table, once per turn close, for the rest of their life —
  # see docs/systemdocs/TURN-ENGINE.md.
  #
  # `visible` stays at its default (hidden), unlike {tag:rage}, which is
  # visible because Rage is plainly happening to you. This is a secret, and one
  # inspect reaction would be the end of it.
  #
  # The lock leaves exactly one Desire standing, the way {tag:stupid} and
  # {tag:thanati} do — see the `chaos` family in docs/desires.yaml.
  old-ways-xom:
    catalog: secret
    name: Old Ways (Xom)
    category: general
    group: general-beliefs
    description: "The patron god of chance and disorder, as mad as those who willingly become his playthings."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    exclusive: true
    desires:
      locks:
        - all: true
          exceptFamilies: [chaos]

  # Pilgrim is deliberately off the point scale at 1 — Gunboat's call.
  pilgrim:
    catalog: all
    name: Pilgrim
    category: general
    group: general-beliefs
    description: "Unlocks desires related to religion."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  saint:
    catalog: all
    name: Saint
    category: general
    group: general-beliefs
    description: "You are at peace. Twice a turn, you can instantly cure someone else's Moderate or lesser wound. You cannot fight anyone, not even in self-defense. You'd rather let yourself be killed."
    fighting: { situational: true }
    pointCost: 14
    visible: true
    # Migrants only: Pale is the Migrant role's starting tag and is
    # purchasable: false, so nobody else can pick it up.
    requiredTag: pale
    # Cannot fight at all, so nothing that picks a fight or refuses to leave
    # one, and nothing cruel (Torturer already refuses this).
    conflictsWith: [hot-headed, relentless, cruel]
    purchasable: true
    purchasableAfterStart: true

  # The Thanati creed. A Belief like the others — exclusive, so a convert
  # drops whatever they held — but never bought: it arrives with the Thanati
  # seats (db/lib/threats.js) or from a GM's hand. `secret` keeps it out of
  # the player's Tag Catalog. Pilgrim and Saint are not exclusive, so they are
  # named here; every other Belief is ruled out by the group. Bascinet's
  # wording.
  thanati:
    catalog: secret
    name: Thanati
    category: general
    group: general-beliefs
    description: "Crudux Cruo! You must serve your master Tzchernobog to be rewarded with a better life after this one! View the Thanati document for further information and instructions. Good luck."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    exclusive: true
    # Pious ("cannot be converted") goes too. The conversion rite bounces
    # off a Pious target, at the pick and again at Join, so this only bites on
    # a GM's Assign.
    conflictsWith: [pacifist, charitable, saint, pilgrim, pious]
    # A cultist's FIRST Desire slot wants what the cult wants, and past that
    # only the ugly things: the blood families stay open because hurting people
    # is most of what a Thanati actually does. `slot: top` makes it the only
    # lock read in that slot, so no Addiction or Depressed can take the cult's
    # slot away — and it leaves every other slot to the rest of their life, so
    # an operative is not pure mayhem. The leader is locked in every slot, by
    # {tag:thanati-leader}'s own lock.
    desires:
      locks:
        - all: true
          exceptFamilies: [thanati, cruelty, violence, feud, betrayal]
          slot: top

  # --- The Cerberon ---------------------------------------------------------
  cerberon:
    catalog: gm
    name: Cerberon
    category: general
    group: general-traits
    description: "You are sworn to the Cerberon. You guard access to the Fortress and uphold order."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # Sign flip 2026-08-31 (Desires rework); moves OUT of general-cerberon into
  # general-interests, ungated — the cerberon/sheriff OR-gate lives on its
  # Desires (take-a-bribe), not on the tag itself. Text unchanged.
  # Grandfathered — see Superstitious.
  corrupt:
    catalog: all
    name: Corrupt
    category: general
    group: general-personality
    description: "The good old ways. You prioritize making yourself comfortable above all else. Unlocks Desires about corruption."
    pointCost: -2
    # Stated rather than left to the default. TAGS.md §4a: a drawback the store
    # PAYS for must be one that can never be handed back, or it is a point
    # farm. This is the only tag in the file that relies on that rule, so the
    # flag is written out.
    visible: false
    purchasable: true
    purchasableAfterStart: false
    # The four Cerberon roles and the Sheriff — the people with something to
    # sell. Corruption is a betrayal of a post, so it needs a post to betray:
    # a bum who prioritizes his own comfort is just a bum. The same five the
    # corrupt Desires gate on (docs/desires.yaml §4e).
    onlyRoles: [incarn, cerberus, censor, squire, sheriff]

  houndmaster:
    catalog: gm
    name: Houndmaster
    category: general
    group: general-cerberon
    description: "You're excellent at handling dogs. Under your usage, the kennel's {tag:hound}s fight and track even better."
    fighting: { situational: true }
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  sergeant:
    catalog: gm
    name: Sergeant
    category: general
    group: general-cerberon
    description: "You have rank, which doesn't necessarily mean much."
    pointCost: 2
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # Reads against the Teaching Skills document (docs/documents.yaml), which
  # sets the untaught baseline at a 6. Change one and change the other.
  # Teaching (Drill Instructor) replaced the old Drillmaster here in 9/2026.
  # A Skill like the rest of the Teaching tree, but it keeps the Cerberon
  # group so the group's `requiredTag: cerberon` gates it: the Cerberi and the
  # Censor (who starts with the Cerberon tag) can take it, nobody else can.
  # PointBuy tabs by the tag's own category, so it shows under Skills. The
  # tag's own requiredTag slot is spent on Teaching. Not teachable.
  teaching-drill-instructor:
    catalog: gm
    name: Teaching (Drill Instructor)
    category: skills
    group: general-cerberon
    requiredTag: teaching
    description: "When someone tries to learn a fighting skill from you, they succeed on a 4, 5, or a 6."
    pointCost: 3
    visible: false
    purchasable: true
    purchasableAfterStart: true
    teachable: false

  # --- The general MASTERIES -------------------------------------------------
  # Five capstones, none of them buyable at character creation (TAGS.md 4a on
  # the mastery band and why it sits above the ordinary 14-point ceiling).
  # Second Wind is filed with them because it reads like one, but it is a plain
  # 6-point tag and is deliberately NOT `mastery` — it can be bought at
  # creation like anything else.

  # Advantage is a re-roll, not a modifier, so it does not live in
  # db/lib/gambitModifier.js — db/lib/advantage.js is the whole mechanic, and
  # every d6 a CHARACTER rolls goes through it.
  lucky:
    catalog: gm
    name: Lucky
    category: general
    group: general-traits
    description: "Fortune leans your way. You roll every Gambit twice and keep the better die, the Caving Die and every other die the game throws included. When you mine, you turn up the better of two finds."
    pointCost: 15
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # Lucky's opposite, and narrower on purpose: it reaches the Gambit die alone,
  # where Lucky reaches all three d6 rolls. Priced at -6 against Lucky's +15
  # because it costs you less than Lucky buys you — see TAGS.md 4a.
  misfortune:
    catalog: gm
    name: Misfortune
    category: general
    group: general-traits
    description: "You're unlucky. Your Gambits are rolled with disadvantage."
    pointCost: -6
    # Holding both used to be a wash on the die (db/lib/gambitDie.js); now the
    # pair is simply refused. Authored here, mirrored onto Lucky by the sync.
    conflictsWith: [lucky]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # The SLOT lock only (GameConfig.desireSlotLockTurns), never a Desire's own
  # cooldown — a Manic character may refill a slot the turn it empties, but
  # each individual Desire still waits out its own timer (DESIRES.md).
  manic:
    catalog: gm
    name: Manic
    category: general
    group: general-personality
    psychological: true
    description: "Your Desire slots don't have a cooldown. However, your available desires are randomized every turn."
    pointCost: 10
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # On death this rolls the holder straight into a new body: a random role with
  # a free seat, the starting budget plus 4, and no Curse. See CHARACTERS.md.
  # The description is deliberately vague — the player is told what it does by
  # DM when they take it, not by the catalog line.
  # The new body is granted THIS tag again (db/lib/reincarnate.js), so the
  # loop never breaks on its own — the catalog line's "infinitely" is literal.
  # It also picks up one more stack of heightened-psychosis, below, every
  # time — a soul worn thinner with every trip through a new skull.
  metempsychosis:
    catalog: gm
    name: Metempsychosis
    category: general
    group: general-traits
    description: "You know something important. You can respawn freely and infinitely, and you remember certain things about your past lives. You don't remember who killed you or your cause of death."
    pointCost: 12
    visible: false
    purchasable: true
    purchasableAfterStart: true
    mastery: true

  # A pure counter, never chosen and never removable — db/lib/reincarnate.js
  # adds one stack every time Metempsychosis fires, so quantity IS the number
  # of past lives. Not `mastery`: nobody buys this, so none of that band's
  # rules (store-only, no negative cost) have anything to say about it.
  # Each stack also costs the new body 2 points of random drawbacks, granted
  # GM_GRANT alongside it — the fraying is mechanical, not just cosmetic.
  heightened-psychosis:
    catalog: gm
    name: Heightened Psychosis
    category: general
    group: general-traits
    description: "Your soul strains against each new, unfamiliar vessel."
    pointCost: 0
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false

