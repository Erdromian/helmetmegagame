    pointCost: 0
    depotPrice: 4
    weight: 0
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    consumable: true
    consumesInto: []

  # The collar kit (docs/systemdocs/COLLAR.md). The collar and the trigger
  # that sets it off are Black Market wares — the Exactor's and the Pusher's rings are the whole gate,
  # and the Exactor is the one seat that starts holding both. What takes a
  # collar off is no longer a ware: the Exactor's and the Pusher's rings carry
  # the retired Collar Key's token (below).
  #
  # The trigger answers to whoever wears the Exactor's ring
  # (db/lib/collar.js#canWorkRemote). Anybody can buy, steal or loot one, and
  # taking his away disarms him, but without that ring on the finger it is a
  # box with a button on it. Each collar picks up a glyph the first time it is locked on,
  # as its own minted pair of rows (db/lib/collarGlyphs.js) — these two catalog
  # rows are only ever a collar nobody has marked yet.
  #
  # NOT craftable, either of them. There is no collar key to strike -- the
  # Exactor's and the Pusher's rings unlock collars -- and a forge that could
  # strike collars would let anybody start a slave trade without ever paying
