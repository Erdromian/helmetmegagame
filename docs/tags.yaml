  # ─── The Combat Update ────────────────────────────────────────────────────
  # Weapons are priced on the six-tier ladder from SMITHING.md. The pt column is
  # the rung's sell price at 7 ¢ a point, and a piece may sit one point either
  # side of it for what it does (TAGS.md §4a, 2026-09-22):
  #
  #   Dead Simple    1 pt / 2 ⬢  / 0.25 turns / crafting OR smithing / no weapon skill
  #   Simple         2 pt / 4 ⬢  / 1 turn     / smithing             / melee-/ranged-basic
  #   Moderate       5 pt / 7 ⬢  / 1 turn     / smithing-skilled     / melee-/ranged-basic
  #   High Quality   9 pt / 15 ⬢ / 2 turns    / smithing-skilled     / melee-/ranged-basic
  #   Exceptional   11 pt / 32 ⬢ / 3 turns    / smithing-skilled     / melee-/ranged-basic
  #   Gunpowder      9 pt / 15 ⬢ / 2 turns    / smithing-gunpowder   / ranged-basic (Bore Pistol 7 pt, 9 ⬢)
  #
  # Bows / crossbows keep `crafting` in place of `smithing` at every tier —
  # wood-and-sinew is still wood-and-sinew even at High Quality.
  #
  # Three small pieces of metalwork — spear, dagger, phrygian-spear — run
  # under the Simple rung's turn: turnsCost 0.25, four to a Routine (the
  # silver-knife takes 0.5, two to a Routine, since 2026-09-20), a spearhead or a knife not being a day at the anvil (Chris
  # 2026-09-07). The markup formula still rounds to 0 at a quarter turn
  # (2 × 0.25^1.3 = 0.33), so they keep Dead Simple's flat +1 rather than the
  # tier's — see DEPOT.md §4. They sell at 8: four a Routine pays 8 ⬢ a turn,
  # under the Simple rung's own 10, and §4's rule is that quick work is never
  # paid better than the rung above it. (Thirds selling at 9 until costs became
  # decimals in 9/2026 — the price came down with the extra unit.) Everything
  # else (pt, skill, forge) is the tier's. The silver-knife is the odd one out
  # and always was: 1 ⬢ and an ingot in, 23 out.
  #
  # ─── Dead Simple ───────────────────────────────────────────────────────────

  trench-knife:
    catalog: all
    name: Trench Knife
    category: items
    group: items-weapons
    sprite: knife
    description: "A deadly knife with brass knuckles embedded on the grip. While equipped, torture-related Gambits gain +1."
    fighting: { tiers: 0.3, weaponClass: knife }
    manifest: black-market
    depotPrice: 6
    pointCost: 1
    requiredTag: melee-basic
    equippable: true
    equipSlot: WEAPON
    weight: 1
    stackable: true
    visible: worn
    purchasable: false
    purchasableAfterStart: false
    craftable: true
    requirement:
      turnsCost: 1
      # Scrap. A 6 ¢ shelf leaves no whole-⬢ recipe on the smithing rung
      # (DEPOT.md §4), so the report holds this one back by name; 1 ⬢ keeps a
      # maker from paying 15 ¢ of material for a 4 ¢ knife, which it was.
      resourceCost: 1
      skills: [smithing]
      gambit: false
    sellable: true
    sellablePrice: 4

  # The creation pick is the bundle below; a single trench knives is under the 1-point floor at 7 ¢ a point (TAGS.md §4a).
  trench-knives-pair:
    catalog: all
    name: Trench Knives (pair)
    category: items
    group: items-weapons
    sprite: knife
    description: "Two of them, wrapped. Unpack them whenever you like."
    pointCost: 1
    requiredTag: melee-basic
    weight: 2
    visible: false
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    consumesInto: [trench-knife, trench-knife]
  # A `customizableSkill: smithing-skilled` below is the +1 ⬢ door onto a
  # smith's own name and words (CRAFTING.md §4a), and the rung it names is
  # who may open it — the top of the Smithing ladder, whatever tier the piece
  # itself is. Only the plain arms carry it: a mace, a broadsword, a spear.
