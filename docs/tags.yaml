# Sole master for the Tag catalog. TagGroup catalog is a sibling file,
# docs/taggroups.yaml — see there for group/color fields.
#
# PRICING A TAG: the point scale is docs/systemdocs/TAGS.md §4a, and it is
# canonical. Price against the band, not against whatever the neighbouring
# entries in this file happen to cost. docs/tag-design.md restates the same
# scale for players, along with the YAML format and worked examples.
#
# NAMING A SLASH COMMAND IN A `description`: write `{cmd:play}`, never a bare
# /play and never backticks. Tag descriptions render through ChipText.js /
# RichText.js, which understand the {kind:payload} token grammar and have NO
# Markdown parser at all — a backtick here prints as a backtick. The token
# renders the command in the mono face on every surface, the handbook and the
# documents included. Bot and DM strings are the opposite case: Discord DOES
# render Markdown and does not render tokens, so those write `/conceal` with
# real backticks. Added 2026-09-05 for the Instrument line.
#
# NUMBERS IN A `description`: digits for anything a player counts, tracks, or
# computes with (a turn cost, a frequency limiter, a skill-tier shift, a die
# face or range, a headcount, a resource amount). Words only for idiom
# ("Almost no one matches you"), hyphenated compounds ("one-shot", "one-on-
# one"), or pure flavour with no mechanical weight ("six chambers"). A skill
# tier shift always reads "counts as N tiers higher/lower" — not "levels",
# not "rungs", and it NAMES ITS TREE: "your melee skill", "your ranged skill".
# "your fighting skill" is reserved for a shift that really does move both,
# which is the five drinking/injury debuffs, Reckless Attacker and Monster
# Hunter. A melee-only sidegrade writing "fighting" overclaims, since the two
# halves of the tree never overlap. A flat time cost always reads "Takes N
# turns."; a repeating
# one always reads "Once per day/turn" or "Once every N turns/days."
#
# ENTRY FORMAT: every entry in `categories:` and `tags:` below is a map keyed
# by its own slug — `hungerless:`, not `- slug: hungerless`. An editor's
# outline labels a map entry with its key and a sequence entry with its index,
# so the sequence form turned 500 tags into "{} 0, {} 1, …". The syncs read
# both shapes through db/lib/yamlEntries.js; the masters all use the keyed one.
#
# A SLUG IS ITS NAME, SLUGIFIED: lowercase, punctuation dropped, spaces and
# colons to hyphens. "Old Ways (Bacchus)" is `old-ways-bacchus`, "True Form:
# Serpent" is `true-form-serpent`. db/lib/syncTags.js throws when they
# disagree, so renaming a tag means renaming its slug — and then every
# reference to it, since the slug is the match key everywhere else (desires,
# taggroups, code). Two exceptions. A hidden category (demoness), where a
# generic name like "Heal" would collide with a general tag and the slug
# leads with the category instead: `demoness-heal`. And `keepSlug: true` on
# an entry, for a tag RENAMED mid-stream whose old slug is load-bearing —
# the sync then accepts the mismatch, and throws instead if the flag sits on
# a slug that already matches, so it can never quietly go stale.
#
# This file is hand-edited and is the ONLY thing that writes the catalog.
# There is deliberately no automated sync from anywhere else — drafted
# entries get added here by hand, one at a time, so the fields that only
# ever live in this file (consumesInto, stackable, craftable, requirement)
# can't be clobbered by a bulk overwrite.
#
# Per-tag fields not covered elsewhere in this file:
#   sprite          - the tag's own art: a PNG basename, no extension, under
#                     web/public/assets/items/ (pixel art from OpenSourceWeb,
#                     CC BY-SA 3.0 — see that folder's ATTRIBUTION.md, and
#                     assets/osw-sprites/ for the library it is picked from).
#                     Drawn by TagIcon.js on chips, sheet rows and item cards
#                     INSTEAD of the tag's TagGroup glyph. Optional, and absent
#                     is the ordinary case: a tag with no sprite keeps its group
#                     icon, which is never wrong, only general. Do not stretch
#                     to fill one in — a misleading picture is worse than a
#                     generic mark. The sync throws if the file is not there. A
#                     custom craft inherits its base recipe's value. TAGS.md 4c.
#   durationTurns   - default turns-to-expire once granted, for tags that
#                     auto-expire (e.g. Drained: 3). Omit for tags that don't
#                     expire on their own.
#   visible         - who sees this tag on a 🔍 inspect. true | false | worn |
#                     named | face, default false. THE RULE, and it is catalog-wide: `true`
#                     means a stranger looking you over would notice — your
#                     body, your face, your gait, your clothes, anything large
#                     enough that you are visibly hauling it, and a reputation
#                     already public under your name (Wanted, Knighted).
#                     NEVER your appetites, beliefs, opinions,
#                     skills or secrets: Hot-Headed, Pacifist, Alcoholic,
#                     Eunuch, every Belief and every Skill are `false`, and a
#                     temper is a thing you find out about someone rather than
#                     a thing you see. `worn` is the concealable middle and
#                     requires `equippable` (the sync throws otherwise).
#                     `named` is a reputation: gone under a hood or a false
#                     name (Wanted). `face` is a thing ON the face — Disfigured,
#                     Ugly, Pretty, a missing eye, a wired jaw: like `true`
#                     until a hood or mask covers it. A Disguise Kit does not
#                     hide it, since the face under one is uncovered. When
#                     in doubt, check the neighbours — if a tag of identical
#                     severity two rows away disagrees with you, one of the two
#                     is wrong. Health carries a second rule on top of this
#                     one: a medic sees what they could treat whatever this
#                     says, so an internal illness can be `false` without
#                     becoming undiagnosable (TAGS.md §5c).
#   removable       - an OPT-OUT, and the only legal value is `false`. Destroy
#                     is for things you own, so db/lib/syncTags.js DERIVES the
#                     flag: every tag in `items` or `assets` gets the Destroy
#                     menu and nothing else ever does. Write `removable: false`
#                     on the handful an item is not allowed to be binned from
#                     — the three corpses (Butcher and Bury are the two ways a
#                     body leaves) — and say why in a comment
#                     beside it. The sync THROWS on `removable: true` anywhere,
#                     and on `removable: false` outside those two categories,
#                     where it would do nothing. A cure is `healable`, not
#                     this. Destroying refunds nothing.
#   tradeable       - whether the tag can be handed over, or lifted off a body
#                     (docs/systemdocs/TAGS.md §5). ITEMS DO NOT WRITE IT: an
#                     item is a thing, and a thing can change hands, so the
#                     sync derives it the way it derives `removable` and THROWS
#                     on the line either way round. Assets DO write it, and
#                     must: they are genuinely split, since an arelitz, a cart and
#                     a dog change hands while a forge, a palisade and
#                     a gallows do not. Everything else is untradeable and says
#                     nothing. A runtime mint is not bound by this — a Disguise
#                     is an Items row that is deliberately not cargo — but that
#                     is code, not this file.
#   craftable       - the Craft menu (docs/systemdocs/CRAFTING.md): whether a
#                     player can make this tag. The recipe is the
#                     `requirement:` block below, and every listed skill must
#                     be held. Setting it true puts the tag in the Craft menu
#                     of everyone who holds its skills. Default false.
#   customizable    - the maker may put their own name and words on it, for
#                     +1 ⬢ a unit (CRAFTING.md §4a). Craftable and stackable
#                     only. Default false.
#   customizableSkill - a tag slug the maker must HOLD to do that. The arms
#                     and armour all name `smithing-skilled`, so signing a
#                     piece is a skilled smith's privilege whatever tier the
#                     piece itself is. Omit it and anyone who can make the
#                     thing may customize it.
#   healable        - the Heal menu (HEAL_CHARACTER): a cure exists. Its cost
#                     is the `requirement:` block and the medic must hold its
#                     skills. Default false.
#   teachable       - Learn / Teach can move this tag between characters
#                     (docs/systemdocs/LESSONS.md). Every skill sets it.
#                     Default false.
#   mastery         - a MASTERY tag: buyable ONLY once play has started, never
#                     at character creation. The third state `purchasable` and
#                     `purchasableAfterStart` could not express between them
#                     ("buyable at all" and "still buyable mid-game"; neither
#                     says "not yet"). Bought with points earned in play rather
#                     than out of a starting budget, which is why the mastery
#                     tags are the deliberate exception to the 14-point ceiling
#                     — see TAGS.md 4a. Renders a ★ beside the name wherever
#                     the name is drawn. Default false.
#                     db/lib/syncTags.js THROWS on `mastery` with
#                     `purchasableAfterStart: false` (buyable nowhere at all)
#                     and on `mastery` with a negative pointCost (a drawback
#                     you can only take mid-game is a point farm).
#   stackable       - whether a character can hold more than one at a time
#                     (meals, ammunition, anything a crafting Move makes in a
#                     batch). Default false. A stack is one CharacterTag row
#                     carrying a count, not N rows, so presence checks are
#                     unaffected. Fine to combine with durationTurns: each
#                     expiry sheds one unit and restarts the timer for the
#                     rest, so 3 of a 2-turn tag lose one every 2 turns.
#   weight          - what ONE UNIT weighs, in pounds, against
#                     GameConfig.carryWeightLbs (docs/systemdocs/CARRY.md §1).
#                     0 IS A REAL RUNG, not a mistake: a key, a letter, a
#                     badge, a pair of spectacles. Nobody's carry is decided
#                     by their keyring, and pretending otherwise just makes
#                     players do arithmetic about paperwork. Write `0`
#                     explicitly rather than omitting it — omission means the
#                     tag is not cargo at all, which is a different claim.
#                     Omit it for anything weightless: every skill, status,
#                     injury and belief, and every Asset, since a horse
#                     carries itself and a house does not move at all. EVERY
#                     item needs one, with no exemption — an item is always
#                     cargo now (see `tradeable` above).
#                     PRICE IT OFF THE BAND, never by feel, the same way a
#                     point cost is priced off TAGS.md §4a:
#                       0       Negligible   key, letter, badge, coin, cigarette
#                       0.5–1   Trivial      vial, tonic, dagger, sling, sac
#                       2–3     Light        meal, flask, sword, bow, cudgel
#                       4–6     Medium       spear, mace, helm, halberd, fishing rod
#                       8–12    Heavy        crossbow, rifle, shield, trap, padded armor
#                       20–30   Very Heavy   mail shirt, breastplate, pavise, Godflesh
#                       40–75   Massive      plate armor, flamethrower, a corpse
#                       100     Immense      workshop equipment
#                     A thing with an obvious real weight gets that weight
#                     (a longsword is 3 lb, a halberd 6); the band is for
#                     what has none. Never price by feel.
#                     db/lib/syncTags.js THROWS if an `items` tag omits it,
#                     so new gear can never sneak in weighing nothing.
#   consumable      - whether a player can use this tag up from their
#                     character sheet — eat the meal, unpack the crate.
#                     Default false. Consuming always takes exactly ONE
#                     unit, so a stack of meals feeds you several times.
#   consumesInto    - list of tag slugs this tag turns INTO when it is
#                     consumed (a drink becoming Tipsy; Starting Wares
#                     unpacking into goods). Repeat a slug to grant several
#                     of it — that only multiplies for a stackable tag, a
#                     non-stackable repeat collapses to one. Granted tags
#                     that have their own durationTurns start their clock at
#                     that moment, so chains work (drink -> tipsy, which
#                     the expiry sweep then clears). If the character already
#                     holds a non-stackable granted tag, their existing one
#                     is left alone. Omit it for a consumable that simply
#                     gets used up.
#                     An entry may also be conditional, granted only to a
#                     character holding NONE of the listed tags. Nothing in
#                     the catalog uses this today; the shape is:
#                         consumesInto:
#                           - tipsy
#                           - slug: night-vision
#                             unlessTags: [blind]
#                     Both halves are validated against this file. The
#                     condition is applied by the grant, and by nothing else:
#                     consuming says nothing about what it leaves behind.
#   cooked:         - what this tag contributes as a COOKING ingredient — see
#                     docs/systemdocs/COOKING.md §3 for the field reference
#                     (taste, mood, hunger, tasteForm, into, cures). Not
#                     documented here since it lives entirely in that doc.
#   requirement:    - what it costs a character to add (craftable) or remove
#                     (healable) this tag in play. Enforced by Craft and Heal.
#                     One shared block covers whichever direction applies to
#                     a given tag - e.g. crafting a sword only cares about the
#                     cost to add it, curing Arthritis only about removing it.
#     turnsCost     - the WORK one unit takes, in Moves, as a DECIMAL on a
#                     quarter. 0 means Dead Simple (no Move, rationed per
#                     turn); 0.25, 0.5 and 0.75 are shares of a Routine, so
#                     four / two / one of them fill it and a spare part-turn
#                     takes more work of the same family; 1 means this turn's
#                     whole Routine; more means a multi-turn project (one unit
#                     per project, whole turns only). Quantity is limited by
#                     this arithmetic alone - never by a separate cap (Chris
#                     2026-09-06).
#                     Quarters, and the sync refuses anything else: the Move
#                     budget is exact rational arithmetic, and a cost it cannot
#                     hold exactly lets a character do work they never paid for.
#                     It was a `1/N` fraction until 9/2026.
#     resourceCost  - ⬢, charged up front by Craft, per unit
#     skills        - list of skill tag slugs required; multiple accepted
#     cureRung      - wounds only, and REQUIRED on them: which rung of the
#                     cure ladder above this sits on, 0 to 7 (half rungs 0.5
#                     and 3.5 exist for the named exceptions). It is what the
#                     mood dial reads - see db/lib/mood.js#woundRungOf - and
#                     it is authored rather than worked out from the price,
#                     so severity and cost can be tuned apart.
#     gambit        - cures only: whether the medic rolls a Gambit. Crafting
#                     is always a Routine and ignores this. A cure ABOVE the
#                     medic's own tier is a Gambit whatever this says; this
#                     field is for the top rung, which even an Expert rolls
#                     for (docs/systemdocs/TAGS.md §5c).
#     perTurn       - a RATION: units of this recipe one character may make
#                     in a turn. ONLY legal at turnsCost: 0, where it caps a
#                     Dead Simple recipe below the shared pool (bliss at 2).
#                     Omit it and a Dead Simple recipe falls back to
#                     DEAD_SIMPLE_PER_TURN (4). It is never a work cost - work
#                     is turnsCost, and 0.25 is how you say "four a Routine".
#                     The sync refuses perTurn on anything that costs a Move.
#                     (It used to double as the denominator of a `1/N` cost,
#                     which is why the column once meant two things.)
#   expiresInto     - what this tag turns INTO when its durationTurns runs
#                     out, instead of simply being swept away. This is the
#                     untreated-wound chain: Infected festers, Festering goes
#                     Feverish AND Necrotic, Necrosis costs you a limb.
#                     A list whose entries are either a bare slug:
#                         expiresInto: [festering]
#                     several slugs, all granted at once:
#                         expiresInto: [feverish, necrosis]
#                     or an even random pick between slugs:
#                         expiresInto:
#                           - oneOf: [missing-leg, missing-arm]
#                     Three rules, all enforced by db/lib/syncTags.js before
#                     it writes anything: every slug must exist in this file;
#                     the tag must have durationTurns (or nothing would ever
#                     fire it); and a tag may not list ITSELF, since the
#                     sweep that follows the grant would delete the fresh row
#                     one statement later. A two-tag loop (migraine <->
#                     no-migraine) is fine and is how a recurring condition
#                     is written.
#                     Distinct from consumesInto above: that one is chosen by
#                     the player, this one happens on the clock whether they
#                     wanted it or not.
#   escalatesInto   - the rung ABOVE this one on a ladder. Consuming something
#                     that grants a tag you already hold clears the one you
#                     hold and gives you this instead, walking up as far as
#                     the chain goes:
#                         tipsy:  escalatesInto: wasted
#                         wasted: escalatesInto: unconscious
#                     Without it a second drink does nothing at all, because a
#                     non-stackable tag you already hold is left alone.
#                     One bare slug, not a list and not a { oneOf } — a ladder
#                     has exactly one next rung, and a random one would make
#                     "one more drink" impossible to plan around. The slug must
#                     exist in this file and the chain may not loop, both
#                     enforced by db/lib/syncTags.js.
#                     Only the CONSUME path walks it. A GM granting the same
#                     tag twice from the Dev Panel is not pouring a drink.
#
# THE CURE LADDER. Every tag in the `health` category is priced off one of
# eight rungs, and nothing in that category should invent its own numbers —
# pick the rung and copy the block. Full writeup in
# docs/systemdocs/TAGS.md §5c.
#
#   Tier 0  untreatable            no requirement block at all
#   Tier 1  very minor, first aid  1 ⬢,  0 turns,    medical-basic
#   Tier 2  minor                  2 ⬢,  0.25 turns, medical-basic
#   Tier 3  moderately severe      2 ⬢,  0.25 turns, medical-skilled
#   Tier 4  severe                 4 ⬢,  0.25 turns, medical-skilled
#   Tier 5  very minor surgery     7 ⬢,  0.5 turns,  medical-skilled
#   Tier 6  severe surgery         14 ⬢, 1 turn,     medical-expert
#   Tier 7  complex surgery        14 ⬢, 1 turn,     medical-expert, gambit
#
# Pick the rung, copy the block, AND SET `cureRung:` to match — the mood dial
# reads that field, not the price (db/lib/mood.js). It used to work the rung
# out from the ⬢ and the turns, which is why tiers 2 and 3 had different turn
# costs; costs are decimals now and those two tiers cost the same, so the rung
# is written down. The sync refuses a wound that does not carry one.
#
# The top three rungs are the surgical ones, and they are where the ladder
# does its real work. A Serpent closes an arterial bleed and cuts away dead
# flesh without rolling; anything that means opening a chest or a belly is
# Esculap's, and a Serpent attempting it rolls. The last rung is the one even
# Esculap rolls for, which is why it shares tier 6's price — what separates
# them is the Gambit, not the bill.
#
# ONE tag is deliberately off the ladder: `dying`. Its cure is a rescue rather
# than a procedure, so it is priced as first aid (4 ⬢, no turns, medical-basic)
# and made hard by an unconditional Gambit instead of by the bill. The block
# itself says why. Nothing else in the category gets to do this.
#
# Tier 0 is a real choice, not a gap: something that realistically isn't
# treatable, runs its course quickly, and does no lasting harm (Vomiting, a
# Migraine, a Concussion) gets NO requirement block, which is exactly what
# makes the Heal request refuse to offer it. A player can always attempt a
# Gambit to treat anything above their tier, or anything with no listed cure
# — that is what Gambits are for, and the Medical document says so.
categories:
  meta:
    name: Meta
  general:
    name: General
  skills:
    name: Skills
  status:
    name: Status
  # Every affliction, injury and condition a medic might treat. Split out of
  # Status deliberately: Status is the needs/intoxication layer (Hungry,
  # Drained, Tipsy) and health is a system of its own, with its own groups
  # and its own pricing ladder. See docs/systemdocs/TAGS.md §5c.
  health:
    name: Health
  items:
    name: Items
  assets:
    name: Assets
  # Hidden categories. Each has exactly one group in docs/taggroups.yaml
  # carrying a `requiredTag`, and that group gate is the only thing hiding
  # them — there is no per-category field. Until a character holds the
  # unlocking tag the category has no tab in any picker and its tags are
  # withheld from /api/tags entirely.
  demoness:
    catalog: secret
    name: Demoness
# TagGroup catalog (Traits, Social, Health, ...) now lives in
# docs/taggroups.yaml — split out so group colors can be freeform hex
# instead of a fixed token set. Tags below reference a group by its slug
# via `group:`, same as before.

tags:
  # --- Meta ---------------------------------------------------------------
  hungerless:
    catalog: gm
    name: Hungerless
    category: meta
    description: "Your body no longer needs sustenance. You can still eat, but food does nothing for you."
    pointCost: 0
    purchasable: false
    # Fast Metabolism's hunger never comes, so its points would be free. Any
    # seat that hands out Hungerless takes it off (db/lib/seatConflicts.js).
    conflictsWith: [fast-metabolism]

  turn-ping:
    catalog: gm
    description: "You are pinged in Discord when the turn advances. Toggled from /character; carries no weight in play."
    name: Turn Ping
    category: meta
    pointCost: 0
    purchasable: false

  # The Judge's seat tag (db/lib/threats.js). Like `demoness` below it is
  # role-granted, never bought, and carries no group — the point cost is
  # cosmetic. It exists so the threat roster can find who holds the seat
  # without a column to keep in sync. `secret` for the same reason Demoness
  # is: an antagonist seat has no business showing up in the player's Tag
  # Catalog.
  # A seat's INCOMPATIBLE tags are its conflictsWith edges (THREATS.md §3).
  # The store and Add Tag refuse them for a holder; Assign removes what a
  # character already had and settles its cost (db/lib/seatConflicts.js).
  # A drawback the seat forbids belongs HERE, not on a buyable perk the seat
  # hands out: a perk's edges only take tags that cost points.
  judge:
    catalog: secret
    name: Judge
    category: general
    description: "You are the Judge."
    pointCost: 0
    purchasable: false
    conflictsWith: [pacifist, charitable, saint]

  demoness:
    catalog: secret
    name: Demoness
    category: general
    description: '"Pleasure is so painful — ah~! I don''t care!" You can Break souls ({tag:broken}), turning their owners into walking, empty shells, by making them fall in love with you — and then sealing it with a (voluntary) kiss. If people want more after that, that''s your business, not mine.'
    pointCost: 0
    purchasable: false
    # Ugly and Pretty sit under the Beautiful the seat hands out; Prudish and
    # Eunuch refuse the romance the seat runs on.
    conflictsWith: [pacifist, charitable, saint, ugly, pretty, prudish, eunuch]
    desires:
      locks:
        - all: true
          exceptFamilies: [demoness]

  # The Vampire's seat tag (db/lib/threats.js). Same posture as `judge`
  # above: role-granted, never bought, no group — the point cost is
  # cosmetic. It exists so the threat roster can find who holds the seat
  # without a column to keep in sync. `secret` for the same reason Judge is:
  # an antagonist seat has no business showing up in the player's Tag
  # Catalog. See docs/systemdocs/VAMPIRE.md.
  vampire:
    catalog: secret
    name: Vampire
    category: general
    description: "A creature of the night, they must continually feed on the blood of mortals to retain their eternal youth. Vampires also have an attachment to the mortal coil, if they give in to their desires too freely, they may end up turning fully to their thirst for blood."
    pointCost: 0
    purchasable: false
    # A vampire feeds; Saint and Pacifist forbid harming anyone at all — the
    # design doc's own words (VAMPIRE.md §9): "mutually exclusive with tags
    # that would inhibit them from feeding... Such tags are removed from a
    # character if they become a vampire." threatActions.js#assignThreat
    # already strips conflictsWith edges off any seat tag it grants (same
    # mechanism Demoness above uses) — no new code needed, just this edge.
    # Hemophobia too: blood makes them dizzy, and a vampire lives on it.
    conflictsWith: [saint, pacifist, hemophobia]
    # Food/drink Desires are unavailable to a vampire — VAMPIRE.md §9: "Do
    # not become hungry, nor... gain mood points from eating food or meals.
    # Desires relating to food and drink are unavailable to them, instead
    # they have vampire specific desires." Read as covering both the `food`
    # family (meals, tea, sweets) and `alcohol` (a drink); nothing else is
    # touched, so a vampire's other Desires (wealth, status, romance...)
    # stay open alongside their new `vampirism` ones.
    desires:
      locks:
        - families: [food, alcohol]

  # The Thanati Leader's mark on top of the thanati Belief below — the roster
  # The Skinless's own tag (db/lib/skinless.js, docs/systemdocs/SKINLESS.md).
  # Every rule the doc gives them hangs off holding this, not off the role:
  # the grunts others hear (db/lib/strangers.js), no clothes, armour or
  # accessories (db/lib/verbs/self.js), the fixed face, Smell Skin, a Skinless
  # Brain when butchered, no belief and no group. Visible on a look: you can
  # see what they are. Its desire lock leaves only the Skinless family.
  skinless:
    catalog: secret
    name: Skinless
    category: general
    group: general-traits
    description: "A fleshy humanoid, raw musculature glistening for all to see."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    desires:
      locks:
        - all: true
          exceptFamilies: [skinless]

  # A Skinless's eyes (db/lib/skinless.js). The +1 tier is real, not
  # situational: fightingSkill.js adds it while the holder stands in a
  # CAVE_LEVEL zone (the Caves or the Depths), and lists it for the GM where
  # nobody knows where they are standing.
  cave-eyes:
    catalog: secret
    name: Cave Eyes
    category: general
    group: general-traits
    description: "Your eyes are perfectly adapted to see inside the caves."
    fighting: { tree: both, tiers: 1, when: { zoneKind: [CAVE_LEVEL] } }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # tells the two seats apart by this tag (db/lib/threats.js).
  thanati-leader:
    catalog: secret
    name: Thanati Leader
    category: general
    description: "The most senior and wicked member of the cult. You have spent many years nurturing it, now the time to strike approaches… View the Cult Leader document for more information."
    pointCost: 0
    purchasable: false
    # The leader stays wholly the cult's: {tag:thanati}'s lock only claims
    # the first slot, and this one shuts every other slot the same way.
    desires:
      locks:
        - all: true
          exceptFamilies: [thanati, cruelty, violence, feud, betrayal]

  # Price is cosmetic (role-granted, not purchasable) — do not "fix" it. The
  # `all + food at tiers 1-2` intent from the design spec isn't expressible
  # in one clause (each clause carries exactly one of all|families|tiers, and
  # exceptFamilies only subtracts), so the tier-1 lock is data and the cheap-
  # food restriction below is a prose line, GM-adjudicated.
  nobility:
    catalog: gm
    name: Nobility
    psychological: true
    category: general
    group: general-personality
    description: "You are a person of noble breeding, accustomed to comfort in all aspects. You need to regularly eat lavish meals. You can't take any Desire related to something below your station."
    pointCost: -2
    requiredTag: courtier
    purchasable: false
    purchasableAfterStart: false
    visible: true
    # Named rather than `tiers: [1]`, which is what this used to be. A point
    # rescale turned tier 1 into most of the catalog, so the old shape shut a
    # noble out of nearly everything — and "below your station" was never about
    # what a Desire is worth. It is a judgment per Desire: errands, common
    # pleasures and pocket-change wins. Comforts, court life, romance, faith,
    # scheming and vice all stay open, however cheap.
    desires:
      locks:
        - named:
            - win-a-compliment
            - drink-alcohol
            - drink-tea-or-coffee
            - drink-moonshine
            - eat-sweets
            - smoke-a-cigarette
            - get-a-hug
            - give-a-hug
            - listen-to-boombox
            - make-a-merchant-purchase
            - win-5-gambling
            - win-10-gambling
            - win-a-bet
            - retrieve-item-from-caves
            - deliver-a-message
            - paid-for-performance
            - pet-a-rat

  ravenhearter:
    catalog: gm
    name: Ravenhearter
    category: general
    description: "You live in Ravenheart."
    pointCost: 0
    purchasable: false
    visible: false

  mortus:
    catalog: gm
    name: Mortus
    category: general
    description: "You are one of the Mortii, who deal with the dead and tend to the Lifeweb."
    pointCost: 0
    purchasable: false
    visible: false

  servant:
    catalog: gm
    name: Servant
    category: general
    description: "You work to maintain the Keep and please its masters."
    pointCost: 0
    purchasable: false
    visible: false

  # Two markers a GM hands out rather than anything anybody buys: one for
  # knowing where a door is, one for being on the wrong side of one.
  behind-the-painting:
    catalog: gm
    name: Behind the Painting
    category: general
    description: "You know what the Great Hall's painting is hiding."
    pointCost: 0
    purchasable: false
    visible: false

  in-the-pit:
    catalog: gm
    name: In the Pit
    category: general
    description: "Oh no…"
    pointCost: 0
    purchasable: false
    visible: false

  # What the Charon's Habitation hands you (docs/systemdocs/CHARON.md). The tag
  # is the only thing a player ever sees of the ASLEEP status — visible on
  # purpose, since it is the thing telling them they may roll again.
  #
  # NOT the `asleep` tag further down this file. That one is ordinary sleep: a
  # one-turn status debuff that caps your fighting at pitiful and wears off.
  # This one never wears off, because the character it is on is out of the game.
  charon-asleep:
    catalog: gm
    name: Asleep
    # The slug cannot be `asleep`; that one is taken by ordinary sleep. The
    # NAME is the word for it either way, so the flag is here rather than the
    # name being bent to fit a free slug.
    keepSlug: true
    category: general
    description: "You are asleep. You can respawn."
    pointCost: 0
    purchasable: false
    visible: true

  courtier:
    catalog: gm
    name: Courtier
    category: general
    group: general-traits
    description: "A member of the court."
    pointCost: 0
    purchasable: false

  # The Court — general-court is gated behind `courtier` at the group level,
  # same idiom as general-cerberon, so none of these need their own requiredTag.
  # A token price. Knighthood is mostly conferred -- the Baron's hand, or the
  # Seasoned Knight kit below -- so the point is not what it buys you but that
  # you had to spend something to claim it at creation. Creation only: the
  # Baron does the knighting once play starts.
  knighted:
    catalog: gm
    name: Knighted
    category: general
    group: general-court
    description: "You were knighted, and serve the Baron directly."
    pointCost: 1
    visible: true
    purchasable: true
    purchasableAfterStart: true

  # --- Teaching (docs/systemdocs/LESSONS.md) -----------------------------
  # Learn Skill / Teach Skill on the sheet. Teaching is NOT a door — anybody
  # can teach what they know, it just costs them their Routine and their
  # student needs a 6. The tag is what makes it free, repeatable and easier;
  # the Drill Instructor rung is gated by general-cerberon. The Lecturing rung
  # was removed on 2026-09-14, its three-student cap folded into Teaching
  # itself. Both are Skills, standalone like Climbing or Stealth, and neither
  # is teachable: you can't be taught to teach. Bascinet's words, unmarked.
  # [PLAYER TEXT — Bascinet to rewrite the description below]
  teaching:
    catalog: all
    name: Teaching
    category: skills
    description: "You can train someone in a skill you have, and it costs you no Move at all — up to 3 people a turn. They'll succeed in a 5 or a 6. Without this tag, teaching takes your whole turn and they need a 6."
    pointCost: 3
    visible: false
    purchasable: true
    purchasableAfterStart: true
    teachable: false

  old-blood:
    catalog: gm
    name: Old Blood
    category: general
    group: general-court
    description: "Your family has been around a long time."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: false

  dancer:
    catalog: gm
    name: Dancer
    category: general
    group: general-court
    description: "You are a fantastic dancer. Unlocks Desires about dancing."
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  soft-hands:
    catalog: gm
    name: Soft Hands
    category: general
    group: general-court
    description: "You've never done a day's labor. You make half the ⬢ you otherwise would when laboring."
    pointCost: -4
    purchasable: true
    purchasableAfterStart: false

  # --- Locations you know about (group general-location) --------------------
  # Knowledge, not a possession. It is the `access:` key on a hidden Room in
  # docs/zones.yaml and nothing else, so it weighs nothing, cannot be bought
  # and cannot be handed over — you either were shown the place or you were
  # not. Somebody bringing a newcomer in has to grant it deliberately.
  sewer:
    catalog: gm
    name: Sewer
    category: general
    group: general-location
    description: "You know the location of the sewers."
    pointCost: 0
    tradeable: false
    weight: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  convoy-directions:
    catalog: gm
    name: Convoy Directions
    category: general
    group: general-location
    description: "The itinerary of a trade convoy moving through the caves long ago."
    pointCost: 0
    tradeable: false
    weight: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # Not knowledge of a place so much as arrival at one: the Walkways' pit is
  # a room you can only be in once you have fallen into it, so a GM grants
  # this from /gm/dev and takes it back when the character climbs out.
  cave-pit:
    catalog: gm
    name: Cave Pit
    category: general
    group: general-location
    description: "You fell into the pit."
    pointCost: 0
    tradeable: false
    weight: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # Moved out of general-court (2026-08-31, Desires rework) — anyone can be
  # vain, not just the court.
  vain:
    catalog: all
    name: Vain
    psychological: true
    category: general
    group: general-addictions
    description: "You are inwardly inconsolable if anyone outshines you. Your bottom Desire slot is locked to Desires about being admired."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    consumable: false
    conflictsWith: [depressed]
    desires:
      locks:
        - all: true
          exceptFamilies: [vanity]
          slot: bottom

  # NEW (2026-08-31, Desires rework). The one Addiction that closes tiers
  # 5 and 7 too — compensated by food being the largest family.
  glutton:
    catalog: all
    name: Glutton
    psychological: true
    category: general
    group: general-addictions
    description: "Just one more sweet… You can keep eating even when you are full, and your bottom Desire slot is locked to Desires about food."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    consumable: false
    conflictsWith: [depressed]
    desires:
      locks:
        - all: true
          exceptFamilies: [food]
          slot: bottom

  # --- Personality: the positive half (general-personality) ---------------
  # NEW 2026-08-31 (Desires rework) as `general-interests`; MOVED into
  # `general-personality` 2026-09-01. Nothing here locks anything — these just
  # gate a Desire open. They now sit in the same group as the drawbacks that
  # close the catalog down, because the merge's whole point is that one tag is
  # allowed to do both (DESIRES.md §5). Superstitious/Desperate/Hypochondriac/
  # Combative/Corrupt/Fundamentalist above came in with the same sign flip.
  mad-doctor:
    catalog: gm
    name: Mad Doctor
    category: general
    group: general-personality
    description: "You are intrigued by humanity's potential. Unlocks Desires about modifying the body."
    pointCost: 5
    requiredTag: medical-basic
    purchasable: true
    purchasableAfterStart: true

  esoteric:
    catalog: gm
    name: Esoteric
    category: general
    group: general-personality
    description: "What could be worthwhile except the Truth? Unlocks Desires about esotericism."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  adventurer:
    catalog: all
    name: Adventurer
    category: general
    group: general-personality
    description: "Unlocks Desires about adventuring."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  cruel:
    catalog: all
    name: Cruel
    category: general
    group: general-personality
    description: "It's a call, a need. Unlocks Desires about cruelty. Your torture rolls get +1."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  charitable:
    catalog: all
    name: Charitable
    category: general
    group: general-personality
    description: "Unlocks Desires about charity."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  torturer:
    catalog: all
    name: Torturer
    category: general
    group: general-personality
    description: "You know the best ways to draw knowledge out of someone through… certain means. Your Gambits to extract information are likelier to shake a dark secret loose."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true
    conflictsWith: [charitable, pacifist, saint, old-ways-eusoch]

  # Lock-free by design (F-18): an Interest, not a Restriction.
  death-wish:
    catalog: all
    name: "Death Wish"
    category: general
    group: general-personality
    description: "You want to see how close you can get to death's door. Unlocks powerful Desires about extreme risk."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  schemer:
    catalog: all
    name: Schemer
    category: general
    group: general-personality
    description: "You have quite the active, or ambitious, mind. Unlocks Desires about scheming."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  chaplain:
    catalog: gm
    name: Chaplain
    category: general
    description: "Your forgiving presence can cure negative psychological tags like addictions. People can Confess to you pressing the Confess button, consuming their turn. If the confessor rolls a 5 or a 6, the tag is removed."
    pointCost: 0
    purchasable: false

  # The office itself, as a tag. The bishop role already grants Chaplain, and
  # every confession gate reads that tag rather than the role
  # (db/lib/confession.js, docs/systemdocs/CHARACTERS.md) — this is the same
  # move for the things only the Bishop may do. Groupless like Chaplain above,
  # invisible, and never bought: docs/roles.yaml hands it out and nothing else
  # ever will. It gates the Excommunicate button and the Depriver tag below.
  bishop:
    catalog: gm
    name: Bishop
    category: general
    description: "You can excommunicate people."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  pious:
    catalog: gm
    name: Pious
    category: general
    group: general-traits
    description: "You cannot be converted."
    pointCost: 0
    purchasable: false

  # Bishop-only, bought rather than granted. Gated by the tag rather than by
  # the role because a required role is not a thing docs/tags.yaml can say —
  # requiredTag is, and the bishop tag above exists so it can be said. An
  # ungated group with a gate on the tag itself, the single-tag half of the
  # mechanism the header describes, so nobody else ever sees it in the
  # point-buy or at /store.
  depriver:
    catalog: gm
    name: Depriver
    category: general
    group: general-traits
    description: "You can excommunicate one extra person."
    pointCost: 3
    requiredTag: bishop
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # THE RITE OF REANIMATION'S RISEN (docs/systemdocs/THANATI.md §4). A Ghoul
  # growls instead of speaking (db/lib/babble.js); the Servant mark is the
  # cult's claim on them and carries Hungerless with it. Bascinet's wording.
  ghoul:
    catalog: secret
    name: Ghoul
    category: general
    group: general-traits
    description: "A pallid corpse, stumbling over its own broken body."
    fighting: { tree: both, tiers: -1 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false

  servant-of-tzchernobog:
    catalog: secret
    name: Servant of Tzchernobog
    category: general
    group: general-traits
    description: "You serve the Dark Lord now; you are unable to attack his servants or perform anything other than violence."
    fighting: { situational: true }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false

  # The Rite of Rage. Permanent; nothing sinks a Raging character's mood
  # (db/lib/mood.js MULTIPLIERS) and every Desire but cruelty is locked to
  # them. Bascinet's wording.
  rage:
    catalog: secret
    name: Rage
    category: general
    group: general-traits
    description: "Inhumanly strong, fast, tough, and intelligent, but completely consumed by bloodlust. You are impatient and are uninterested in anything but killing people."
    fighting: { tree: both, tiers: 2.5 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    desires:
      locks:
        - all: true
          exceptFamilies: [cruelty]

  insightful:
    catalog: all
    name: Insightful
    category: general
    group: general-traits
    description: "You read people well. You can use a Gambit to randomly discover 1–6 of a person's tags."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  # NEW (Claude) --------------------------------------------------------
  # The 5 and 6 bands were nearly empty, and the design doc names "giant" as
  # its own 6-point example.
  # The biggest body bonus in the game, and the priciest tag, which until now
  # bought no carry at all (docs/systemdocs/CARRY.md §1).
  giant:
    catalog: all
    name: Giant
    category: general
    group: general-traits
    description: "You are a behemoth among humanity and struggle to fit into confined spaces. However, you could easily crush anyone. {carry:giant}"
    fighting: { tree: both, tiers: 2 }
    pointCost: 14
    visible: true
    purchasable: true
    # Creation-only (Bascinet, 2026-09-11): a body this size is who you
    # started as, not a mid-game purchase.
    purchasableAfterStart: false
    carryBonus: 0.75
    # Giant, Strong and Pack Mule are one fiction — a big body that hauls —
    # so they never stack. Authored here and on Strong; db:sync-tags mirrors
    # the edges (TAGS.md §2).
    # Tunnel Rat is the tag that gets you through the dug-through-wall
    # passage into the Hole in the Wall (docs/zones.yaml's `hidden: tunnel-rat`
    # edges) — a hole a Giant cannot fit through, whatever else they know.
    # It also opens rooms, and three of them open to nothing else: the Art
    # Gallery, the Burnt Home and the Grated Room. So a Giant can't get into
    # those three by themselves.
    # Authored here and on Tunnel Rat; db:sync-tags mirrors the edge.
    conflictsWith: [strong, pack-mule, tunnel-rat]

  # +0.5 on both carry caps, i.e. ×1.5 on its own; adds with Cart
  # (docs/systemdocs/CARRY.md).
  # Priced at 4 by Bascinet's call — between the 2 and 5 bands, deliberately
  # (TAGS.md §4a). {carry:pack-mule} renders the exact bonus from the live
  # config, so the number never drifts from what the caps actually are.
  pack-mule:
    catalog: all
    name: Pack Mule
    category: general
    group: general-traits
    description: "Broad back, strong legs, and no shame about what you'll haul. {carry:pack-mule}"
    pointCost: 4
    visible: true
    purchasable: true
    purchasableAfterStart: true
    carryBonus: 0.5
    # The Merchant does not haul (Depot Overhaul.docx): his seat starts with
    # Soft Hands and may buy neither this nor Strong. Dockers start with it.
    excludedRoles: [merchant]

  # The mirror of Pack Mule above, and priced as its mirror: -4 for -0.5.
  pack-mouse:
    catalog: all
    name: Pack Mouse
    category: general
    group: general-traits
    description: "You carry less than the average person. {carry:pack-mouse}"
    pointCost: -4
    visible: true
    purchasable: true
    purchasableAfterStart: false
    carryBonus: -0.5
    # Same fiction as Giant's comment above, from the other end: a scrawny
    # under-carrier can't also be the big body that hauls.
    conflictsWith: [pack-mule, strong, giant]

  # Push on (MAP.md §3): keeps the worse of two dice — db/lib/locationTravel.js.
  old:
    catalog: all
    name: Old
    category: general
    group: general-traits
    description: "Elderly. You're slower and fight slightly worse."
    fighting: { tree: both, tiers: -0.7 }
    pointCost: -5
    carryBonus: -0.05
    visible: true
    purchasable: true
    purchasableAfterStart: false

  # Costed at -1 rather than the scale's -2 (docs/systemdocs/TAGS.md §4a): it
  # is nearly all flavour, and it is the gate on the Leper's Hood, which is a
  # 0-point item. At -2 the pair would have PAID a player to take a free hood.
  #
  # conflictsWith runs BOTH ways on purpose. Against Pretty and Beautiful it is
  # the same edge Ugly and Disfigured already carry — you cannot be covered in
  # sores and divine. Against Ugly and Disfigured it is about points: all three
  # are the one fiction, "your face is hard to look at", and without the edge a
  # build could bank -4 of the -12 drawback budget for it three times over.
  leper:
    catalog: gm
    name: Leper
    category: health
    group: health-illness
    description: "Covered in sores."
    fighting: { tree: both, tiers: -0.1 }
    pointCost: -1
    conflictsWith: [pretty, beautiful, ugly, disfigured]
    visible: true
    purchasable: true
    purchasableAfterStart: false

  frail:
    catalog: all
    name: Frail
    category: general
    group: general-traits
    description: "You are physically weak and fragile. Mustering strength to fight back is almost impossible."
    fighting: { tree: both, tiers: -0.7 }
    pointCost: -5
    conflictsWith: [pack-mule, strong, tough]
    carryBonus: -0.1
    visible: true
    purchasable: true
    purchasableAfterStart: false

  # The Alcohol & Drugs document has assigned itself to this tag by name since
  # before the tag existed — documents.yaml's `tags:` list is deliberately soft
  # and merely reported an unmatched entry. Nothing automates it: no drink in
  # this file grants it and no pass looks for it. A GM grants it when the
  # roleplay has earned it, which is what the document tells players outright.
  # Not items — you don't carry a ghost or a spell in a pocket. Both arrive by
  # consuming something (the Golden Arrow, the Codex Supprimata) and then they
  # are simply part of you: untradeable, unremovable, and not purchasable at
  # any price.
  holoparasite:
    catalog: secret
    name: Holoparasite
    category: general
    group: general-traits
    description: "A reflection of your soul, with your choice of name. It can appear and disappear at will, and punch things hard and fast. Beware! Any damage it takes is reflected onto you."
    fighting: { tree: melee, tiers: 2.5 }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    tradeable: false

  time-stop:
    catalog: secret
    name: Time Stop
    category: general
    group: general-traits
    description: "Once per day, you can stop time in a 10-foot radius around you. This lasts 10 seconds."
    fighting: { situational: true }
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    tradeable: false

  tracking:
    catalog: all
    name: Tracking
    category: general
    group: general-traits
    description: "You're good at following footsteps and other signs, in the wild or in the city."
    pointCost: 5
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # A Skill, not a general trait. Reading is a thing you were taught, and the
  # category was only ever deciding the chip's colour and where the row sits —
  # `teachable` is what Learn Skill and Teach Skill read (db/lib/lessons.js),
  # and it is set here regardless. Groupless on purpose, the way musician,
  # butcher, climbing and stealth are: there is no literacy family to join.
  literacy:
    catalog: all
    name: Literacy
    category: skills
    description: "You can read and write, something most people in Ravenheart cannot do."
    pointCost: 4
    # Teachable because learn-a-skill covers it — teaching somebody their
    # letters is a lesson like any other.
    teachable: true
    purchasable: true
    purchasableAfterStart: true

  # Sits beside Literacy on purpose: they are the two ends of the same
  # question. Slow blocks learning outright and blocks reading the way
  # Stupid does, so it conflicts with Literacy rather than stacking on it.
  # Stupid is the super-tag — gaining Stupid strips Slow, in
  # db/lib/tagWrites.js.
  slow:
    catalog: all
    name: Slow
    category: general
    group: general-traits
    description: "This person is too slow to learn. You can't learn skills, and you can't read."
    pointCost: -6
    # Intelligent joins Literacy here: too slow to learn is the inverse of it.
    conflictsWith: [literacy, intelligent]
    purchasable: true
    purchasableAfterStart: false

  light-sleeper:
    catalog: all
    name: Light Sleeper
    category: general
    group: general-traits
    description: "You wake up to noise readily, such as footsteps in the night."
    fighting: { situational: true }
    pointCost: 1
    purchasable: true
    purchasableAfterStart: true

  # A drawback, so it GIVES a point back rather than costing one — same
  # posture as Frail and Old above.
  heavy-sleeper:
    catalog: all
    name: Heavy Sleeper
    psychological: true
    category: general
    group: general-traits
    description: "Not a good thing to be in Ravenheart."
    fighting: { situational: true }
    pointCost: -2
    # A deep sleeper is not also one who keeps waking up Exhausted.
    conflictsWith: [light-sleeper, insomniac]
    purchasable: true
    purchasableAfterStart: false

  depressed:
    catalog: all
    name: Depressed
    psychological: true
    category: general
    group: general-personality
    description: "Nothing is worth wanting. Locks all Desires. Can be cured by a Chaplain."
    # The floor of the Personality band: closes the whole catalog, opens
    # nothing (DESIRES.md §5, the 2026-09-02 sign-off).
    pointCost: -8
    purchasable: true
    # Curable + maximally valuable would be a point farm otherwise (R-1).
    purchasableAfterStart: false
    # Depressed IS a Desire tag -- it locks the whole catalog. So it conflicts
    # with the other tags that touch the Desire system: the ones carrying their
    # own desires: block, and the ones a Desire gates on in docs/desires.yaml.
    # A tag that never touches Desires has no quarrel with it, which is why
    # Lazy, Insomniac, Guilt Ridden, the phobias and Torturer sit beside it
    # quite happily. The Addictions carry their own edge back to us and are not
    # repeated here (sync pass 6 unions both directions).
    conflictsWith:
      - nobility
      - mad-doctor
      - esoteric
      - adventurer
      - cruel
      - charitable
      - death-wish
      - schemer
      - craven
      - kleptomaniac
      - superstitious
      - pacifist
      - eunuch
      - desperate
      - hypochondriac
      - prudish
      - hot-headed
      - corrupt
      # Each gated in docs/desires.yaml, or (Manic) worthless with every
      # Desire locked.
      - dancer
