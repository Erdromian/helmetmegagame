        - families: [alcohol, drugs, gambling, romance]

  pyrophobia:
    catalog: all
    name: Pyrophobia
    category: general
    group: general-personality
    description: "You possess an intense fear of uncontrolled fire."
    fighting: { tree: both, tiers: -0.3, situational: true }
    pointCost: -2
    # Imperturbable pins the dial at Fine and Amor Fati replaces the whole
    # multiplier chain (db/lib/mood.js), so beside either one a phobia refunds
    # its points and never bites. Same edge on all five phobias.
    conflictsWith: [imperturbable, amor-fati]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # The phobias each sharpen one kind of harm (docs/systemdocs/MOOD.md):
  # Claustrophobia doubles the caves, Agoraphobia the wilderness, Hemophobia
  # any wound, Teratophobia triples a bad Caving Die, Pyrophobia triples a burn.
  hemophobia:
    catalog: all
    name: Hemophobia
    category: general
    group: general-personality
    description: "Blood, especially your own blood, makes you dizzy…"
    fighting: { tree: both, tiers: -0.5, situational: true }
    pointCost: -4
    conflictsWith: [imperturbable, amor-fati]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  agoraphobia:
    catalog: all
    name: Agoraphobia
    category: general
    group: general-personality
    description: "Being outside makes you uncomfortable."
    pointCost: -4
    # Outsider zeroes the wilderness hit this one doubles, so together it is
    # 4 points for nothing. Rough Camper (×0.5 against ×2) was left alone.
    conflictsWith: [outsider, imperturbable, amor-fati]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  claustrophobia:
    catalog: all
    name: Claustrophobia
    category: general
    group: general-personality
    description: "You possess an intense fear of enclosed spaces."
    pointCost: -3
    # Spelunker zeroes the cave hit this one doubles: the Agoraphobia and
    # Outsider case, underground.
    conflictsWith: [spelunker, imperturbable, amor-fati]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  teratophobia:
    catalog: all
    name: Teratophobia
    category: general
    group: general-personality
    description: "You possess an intense fear of monsters and unnatural creatures."
    fighting: { tree: both, tiers: -0.3, situational: true }
    pointCost: -2
    conflictsWith: [imperturbable, amor-fati]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  poor-swimmer:
    catalog: all
    name: Poor Swimmer
    category: general
    group: general-personality
    description: "You can't swim at all."
    pointCost: -1
    conflictsWith: [strong-swimmer]
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # Scripted: can't equip an arelitz, motorcycle or fishing boat; dragged
  # across a zone by a mounted mover you end up {tag:vomiting}.
  # web/app/(app)/character/equipActions.js, db/lib/locationTravel.js.
  motion-sickness:
    catalog: all
    name: Motion Sickness
    category: general
    group: general-personality
    description: "You are unpleasantly affected by certain movements. You can't use arelitz or boats."
    pointCost: -4
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # Scripted: confession refused in db/lib/confession.js; 5% each turn close to
  # wake Exhausted, db/lib/dawnAfflictionPass.js (named for the Dawn turn it
  # used to ride — it runs every close now).
  guilt-ridden:
    catalog: all
    name: Guilt Ridden
    category: general
    group: general-personality
    description: "You can't confess. Rarely, you have nightmares, making you {tag:exhausted}."
    pointCost: -3
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # Scripted: 20% each turn close, db/lib/dawnAfflictionPass.js.
  insomniac:
    catalog: all
    name: Insomniac
    category: general
    group: general-personality
    description: "You frequently wake up {tag:exhausted}."
    pointCost: -4
    visible: false
    purchasable: true
    purchasableAfterStart: false

  # psychological so a chaplain can confess it away. Scripted:
