  # SIGNET RINGS (docs/systemdocs/RINGS.md). Rings replaced the seat keys and
  # the wax stamps: every seat that spawns in Ravenheart (`ring: spawns` in
  # docs/roles.yaml) starts wearing one, engraved with the holder's initials
  # and registered to that seat's doors and account.
  #
  # These two rows are RECIPES ONLY and are never granted. What a smith or a
  # forger walks away with is a minted row of its own (db/lib/ringMint.js,
  # web/app/(app)/character/actions/crafting.js), because each ring is
  # engraved for one person and each forged seal carries one ring's mark. So
  # the catalog row carries no equipSlot — the minted ring is the one that
  # goes on a finger.
  #
  # The smith picks who the ring is for from the names they know. It comes out
  # unregistered, opening nothing until the Meister registers it at his
  # terminal, and it never seals: only an office's own spawned ring does
  # (`ring:` in docs/roles.yaml), even when the Meister registers a smithed
  # one to that office's doors.
