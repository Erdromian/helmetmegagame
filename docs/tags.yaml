  # The rarest thing in the ground, and the only tag in the game that carries
  # `gambitBonus`. A Trinket forged with one grants its HOLDER +1 on the
  # Gambit die — the ingredient's bonus rides onto the minted clone through
  # db/lib/trinketPass.js the same way its inlayValue rides onto the price,
  # and db/lib/gambitModifier.js is what reads it back. The Arkenstone itself
  # grants nothing while it sits in a pocket; it has to go through the forge.
  #
  # One per Trinket, not because of a cap but because a Trinket takes at most
  # two ingredient slots and the craft refuses the same slug in both. Two
  # separate Arkenstone Trinkets in one pocket DO stack to +2, which is the
  # only way to get there and is meant to be absurd.
  #
  # It is also the target of a once-ever Desire (docs/desires.yaml), so a
  # prospector who finds one has a real decision: sell it, forge it, or keep
  # it.
  arkenstone:
    catalog: gm
    name: Arkenstone
    category: items
    group: items-mining
    sprite: gibtonite-ore
    description: "A dazzling gemstone. If forged into a Trinket, it will bestow great power. It can be smithed into trinkets in order to increase their value."
    pointCost: 0
    weight: 1
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    sellable: true
    # The find of the game, and priced like one (2026-09-20): 200 ¢ raw, and
    # 464 ¢ as a Masterwork Trinket. There is no depotPrice here and there
    # must not be one — the station selling a stone it cannot source would
    # undercut the only thing that makes the Depths worth the walk.
    #
    # EVERY inlayValue IN THE CATALOG IS SET BY ONE RULE, and this is the
    # place it is written down (see docs/systemdocs/TRINKETS.md §2):
    #
    #     inlayValue = 2 × sellablePrice + 4
    #
    # never below what the tag already had, and always strictly under
    # depotPrice where the Merchant stocks the thing.
    #
    # The doubling is the stone; the +4 is the smith's craft, and it is what
    # stops the bottom of the ladder being worthless. Ultracommon rock is 62%
    # of every Caves draw, so at a flat 2× a malachite inlays for 2 ¢ and the
    # ordinary prospector gets nothing out of a forge. The multiplier falls
    # from 6× at the bottom to 2.02× at the top, which is the point.
    #
    # The depot cap is not a nicety. A stone that inlays for more than the
    # Merchant charges can be bought, forged and sold at a profit, forever,
    # with no skill gate and no scarcity behind it — the same shape of hole
    # db/lib/syncTags.js already warns about when depotPrice <= sellablePrice.
    # It binds on exactly three tags today: silver, iron and jewelry.
    #
    # So re-pricing a stone means re-pricing BOTH halves. Change sellablePrice
    # and leave inlayValue alone and the rule quietly stops being true.
    sellablePrice: 200
    inlayValue: 404
    gambitBonus: 1

  # The base row a Trinket is minted FROM (TRINKETS.md). NOT craftable in the
  # ordinary sense — there is no Craft-dialog entry point for it, on purpose:
  # a Trinket's whole point is that its quality is unknown until the turn
  # ends, and the normal Craft dialog shows you exactly what you are about to
  # get. `web/app/(app)/character/trinketActions.js` is the recipe's real
  # gate (smithing + a forge + a whole Move, priced in db/lib/constants.js,
  # not read off this row's `requirement`) and the sheet's Make a Trinket
  # button is its only door (TRINKETS.md §2a) — this row exists only so
  # `mintCustomCraft` has a base shape (category, group, weight, sellable…)
  # to clone when the die comes up. `craftable` stays false and `pointCost` 0
  # so nothing anywhere ever offers it for purchase or for the Craft button.
  trinket:
    # `secret` — the strictest catalog value, "nobody sees it" — since this
    # row is a clone source only and is never itself held or offered
    # anywhere (`catalog: none` is not a real value; CATALOG_BY_YAML in
    # db/lib/syncTags.js only knows secret/gm/all).
    catalog: secret
    name: Trinket
    category: items
    group: items-gear
    sprite: gearring
    description: "A trinket. When making it, a Gambit die is rolled. The quality is random but influenced by your skill. It is very valuable to the merchant."
    pointCost: 0
    weight: 1
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    sellable: true
    # A minted Trinket always carries its own computed price
    # (sellablePriceOverride, db/lib/trinketPass.js); this is only what the
    # never-minted catalog row itself would claim, and nothing ever holds it.
    sellablePrice: 14

