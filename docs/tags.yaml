  # --- Caves Update loot -------------------------------------------------
  # New found-only items for the Caving Die's loot table. See
  # docs/systemdocs/CAVING.md for the table itself and db/lib/cavingLoot.js
  # for how a tier resolves to one of these.
  # On both loot tables — the Caving Die's common tier and the prospecting
  # table's uncommon one — so it lives in `items-mining` with the rest of what
  # comes out of the ground. Its 1 ¢ price is the joke; the inlayValue is why
  # a smith wants it anyway.
  old-coin:
    catalog: gm
    name: Old Coin
    category: items
    group: items-mining
    sprite: old-coin
    description: "A weathered coin. It can be smithed into trinkets in order to increase their value."
    pointCost: 0
