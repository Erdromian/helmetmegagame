  # --- The drinking ladder (docs/systemdocs/BREWING.md) --------------------
  #
  # Three rungs, and every drink in the catalog still consumes into the first
  # one. `escalatesInto` is what makes the second drink matter: consuming
  # something that grants a rung you already hold clears that rung and gives
  # you the one above instead. So tipsy -> wasted -> unconscious, and the only
  # way down is to stop.
  #
  # The Fighting penalties below are ordinary generic `fighting:` blocks, not
  # special cases: no line of code branches on `tipsy`. The one place a rung is
  # named by slug is Drunken Master's `holdsAny`, which is a catalog entry too.
  tipsy:
    catalog: gm
    name: Tipsy
    category: status
    group: status-debuffs
    description: "You feel warm, but a bit uncoordinated."
    fighting: { tree: both, tiers: -0.5 }
    pointCost: 0
    visible: true
    purchasable: false
    durationTurns: 1
    escalatesInto: wasted

  wasted:
    catalog: gm
    name: Wasted
    category: status
    group: status-debuffs
    description: "You are in a bit of a stupor and are having trouble controlling your body."
    fighting: { tree: both, tiers: -1.2 }
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    escalatesInto: unconscious
    expiresInto: [hangover]

  # In INCAPACITATING_SLUGS (db/lib/incapacitation.js): out cold is out cold,
  # so you can be looted, dragged and tied up where you fell. Deliberately NOT
