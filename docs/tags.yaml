  # keepSlug: renamed from "Fast Metabolism" 2026-09-05, but the slug is
  # hardcoded in db/lib/constants.js and read by db/lib/hungerPass.js, so it
  # stays what it is.
  # INERT, AND WORTH −6 POINTS — read this before the next balance pass.
  # Its whole mechanic was doubling the Hunger pass's per-turn ⬢ charge from 1
  # to 2. That charge was removed in 9/2026: eating is a meal on the sheet now,
  # not a debit (db/lib/hungerPass.js). So this currently does NOTHING, while
  # still paying its holder 6 points for the drawback.
  #
  # Left in the catalog rather than retired on purpose — the foodstuff-items
  # work has an obvious home for it (needing two meals a turn rather than one),
  # and retiring it would only have to be undone. The description below is
  # written for what it is going to mean; until that lands it is unenforced.
  # Either give it teeth or drop it to 0 points before anybody buys one.
  fast-metabolism:
    catalog: all
    name: Big Appetite
    keepSlug: true
    category: general
    group: general-traits
    description: "You find yourself feeling hungry far more often than normal."
    pointCost: -6
    # OFF the creation menu until it means something. It is a drawback worth 6
    # points, and while it is unenforced those are 6 free points for accepting
    # nothing — the one thing that must not be true of a negative-cost tag.
    # Turn this back on in the same change that gives it teeth.
    purchasable: false
    purchasableAfterStart: false

