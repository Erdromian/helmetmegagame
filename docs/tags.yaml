  # still sell them to each other for whatever they can get.
  #
  # The Merchant's station DOES buy them now, which is the ⬢ faucet the note
  # above worried about — deliberately, and priced so that butchering a body
  # comes to roughly ONE good day's labour rather than three. Mutilate is a
  # free action and every death mints a body, so the arithmetic that matters is
  # the whole ladder at once: db/lib/mutilate.js takes nine pieces off one
  # subject (two eyes, two hands, two feet, tongue, stomach, heart), which at
  # these numbers is 61 ¢ against 30-42 ⬢ for a specialised labour day — one
  # obol is one ⬢ (DEPOT.md §0), so the comparison still holds. At the first
  # pass it was 94 ¢ and this comment claimed otherwise; the ladder was then
  # lifted a fifth, from 49 ¢, because a body was worth too little for the work.
