  #
  # {tag:copper} and {tag:nickel} are the same recipe over a different ore.
  # All three are gated at plain Smithing rather than Skilled — smelting is
  # basic forge work; it is shaping the ingot afterwards that needs the
  # higher skill — and all three run at `turnsCost: 0.25`, so four fit in one
