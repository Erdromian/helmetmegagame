  # --- assets -------------------------------------------------------
  # `tradeable` decides what can be handed over OR lifted off a body, so every
  # entry here states it outright (db/lib/syncTags.js enforces that). Mounts,
  # vehicles and ordinary animals travel: they are standing right there and
  # anyone can lead them away. Real property does not — you cannot carry a boat
  # off a corpse.
  # Arelitz (docs/systemdocs/ARELITZ.md): replaces the old Horse +
  # Warbeast/Ovum/Thoroughbred family. One mount type rather than three bred
  # variants (Bascinet's call) — an adult is `unruly-arelitz` by default, and
  # `arelitz-mastery` lets someone break one in via a Gambit
  # (ARELITZ.md §6). Bred only, in a Stable room (`Room.stable`) — neither
  # this tag nor any of the brood rungs below is craftable; db/lib/stablePass.js
  # is the only thing that mints one.
  arelitz:
    catalog: gm
    name: Arelitz
    category: assets
    group: assets-companions
    sprite: arl
    description: "A great eight legged spider. It has been broken in, allowing it to be rode by up to two people. Fresh, it carries its riders across 1 zone border a turn, and it is fresh again every turn."
    pointCost: 9
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
    purchasable: false
    purchasableAfterStart: false
    visible: true
    depotPrice: 81
    sellable: true
    # 60% of the 81 ¢ above (DEPOT.md §3). It was 54, which was 60% of the 90 ¢
    # this cost before the 2026-09 price trims; the sell-back never followed.
    sellablePrice: 49

  # THE MOUNT LADDER (ARELITZ.md §2a, db/lib/mounts.js). Every crossing charged
  # to a mount swaps its tag one rung down — arelitz-tacked →
  # arelitz-tacked-ridden-1 → arelitz-tacked-ridden-2 — so the chip's own
  # name says how many rides it has left, whoever is holding it. The turn pass (db/lib/mountRides.js) walks every
  # rung back to the head. Each rung is the SAME animal: same seats, same
  # price (so the economy ledger adds up across a silent swap), same stable
  # count, same meat. Only the rides differ. Slugs are generated from
  # MOUNT_RIDES in mounts.js — add a rung there and here together.
  arelitz-ridden-1:
    # The name says the rides left; the slug is the rung (mounts.js).
    keepSlug: true
    catalog: gm
    name: Arelitz (Spent)
    category: assets
    group: assets-companions
    sprite: arl
    description: "A broken-in arelitz that has carried its riders as far as it will go this turn. It buys no more crossings until it has rested, and it will be fresh again next turn."
    pointCost: 9
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
    purchasable: false
    purchasableAfterStart: false
    visible: true
    sellable: true
    sellablePrice: 49

  # Arelitz Tack fitted to one animal — the Craft recipe below spends the
  # tack and the arelitz and mints this. Not a thing you can take off again.
  # One more ride a turn than a bare arelitz (2), and its own ladder, since a
  # tacked animal ridden once cannot become a bare one.
  # Price is the two parts' sell-back added together (49 + 21).
  arelitz-tacked:
    # "Tacked Arelitz" reads better than "Arelitz Tacked"; the slug is the
    # ladder head mounts.js names.
    keepSlug: true
    catalog: gm
    name: Tacked Arelitz
    category: assets
    group: assets-companions
    sprite: arl
    description: "A broken-in arelitz under a custom tailored saddle, giving its rider far more control of where the beast lumbers. Fresh, it carries its riders across 2 zone borders a turn, and it is fresh again every turn."
    pointCost: 11
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
    purchasable: false
    purchasableAfterStart: false
    visible: true
    sellable: true
    sellablePrice: 70
    craftable: true
    requirement:
      turnsCost: 0
      perTurn: 1
      resourceCost: 0
      items: [arelitz, arelitz-tack]
      gambit: false

  arelitz-tacked-ridden-1:
    # The name says the rides left; the slug is the rung (mounts.js).
    keepSlug: true
    catalog: gm
    name: Tacked Arelitz (1 ride left)
    category: assets
    group: assets-companions
    sprite: arl
    description: "A saddled arelitz that has carried its riders across a border this turn. It has one crossing left in it, and it will be fresh again next turn."
    pointCost: 11
    tradeable: true
    stackable: true
    equippable: true
    equipSlot: MOUNT
    equipLayer: 1
