  # The Keep's shelves. A book is declared BY its text: `bookText` goes on
  # Tag.paperText with paperKind BOOK, never on `description`, because the
  # description column is broadcast to every signed-in browser and these are
  # meant to be found rather than read off the catalog. See PAPERWORK.md.
  #
  # Bascinet's words, all thirteen of them, so none carries a mark.
  the-wise-plague-doctor:
    catalog: gm
    name: The Wise Plague Doctor
    category: items
    group: items-paper
    sprite: book
    bookText: >-
      Once there was a Plague Doctor whose story became legend that no man now lives to tell. Here I have written it down for any that may yet find this book in my dying hour. The Plague Doctor was a lord of the Sanctuary, so powerful and so wise he could use his skills to create life... He had such a knowledge of his art that he could even keep the hopelessly ill he cared about from dying. The skills taught in the Sanctuary and the machines found there are a pathway to many operations some might consider to be unnatural. He became so powerful... the only thing he was afraid of was losing his power, which eventually, of course, he did. Unfortunately, he taught his apprentice everything he knew, then his apprentice killed him in his sleep. Now he has come for all that know his story, even for me. It is ironic - the Plague Doctor could save others from death, but not himself.
    pointCost: 0
    weight: 1.5
    visible: false
    purchasable: false
    purchasableAfterStart: false

  caspians-diary:
    catalog: gm
    name: Caspian's Diary
    category: items
    group: items-paper
    sprite: diary
    bookText: >-
      Dear Diary, It's been 4 days in these caves...at least I think it has. Time seems to have lost all meaning, and I'm unsure whether I've been walking this through this current passage for hours or days. I can't help but feel a blooming hope that I will find the exit soon, for I encountered something today that I've not seen since I entered this place: a hole. Tomorrow I jump to my destiny, and discover what is at the bottom of the hole. With luck, it will be my salvation. Caspian
    pointCost: 0
    weight: 1.5
    visible: false
    purchasable: false
    purchasableAfterStart: false

