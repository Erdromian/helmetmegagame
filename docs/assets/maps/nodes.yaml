# The map's node table.
#
# The ART is authored in Playscii, in the .psci files beside this one. Every
# location is a marker on the hidden LAYER 5 of its map: the glyph is the
# location's system code (1-9, then A-Z) and the marker's COLOUR says which
# zone it belongs to. So the drawing owns where a place is, and this file owns
# what it is called. Nothing keeps a pixel coordinate by hand any more.
#
# `npm run map:build` reads both, and fails loudly on a marker with no entry
# here, an entry with no marker, a duplicate code, or a colour this file does
# not name. See docs/systemdocs/MAP.md.

# Playscii palette index -> the semantic channel the renderer paints it with.
# The colour itself is a CSS token, decided per theme at render time — the art
# never carries a hex.
#
# Index 0 is DELIBERATELY ABSENT: it is Playscii's transparent slot and draws
# nothing. Mapping it to a channel once put 34 phantom houses on the eastern
# side of town, which nobody had drawn on purpose. An unmapped slot is
# reported by the build, so a stray one gets noticed rather than painted.
channels:
  1: void      # the background black
  2: lit       # white — the foreground detail
  3: heat      # rust — water, forge-light, the lake
  12: stone    # the rock, and the solid fill around the carved map
  13: filler   # grey — secondary decoration

# Glyph 168 is the solid block the rock is painted with, and the only
# fully-opaque glyph in either map. The vignette needs to know it to fade the
# rock out, and the build uses it to spot cells buried underneath it.
stoneBlock: 168

# Glyphs the INTERFACE draws that the art never does, so the build has to be
# told to pack them. Both are from the charset's reticle row (row 14, glyphs
# 474-479) so the marker over a place is made of the same 1-bit pixels as
# everything under it, rather than a shape from somewhere else.
#
# A place is marked by a crosshair, not a number: `faint` sits on every place
# you can see, `locked` only on the one you have picked and the one you are
# standing in. `faint` is 24 lit pixels of corner tick — enough to say
# "something is here", quiet enough to put on fifty cells at once.
uiGlyphs:
  faint: 476    # four corner ticks, hollow
  locked: 475   # corner brackets, centre ticks, open middle

maps:
  barony1:
    file: barony1.psci
    name: The Barony
    # Caves go here later, in the rock, as a fifth marker colour. Adding them
    # is one more `- fg:` group below — no code change.
    groups:
      - fg: 7
        zone: town
        nodes:
          "1": Gatehouse
          "2": Square
          "3": Soilery
          "4": Cathedral
          "5": Alleys
          "6": Smithies
          "7": The Old Cock Inn
          "8": Residences
          "9": Sanctuary
          "A": Graveyard

      - fg: 6
        zone: fortress
        nodes:
          "1": Garrison
          "2": Gatehouse
          "3": Court
          "4": Keep
          "5": Tower

      # Black Hills, first half — these keep the codes they are drawn with.
      # The zone was re-prosed underground on 2026-09-20 and its Locations
      # took their own names as slugs, so a `slug:` override is only still
      # here where the drawn code and the slug disagree.
      - fg: 8
        zone: black-hills
        nodes:
          "1": { name: Bridge, slug: bridge }
          "2": { name: West River, slug: west-river }
          "3": { name: Passageway, slug: passageway }
          "4": { name: Refuse Pit, slug: refuse-pit }
          "5": { name: East River, slug: east-river }

      # The old Wilderness, folded into Black Hills. The markers are still
      # drawn with their original codes, so `recode` renumbers them onto the
      # back of the first half rather than making anybody repaint the art.
      - fg: 10
        zone: black-hills
        recode: { "2": "6", "4": "7", "5": "8", "9": "9", "3": "A" }
        nodes:
          "6": { name: Gullies, slug: gullies }
          "7": { name: Grand Ravine, slug: grand-ravine }
          "8": { name: Cliffs, slug: cliffs }
          "9": { name: Sparse Fields, slug: sparse-fields }
          "A": { name: Godard Factory, slug: factory }

  barony2:
    file: barony2.psci
    name: Undertown
    # The Depths go here later, in the rock, as a second marker colour.
    groups:
      - fg: 7
        zone: undertown
        nodes:
          "1": Undercroft
          "2": Residences
          "3": Lifeweb
          "4": Sewer
          "5": Depot
          "6": Merchant
          "7": Poorhouse
          "8": Den
          "9": Den Interior
          "A": Slums
          "B": Order Chambers
          "C": Lake
          "D": Alleys
          "E": Basements
          "F": Hole in the Wall
          "G": Nook
          "H": Island
