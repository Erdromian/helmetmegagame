# What every sound in the library is FOR.
#
# Bascinet's two "Music and Sounds" documents, projected into the repo — the old one for the
# OpenSourceWeb library, the new one for Bascinet's own picks and for the placement rules
# that apply to all of it. They are the source of truth and they are hand-written: every
# use case below is Bascinet's own sentence about that file, carried across verbatim and
# deliberately not re-punctuated. A registry that has quietly improved its source cannot be
# checked against it. Where both describe one file, the new document's sentence is the one
# kept.
#
# THIS FILE IS GENERATED. Run:
#
#     node scripts/audio/import-sound-doc.mjs --apply
#
# Everything but `needs` is rewritten on every run, so `needs` is the only field worth
# hand-editing here. A correction to a use case belongs in the .docx, not in this file.
#
# It is read by db/test/sounds.test.js and scripts/audio/sound-report.mjs. NOTHING syncs
# it to Postgres: like docs/assets/maps/nodes.yaml, it is a registry that tooling reads,
# not a table. See docs/systemdocs/SOUND.md §7.
#
#   use     — Bascinet's sentence, verbatim.
#   class   — one of the eight classes in `rules` below, derived from that sentence.
#   doc     — present only where the document spells the filename differently from the
#             file itself. The key is always the real file; this records what was read,
#             so every correction the importer made is visible and can be argued with.
#   served  — path under web/public/assets/ where this file has been promoted, read out
#             of scripts/audio/build-assets.sh. Absent means it is in the library but not
#             yet in the app.
#   needs   — a fact the selector has to be taught before this use case can be honoured.
#             Absent means the use case is answerable with what the engine knows today.
#
# Loudness lives in web/app/components/musicGain.js and sfx.js, and a song's length in
# db/lib/instrumentSongs.js. Neither is duplicated here.


# The documents' own rules for each class of track, verbatim.
rules:
  ambience: >-
    Ambience tracks are longer tracks which can be seamlessly looped, though silence
    should remain most of the background track.
  atop: >-
    Tracks which can be played atop ambience/silence are short sounds which add to the
    atmosphere, often suited for very specific circumstances
  cue: >-
    Sounds with defined descriptions/use cases are short, generally non-looping sound
    bites which can be used when certain events occur in game.
  lobby: >-
    Lobby music is music which is played for people in the lobby who have not yet made a
    character. A track is always playing, and all players in the lobby hear the same
    track looping. Tracks loop for roughly an hour before another track starts looping.
  instrument: >-
    Instrument tracks are specifically gated behind use of their associated instrument.
  unused: >-
    Unused tracks are not to be selected.
  interrupt: >-
    Ambience tracks continue to completion unless they are interrupted by an ambience
    interrupting SFX, or the character leaves the specific zone in which they can play,
    in which case they fade out. Ambience is universal across all pages, including GM
    ones. When in GM mode, GMs do not have ambience tracks end until they have reached
    completion, and new tracks start from whatever location they are viewing or were
    last viewing in the chat menu.
  jukebox: >-
    Den music is played from the jukebox located in the den. Whichever song has been
    picked loops for all characters in the den until it is changed or turned off. It
    replaces any ambience while playing. Muffle the sound to imitate a low quality
    speaker.

# Where a track may play. The new document's opening, verbatim; it applies to every file
# here, old and new. web/app/components/placeAmbience.js is these rules in code.
placement:
  - >-
    New sounds catalogue. Import these into the osw sound asset folders and register
    them according to the descriptions here. Add a note that ONLY ambience tracks
    referring to space are to be used in space. General ambience is for use in the
    town/undertown/keep/blackhills/caves/depths, not other zones in space or other
    dimensions.
  - >-
    Tracks described as being for use in the fortress mean all locations in the keep,
    town and undertown. Tracks described as for use in the caves/depths are also for use
    in the black hills.
  - >-
    Ambience tracks can apply to multiple, or fewer zones, locations and more. For
    example, while there are inn specific ambience tracks, general and fortress ambience
    can also play there. The most specific ambience track to a situation will be
    selected over more general tracks, with some variation to avoid a single track
    looping.
  - >-
    Ambience tracks continue to completion unless they are interrupted by an ambience
    interrupting SFX, or the character leaves the specific zone in which they can play,
    in which case they fade out. Ambience is universal across all pages, including GM
    ones. When in GM mode, GMs do not have ambience tracks end until they have reached
    completion, and new tracks start from whatever location they are viewing or were
    last viewing in the chat menu.
  - >-
    Only lobby music tracks can play during lobby.
  - >-
    Apply these clarifications to all existing sound assets as well as the new.
  - >-
    Den music is played from the jukebox located in the den. Whichever song has been
    picked loops for all characters in the den until it is changed or turned off. It
    replaces any ambience while playing. Muffle the sound to imitate a low quality
    speaker.

# A rule that applies to a whole folder rather than to one file.
groups:
  instruments/accordion:
    note: Instrument sounds only used for their associated instrument.
  instruments/boombox:
    note: Instrument sounds only used for their associated instrument. Boombox sound files should not be used unless EXPLICITELY requested.
  instruments/lute:
    note: Instrument sounds only used for their associated instrument.

