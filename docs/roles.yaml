  # Saviors
  saviors:
    esculap:
      name: Esculap
      intro: >-
        Lead the Sanctuary, treating the rich and noble and developing medicines.
      description:
        - >-
          How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants.
        - >-
          With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment.
        - >-
          If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners.
        - >-
          Organ harvesting is one of the most profitable enterprises in Ravenheart.
      difficulty: normal
      bank_account: treasury
      starting_account: 60
      multiple: false
      starting_zone: town
