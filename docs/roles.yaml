      intro: >-
        Serve the Exactor and protect his criminal empire.
      description:
        - >-
          You work solely for the Exactor. You shouldn't betray him, because you believe in his empire. He also has dirt on you.
        - >-
          Intimidate people, follow orders, and sell drugs.
