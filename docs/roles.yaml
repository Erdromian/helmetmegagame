        authorised_by: merchants-license
        seal_office: Merchant
        seal_mark: "The initials {initials} emblazoned on a shield, the seal of the Merchant."
        name: "Merchant's Ring"
        description: "A silver ring encrusted with gold and jewels. The face bears the initials {initials} emblazoned on a shield, the seal of the Merchant."
      starting_tags:
        - Cart
        - Literacy
        - Merchant's Garb
        - Merchant's License
        - Silencer
        - Obol x78
        - Nobility
        - Appraisal
        - Foodstuffs x4
        # The Merchant doesn't haul (Depot Overhaul.docx): Pack Mule and Strong
        # are closed to this seat (excludedRoles in docs/tags.yaml).
        - Soft Hands
      doc_elements:
        - godking
        - squeeze
        - merchant
    docker:
      name: Docker
      intro: >-
        Serve the Merchant during the day and get drunk during the night.
      description:
        - >-
          Maybe they'll let you get a ride on their spaceship if things ever get bad around here.
      difficulty: easy
      bank_account: offshore
      starting_account: 8
      multiple: true
      weight: 3
      starting_zone: undertown
      knows: *townsfolk
      starting_location: undertown-6
      ring:
        spawns: true
