    slave:
      name: Slave
      intro: >-
        You were sold into slavery. Work to earn your freedom from the Exactor.
      description:
        - >-
          Do what the Exactor says, with the eventual hope of earning your freedom. Your contract details the amount of obols you must obtain to buy your freedom.
        - >-
          You may rebel, but given your collar, it will be a difficult thing to do.
        - >-
          Your primary job is to go into the caves and prospect for resources.
      difficulty: easy
