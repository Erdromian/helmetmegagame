    # ─── The Bastard's party ────────────────────────────────────────────
    # An invading force, not a Ravenheart estate. All six are late-join seats
    # (db/lib/lateJoin.js): hidden from the ordinary picker, drawn in the
    # picker's own "Special" section only once a GM has opened them, or once
    # the Bastard has bought one with Call reinforcements.
    #
    # PLACEHOLDER — these six carry the Bastard's Camp text from
    # docs/archive/windlander.yaml with every line that named the Windlands,
    # the Windriders or the Broken Spears cut out of it. Nothing has been
    # written to replace those lines: the party has no home any more, and where
    # they come from is Bascinet's to decide. The five soldier seats below are
    # bare on purpose for the same reason.
    bastard:
      name: Bastard
      whitelist: true
      gender: MAN
      intro: >-
        Press your claim and take Ravenheart by force.
      description:
        - >-
          Ravenheart has fended off many assaults over the centuries, so you should plan how you're going to succeed.
        - >-
          You can purchase reinforcements with obols, calling in medics, engineers, infantry, and even riflemen.
        - >-
          The way in which you take Ravenheart is important. Do you want to be known as a tyrant or as a liberator?
        - >-
          You have noble blood. It's possible that you are the Baron's distant relatives.
      difficulty: hard
      multiple: false
      examine_visible: false
      starting_zone: hills
      knows: [baron, baroness, heir, successor, hand, bastard, bastard-infantry, bastard-heavy-infantry, bastard-rifleman, bastard-healer, bastard-engineer]
