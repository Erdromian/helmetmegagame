  # Saviors
  saviors:
    esculap:
      name: Esculap
      intro: >-
        Lead the Sanctuary. Don't accrue debt. Treat only the rich and the noble. Develop medicines, put bodies back together, or pursue the good of science. Be the Eye in the Storm — or lose yourself to curiosity.
      description:
        - >-
          Sickness and pain leave men terrified and alone. It is a noble task to help another face that pain.
        - >-
          How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants. The Sanctuary operates independently. It is your sole charge, and no one can give you orders (well, they can, but it would be counterproductive and unprecedented). However, it is protected by the Baron.
        - >-
          With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment.
        - >-
          If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners. Brewing potions is especially worthwhile; it can really help when you get a wave of inmates. Just throw out a few {tag:cleaning-powder}, a few {tag:mercy}, or an antidote…
        - >-
          You can perform medicine to remove negative medical tags according to their skill, Resource, and action cost.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-9
      whitelist: true
      starting_tags:
        - Sanctuary Key
        - Ravenhearter
        - Medical III
        - Brewing III
        - Literate
        - Esculap's Vest
        - Obol x10
        - Resources x26
      doc_elements:
        - medical
    serpent:
      name: Serpent
      intro: >-
        Cure illnesses, perform surgeries, and brew potions, and keep people in this world — where they're needed.
      description:
        - >-
          Sickness and pain leave men terrified and alone. It is a noble task to help another face that pain.
        - >-
          How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants. The Sanctuary operates independently. However, it is protected by the Baron.
        - >-
          With science, the sky's the limit. You can brew medicines and potions, and even experiment for the good of science.
        - >-
          If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners. Brewing potions is especially worthwhile; it can really help when you get a wave of inmates. Just throw out a few {tag:cleaning-powder}, a few {tag:mercy}, or an antidote…
        - >-
          You can perform medicine to remove negative medical tags according to their skill, Resource, and action cost.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 4
      starting_zone: town
      starting_location: town-9
      starting_tags:
        - Sanctuary Key
        - Ravenhearter
        - Medical II
        - Brewing II
        - Literate
        - Resources x8
      doc_elements:
        - medical

  # Business
  business:
    merchant:
      name: Merchant
      intro: >-
        Make your fortune buying and selling Tags.
      description:
        - >-
          Ravenheart's poor souls are a great source of business, but it's a terrible place otherwise. You wouldn't dare put your heart here — the place is doomed. Time to make some money.
        - >-
          You are from the merchant's class in the United Cities, a nation of cosmopolitan city states.
        - >-
          Your License opens the whole manifest — everything the station stocks, sealed goods included — where everyone else gets a short shelf. The mini-turret is keyed to your face, so it will shoot everyone except you. Be careful not to conceal your face, however.
        - >-
          You deal in obols (¢), not ⬢. You can buy at the Depot's price and sell it at whatever makes sense for profit. You can also buy things from Ravenheartians and sell them on: brews, ore, cave fungus, smithing production, paintings. {tag:ravenheart-red} and paintings especially fetch a good price.
        - >-
          The Company will advance you up to 75 ¢ against the business. Your licence will be revoked if you fail to pay it.
        - >-
          You may issue loans, lending at high rates and calling on your Dockers to collect.
        - >-
          Your account is held off-world, so it is not a claim on the Keep's Vault the way everyone else's is. Nobody can freeze it and nobody can rob it.
      difficulty: hard
      bank_account: offshore
      starting_account: 55
      multiple: false
      starting_zone: undertown
      starting_location: undertown-6
      whitelist: true
      starting_tags:
        - Cart
        - Literate
        - Merchant's Garb
        - Merchant's License
        - Depot Keycard
        - Silencer
        - Obol x20
        - Nobility
        - Appraisal
      doc_elements:
        - godking
        - squeeze
        - merchant
    docker:
      name: Docker
      intro: >-
        Serve the Merchant and get drunk during the night.
      description:
        - >-
          Maybe they'll let you get a ride on their spaceship if things ever get bad around here.
        - >-
          You are the legs of the Merchant's business. The Depot is at the bottom of the Caves and their customers are not, so somebody carries the goods up and the money down — that is you. Somebody also collects from the people who owe them. That is also you.
        - >-
          Your keycard cracks a sealed crate, and lets you sell into the Merchant's books instead of your own.
      difficulty: easy
      bank_account: offshore
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: undertown
      starting_location: undertown-6
      starting_tags:
        - Depot Keycard
        - Appraisal
      doc_elements:
        - merchant
    banneret:
      name: Banneret
      intro: >-
        As the Baron's cousin, begrudgingly serve Ravenheart by organizing the production of the valuable Squeeze and selling it to the merchant.
      description:
        - >-
          You are one of Ravenheart's cadet houses, carrying only a fraction of the prestige and responsibility.
        - >-
          You have been charged with Godard Factory. While usually looked down upon, it is very valuable: Squeeze is how Ravenheart obtains obols, functionally funding its warchest.
        - >-
          Your whole operation relies on your communication with the merchant and the Keep. It's your job to crate the Squeeze, load it on the cart, and sell it to the merchant — or you can let the Geschef do it. But make sure you're getting a good price. Keep some to pay your employees and give the rest to the Baron, lest the Watch come knocking.
        - >-
          Keep your refugees happy with {tag:moonshine}, but also by paying them fair wages. They should make more than commoners — after all, you can afford to pay them. Or just don't pay them and keep them in line.
        - >-
          Make sure everyone's wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers — do not eat the Squeeze! You can't afford to repeat what happened last time…
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: hills
      starting_location: factory
      whitelist: true
      starting_tags:
        - Ravenhearter
        - Arelitz
        - Cart
        - Nobility
        - Brigandine
        - Sabre
        - Bore Pistol
        - Melee I
        - Ranged I
        - Armored Gloves
        - Factory Key
        - Banneret's Key
        - Appraisal
      doc_elements:
        - godking
        - godardfactory
        - squeeze
    geschef:
      name: Geschef
      intro: >-
        Organize operations while the Banneret goes to see the merchant. If the refugees get rowdy, hit them with a stick.
      description:
        - >-
          Your whole operation relies on your communication with the merchant and the Keep.
        - >-
          You've survived this operation long enough to become the general manager. A good place to be. You can treat some of the wounds that will surely come and brew the workers Moonshine to keep them happy.
        - >-
          Make sure everyone's wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers — do not eat the Squeeze! You can't afford to repeat what happened last time…
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: false
      starting_zone: hills
      starting_location: factory
      starting_tags:
        - Ravenhearter
        - Tough
        - Old
        - Big Appetite
        - Cudgel
        - Padded Armor
        - Melee I
        - Brewing I
        - Medical I
        - Cooking I
        - Cleaning Powder
        - Armored Gloves
        - Factory Key
        - Banneret's Key
        - Appraisal
      doc_elements:
        - godardfactory
        - medical
    refugee:
      name: Refugee
      intro: >-
        Do dangerous work — cutting Godflesh from the refuse pit — in exchange for good hazard pay and potential social mobility.
      description:
        - >-
          You arrived from the caves. You don't really have a trade or the ability to labor, so your only opportunity to stay alive is through factory work.
        - >-
          Cutting Godflesh out is dangerous. However, since it's worthwhile as it is to the merchant, the Banneret should be paying you well. If that's not the case, feel free to do a bit of protesting.
        - >-
          But not too much, you know? Your life is worthless here. And an armed revolt? Pffft.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: hills
      starting_location: factory
      starting_tags:
        - Hatchet
        - Cleaning Powder
        - Armored Gloves
        - Factory Key
      doc_elements:
        - godardfactory
    exactor:
      name: Exactor
      intro: >-
        Run Ravenheart's criminal underbelly.
      description:
        - >-
          You're from the United Cities, like the merchant. Unlike him, you aren't from the upper classes, and instead found your way into a criminal enterprise.
        - >-
          You have a few elements tools: the Pusher, a brewer and drug seller; the Slaves, miners with bomb collars you can detonate; and the Courtesans, who do not work for you but will pay some of their cut for your protection.
        - >-
          Your Silver Chip allows you to obtain items from the Black Market manifest at the depot.
        - >-
          Your only job is to make as much money as possible. The slaves and the Pusher will make you money by default, but you should plan big business moves. One lucrative enterprise is selling your slaves or getting new ones. The Incarn might sell you prisoners if you can cut a deal.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: undertown
      starting_location: undertown-8
      whitelist: true
      starting_tags:
        - Bore Pistol
        - Machete
        - Suit and Tie
        - Balaclava
        - Bomb Collar
        - Remote Detonator
        - Collar Key
        - Silver Chip
        - Literate
        # Every door in the Den. The two room keys are his second copies —
        # there is another pair on the desk in his office (docs/zones.yaml).
        - Den Key
        - Exactor's Key
        - Room A Key (Den)
        - Room B Key (Den)

  # Soil
  soil:
    headman:
      name: Headman
      intro: >-
        Lead the Town. Ensure it works and pays its taxes.
      description:
        - >-
          On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Headman!
        - >-
          Your main job is to tax people. You are beholden to the Meister, the Baron's taxperson, and things have gotten nasty in the past when the tithe didn't meet expectations. If the Warehouse isn't full next time he comes, it won't be a pretty day. You also ought to pay tithe to the Church, for all they do for the town, and pay the Sheriff, for their work.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-2
      whitelist: true
      starting_tags:
        - Ravenhearter
        - Insightful
        - Old
        - Soilery
        - Literate
        - Headman's Cap
        - Sewer Key
        - Headman's Key
      doc_elements:
        - farming
    sheriff:
      name: Sheriff
      intro: >-
        Keep the peace in the Town, six-shooter at your hip.
      description:
        - >-
          Unlike the Cerberon, whose sworn duty is to protect the Fortress, you protect the Town.
        - >-
          Your most valued possession is a .45 six-shooter.
        - >-
          You should loyally serve the Baron.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: false
      starting_zone: town
      starting_location: town-2
      starting_tags:
        - Ravenhearter
        - Melee I
        - Ranged I
        - Neoclassic R&W10
        - Cudgel
        - Sheriff's Badge
      doc_elements:
        - combat
    metalsmith:
      name: Metalsmith
      intro: >-
        Forge anything from basic tools to siege implements and legendary weapons.
      description:
        - >-
          With smithing, you are only limited by your Resources and your creativity. You can make weapons, but you can also make armor, tools, siege equipment, sculptures…
        - >-
          You're not on the Headman's payroll, so it's important you find clients so that you can feed yourself.
        - >-
          The theory is important to keep in mind. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
        - >-
          Simple tools and weapons are cheap and quick; a moderate or high-quality piece — a proper sword, a breastplate — costs more of both, and something truly exceptional costs more still. Check the smithing price list for exact numbers.
        - >-
          You can also make Unique Tags — name and describe them yourself. You'll have to roll to see what the quality ends up being.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-2
      starting_tags:
        - Ravenhearter
        - Smithing I
        - Smithy Key
        - Resources x20
      doc_elements:
        - smithing
        - combat
    # Added 2026-09-18 with the Prospecting rework (MINING.md). Starts at the
    # Inn rather than the cave mouth on purpose: the walk down is part of the
    # job, and a prospector who never comes up never meets the smith he needs.
    prospector:
      name: Prospector
      intro: >-
        Enter the caves, obtain resources, and strike the earth.
      description:
        - >-
          You can either sell resources directly to the Depot, or skip the sales tax by directly cutting a deal with the people that need them — like smiths and doctors.
        - >-
          The ores you obtain can be worked by smiths, turning them into highly valuable trinkets. However, they can also be sold raw for a small profit.
        - >-
          You can mine by using the Mine button while in the caves.
        - >-
          The caves are very, very dangerous. The depths especially so. However, the deeper you go, the higher the reward.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-7
      starting_tags:
        - Ravenhearter
        - Prospecting
        - Ration Box x2
        - Pickaxe
    mortus:
      name: Mortus
      intro: >-
        Bring spirits to peace and feed the Lifeweb.
      description:
        - >-
          You have two jobs, both of them sacred: to feed the Lifeweb and to bury people, bringing their souls to peace.
        - >-
          The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
        - >-
          The Lifeweb maintains Ravenheart's environment. Without it, it'll fade into the wastelands. However, it is powered by human blood. People can either voluntarily donate their blood to feed it for a short time — or you can kidnap people and feed them manually. Dead bodies cannot be fed to the Lifeweb. Dead bodies can, however, be buried to bring the person's soul to peace (as a Routine Move).
        - >-
          Any crimes you commit in service of your vow are not crimes.
        - >-
          You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves, but if dead people are scarce, you can ask the Headman for some food.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: town
      starting_location: town-a
      starting_tags:
        - Ravenhearter
        - Mortus
        - Mortus Key
        - Mortus Rags
        - Melee I
        - Cudgel
      doc_elements:
        - respawning
    bum:
      name: Bum
      intro: >-
        You live in a shell and sleep with the dogs, but you understand life (or think you do).
      description:
        - >-
          Beg for food and coin.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 4
      starting_zone: undertown
      starting_location: undertown-a
      extra_starting_points: -3
      starting_tags:
        - Ravenhearter
        - Unhygienic
        - Ugly
    pusher:
      name: Pusher
      intro: >-
        Work under the Exactor to sell drugs and make a profit.
      description:
        - >-
          You start with Brewing skills, allowing you to craft and sell drugs.
        - >-
          You should give the Exactor some of your cut so that he continues to protect you.
        - >-
          You have the Silver Chip, which allows you to buy drugs from the Depot.
      difficulty: normal
      bank_account: treasury
      starting_account: 14
      multiple: false
      starting_zone: undertown
      starting_location: undertown-8
      starting_tags:
        - Ravenhearter
        - Brewing II
        - Den Key
        - Silver Chip
        - Heroin x2
        - Changa
        - Cave Fungus
        - Obol x10
      doc_elements:
        - alcoholdrugs
    innkeeper:
      name: Innkeeper
      intro: >-
        Name and run the inn: set prices, hire and fire staff, and run an actual, living business.
      description:
        - >-
          The inn is a game of its own. It's up to you to figure out how to make a living out of it. For one thing, you can consider asking the Merchant for a loan.
        - >-
          Cook fine meals, brew alcohol, hire bards and pretty ladies — keep the Customer coming back, yes, but be creative. Running an information network or turning the Inn into a place for people to find jobs are possible ways you can take advantage of owning Ravenheart's most popular enterprise.
        - >-
          You are responsible for paying your staff. They have to eat.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-7
      whitelist: true
      starting_tags:
        - Inn Key x3
        - Room A Key x2
        - Room B Key x2
        - Room C Key x2
        - Ravenhearter
        - Cooking I
        - Brewing I
        - Appraisal
      doc_elements:
        - alcoholdrugs
        - inn
    inn-staff:
      name: Inn Staff
      intro: >-
        Work the floor, the kitchen, or the cellar — whatever the Inn needs.
      description:
        - >-
          Keep the Inn running under the Innkeeper. Cook (Cooking II), brew (Brewing II), wait tables, or just keep the room talking — pick your corner, or split off and start your own enterprise if you're a brewer with ambition.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-7
      starting_tags:
        - Inn Key
        - Ravenhearter
        - Cooking I
      doc_elements:
        - alcoholdrugs
        - inn
    courtesan:
      name: Courtesan
      intro: >-
        Kiss people for money.
      description:
        - >-
          Ravenheart is a dangerous place, which is why you rely on the Exactor to protect you. You owe him some of your cut in exchange for his protection, but you can also choose to work independently.
        - >-
          Set your prices and work the late hours. Your kisses are the most powerful in the game and can easily make other people ecstatic, giving them a +1 to their Gambits.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: undertown
      starting_location: undertown-8
      starting_tags:
        # The SLUG, not the name: "Seductive" is also the display name of the
        # catalog: secret Demoness power, and the sync refuses an ambiguous
        # name rather than picking one.
        - seductive
        - Ration Box x2
        - Cigarette
        - Den Key
        - Courtesan's Key
    slave:
      name: Slave
      intro: >-
        You were sold into slavery. Work to earn your freedom.
      description:
        - >-
          Do what the Exactor says, with the eventual hope of earning your freedom. Your contract details the amount of obols you must obtain to buy your freedom.
        - >-
          You may rebel, but given your collar, it will be a difficult thing to do.
        - >-
          Your primary job is to go into the caves and prospect for resources.
      difficulty: easy
      multiple: true
      weight: 3
      starting_zone: undertown
      starting_location: undertown-8
      starting_tags:
        - Bomb Collar (Locked)
        - Pickaxe
        - Ration Box
    goon:
      name: Goon
      intro: >-
        Serve the Exactor and protect his criminal empire.
      description:
        - >-
          You work solely for the Exactor. You shouldn't betray him, because you believe in his empire. He also has dirt on you.
        - >-
          Intimidate people, follow orders, and sell drugs.
        - >-
          You're paid better than the Dockers, but commit crimes as your job. What's not to love?
      difficulty: easy
      bank_account: treasury
      starting_account: 4
      multiple: true
      weight: 2
      starting_zone: undertown
      starting_location: undertown-8
      starting_tags:
        - Strong
        - Melee I
