    # Added 2026-09-18 with the Prospecting rework (MINING.md). Starts at the
    # Inn rather than the cave mouth on purpose: the walk down is part of the
    # job, and a prospector who never comes up never meets the smith he needs.
    prospector:
      name: Prospector
      intro: >-
        Enter the caves, obtain resources, and strike the earth.
      description:
        - >-
          You can either sell resources directly to the Depot or skip the sales tax by cutting a deal with the people that need them — like smiths and Serpents.
        - >-
          The ores you obtain can be worked by smiths, turning them into highly valuable trinkets. However, they can also be sold raw for a small profit.
        - >-
          You can mine by using the Mine button while in the caves, but you need a Prospector pick.
        - >-
          The caves are very dangerous, and the depths especially so. However, the deeper you go, the higher the reward. Consider hiring an escort.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 2
      starting_zone: town
      knows: *townsfolk
      starting_location: town-7
      ring:
        spawns: true
        opens: []
      starting_tags:
        - Ravenhearter
        - Prospecting
        - Spelunker
        - Ration Box x2
        - Pickaxe
        - Appraisal
        - Obol x2
    # Added 2026-09-20. Starts inside the Soilery (town-3) rather than the
    # town square, because the Farm button only exists on `soilery` ground —
    # a Soiler who starts anywhere else spends their first Move walking.
    # The Soiler's ring is not decoration: the Silo (town-3-2) where the
    # harvest is kept and the Stable (town-3-3) are both locked behind it.
    soiler:
      name: Soiler
      intro: >-
        Grow food for Ravenheart and tame the arelitz.
      description:
        - >-
          You can farm, but you must be in the Soilery, a set of plots and sheds in the town's east. The Farm button there plants 100 crops, and whatever doesn't wither comes in as Foodstuffs when the turn is pushed. A day in the fields leaves you Recently Farmed and Tired, so you farm one turn in three.
        - >-
          Food fetches nothing at the Depot, so cut a deal with the Inn or other organizations instead. A hungry town will pay for it.
        - >-
          Your ring opens the Silo, where the harvest is kept, and the Stable beside it.
        - >-
          The arelitz in the Stable eat Foodstuffs left on the floor, two each, and lay eggs, and the eggs hatch and grow on their own clock. A grown one is unruly, and nobody rides it until somebody breaks it in.
        - >-
          An arelitz is also meat, and so is anything you cannot feed.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 5
      starting_zone: town
      knows: *townsfolk
      starting_location: town-3
      ring:
        spawns: true
        opens: [soilers-key]
      starting_tags:
        - Ravenhearter
        - Soilery
        - Work Knife
        - Resources x2
        - Plebeian Hood
        - Foodstuffs x4
        - Obol x1
      doc_elements:
        - farming
    mortus:
      name: Mortus
      intro: >-
        Bring spirits to peace and feed the Lifeweb.
      description:
        - >-
          You have two jobs, both of them sacred: to feed the Lifeweb and to bury people, bringing their souls to peace.
        - >-
          The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
        - >-
          Any crimes you commit in service of your vow are not crimes.
        - >-
          You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves.
      difficulty: easy
