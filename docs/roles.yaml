        - Suit and Tie
        - Hood
        - Bomb Collar
        - Remote Detonator
        - Literacy
        - Obol x35
        # His ring opens the Den itself. The two guest-room keys stay keys, to
        # lend out, and these are his second copies — there is another pair on
        # the desk in his office (docs/zones.yaml).
