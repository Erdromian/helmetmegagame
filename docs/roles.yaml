        - Ration Box
        - Obol x7
        # Hauling crates is the job (Depot Overhaul.docx, CARRY.md §10).
        - Pack Mule
      doc_elements:
        - merchant
    banneret:
      name: Banneret
      intro: >-
        As the Baron's cousin, begrudgingly serve Ravenheart by organizing the production of the valuable Squeeze and selling it to the merchant.
      description:
        - >-
          You're the leader of one of Ravenheart's cadet houses, carrying only a fraction of the prestige and responsibility as the Baron himself.
        - >-
          You've been charged with Godard Factory. While usually looked down upon, it is very valuable: Squeeze is how Ravenheart obtains obols, funding its warchest.
        - >-
          Your whole operation relies on your communication with the merchant and the Keep. It's your job to crate the Squeeze, load it on the cart, and sell it to the merchant — or you can let the Geschef do it. But make sure you're getting a good price. Keep some to pay your employees and give the rest to the Baron. Also keep your refugees happy with {tag:moonshine}.
        - >-
          Make sure everyone's wearing their armored gloves.
      difficulty: hard
      bank_account: treasury
      starting_account: 43
      multiple: false
      starting_zone: hills
      knows: *townsfolk
      starting_location: factory
      ring:
        spawns: true
        opens: [factory-key, bannerets-key]
        seal_office: Banneret
        seal_mark: "Three ravens on a tree branch, the seal of the Banneret."
        name: "Banneret's Ring"
        description: "A steel ring engraved with the initials {initials}. The face bears three ravens on a tree branch, the seal of the Banneret."
      starting_tags:
        - Ravenhearter
        - Arelitz
        - Cart
        - Nobility
        - Brigandine
        - Sabre
        - Bore Pistol
        - Melee I
        - Ranged I
        - Obol x25
        # Their own pair and the factory's 2 spares. The spares, the hatchet
