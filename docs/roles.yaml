# Source of truth for every playable role, synced into Postgres by
# db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet) is a `>-` folded block scalar, one physical line per bullet, no
# hard wrapping. `>-` never needs quoting, so a `: ` or a leading `-` inside
# the text is safe, and it folds back to a single line. That last part is
# load-bearing: `Role.description` is a String[] and each element is rendered
# as one Markdown bullet on the role charter, so an element carrying a newline
# breaks the bullet. Never use `|` on `description` — it hands the sync one
# string where Prisma wants an array, and the sync throws mid-pass.
# docs/locations.yaml follows the same rule.
#
# Roles are grouped the way the character-creation picker groups them: by
# SOCIAL POSITION, not by where the seat stands. `groups` and `roles` are maps
# keyed by slug (`baron:`, not `- slug: baron`). See docs/tags.yaml's header
# for why, and db/lib/yamlEntries.js.
#
# The group slugs and their display names live in db/lib/roleGroups.js, not
# here — a key in this file that is not one of them fails the sync's up-front
# validation pass, before anything is written, rather than landing roles under
# a heading nobody named. `other` is the trailing bucket, labelled "Elsewhere".
#
# This file used to nest zones -> factions -> roles. Factions were removed in
# 10/2026 and the zone layer went with them: every role declares its own
# `starting_zone` and `starting_location`, so the nesting was saying twice
# what those two already say.
#
# `slug` is the stable match key across syncs. Renaming later means changing
# `name`, NOT `slug`; a changed slug is treated as a brand-new row (old one
# pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Judge — are NOT in this file. They
# were never read by any sync (a GM hands those seats out by hand and they
# never appear in the player-facing picker), so the whole brief lives in
# db/lib/threats.js instead (docs/systemdocs/THREATS.md).
#
# `weight` (only present on `multiple: true` roles) is the seat cap,
# expressed as seats allowed per 100 total players — the picker computes
# `round(weight * GameConfig.playerCount / 100)`, so raising playerCount to
# 120 scales every capped role by 1.2. `weight: unlimited` means no cap at
# any scale (chaff roles like Commoner/Migrant).
#
# `multiple: false` roles get no `weight` field at all — they're a single
# specific named character (Baron, Bishop, Sheriff, ...) and always stay
# at exactly one seat no matter how large the game gets, which is not the
# same thing as "1 per 100 players".
#
# A seat normally frees up when its holder dies — but only two of them do.
# Which ones is listed in code, by slug, not here:
# db/lib/roleCapacity.js#REOPENING_SEAT_ROLE_SLUGS. Every other seat is spent
# for the rest of the run.
#
# `whitelist: true` is who may claim this seat at all. Picking a whitelisted
# role needs the @Leader Whitelist Discord role (db/lib/roleIds.js), always —
# that used to be a Dev Panel switch and is now simply the rule. It is a
# HOSTING decision: these are the named seats the game cannot open without, so
# they are also the ones the assignment roll fills first
# (db/lib/roleAssignment.js) and the ones the picker marks with a ★.
#
# `examine_visible` (optional, defaults TRUE) is whether examining somebody in
# this seat reads the title off them. Most seats in this game are public
# offices — the Bishop, the Sheriff and the Innkeeper are known to be what they
# are — so leaving the key out means visible. It is set to `false` on the two
# seats that live on not being known: the two Tribunal seats. A hooded
# character reads out no role either way, the same as they read out no name.
#
# `bank_account` (role-level, optional) opens a fingerprinted account at the
# Depot for this character at creation: `treasury` for a claim on the coin in
# the Keep's Vault, `offshore` for money the Company holds off-world (the
# Merchant's and his Dockers'). Absent means no account — the Black Hills seats
# arrive without one, and open one at the counter if they ever want one.
# See docs/systemdocs/DEPOT.md §0g.
#
# `starting_account` (role-level, optional, defaults 0) is how many obols are
# already in that account the moment it opens. It is station rather than
# balance: the Baron is rich, a courtier is comfortable, a commoner has pocket
# change, and a slave or a migrant has nothing. It is refused on a seat with no
# `bank_account`, because there would be nowhere for the money to land.
#
# A purse can also be PHYSICAL — `Obol x5` in `starting_tags` — and several
# seats carry both. The difference matters: coin in your hand can be stolen or
# pickpocketed, and coin in the bank cannot, but the bank can only pay out what
# is actually sitting in the Keep's Vault. Every treasury figure here is a
# claim on that pile (docs/zones.yaml, `undertown-1-7`), so raising one
# means checking `npm run db:audit-vault-backing` still exits 0.
#
# `starting_zone` (role-level) is a Zone **slug** from docs/zones.yaml — it
# decides where the character starts, and therefore which zone role (and so
# which Discord category) they get on creation. Must be a presence zone: the
# Caves group itself is not standable, but its levels (caverns, railroad,
# aberrant-pits) are.
#
# `starting_location` (role-level, optional) is a Location **slug** from
# docs/zones.yaml — it decides which Location channel (and "Location: {Name}"
# role) the character lands in. If a role gives none, it defaults to the
# first Location (by `sort`) of its `starting_zone`. If both are given, the
# location must actually belong to that zone — the sync throws otherwise.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# Tag NAMES are not unique. Where two tags share one ("Seductive" is both the
# Courtesan's trade and a catalog: secret Demoness power), the sync refuses the
# name and you write the SLUG instead — it takes either. It used to take the
# last row it happened to load, which handed the Courtesan the Demoness tag and
# said nothing.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
groups:
  # Court
  court:
    baron:
      name: Baron
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are the Baron of Ravenheart. Lead the people to peace, justice, and prosperity and walk the path of your ancestors.
      description:
        - >-
          First, choose your dynasty's last name. Ensure that if you die, at least your heir will continue on.
        - >-
          Your most important task is to communicate with your subordinates — ranging from the Censor, to the Banneret and the Meister — in order to keep Ravenheart organized. After that, you can enjoy your hard-earned luxury. Alternatively, you can simply enjoy your life, have a drink, and seduce the servants.
        - >-
          Be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness.
        - >-
          If things become too dire, you and your family can escape on the Charon.
        - >-
          The keep has a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
      difficulty: hard
      bank_account: treasury
      starting_account: 36
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      whitelist: true
      starting_tags:
        - Armory Key
        - Ravenhearter
        - Nobility
        - Cerberus Key
        - Baron's Key
        - Elevator Key
        - Baron's Scepter
        - Brigandine
        - Sabre
        - Literacy
        - Courtier
        - Obol x25
        - Post-Christian
        - Appraisal
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    baroness:
      name: Baroness
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        Assist the Baron as only someone who loves him can. Raise and protect the Heir, and be the Mistress of the Keep.
      description:
        - >-
          Your Baron is a stressed, overburdened, and threatened man. Support him however you can.
      difficulty: easy
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literacy
        - Baroness's Key
        - Obol x5
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    heir:
      name: Heir
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are your father's son. Are you the exact opposite of him, or his closest ally?
      description:
        - >-
          Life is good as the Heir — but that may change one day. Will you make an effort to reveal the gravity of your situation, or will you dawdle your days away?
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Literacy
        - Heir's Key
        - Obol x5
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    successor:
      name: Successor
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        You are the Baron's daughter. Bring some light to the darkness.
      description: []
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literacy
        - Successor's Key
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    hand:
      name: Hand
      intro: >-
        You're the only man the Baron can truly trust. At his side, shape the course of Ravenheart for the better.
      description:
        - >-
          The Baron works best when he's informed and has a court that's loyal and organized. You are his everloyal spymaster, executor, and voice.
        - >-
          Coordinate with the Banneret to export Squeeze. The more obols you can secure for the treasury, the better poised Ravenheart will be to defend itself from attack.
        - >-
          The keep has a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
      difficulty: normal
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      whitelist: true
      starting_tags:
        - Armory Key
        - Ravenhearter
        - Courtier
        - Literacy
        - Hand's Pin
        - Hand's Key
        - Obol x10
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    meister:
      name: Meister
      intro: >-
        You are the Keep's circulatory system. Organize the various systems of Ravenheart and ensure the economy remains in order.
      description:
        - >-
          Your terminal lists every account in Ravenheart and allows you to set the sell tax. Be careful to not withdraw too much from the Treasury, or people's accounts will no longer be backed by your obols, certainly leading to rebellion.
      difficulty: normal
      bank_account: treasury
      starting_account: 4
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      whitelist: true
      starting_tags:
        - Ravenhearter
        - Courtier
        - Frail
        - Medical I
        - Literacy
        - Meister's Key
        - Bird
        - Obol x5
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - medical
    arbiter:
      name: Arbiter
      intro: >-
        Represent the God-King Enoch II's interests, support Ravenheart's defense, and advise the Baron.
      description:
        - >-
          You're from the God-King's court. Your home and allegiance is back in the Kingdom, and as such, you are here to serve His Majesty God-King Enoch II's interests — primarily by ensuring neither Ravenheart's court nor its peasants get uppity, and secondarily by aiding in the organization of its defenses against both internal and external threats. Whether you happen to personally like the Baron or not is up to you.
        - >-
          Unless the God-King orders you otherwise, ensure you're helping the fortress however you can. It's particularly important that you aid in economic matters, such as in the organization of Godard Factory or the town's taxation. Ensure the Meister does his job.
        - >-
          Ask the Baron how you can help him. Your service will surely be appreciated.
      difficulty: normal
      bank_account: treasury
      starting_account: 5
      multiple: false
      whitelist: true
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Literacy
        - Sabre
        - Major's Insignia
        - Obol x4
        - Appraisal
      doc_elements:
        - godking
        - courtstructure
    courtier:
      name: Courtier
      intro: >-
        Live life according to your whims, serving the Baron enough to meet his demands.
      description:
        - >-
          The Baron keeps you around in his court. Either honorably serve Ravenheart, convince the Censor to launch an expedition into the caves, or duel your fellow courtiers for the Successor's affection. It's your day to make of it what you will.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 6
      starting_zone: fortress
      starting_location: fortress-4
      # In place of the ten Courtier kits, which were removed for being a
      # second point economy sitting on top of this one: ten crates, each with
      # its own price and its own conflict list, deciding a courtier's whole
      # sheet before they reached the catalog. The points buy the same things.
      extra_starting_points: 7
      starting_tags:
        - Ravenhearter
        - Courtier
        - Literacy
      doc_elements:
        - godking
        - courtstructure
    minstrel:
      name: Minstrel
      intro: >-
        Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
      description: []
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 1
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Musician
        - Instrument
      doc_elements:
        - godking
        - courtstructure
    servant:
      name: Servant
      intro: >-
        Keep the fortress running.
      description:
        - >-
          Clean, cook, maintain, and serve.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 3
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Servant
        - Cooking I
        # A turn's cooking to start with: 40 crops is 20 dishes at 2 crops and
        # 0.05 of a Move each, which is one whole Move. Every dish here is
        # 35 hunger (COOKING.md §2a), so a cook can feed 20 person-turns.
        - Wheat x8
        - Potato x12
        - Carrot x6
        - Tomato x8
        - Onion x6
      doc_elements:
        - godking
        - courtstructure

  # Clergy
  clergy:
    bishop:
      name: Bishop
      intro: >-
        Keep people's souls on the straight and narrow. Prevent the world from descending into animalness.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          At some point, you'll have to decide between peacefulness or the Order of the Silver Cross.
        - >-
          You can make Holy Water and Excommunicate people.
        - >-
          Along with the Chaplains, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-4
      whitelist: true
      starting_tags:
        - Cathedral Key
        - Ravenhearter
        - Chaplain
        # The office as a tag, the same move Chaplain above is. Every gate
        # that means "is this the Bishop" reads this and not the role — the
        # Excommunicate button and the Depriver tag both do.
        - Bishop
        - Blessing
        - Teaching
        - Pious
        - Literacy
        - Post-Christian
        - Bishop's Mitre
        - Vestments
        - Cross
      doc_elements:
        - postchristianity
    chaplain:
      name: Chaplain
      intro: >-
        Care for the needy, lend an ear, and kindle goodness in others.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          Do as you wish to help the people, including caring for bums, taking confessions, or spending your time criticizing sinners.
        - >-
          Along with the Bishop, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Cathedral Key
        - Ravenhearter
        - Chaplain
        - Teaching
        - Pious
        - Literacy
        - Post-Christian
        - Vestments
        - Cross
      doc_elements:
        - postchristianity
    inquisitor:
      name: Inquisitor
      intro: >-
        Uphold your duty and expunge the barony's corruption.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Deploy the Preacher wisely to radicalize and convert people to fundamentalism. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-4
      whitelist: true
      starting_tags:
        - Order Key
        - Cathedral Key
        - Ravenhearter
        - Pious
        - Melee I
        - War Hammer
        - Silver Knife
        - Shield
        - Mail Shirt
        - Post-Christian
        - Inquisitor's Longcoat
        - Fundamentalist
        - Torturer
        - Literacy
      doc_elements:
        - postchristianity
    practicus:
      name: Practicus
      intro: >-
        Serve the Inquisitor. Radicalize the Town, the Church, and possibly even the Court.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Follow the Inquisitor's orders. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Order Key
        - Ravenhearter
        - Pious
        - Melee I
        - Mail Shirt
        - Truncheon
        - Post-Christian
        - Practicii's Robes
        - Gas Mask
        - Fundamentalist
        - Torturer
      doc_elements:
        - postchristianity
    preacher:
      name: Preacher
      intro: >-
        You are the Order's face. Speak in the Town Square for all to hear.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 1
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Order Key
        - Ravenhearter
        - Pious
        - Post-Christian
        - Fundamentalist
      doc_elements:
        - postchristianity

  # Cerberon
  cerberon:
    censor:
      name: Censor
      intro: >-
        Bravely lead the Cerberi against the enemies of Ravenheart.
      description:
        - >-
          Ravenheart is an ancient bastion of humanity and a beacon of light. It is your solemn duty — at least on paper — to uphold that.
        - >-
          You win through leadership, proactivity, communication, and organization.
        - >-
          The Cerberi are men, but they are also dogs. Remind them that in service of Ravenheart, they should be capable of the savagery their position demands.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: fortress
      starting_location: fortress-1
      whitelist: true
      starting_tags:
        - Censor's Helmet
        - Armory Key
        - Cerberus Key
        - Censor's Key
        - Ravenhearter
        - Cerberon
        - Tactician
        - Melee II
        - Melee (Shield Wall)
        - Ranged I
        - Teaching
        - Disabler
        - Truncheon
        - Broadsword
        - Shield
        - Radio System (Cerberon)
        - Radio Bracelet (Cerberon)
        - Literacy
        - Obol x2
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - cerberon
        - armory
        - combat
    incarn:
      name: Incarn
      intro: >-
        You are a warrior monk, the Warden, the unbound spirit of the Keep.
      description:
        - >-
          Guard the Keep, process prisoners, and praise God. Your allegiance is to God first and foremost, and Ravenheart second. Fortunately, the Baron is on the side of order more often than not, so your cause tends to be aligned with his.
        - >-
          Your job is to guard the dungeon, process migrants, and protect the Silver Cross, Ravenheart's only relic. The Silver Cross is an ancient artifact. It terrifies and burns demonic creatures.
        - >-
          Your role is as organizational as it is combat-like — you should assist the Censor in assigning his men, drafting battleplans, and performing espionage. Monitor the outskirts and the caves, and always be a step ahead of the darkness.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: false
      starting_zone: fortress
      starting_location: fortress-1
      starting_tags:
        - Armory Key
        - Ravenhearter
        - Melee II
        - Ranged I
        - Cerberon
        - Cerberus Key
        - Melee (Shield Wall)
        - Pious
        - Incarn's Key
        - Cudgel
        - Disabler
        - Mail Coif
        - Mail Shirt
        - Post-Christian
      doc_elements:
        - courtstructure
        - cerberon
        - postchristianity
        - armory
        - combat
    cerberus:
      name: Cerberus
      intro: >-
        Serve the Baron and defend Ravenheart. You are the man of the hour.
      description:
        - >-
          You are a member of the Cerberon, one of the prowling dogs of the Keep. Armed with your disabler, cudgel, and your weapon of choice from the armory, execute the Censor's will.
        - >-
          You are loyal to the Censor and the Baron, although extreme circumstances could change that.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 6
      starting_zone: fortress
      starting_location: fortress-1
      starting_tags:
        - Cerberus Helmet
        - Ravenhearter
        - Cerberon
        - Cerberus Key
        - Melee I
        - Ranged I
        - Melee (Shield Wall)
        - Disabler
        - Radio Bracelet (Cerberon)
        - Truncheon
        - Mail Coif
        - Mail Shirt
        - Post-Christian
        - Obol x1
      doc_elements:
        - courtstructure
        - cerberon
        - armory
        - combat
    squire:
      name: Squire
      intro: >-
        Train. One day, you might become one of the Cerberi.
      description:
        - >-
          You are a member of the Cerberon, one of the prowling dogs of the Keep. Armed with your disabler, cudgel, and your weapon of choice from the armory, execute the Censor's will.
        - >-
          You are loyal to the Censor and the Baron, although extreme circumstances could change that.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: fortress
      starting_location: fortress-1
      starting_tags:
        - Ravenhearter
        - Cerberon
        - Cerberus Key
        - Cudgel
        - Simple Helm
        - Buckler
        - Mail Coif
        - Mail Shirt
        - Post-Christian
      doc_elements:
        - courtstructure
        - cerberon
        - armory
        - combat

  # Saviors
  saviors:
    esculap:
      name: Esculap
      intro: >-
        Lead the Sanctuary, treating the rich and noble and developing medicines.
      description:
        - >-
          How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants.
        - >-
          With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment.
        - >-
          If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners.
        - >-
          Organ harvesting is one of the most profitable enterprises in Ravenheart.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-9
      whitelist: true
      starting_tags:
        - Sanctuary Key
        - Ravenhearter
        - Medical III
        - Brewing III
        - Literacy
        - Esculap's Vest
        - Obol x10
        - Resources x26
      doc_elements:
        - medical
    serpent:
      name: Serpent
      intro: >-
        Cure illnesses, perform surgeries, and brew potions, and keep people in this world — where they're needed.
      description:
        - >-
          How you view your task — whether you're a savior or a businessman — is up to you. However, medicine is costly, so consider following tradition and only treating those with coin (or those with noble blood). It wouldn't do for the Sanctuary to rack up high debts just to save some peasants.
        - >-
          With science, the sky's the limit. You can brew medicines and potions, and even experiment for the good of science.
        - >-
          Organ harvesting is one of the most profitable enterprises in Ravenheart.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 4
      starting_zone: town
      starting_location: town-9
      starting_tags:
        - Sanctuary Key
        - Ravenhearter
        - Medical II
        - Brewing II
        - Literacy
        - Resources x8
      doc_elements:
        - medical

  # Business
  business:
    merchant:
      name: Merchant
      intro: >-
        Make your fortune buying and selling items.
      description:
        - >-
          Ravenheart's poor souls are a great source of business, but it's a miserable place otherwise. Remain unattached from its endeavors, and strive only to make a profit until you can return to your home in the United Cities. You're from the U.C.'s merchant class, unlike the Exactor, who is from a lower class.
        - >-
          Buy low, sell high. Ravenheart's principal export is Squeeze, a lucrative item coveted in the United Cities for its life-lengthening properties, and Trinkets, goods smithed using precious metals from the mines.
        - >-
          You have a turret. It's keyed to your face, so it will shoot anyone except you.
        - >-
          The Company will advance you up to 75 ¢ against the business. Your license will be revoked if you fail to pay it.
        - >-
          You may issue loans, lending at high rates and calling on your Dockers to collect.
        - >-
          Unlike other people's accounts, your ATM's obols are backed off-world, so if the Keep's treasury is drained during a bank run you'll still be able to withdraw obols.
      difficulty: hard
      bank_account: offshore
      starting_account: 55
      multiple: false
      starting_zone: undertown
      starting_location: undertown-6
      whitelist: true
      starting_tags:
        - Cart
        - Literacy
        - Merchant's Garb
        - Merchant's License
        - Depot Keycard
        - Silencer
        - Obol x20
        - Nobility
        - Appraisal
      doc_elements:
        - godking
        - squeeze
        - merchant
    docker:
      name: Docker
      intro: >-
        Serve the Merchant during the day and get drunk during the night.
      description:
        - >-
          Maybe they'll let you get a ride on their spaceship if things ever get bad around here.
      difficulty: easy
      bank_account: offshore
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: undertown
      starting_location: undertown-6
      starting_tags:
        - Depot Keycard
        - Appraisal
      doc_elements:
        - merchant
    banneret:
      name: Banneret
      intro: >-
        As the Baron's cousin, begrudgingly serve Ravenheart by organizing the production of the valuable Squeeze and selling it to the merchant.
      description:
        - >-
          You're the leader of one of Ravenheart's cadet houses, carrying only a fraction of the prestige and responsibility as the Baron himself.
        - >-
          You've been charged with Godard Factory. While usually looked down upon, it is very valuable: Squeeze is how Ravenheart obtains obols, funding its warchest.
        - >-
          Your whole operation relies on your communication with the merchant and the Keep. It's your job to crate the Squeeze, load it on the cart, and sell it to the merchant — or you can let the Geschef do it. But make sure you're getting a good price. Keep some to pay your employees and give the rest to the Baron. Also keep your refugees happy with {tag:moonshine}.
        - >-
          Make sure everyone's wearing their armored gloves.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: hills
      starting_location: factory
      whitelist: true
      starting_tags:
        - Ravenhearter
        - Arelitz
        - Cart
        - Nobility
        - Brigandine
        - Sabre
        - Bore Pistol
        - Melee I
        - Ranged I
        - Armored Gloves
        - Factory Key
        - Banneret's Key
        - Appraisal
      doc_elements:
        - godking
        - godardfactory
        - squeeze
    geschef:
      name: Geschef
      intro: >-
        Organize operations while the Banneret goes to see the merchant. If the refugees get rowdy, hit them with a stick.
      description:
        - >-
          Your operation relies on your communication with the merchant and the Keep.
        - >-
          You've survived this operation long enough to become the general manager. You can treat some of the wounds that will surely come and brew the workers Moonshine to keep them happy.
        - >-
          Make sure everyone's wearing their armored gloves.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: false
      starting_zone: hills
      starting_location: factory
      starting_tags:
        - Ravenhearter
        - Tough
        - Old
        - Big Appetite
        - Cudgel
        - Padded Armor
        - Melee I
        - Brewing I
        - Medical I
        - Cooking I
        # A turn's cooking to start with, as for the Servant.
        - Wheat x8
        - Potato x12
        - Carrot x6
        - Tomato x8
        - Onion x6
        - Cleaning Powder
        - Armored Gloves
        - Factory Key
        - Banneret's Key
        - Appraisal
      doc_elements:
        - godardfactory
        - medical
    refugee:
      name: Refugee
      intro: >-
        Do dangerous work — cutting Godflesh from the refuse pit — in exchange for good hazard pay and potential social mobility.
      description:
        - >-
          You arrived from the caves. You don't have a trade or the ability to labor, so your only opportunity to stay alive is through factory work.
        - >-
          Cutting Godflesh out is dangerous. However, since it's worthwhile as it is to the merchant, the Banneret should be paying you well. If that's not the case, feel free to do a bit of protesting.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: hills
      starting_location: factory
      starting_tags:
        - Hatchet
        - Cleaning Powder
        - Armored Gloves
        - Factory Key
      doc_elements:
        - godardfactory
    exactor:
      name: Exactor
      intro: >-
        Run Ravenheart's criminal underbelly.
      description:
        - >-
          You're from the United Cities, like the merchant. Unlike him, you aren't from the upper classes, and instead found your way into a criminal enterprise.
        - >-
          You have a few tools: the Pusher, a brewer and drug seller; the Slaves, miners with bomb collars you can detonate; and the Courtesans, who do not work for you but will pay some of their cut for your protection.
        - >-
          Your Silver Chip allows you to obtain items from the Black Market manifest at the depot.
        - >-
          Your only job is to make as much money as possible. The slaves and the Pusher will make you money by default, but you should plan big business moves. One lucrative enterprise is selling your slaves or getting new ones. The Incarn might sell you prisoners if you can cut a deal.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: undertown
      starting_location: undertown-8
      whitelist: true
      starting_tags:
        - Bore Pistol
        - Machete
        - Suit and Tie
        - Hood
        - Bomb Collar
        - Remote Detonator
        - Collar Key
        - Silver Chip
        - Literacy
        # Every door in the Den. The two room keys are his second copies —
        # there is another pair on the desk in his office (docs/zones.yaml).
        - Den Key
        - Exactor's Key
        - Room A Key (Den)
        - Room B Key (Den)
        - Appraisal

  # Soil
  soil:
    sheriff:
      name: Sheriff
      intro: >-
        Keep the peace in the Town, six-shooter at your hip.
      description:
        - >-
          Unlike the Cerberon, whose sworn duty is to protect the Fortress, you protect the Town.
        - >-
          Your most valued possession is a .45 six-shooter.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: false
      starting_zone: town
      starting_location: town-2
      starting_tags:
        - Ravenhearter
        - Melee I
        - Ranged I
        - Neoclassic R&W10
        - Cudgel
        - Sheriff's Badge
      doc_elements:
        - combat
    metalsmith:
      name: Metalsmith
      intro: >-
        Forge the lucrative Trinkets, but also weapons for the Keep.
      description:
        - >-
          You can smith weapons to turn a profit. Your main source of resources are the Prospector, the Slaves, and the Depot.
        - >-
          You can smelt ores into more valuable metals, and use them along with gems to inlay Trinkets. Masterwork Trinkets inlayed with precious gems fetch a magnificent price.
        - >-
          The theory is important to keep in mind. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
      difficulty: normal
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-2
      starting_tags:
        - Ravenhearter
        - Smithing I
        - Smithy Key
        - Resources x20
        - Appraisal
      doc_elements:
        - smithing
        - combat
    # Added 2026-09-18 with the Prospecting rework (MINING.md). Starts at the
    # Inn rather than the cave mouth on purpose: the walk down is part of the
    # job, and a prospector who never comes up never meets the smith he needs.
    prospector:
      name: Prospector
      intro: >-
        Enter the caves, obtain resources, and strike the earth.
      description:
        - >-
          You can either sell resources directly to the Depot or skip the sales tax by cutting a deal with the people that need them — like smiths and Serpents.
        - >-
          The ores you obtain can be worked by smiths, turning them into highly valuable trinkets. However, they can also be sold raw for a small profit.
        - >-
          You can mine by using the Mine button while in the caves, but you need a Prospector pick.
        - >-
          The caves are very dangerous, and the depths especially so. However, the deeper you go, the higher the reward. Consider hiring an escort.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-7
      starting_tags:
        - Ravenhearter
        - Prospecting
        - Ration Box x2
        - Pickaxe
        - Appraisal
    # Added 2026-09-20. Starts inside the Soilery (town-3) rather than the
    # town square, because the Farm button only exists on `soilery` ground —
    # a Soiler who starts anywhere else spends their first Move walking.
    # The Soiler's Key is not decoration: the Silo (town-3-2) where the seed
    # is kept and the Stable (town-3-3) are both locked behind it.
    soiler:
      name: Soiler
      intro: >-
        Grow food for Ravenheart and tame the arelitz.
      description:
        - >-
          You can farm, but you must be in the Soilery, a set of plots and sheds in the town's east. The Farm button there spends a seed bag and sows a field; the crop comes in when the turn is pushed, minus whatever withers.
        - >-
          You can sell Tobacco to the Depot, but for crops it is better if you cut a deal with the Inn or other organizations. Food fetches nothing at the counter and everything from a hungry town.
        - >-
          Your key opens the Silo, where the seed and the harvest are kept, and the Stable beside it.
        - >-
          The arelitz in the Stable eat what is on the floor and lay eggs, and the eggs hatch and grow on their own clock. A grown one is unruly, and nobody rides it until somebody breaks it in.
        - >-
          An arelitz is also meat, and so is anything you cannot feed.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: town
      starting_location: town-3
      starting_tags:
        - Ravenhearter
        - Soilery
        - Soiler's Key
        - Work Knife
        - Resources x2
        - Wheat
        - Tobacco
        - Wheat Seed Bag
        - Plebeian Hood
      doc_elements:
        - farming
    mortus:
      name: Mortus
      intro: >-
        Bring spirits to peace and feed the Lifeweb.
      description:
        - >-
          You have two jobs, both of them sacred: to feed the Lifeweb and to bury people, bringing their souls to peace.
        - >-
          The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
        - >-
          Any crimes you commit in service of your vow are not crimes.
        - >-
          You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: town
      starting_location: town-a
      starting_tags:
        - Ravenhearter
        - Mortus
        - Mortus Key
        - Mortus Rags
        - Melee I
        - Cudgel
        - Shovel
        - Corpse Salts
      doc_elements:
        - respawning
    bum:
