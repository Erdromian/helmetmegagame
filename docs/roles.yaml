          You know where the bomb is, and you carry a note with the 8-digit sequence that arms it. Key the sequence into the bomb's keypad and press the button beneath it when it turns green, giving you 2 turns to get to the caves. Three wrong sequences in a row and the keypad will no longer answer you.
