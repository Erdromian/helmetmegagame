      doc_elements:
        - alcoholdrugs
    innkeeper:
      name: Innkeeper
      intro: >-
        Run the Old Cock Inn: set prices, hire and fire staff, and manage an actual, living business.
      description:
        - >-
          It's up to you to figure out how to make a living out of the inn. For one thing, you can consider asking the Merchant for a loan.
        - >-
          Cook fine meals, brew alcohol, hire bards and pretty ladies, and make the most out of your own opportunity. Running an information network or turning the Inn into a place for people to find jobs are possible ways you can take advantage of owning Ravenheart's most popular enterprise.
        - >-
          Pay your staff so they can eat.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
