    # ─── The Bastard's party ────────────────────────────────────────────
    # An invading force, not a Ravenheart estate. All six are late-join seats
    # (db/lib/lateJoin.js): hidden from the ordinary picker, drawn in the
    # picker's own "Special" section only once a GM has opened them, or once
    # the Bastard has bought one with Call reinforcements.
    #
    # PLACEHOLDER — these six carry the Bastard's Camp text from
    # docs/archive/windlander.yaml with every line that named the Windlands,
    # the Windriders or the Broken Spears cut out of it. Nothing has been
    # written to replace those lines: the party has no home any more, and where
    # they come from is Bascinet's to decide. The five soldier seats below are
    # bare on purpose for the same reason.
    bastard:
      name: Bastard
      whitelist: true
      gender: MAN
      intro: >-
        You have thirty days to take Ravenheart. Unite your Lieutenants, feed your men, and march — it's your people's only hope.
      description:
        - >-
          Your job is very difficult. Your people are naturally inclined to kill each other instead of cooperate, and if you don't act fast enough, you will starve. You must plan, communicate, organize, and lead to be effective. Above all, be proactive.
        - >-
          The way in which you take Ravenheart is important. Do you want to be known as a tyrant or as a liberator?
        - >-
          You have noble blood. It's possible that you are the bastard of someone in the Baron's lineage, and thus you share blood with him.
        - >-
          There is someone sympathetic to your cause within the walls of the Baron's keep.
      difficulty: hard
      multiple: false
      examine_visible: false
      starting_zone: hills
      starting_location: grand-ravine
      extra_starting_points: 2
      starting_tags:
        - Bastard
        - Melee II
        - Ranged I
        - Tactician
        - Sabre
        - Buckler
        - Bastard's Helmet
        - Bastard's Garb
        - Deep Beast Horn
        - Brigandine
        - Mail Coif
        - Nobility
        - Literate
        - Brave
        - Rough Camper
        - Outsider

