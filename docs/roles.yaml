# Source of truth for every playable role, synced into Postgres by
# db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet) is a `>-` folded block scalar, one physical line per bullet, no
# hard wrapping. `>-` never needs quoting, so a `: ` or a leading `-` inside
# the text is safe, and it folds back to a single line. That last part is
# load-bearing: `Role.description` is a String[] and each element is rendered
# as one Markdown bullet on the role charter, so an element carrying a newline
# breaks the bullet. Never use `|` on `description` — it hands the sync one
# string where Prisma wants an array, and the sync throws mid-pass.
# docs/locations.yaml follows the same rule.
#
# Roles are grouped the way the character-creation picker groups them: by
# SOCIAL POSITION, not by where the seat stands. `groups` and `roles` are maps
# keyed by slug (`baron:`, not `- slug: baron`). See docs/tags.yaml's header
# for why, and db/lib/yamlEntries.js.
#
# The group slugs and their display names live in db/lib/roleGroups.js, not
# here — a key in this file that is not one of them fails the sync's up-front
# validation pass, before anything is written, rather than landing roles under
# a heading nobody named. `other` is the trailing bucket, labelled "Elsewhere".
#
# This file used to nest zones -> factions -> roles. Factions were removed in
# 10/2026 and the zone layer went with them: every role declares its own
# `starting_zone` and `starting_location`, so the nesting was saying twice
# what those two already say.
#
# `slug` is the stable match key across syncs. Renaming later means changing
# `name`, NOT `slug`; a changed slug is treated as a brand-new row (old one
# pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Judge — are NOT in this file. They
# were never read by any sync (a GM hands those seats out by hand and they
# never appear in the player-facing picker), so the whole brief lives in
# db/lib/threats.js instead (docs/systemdocs/THREATS.md).
#
# The Brigands are the exception, and used to be listed here as a threat too:
# they ARE in this file, with weights, so they sync like any other seat and do
# appear in the picker. Nothing in db/, web/ or bot/ special-cases them.
#
# `weight` (only present on `multiple: true` roles) is the seat cap,
# expressed as seats allowed per 100 total players — the picker computes
# `round(weight * GameConfig.playerCount / 100)`, so raising playerCount to
# 120 scales every capped role by 1.2. `weight: unlimited` means no cap at
# any scale (chaff roles like Commoner/Migrant).
#
# `multiple: false` roles get no `weight` field at all — they're a single
# specific named character (Baron, Bishop, Headman, ...) and always stay
# at exactly one seat no matter how large the game gets, which is not the
# same thing as "1 per 100 players".
#
# A seat normally frees up when its holder dies. The roles that DON'T reopen
# (Baron, Heir, Bishop, the Brigands, ...) are listed in
# code — db/lib/roleCapacity.js#PERMANENT_SEAT_ROLE_SLUGS, by slug — not here.
#
# `whitelist: true` is who may claim this seat at all. Picking a whitelisted
# role needs the @Leader Whitelist Discord role (db/lib/roleIds.js), always —
# that used to be a Dev Panel switch and is now simply the rule. It is a
# HOSTING decision: these are the named seats the game cannot open without, so
# they are also the ones the assignment roll fills first
# (db/lib/roleAssignment.js) and the ones the picker marks with a ★.
#
# `examine_visible` (optional, defaults TRUE) is whether examining somebody in
# this seat reads the title off them. Most seats in this game are public
# offices — the Bishop, the Sheriff and the Innkeeper are known to be what they
# are — so leaving the key out means visible. It is set to `false` on the four
# seats that live on not being known: the two Brigands and the two Tribunal
# seats. A hooded character reads out no role either way, the same as they read
# out no name.
#
# `bank_account` (role-level, optional) opens a fingerprinted account at the
# Depot for this character at creation: `treasury` for a claim on the coin in
# the Keep's Vault, `offshore` for money the Company holds off-world (the
# Merchant's and his Dockers'). Absent means no account — the Black Hills seats
# arrive without one, and open one at the counter if they ever want one.
# See docs/systemdocs/DEPOT.md §0g.
#
# `starting_account` (role-level, optional, defaults 0) is how many obols are
# already in that account the moment it opens. It is station rather than
# balance: the Baron is rich, a courtier is comfortable, a commoner has pocket
# change, and a slave or a migrant has nothing. It is refused on a seat with no
# `bank_account`, because there would be nowhere for the money to land.
#
# A purse can also be PHYSICAL — `Obol x5` in `starting_tags` — and several
# seats carry both. The difference matters: coin in your hand can be stolen or
# pickpocketed, and coin in the bank cannot, but the bank can only pay out what
# is actually sitting in the Keep's Vault. Every treasury figure here is a
# claim on that pile (docs/zones.yaml, `undertown-1-7`), so raising one
# means checking `npm run db:audit-vault-backing` still exits 0.
#
# `starting_zone` (role-level) is a Zone **slug** from docs/zones.yaml — it
# decides where the character starts, and therefore which zone role (and so
# which Discord category) they get on creation. Must be a presence zone: the
# Caves group itself is not standable, but its levels (caverns, railroad,
# aberrant-pits) are.
#
# `starting_location` (role-level, optional) is a Location **slug** from
# docs/zones.yaml — it decides which Location channel (and "Location: {Name}"
# role) the character lands in. If a role gives none, it defaults to the
# first Location (by `sort`) of its `starting_zone`. If both are given, the
# location must actually belong to that zone — the sync throws otherwise.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# Tag NAMES are not unique. Where two tags share one ("Seductive" is both the
# Courtesan's trade and a catalog: secret Demoness power), the sync refuses the
# name and you write the SLUG instead — it takes either. It used to take the
# last row it happened to load, which handed the Courtesan the Demoness tag and
# said nothing.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
groups:
  # Court
  court:
    baron:
      name: Baron
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are the Baron of Ravenheart. Lead the people to peace, justice, and prosperity and walk the path of your ancestors.
      description:
        - >-
          You are the ruler. Your job isn't an easy one.
        - >-
          Choose a last name — a Dynasty name. Ensure that if you die, at least your heir will continue on.
        - >-
          Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home. Your ancestors strove to protect it. Some will see you as a dictator, some will see you as a fool — it does not matter! This will outlive you, outlive them!
        - >-
          Stay happy. An unhappy Baron is an unproductive, dangerous baron.
        - >-
          The Council Room has an intercom. Anyone standing at that table can speak into it, and everyone above ground will hear — except the Black Hills, which no speaker was ever strung out to. The yard also has an automated machine gun turret which can be turned on from the Censor's office. It can't tell hostiles or friendlies apart.
        - >-
          You have three missions:
        - >-
          Be organized. Communicate, force your Hand to work, check in on people.
        - >-
          Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
        - >-
          Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
        - >-
          Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
        - >-
          A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
        - >-
          The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
      difficulty: hard
      bank_account: treasury
      starting_account: 36
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      whitelist: true
      starting_tags:
        - Armory Key
        - Ravenhearter
        - Nobility
        - Cerberus Key
        - Baron's Key
        - Elevator Key
        - Baron's Scepter
        - Brigandine
        - Sabre
        - Literate
        - Courtier
        - Obol x25
        - Post-Christian
        - Appraisal
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    baroness:
      name: Baroness
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        Assist the Baron as only someone who loves him can. Raise and protect the Heir, and be the Mistress of the Keep.
      description:
        - >-
          Your Baron is a stressed, overburdened, and threatened man. You do not understand everything, but he has a project. Ravenheart is one of humanity's last bastions. Do what you can to protect him — and the Heir.
      difficulty: easy
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literate
        - Baroness's Key
        - Obol x5
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    heir:
      name: Heir
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are your father's son. Are you the exact opposite of him, or his closest ally?
      description:
        - >-
          Life is good as the Heir — but that may change one day. Will you make an effort to reveal the gravity of your situation, or will you dawdle your days away?
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Literate
        - Heir's Key
        - Obol x5
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    successor:
      name: Successor
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        You are the Baron's daughter. Bring some light to the darkness.
      description: []
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literate
        - Successor's Key
        - Post-Christian
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    hand:
      name: Hand
      intro: >-
        You're the Baron's best friend and perhaps the only man he can truly trust. At his side, shape the course of Ravenheart for the better.
      description:
        - >-
          The Baron works best when he's informed and has a court that's loyal and organized. You are his everloyal spymaster, executor, and voice. Without you, Ravenheart may very well collapse.
        - >-
          Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home.
        - >-
          You have three missions:
        - >-
          Be organized. Communicate, check in on people. Execute the Baron's vision. In order to do these things, you must win people's loyalty. If the people trust and follow you, there is no danger you cannot overcome.
        - >-
          Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
        - >-
          Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
        - >-
          A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
        - >-
          The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
      difficulty: normal
      bank_account: treasury
      starting_account: 5
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      extra_starting_points: 5
      whitelist: true
      starting_tags:
        - Armory Key
        - Ravenhearter
        - Courtier
        - Literate
        - Hand's Pin
        - Hand's Key
        - Obol x10
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    meister:
      name: Meister
      intro: >-
        You are the Keep's brains, but more importantly, its circulatory system. Organize the various systems of Ravenheart and ensure the economy remains in order.
      description:
        - >-
          Make sure the Town sends its taxes — your main contact there is the Headman — and oversee that no one is taking undue amounts of Resources out of the Keep's stores. The town's labor feeds Ravenheart but doesn't produce any surplus. The true money to be made comes from Godard Factory's production of Squeeze. Keep close communication with the Banneret to ensure he's getting you enough obols to fund the warchest, and buy you nice things from the merchant.
        - >-
          Your terminal lists every account in Ravenheart and the coin in the Vault standing behind them, and it sets the sell tax — a cut of every sale at the Depot, taken before the seller is paid, paid into the Vault. Set it too high and people stop selling; set it too low and the Vault empties and nobody can draw their own money out.
        - >-
          Your part in fate is not well-loved nor well-understood, but it is essential. You bear the weight of Ravenheart on your shoulders — or that's what it seems like to you.
        - >-
          In order to do your job effectively, communication and coordination is key. You can use the Keep's messenger ravens to contact others over long distances, and should consider keeping records of the events of the day, to be referenced down the line.
        - >-
          A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
      difficulty: normal
      bank_account: treasury
      starting_account: 4
      multiple: false
      starting_zone: fortress
      starting_location: fortress-4
      whitelist: true
      starting_tags:
        - Ravenhearter
        - Courtier
        - Frail
        - Medical I
        - Literate
        - Meister's Key
        - Bird
        - Obol x5
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - medical
    arbiter:
      name: Arbiter
      intro: >-
        Represent the God-King Enoch II's interests, support Ravenheart's defense, and advise the Baron.
      description:
        - >-
          You are not a born citizen of Ravenheart, unlike the rest of these people. Your home and allegiance is back in the Kingdom, and as such, you are here to serve His Majesty God-King Enoch II's interests — primarily by ensuring neither Ravenheart's court nor its peasants get uppity, and secondarily by aiding in the organization of its defenses against both internal and external threats. Whether you happen to personally like the Baron or not is up to you.
        - >-
          Unless the God-King orders you otherwise, ensure you're helping the fortress however you can. It is particularly important that you aid in economic matters, such as in the organization of Godard Factory or the town's taxation. Ensure the Meister and the Headman do their jobs.
        - >-
          Ask the Baron how you can help him. Your service will surely be appreciated.
      difficulty: normal
      bank_account: treasury
      starting_account: 5
      multiple: false
      whitelist: true
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Literate
        - Sabre
        - Major's Insignia
        - Obol x4
        - Appraisal
      doc_elements:
        - godking
        - courtstructure
    courtier:
      name: Courtier
      intro: >-
        Live life indulgently or honorably — there is not much binding you except your own decisions. What freedom!
      description:
        - >-
          For whatever reason, the Baron keeps you around in his court. Convince the Censor to launch an expedition into the caves, host marvelous feasts, or duel your fellow courtiers for the Successor's affection. It is your day to make of it what you will.
        - >-
          As a Courtier, your gameplay is largely undefined. You are encouraged to set your own goals and desires and work to fulfill them.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 6
      starting_zone: fortress
      starting_location: fortress-4
      # In place of the ten Courtier kits, which were removed for being a
      # second point economy sitting on top of this one: ten crates, each with
      # its own price and its own conflict list, deciding a courtier's whole
      # sheet before they reached the catalog. The points buy the same things.
      extra_starting_points: 7
      starting_tags:
        - Ravenhearter
        - Courtier
        - Literate
      doc_elements:
        - godking
        - courtstructure
    minstrel:
      name: Minstrel
      intro: >-
        Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
      description:
        - >-
          Peddle what you smuggle to the courtiers — quietly.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 1
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Musician
        - Instrument
      doc_elements:
        - godking
        - courtstructure
    servant:
      name: Servant
      intro: >-
        Keep the fortress running.
      description:
        - >-
          Clean, cook, maintain, and serve.
        - >-
          Take Cooking II if you want to run the kitchens properly as the Chef.
      difficulty: easy
      bank_account: treasury
      starting_account: 5
      multiple: true
      weight: 3
      starting_zone: fortress
      starting_location: fortress-4
      starting_tags:
        - Ravenhearter
        - Servant
        - Cooking I
      doc_elements:
        - godking
        - courtstructure

  # Clergy
  clergy:
    bishop:
      name: Bishop
      intro: >-
        Keep people's souls on the straight and narrow. Prevent the world from descending into animalness.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          At some point, you'll have to decide between peacefulness or the Order of the Silver Cross.
        - >-
          You can make Holy Water.
        - >-
          Along with the Chaplains, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: normal
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-4
      whitelist: true
      starting_tags:
        - Cathedral Key
        - Ravenhearter
        - Chaplain
        # The office as a tag, the same move Chaplain above is. Every gate
        # that means "is this the Bishop" reads this and not the role — the
        # Excommunicate button and the Depriver tag both do.
        - Bishop
        - Blessing
        - Teaching
        - Pious
        - Literate
        - Post-Christian
        - Bishop's Mitre
        - Vestments
        - Cross
      doc_elements:
        - postchristianity
    chaplain:
      name: Chaplain
      intro: >-
        Care for the needy, lend an ear, and kindle goodness in others.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          Do as you wish to help the people, including caring for bums, taking confessions, or spending your time criticizing sinners.
        - >-
          Along with the Bishop, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 3
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Cathedral Key
        - Ravenhearter
        - Chaplain
        - Teaching
        - Pious
        - Literate
        - Post-Christian
        - Vestments
        - Cross
      doc_elements:
        - postchristianity
    inquisitor:
      name: Inquisitor
      intro: >-
        Uphold your everlasting duty to expunge the barony's corruption.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Deploy the Preacher wisely to radicalize and convert people to fundamentalism. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions. You can torture people from the character panel, forcing them to reveal their secrets.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: town
      starting_location: town-4
      whitelist: true
      starting_tags:
        - Order Key
        - Cathedral Key
        - Ravenhearter
        - Pious
        - Melee I
        - War Hammer
        - Silver Knife
        - Shield
        - Mail Shirt
        - Post-Christian
        - Inquisitor's Longcoat
        - Fundamentalist
        - Torturer
        - Literate
      doc_elements:
        - postchristianity
    practicus:
      name: Practicus
      intro: >-
        Serve the Inquisitor. Radicalize the Town, the Church, and possibly even the Court.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Follow the Inquisitor's orders. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions. You can torture people from the character panel, forcing them to reveal their secrets.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 2
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Order Key
        - Ravenhearter
        - Pious
        - Melee I
        - Mail Shirt
        - Truncheon
        - Post-Christian
        - Practicii's Robes
        - Gas Mask
        - Fundamentalist
        - Torturer
      doc_elements:
        - postchristianity
    preacher:
      name: Preacher
      intro: >-
        You are the Order's face. Speak in the Town Square for all to hear.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions. You can torture people from the character panel, forcing them to reveal their secrets.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 1
      starting_zone: town
      starting_location: town-4
      starting_tags:
        - Order Key
        - Ravenhearter
        - Pious
        - Post-Christian
        - Fundamentalist
      doc_elements:
        - postchristianity

  # Cerberon
  cerberon:
    censor:
      name: Censor
      intro: >-
        Bravely lead the Cerberi against the enemies of Ravenheart.
      description:
        - >-
          Ravenheart is an ancient bastion of humanity and a beacon of light. It is your solemn duty — at least on paper — to uphold that.
        - >-
          You win through leadership, proactivity, communication, and organization. Think carefully. Speak with the Baron. Do not ride into battle unless necessary — be a strategist first, a footsoldier second. Always be a step ahead of the darkness. If you have eyes everywhere, plans, if you know and see, nothing can stop you.
        - >-
          The Cerberi are men, but they are also dogs. Remind them that in service of Ravenheart, they should be capable of the savagery their position demands.
      difficulty: hard
      bank_account: treasury
      starting_account: 6
      multiple: false
      starting_zone: fortress
      starting_location: fortress-1
      whitelist: true
      starting_tags:
        - Censor's Helmet
        - Armory Key
        - Cerberus Key
        - Censor's Key
        - Ravenhearter
        - Cerberon
        - Tactician
        - Melee II
        - Melee (Shield Wall)
        - Ranged I
        - Teaching
        - Disabler
        - Truncheon
        - Broadsword
        - Shield
        - Radio System (Cerberon)
        - Radio Bracelet (Cerberon)
