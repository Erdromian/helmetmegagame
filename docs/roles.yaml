      intro: >-
        Forge the lucrative Trinkets, but also weapons for the Keep.
      description:
        - >-
          You can smith weapons to turn a profit. Your main source of resources are the Prospector, the Slaves, and the Depot.
        - >-
          You can smelt ores into more valuable metals, and use them along with gems to inlay Trinkets. Masterwork Trinkets inlayed with precious gems fetch a magnificent price.
        - >-
          The theory is important to keep in mind. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
      difficulty: normal
      bank_account: treasury
