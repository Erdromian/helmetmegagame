        - Ration Box x8
        - Appraisal
        - Foodstuffs x4
      doc_elements:
        - godking
        - godardfactory
        - squeeze
    geschef:
      name: Geschef
      intro: >-
        Organize operations while the Banneret goes to see the merchant. If the refugees get rowdy, hit them with a stick.
      description:
        - >-
          Your operation relies on your communication with the merchant and the Keep.
        - >-
          You've survived this operation long enough to become the general manager. You can treat some of the wounds that will surely come and brew the workers Moonshine to keep them happy.
        - >-
          Make sure everyone's wearing their armored gloves.
      difficulty: normal
      bank_account: treasury
      starting_account: 20
      multiple: false
      starting_zone: hills
      knows: *townsfolk
      starting_location: factory
      ring:
        spawns: true
        opens: [factory-key, bannerets-key]
      starting_tags:
