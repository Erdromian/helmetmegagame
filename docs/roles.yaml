      intro: >-
        Kiss people for money.
      description:
        - >-
          Ravenheart is a dangerous place, which is why you rely on the Exactor to protect you. You owe him some of your cut in exchange for his protection, but you can also choose to work independently.
        - >-
          Set your prices and work the late hours. Your kisses are the most powerful in the game and can easily make other people ecstatic, giving them a +1 to their Gambits.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
