  # Business
  business:
    merchant:
      name: Merchant
      intro: >-
        Make your fortune buying and selling items.
      description:
        - >-
          Ravenheart's poor souls are a great source of business, but it's a miserable place otherwise. Remain unattached from its endeavors, and strive only to make a profit until you can return to your home in the United Cities. You're from the U.C.'s merchant class, unlike the Exactor, who is from a lower class.
        - >-
          Buy low, sell high. Ravenheart's principal export is Squeeze, a lucrative item coveted in the United Cities for its life-lengthening properties, and Trinkets, goods smithed using precious metals from the mines.
        - >-
          You have a turret. It's keyed to your face, so it will shoot anyone except you.
        - >-
          You may issue loans, lending at high rates and calling on your Dockers to collect.
        - >-
          Unlike other people's accounts, your account's obols are backed off-world, so if the Keep's treasury is drained during a bank run you'll still be able to withdraw obols.
      difficulty: hard
      bank_account: offshore
      starting_account: 88
      multiple: false
      starting_zone: undertown
      knows: *townsfolk
      starting_location: undertown-6
      whitelist: true
      ring:
        spawns: true
        # depot-keycard: the Storefront's way through to the Depot, and the Cargo
        # Bay. merchants-terminal-key: the Merchant's Terminal (DEPOT.md §0c).
