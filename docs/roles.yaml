        # A turn's cooking to start with, as for the Servant.
        - Foodstuffs x40
        - Cleaning Powder
        - Armored Gloves
        - Appraisal
        - Cheese x3
      doc_elements:
        - godardfactory
        - medical
    refugee:
      name: Refugee
      intro: >-
        Do dangerous work — cutting Godflesh from the refuse pit — in exchange for good hazard pay and potential social mobility.
      description:
        - >-
          You arrived from the caves. You don't have a trade or the ability to labor, so your only opportunity to stay alive is through factory work.
        - >-
          Cutting Godflesh out is dangerous. However, since it's worthwhile as it is to the merchant, the Banneret should be paying you well. If that's not the case, feel free to do a bit of protesting.
      difficulty: easy
      bank_account: treasury
      starting_account: 3
      multiple: true
      weight: 4
      starting_zone: hills
      knows: *townsfolk
      starting_location: factory
      ring:
        spawns: true
        opens: [factory-key]
      starting_tags:
        - Rough Camper
        - Hatchet
        - Cleaning Powder
        - Armored Gloves
        - Moldy Bread
        - Obol x1
      doc_elements:
        - godardfactory
    exactor:
      name: Exactor
      intro: >-
        Run Ravenheart's criminal underbelly.
      description:
        - >-
          You're from the United Cities, like the merchant. Unlike him, you aren't from the upper classes, and instead found your way into a criminal enterprise.
        - >-
          You have a few tools: the Pusher, a brewer and drug seller; the Slaves, miners with bomb collars you can detonate; and the Courtesans, who do not work for you but will pay some of their cut for your protection.
        - >-
          Your ring works the Black Market terminal in your office.
        - >-
          Your only job is to make as much money as possible. The slaves and the Pusher will make you money by default, but you should plan big business moves. One lucrative enterprise is selling your slaves or getting new ones. The Incarn might sell you prisoners if you can cut a deal.
      difficulty: normal
      bank_account: treasury
      starting_account: 45
      multiple: false
      starting_zone: undertown
      knows: *townsfolk
      starting_location: undertown-8
      whitelist: true
      ring:
        spawns: true
        # collar-key: his ring unlocks collars; there is no Collar Key item.
        # black-market-key: the Black Market terminal in his office (DEPOT.md §0n).
        opens: [den-key, exactors-key, collar-key, black-market-key]
      starting_tags:
