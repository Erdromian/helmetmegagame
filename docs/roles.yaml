# Source of truth for every playable role, synced into Postgres by
# db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet) is a `>-` folded block scalar, one physical line per bullet, no
# hard wrapping. `>-` never needs quoting, so a `: ` or a leading `-` inside
# the text is safe, and it folds back to a single line. That last part is
# load-bearing: `Role.description` is a String[] and each element is rendered
# as one Markdown bullet on the role charter, so an element carrying a newline
# breaks the bullet. Never use `|` on `description` — it hands the sync one
# string where Prisma wants an array, and the sync throws mid-pass.
# docs/locations.yaml follows the same rule.
#
# Roles are grouped the way the character-creation picker groups them: by
# SOCIAL POSITION, not by where the seat stands. `groups` and `roles` are maps
# keyed by slug (`baron:`, not `- slug: baron`). See docs/tags.yaml's header
# for why, and db/lib/yamlEntries.js.
#
# The group slugs and their display names live in db/lib/roleGroups.js, not
# here — a key in this file that is not one of them fails the sync's up-front
# validation pass, before anything is written, rather than landing roles under
# a heading nobody named. `other` is the trailing bucket, labelled "Elsewhere".
#
# This file used to nest zones -> factions -> roles. Factions were removed in
# 10/2026 and the zone layer went with them: every role declares its own
# `starting_zone` and `starting_location`, so the nesting was saying twice
# what those two already say.
#
# `slug` is the stable match key across syncs. Renaming later means changing
# `name`, NOT `slug`; a changed slug is treated as a brand-new row (old one
# pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Judge — are NOT in this file. They
# were never read by any sync (a GM hands those seats out by hand and they
# never appear in the player-facing picker), so the whole brief lives in
# db/lib/threats.js instead (docs/systemdocs/THREATS.md).
#
# Seats (Fate Slot Logic.docx; db/lib/fateCapacity.js, docs/systemdocs/
# CHARACTERS.md "Fate seats"). A game has the readied count plus 10% in fate
# seats, rounded up — 72 readied is 80. Three shapes:
#
# `multiple: false` — a constant fate: a single specific named character
# (Baron, Bishop, Sheriff, ...) with exactly one seat no matter how large the
# game gets. There are 20 of them in the lobby, and the sync refuses a file
# that says otherwise.
#
# `weight: N` (on `multiple: true`) — a share, out of 60, of the POOL: the fate
# seats less the 20 constant ones. The seats are `round(N * pool / 60)`, so at
# 72 readied every fate has exactly N — but never fewer than half of N, rounded
# up (a `weight: 6` fate keeps 3 seats in the smallest game, a `weight: 1` fate
# 1). The lobby's weights must add up to 60, and the sync refuses a file where
# they do not. `base_seats` is retired.
#
# `weight: unlimited` — no cap at any scale: Bum and Migrant, and the Bastard's
# spawn-only troops. Bum and Migrant are also left off the lobby's priority
# list — a player the roll cannot seat chooses one of them as their fallback —
# and they are the only two seats that free up when their holder dies. Which
# ones is listed in code, by slug, not here:
# db/lib/fateCapacity.js#OPEN_FATE_SLUGS. Every other seat is spent for the
# rest of the run.
#
# `whitelist: true` is who may claim this seat at all. Picking a whitelisted
# role needs the @Leader Whitelist Discord role (db/lib/roleIds.js), always —
# that used to be a Dev Panel switch and is now simply the rule. It is a
# HOSTING decision: these are the named seats the game cannot open without, so
# they are also the ones the assignment roll fills first
# (db/lib/fateAssignment.js) and the ones the picker marks with a ★.
#
# `examine_visible` (optional, defaults TRUE) now only decides whether the seat
# is listed in #info's public roles thread (db/lib/infoChannel.js). It is set to
# `false` on the two Tribunal seats and the six Bastard seats, so the server is
# not told who is coming. It no longer hides anything in play: a look reads a
# role from the looker's own memory (the Friends section of /memories), and
# every seat here — the Tribunal's and the Bastard's included — can be seeded
# and learned like any other. The secret antagonists (the Thanati, the
# Vampire, the Demoness, the Judge) have no seat in this file at all: each is a
# hidden tag under a cover role, and nothing about them ever enters memory
# (docs/systemdocs/MEMORIES.md §2d).
#
# `knows` (optional, defaults to nobody) is who somebody in this seat already
# knows when the game starts: a list of role slugs and group slugs, where a
# group means every seat in it, its own seat included. Each living holder of a
# known seat becomes a Friends entry on /memories, with their name and role,
# and a character created later is added to everyone whose seat knows theirs
# (db/lib/acquaintances.js). It is one-way — the Baron knowing the Servants
# does not make the Servants know the Baron. The town — every Court,
# Clergy, Cerberon, Saviors, Business and Soil seat, plus the Mercenary —
# shares one list through the `&townsfolk` anchor, and the Bastard's soldiers
# share `&bastards`; a seat that should differ gets a list of its own instead
# of the alias. The Migrant has no `knows:` at all: a stranger to everyone.
# See docs/systemdocs/MEMORIES.md §2a.
#
# `bank_account` (role-level, optional) opens a fingerprinted account at the
# Depot for this character at creation: `treasury` for a claim on the coin in
# the Keep's Vault, `offshore` for money the Company holds off-world (the
# Merchant's and his Dockers'), `crown` for the Baron's: not a claim on the
# Vault but the Vault itself, so its balance is whatever the Vault holds and a
# `crown` seat may not set `starting_account`. Absent means no account — the
# Black Hills seats, the Slave, the Bum and the Migrant arrive without one, and
# open one at the counter if they ever want one.
# See docs/systemdocs/DEPOT.md §0g.
#
# `starting_account` (role-level, optional, defaults 0) is how many obols are
# already in that account the moment it opens. It is station rather than
# balance: the Baron is rich, a courtier is comfortable, a commoner has pocket
# change, and a slave or a migrant has nothing. It is refused on a seat with no
# `bank_account`, because there would be nowhere for the money to land.
#
# A purse can also be PHYSICAL — `Obol x5` in `starting_tags` — and several
# seats carry both. The difference matters: coin in your hand can be stolen or
# pickpocketed, and coin in the bank cannot, but the bank can only pay out what
# is actually sitting in the Keep's Vault. Every treasury figure here is a
# claim on that pile (docs/zones.yaml, `undertown-1-7`) — and the pile is made
# of them: each starting character's balance puts a share of itself into the
# Vault as coin (25% by default, the Vault stock knob on /gm/dev, the Baron's
# excepted; db/lib/startingAccount.js). So raising a figure raises the Vault
# with it, and the cover opens at that share. Only the seats Start Game rolled
# stock it; a character who arrives later gets their balance and adds nothing.
#
# Both figures are the MIDDLE of a range, not the exact amount: each character
# rolls their `starting_account` and their `Obol xN` within 10% at creation
# (db/lib/startingVariance.js). A figure under 10 is too small to move.
#
# `starting_zone` (role-level) is a Zone **slug** from docs/zones.yaml — it
# decides where the character starts, and therefore which zone role (and so
# which Discord category) they get on creation. Must be a presence zone: the
# Caves group itself is not standable, but its levels (caverns, railroad,
# aberrant-pits) are.
#
# `starting_location` (role-level, optional) is a Location **slug** from
# docs/zones.yaml — it decides which Location channel (and "Location: {Name}"
# role) the character lands in. If a role gives none, it defaults to the
# first Location (by `sort`) of its `starting_zone`. If both are given, the
# location must actually belong to that zone — the sync throws otherwise.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# Tag NAMES are not unique. Where two tags share one ("Seductive" is both the
# Courtesan's trade and a catalog: secret Demoness power), the sync refuses the
# name and you write the SLUG instead — it takes either. It used to take the
# last row it happened to load, which handed the Courtesan the Demoness tag and
# said nothing.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
#
# `ring:` (optional) is the seat's signet ring (docs/systemdocs/RINGS.md).
# Rings replaced the seat keys and the office wax stamps:
#   spawns       true: created wearing a ring engraved with their initials,
#                registered to this seat and linked to their account.
#   opens        the door tokens a ring registered to this seat carries. They
#                are the old seat keys' slugs, because that is still what every
#                room's `access:` and every locked way names.
#   authorised_by  a tag slug: the Meister's terminal will only register a ring
#                to this seat's access for somebody holding it (the Merchant's
#                License, the Baron's Scepter).
#   seal_office  an OFFICE ring — the nine seats that used to keep a wax stamp.
#   seal_mark    The seat's own spawned ring wears `name` and `description`
#   name         and is the only kind of ring that seals: it presses seal_mark
#   description  into wax under the seal_office label. All four or none;
#                {initials} is filled in wherever it appears. Any other ring,
#                and every ring a smith makes (even one the Meister registers
#                to an office seat), is a plain "Silver Ring" that
#                opens doors and leaves no seal of any kind.
# The guest-room keys (the Inn's and the Den's) stay keys. The Collar Key is
# gone: the Exactor's and the Pusher's rings carry its token (COLLAR.md §3).
groups:
  # Court
  court:
    baron:
      name: Baron
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are the Baron of Ravenheart. Lead the people to peace, justice, and prosperity and walk the path of your ancestors.
      description:
        - >-
          First, choose your dynasty's last name. Ensure that if you die, at least your heir will continue on.
        - >-
          Your most important task is to communicate with your subordinates — ranging from the Censor, to the Banneret and the Meister — in order to keep Ravenheart organized. After that, you can enjoy your hard-earned luxury. Alternatively, you can simply enjoy your life, have a drink, and seduce the servants.
        - >-
          Be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness.
        - >-
          If things become too dire, you and your family can escape on the Charon.
        - >-
          The keep has a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
        - >-
          Your bank account is the Vault itself. At any infoterminal it holds every obol in the Vault, and you can take out as much as is there.
      difficulty: hard
      bank_account: crown
      multiple: false
      starting_zone: fortress
      knows: &townsfolk [court, clergy, cerberon, saviors, business, soil, mercenary]
      starting_location: fortress-4
      extra_starting_points: 9
      whitelist: true
      ring:
        spawns: true
        opens: [armory-key, cerberus-key, barons-key, tower-key, elevator-key, gatehouse-key, portcullis-key]
        authorised_by: barons-scepter
        seal_office: Baron
        seal_mark: "A raven clutching a banner, the seal of the Baron."
        name: "Baron's Ring"
        description: "A ring of pure gold with the initials {initials} finely etched. It is crested with a gemstone, the face painstakingly carved into the shape of a raven clutching a banner with which to seal letters."
      starting_tags:
        - Ravenhearter
        - Nobility
        - Baron's Scepter
        - Brigandine
        - Sabre
        - Literacy
        - Courtier
        - Obol x68
        - Post-Christian
        - Appraisal
        - Insomniac
        - Foodstuffs x4
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    baroness:
      name: Baroness
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        Assist the Baron as only someone who loves him can. Raise and protect the Heir, and be the Mistress of the Keep.
      description:
        - >-
          Your Baron is a stressed, overburdened, and threatened man. Support him however you can.
      difficulty: easy
      bank_account: treasury
      starting_account: 26
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      ring:
        spawns: true
        opens: [baroness-key]
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literacy
        - Insightful
        - Light Sleeper
        - Obol x18
        - Post-Christian
        - Foodstuffs x4
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    heir:
      name: Heir
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: MAN
      intro: >-
        You are your father's son. Are you the exact opposite of him, or his closest ally?
      description:
        - >-
          Life is good as the Heir — but that may change one day. Will you make an effort to reveal the gravity of your situation, or will you dawdle your days away?
      difficulty: easy
      bank_account: treasury
      starting_account: 18
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      extra_starting_points: 8
      ring:
        spawns: true
        opens: [heirs-key]
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Literacy
        - Game Master
        - Hot-Headed
        - Obol x7
        - Post-Christian
        - Foodstuffs x4
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    successor:
      name: Successor
      # The seat fixes the holder's gender -> Role.lockedGender.
      gender: WOMAN
      intro: >-
        You are the Baron's daughter. Bring some light to the darkness.
      description: []
      difficulty: easy
      bank_account: treasury
      starting_account: 24
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      extra_starting_points: 5
      ring:
        spawns: true
        opens: [successors-key]
      starting_tags:
        - Ravenhearter
        - Courtier
        - Nobility
        - Jewelry
        - Literacy
        - Artist
        - Beautiful
        - Post-Christian
        - Foodstuffs x4
        - Obol x15
      doc_elements:
        - godking
        - courtstructure
        - lifewebbasic
    hand:
      name: Hand
      intro: >-
        You're the only man the Baron can truly trust. At his side, shape the course of Ravenheart for the better.
      description:
        - >-
          The Baron works best when he's informed and has a court that's loyal and organized. You are his everloyal spymaster, executor, and voice.
        - >-
          Coordinate with the Banneret to export Squeeze. The more obols you can secure for the treasury, the better poised Ravenheart will be to defend itself from attack.
        - >-
          The keep has a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
      difficulty: normal
      bank_account: treasury
      starting_account: 57
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      extra_starting_points: 10
      ring:
        spawns: true
        opens: [armory-key, hands-key, tower-key, gatehouse-key, portcullis-key]
        seal_office: Hand
        seal_mark: "An open palm, the seal of the Hand."
        name: "Hand's Ring"
        description: "A thin ring of gold engraved with the initials {initials}. The face bears an open palm, the seal of the Hand."
      starting_tags:
        - Ravenhearter
        - Courtier
        - Literacy
        - Hand's Pin
        - Subtle
        - Dagger
        - Obol x15
        - Foodstuffs x4
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - cerberon
        - armory
        - charon
    meister:
      name: Meister
      intro: >-
        You are the Keep's circulatory system. Organize the various systems of Ravenheart and ensure the economy remains in order.
      description:
        - >-
          The terminal in your study lists every account in Ravenheart. From it you control the entire economy of Ravenheart. Manage taxes, wages and people's treasury accounts.
      difficulty: normal
      bank_account: treasury
      starting_account: 16
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      ring:
        spawns: true
        opens: [meisters-key, tower-key, portcullis-key]
        seal_office: Meister
        seal_mark: "A single goblet, the seal of the Meister."
        name: "Meister's Ring"
        description: "A polished brass ring engraved with the initials {initials} and encrusted with tiny jewels. The face bears a single goblet, the seal of the Meister."
      starting_tags:
        - Ravenhearter
        - Courtier
        - Frail
        - Medical I
        - Literacy
        - Bird
        - Teaching
        - Appraisal
        - Obol x7
        - Foodstuffs x4
      doc_elements:
        - godking
        - squeeze
        - courtstructure
        - lifewebbasic
        - medical
    arbiter:
      name: Arbiter
      intro: >-
        Represent the God-King Enoch's interests, support Ravenheart's defense, and advise the Baron.
      description:
        - >-
          You're from the God-King's court. Your home and allegiance is back in the Kingdom, and as such, you are here to serve His Majesty God-King Enoch's interests — primarily by ensuring neither Ravenheart's court nor its peasants get uppity, and secondarily by aiding in the organization of its defenses against both internal and external threats. Whether you happen to personally like the Baron or not is up to you.
        - >-
          Unless the God-King orders you otherwise, ensure you're helping the fortress however you can. It's particularly important that you aid in economic matters, such as in the organization of Godard Factory or the town's taxation. Ensure the Meister does his job.
        - >-
          Ask the Baron how you can help him. Your service will surely be appreciated.
      difficulty: normal
      bank_account: treasury
      starting_account: 22
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      ring:
        spawns: true
        opens: []
      starting_tags:
        - Ravenhearter
        - Literacy
        - Sabre
        - Major's Insignia
        - Obol x13
        - Appraisal
        - Tactician
        - Foodstuffs x4
      doc_elements:
        - godking
        - courtstructure
    courtier:
      name: Courtier
      intro: >-
        Live life according to your whims, serving the Baron enough to meet his demands.
      description:
        - >-
          The Baron keeps you around in his court. Either honorably serve Ravenheart, convince the Censor to launch an expedition into the caves, or duel your fellow courtiers for the Successor's affection. It's your day to make of it what you will.
      difficulty: easy
      bank_account: treasury
      starting_account: 14
      multiple: true
      weight: 3
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      # In place of the ten Courtier kits, which were removed for being a
      # second point economy sitting on top of this one: ten crates, each with
      # its own price and its own conflict list, deciding a courtier's whole
      # sheet before they reached the catalog. The points buy the same things.
      extra_starting_points: 7
      ring:
        spawns: true
        opens: []
      starting_tags:
        - Ravenhearter
        - Courtier
        - Literacy
        - Foodstuffs x4
        - Obol x6
      doc_elements:
        - godking
        - courtstructure
    minstrel:
      name: Minstrel
      intro: >-
        Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
      description: []
      difficulty: easy
      bank_account: treasury
      starting_account: 10
      multiple: false
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      ring:
        spawns: true
        opens: []
      starting_tags:
        - Ravenhearter
        - Musician
        - Instrument Kit
        - Foodstuffs x4
        - Obol x4
      doc_elements:
        - godking
        - courtstructure
    servant:
      name: Servant
      intro: >-
        Keep the fortress running.
      description:
        - >-
          Clean, cook, maintain, and serve.
      difficulty: easy
      bank_account: treasury
      starting_account: 10
      multiple: true
      weight: 4
      starting_zone: fortress
      knows: *townsfolk
      starting_location: fortress-4
      ring:
        spawns: true
        opens: [servant-key]
      starting_tags:
        - Ravenhearter
        - Servant
        - Cooking I
        - Obol x6
        # A turn's cooking to start with: 40 Foodstuffs is 20 Basic meals at 2
        # Foodstuffs and 0.05 of a Move each, which is one whole Move
        # (COOKING.md).
        - Foodstuffs x40
        - Cheese x3
      doc_elements:
        - godking
        - courtstructure

  # Clergy
  clergy:
    bishop:
      name: Bishop
      intro: >-
        Keep people's souls on the straight and narrow. Prevent the world from descending into animalness.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          At some point, you'll have to decide between peacefulness or the Order of the Silver Cross.
        - >-
          You can make Holy Water and Excommunicate people.
        - >-
          Along with the Chaplains, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: normal
      bank_account: treasury
      starting_account: 44
      multiple: false
      starting_zone: town
      knows: *townsfolk
      starting_location: town-4
      whitelist: true
      ring:
        spawns: true
        opens: [cathedral-key, order-key]
        seal_office: Bishop
        seal_mark: "The psychick cross, the seal of the Bishop."
        name: "Bishop's Ring"
        description: "An ornate gold ring engraved with the initials {initials}. The face bears the psychick cross, the seal of the Bishop."
      starting_tags:
        - Ravenhearter
        - Chaplain
        - Obol x54
        # The office as a tag, the same move Chaplain above is. Every gate
        # that means "is this the Bishop" reads this and not the role — the
        # Excommunicate button and the Depriver tag both do.
        - Bishop
        - Blessing
        - Teaching
        - Pious
        - Literacy
        - Post-Christian
        - Bishop's Mitre
        - Vestments
        - Cross
        - Foodstuffs x4
      doc_elements:
        - postchristianity
    chaplain:
      name: Chaplain
      intro: >-
        Care for the needy, lend an ear, and kindle goodness in others.
      description:
        - >-
          It's not the first time dark days have come to Ravenheart; God will ensure the people survive. Your task is to serve as a shining example of goodness during the transition.
        - >-
          Do as you wish to help the people, including caring for bums, taking confessions, or spending your time criticizing sinners.
        - >-
          Along with the Bishop, you have the power to take confessions, dispelling psychological drawback tags.
      difficulty: easy
      bank_account: treasury
      starting_account: 12
      multiple: true
      weight: 2
      starting_zone: town
      knows: *townsfolk
      starting_location: town-4
      ring:
        spawns: true
        opens: [cathedral-key]
      starting_tags:
        - Ravenhearter
        - Chaplain
        - Teaching
        - Pious
        - Literacy
        - Post-Christian
        - Vestments
        - Cross
        - Foodstuffs x4
        - Obol x3
      doc_elements:
        - postchristianity
    inquisitor:
      name: Inquisitor
      intro: >-
        Uphold your duty and expunge the barony's corruption.
      description:
        - >-
          The dark days the scriptures promised are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter. There are things that lurk in the shadows that no man could comprehend.
        - >-
          Rather than being thirsty for power, you are sane, and just doing what is necessary to bring about the goodness of God. To this end, organize your followers and radicalize the Town, the Church, and possibly even the Court. A wary, suspicious, and ready Ravenheart is the only one that can survive.
        - >-
          Get the Bishop on your side. Deploy the Preacher wisely to radicalize and convert people to fundamentalism. Crucify heretics to make an example out of them, and employ your torturer's tools to extract confessions.
        - >-
          Lastly, the Incarn holds the Silver Cross, the powerful artifact your Order is named after. If the need is dire, secure it from him.
      difficulty: hard
      bank_account: treasury
      starting_account: 31
      multiple: false
      starting_zone: town
      knows: *townsfolk
      starting_location: town-4
      whitelist: true
      ring:
        spawns: true
        opens: [order-key, cathedral-key]
        seal_office: Inquisitor
        seal_mark: "A sword drenched in flame, the seal of the Inquisitor."
        name: "Inquisitor's Ring"
        description: "A blackened silver ring engraved with the initials {initials}. The face bears a sword drenched in flame, the seal of the Inquisitor."
      starting_tags:
        - Ravenhearter
        - Pious
        - Melee I
        - War Hammer
        - Silver Knife
        - Shield
        - Obol x14
        # The Order's crossbow and tear gas, which used to lie in the
        # Order Chambers where every Order ring could take them.
        - Crossbow
        - Tear Gas Grenade x3
        - Mail Shirt
        - Post-Christian
        - Inquisitor's Longcoat
        - Fundamentalist
        - Torturer
        - Literacy
        - Foodstuffs x4
      doc_elements:
