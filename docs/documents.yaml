explanation:
  tag: Anyone with this tag gets this Document.
  public: If assigned, this will appear in a player's document folder. However, using the search function, anyone can browse and find this document.
# Documents are a map keyed by their document key (`lore:`, not
# `- key: lore`) — see docs/tags.yaml's header, and db/lib/yamlEntries.js.
documents:
  # FATES — one per role, reached by `roles:` rather than the role's
  # doc_elements, which count toward the role's power score
  # (db/scripts/analysis/economy/power.js) and would shift balance for what is
  # only flavour. Bascinet's text, from E:\Bascinet\V2\Fate Documents.docx —
  # except Soiler, Innkeeper and Inn Staff, which come from
  # E:\Bascinet\V3\Fates.docx. Edits are the {tag:…} tokens, straight quotes
  # and a handful of typo fixes. The V2 Scholastic, Fisherman and Headman fates
  # are not here: no role has those slugs.
  # First in the file so a fate sits right under the pinned role charter.
  fate-baron:
    name: "Fate: Baron"
    public: false
    tags: []
    roles: [baron]
    description: |-
      As the Baron, your rule is absolute. You have the authority to order around any, save for the church. Those who refuse to comply must be punished and made examples of.

      Regardless of your characteristics, as a Baron you must be decisive and willing to have your men crack as many heads as needed in order to get what you want. This is a story about you, and you must steer it as such!
  fate-baroness:
    name: "Fate: Baroness"
    public: false
    tags: []
    roles: [baroness]
    description: |-
      As the Baron's wife, you are simultaneously the closest person to him, and also the most distant. After years spent with him, you are accustomed to being ignored and overlooked, taken for granted and even mistreated.

      However, this doesn't mean you can't play a significant and even pivotal role in the story, it only means it is up to you to make that happen. Pester your husband to lend his ear to you for once instead of his foolish courtiers, scheme behind his back either in support or against him. Act first and ask for permission later, as his wife you have similar authority to the Baron.
  fate-heir:
    name: "Fate: Heir"
    public: false
    tags: []
    roles: [heir]
    description: |-
      Heir apparent! The future of the fortress rests on your shoulders, and you are keen to ignore that fact in favour of whatever fun activities you have planned for right now.

      Parties, adventures, vices and all the other things that you won't be able to do when you are forced to take up responsibilities, they are your forte. The world is your oyster, and you can actually afford to make an impact on it!
  fate-successor:
    name: "Fate: Successor"
    public: false
    tags: []
    roles: [successor]
    description: |-
      The sibling of your brother, that is all people know you as, and you are keen to change that. Thankfully your father is too unimportant amongst the kingdom's nobility for you to have been married off for some temporary alliance.

      You still have your freedom to impact the world around you; you would be wise to make good use of it. Leave your mark on the world and maybe people will start to realise you are more than just some pretty-faced noble lady.
  fate-hand:
    name: "Fate: Hand"
    public: false
    tags: []
    roles: [hand]
    description: |-
      Growing up with the Baron, you know him inside and out, and only you are privy to some of his most hare-brained ideas. You have made sure to gently let him down on many occasions, turning his deluded commands into sensible policies, all the while letting him take the credit for the prosperity you have created.

      You are perhaps the only person in Ravenheart who can save the Baron from himself, good luck.
  fate-meister:
    name: "Fate: Meister"
    public: false
    tags: []
    roles: [meister]
    description: |-
      Endlessly overworked, you must somehow turn failed harvests and catastrophic disasters into financial gains for the Baron. After all the economic miracles you have worked for the treasury in the past, expectations are high.

      Micromanagement is key, the Banneret cannot be relied upon if experience has taught you anything. Make sure your presence is overbearing and scrutinize every {tag:obol} and resource they send your way. If the treasury winds up empty, you will be the one taking the fall along with the Banneret.
  fate-arbiter:
    name: "Fate: Arbiter"
    public: false
    tags: []
    roles: [arbiter]
    description: |-
      The God-King has sent you here to ensure his will and laws are followed to the letter. Petty nobility like the Baron have a bad habit of warping the law to their own desires, make sure to remind them of their obligations.

      If things are going wrong in Ravenheart, it is the Baron's fault and you must ensure he is accountable for it.
  fate-courtier:
    name: "Fate: Courtier"
    public: false
    tags: []
    roles: [courtier]
    description: |-
      The Baron saw fit to recruit you to his court, and now he expects you to earn your keep. Show your liege how indispensable your skills, talents and advice are, or you might be quietly sent away.
  fate-minstrel:
    name: "Fate: Minstrel"
    public: false
    tags: []
    roles: [minstrel]
    description: |-
      The court's entertainer, not everyone understands the appeal, but for some reason the Baron can't get enough of you! The keep can be a very tense place, and the Baron is no stranger to losing his temper. You must keep this place sane by providing the occasional whimsical routine, if tensions get too high perhaps the Baron will find your head on a spike to be the most entertaining thing to do with you.
  fate-servant:
    name: "Fate: Servant"
    public: false
    tags: []
    roles: [servant]
    description: |-
      Cook, clean and serve! Your pay is meagre, but in return you are granted a place in the Lord's opulent keep. The Baron and his family expect hot food to be prepared without them even asking, fail at this and you might end up out in the cold.

      Chop Chop!
  fate-bishop:
    name: "Fate: Bishop"
    public: false
    tags: []
    roles: [bishop]
    description: |-
      Guide the faithful and let none stray from the church's strict doctrines! You have been the anointed Bishop of Ravenheart for quite some time, and despite all your efforts many of the flock seem more interested in worldly vices. You must redouble your efforts and enlighten them, lest they damn their immortal souls.

      The inquisitor arrived in Ravenheart not too long ago, he will be your greatest ally in saving Ravenheart from damnation. Make sure you hold regular sermons, or the faithful will surely start losing sight of God-in-Coma.
  fate-chaplain:
    name: "Fate: Chaplain"
    public: false
    tags: []
    roles: [chaplain]
    description: |-
      Man of the cloth, you have seen the light of God in Coma and dedicated your life to honouring him. Many in Ravenheart find themselves jaded and lost, it is your duty to provide them with a path back to grace. Counsel those who bear guilt, nourish those who might go hungry and enlighten those who have lost faith. All the while, inform the inquisition of exactly who might be a little too far from God…
  fate-inquisitor:
    name: "Fate: Inquisitor"
    public: false
    tags: []
    roles: [inquisitor]
    description: |-
      This place is teeming with heresy. You could sense it, even when you first arrived. Since then, you have been working tirelessly to uproot the evildoers who hide amongst the flock. Asking nicely and observing passively will get you nowhere, evil knows how to hide itself and does so with ease. Answers must be beaten out if you are to ever get to the bottom of this.

      Dispatch your practicii to ask around town, the faithful will either be eager or intimidated enough to share all the suspicious things they have seen. And those who lie you can always go back for later.

      God be saved, dear inquisitor. You must succeed or else damnation is all but assured for this wretched place.
  fate-practicus:
    name: "Fate: Practicus"
    public: false
    tags: []
    roles: [practicus]
    description: |-
      The inquisitor is many things, but they are still only one person. You must be their extra eyes and hands. Stick with your mentor as much as you can and do as they ask of you.

      There is no such thing as unwarranted suspicion, and deeper evil is almost always behind those who seem out of place.
  fate-preacher:
    name: "Fate: Preacher"
    public: false
    tags: []
    roles: [preacher]
    description: |-
      You came here as a part of the larger inquisitory effort. Your role is to radicalize the common people against the heresy and evil which plague them. Show them exactly what is the root of all their hardships and lead them forward in purging it from Ravenheart!

      The minds of the faithful are as much a battlefield against the cultural poison of heresy as the physical realm. You are the inquisition's greatest asset in establishing religious purity in this place.

      Call out the sinful, shame them for all to see!
  fate-censor:
    name: "Fate: Censor"
    public: false
    tags: []
    roles: [censor]
    description: |-
      Captain of the guard, your existence is dedicated to serving the Baron. Your desire for self-preservation is derived only from your use as a tool to your liege. Enact his will without question and see that your subordinates possess the same zeal as yourself.

      Give regular assignments to your cerberii and receive any reports of incidents in town. You are the Baron's first line of defence against those who seek to undermine his rule.
  fate-incarn:
    name: "Fate: Incarn"
    public: false
    tags: []
    roles: [incarn]
    description: |-
      Stern and resolute, your service to protect your liege is a service in honour of God-in-Coma. You are tasked with manning the gates of the fortress, as none in the garrison have a better eye for evil than you. Grant passage to those who deserve it, and do not be afraid to reject or detain any who you suspect seek to enter the fortress with malicious intents.

      As a warrior of God, one of the only things that can lure you from your post is the fear of missing one of the Bishop's sermons. God be saved, dear Incarnatus!
  fate-cerberus:
    name: "Fate: Cerberus"
    public: false
    tags: []
    roles: [cerberus]
    description: |-
      Loyal dog of the Baron. You have been thoroughly trained to follow orders given by your liege and captain without thought. You pride yourself on your ability to fulfill the duties assigned to you and are haunted by the fear of failure.

      Try and always have a duty assigned to you, seek out your superiors asking how you can serve. Do as they ask, and no more. If a criminal is ordered to be brought before the Lord's feet, do not maim them in the process, unless specifically ordered to.

      Your zeal for serving your liege does not rival that of your captain. Nevertheless, your life revolves around your service to the Baron and you should follow all but the most preposterous orders without question.
  fate-squire:
    name: "Fate: Squire"
    public: false
    tags: []
    roles: [squire]
    description: |-
      A Cerberus in training, stick to whoever is assigned to train you like glue. Help them in their assigned duties and learn the ropes along the way.

      Time spent separate from your mentor is time wasted, if you ever wish to be promoted you need to always stay by their side. If you lack a mentor, you should be making every possible effort to find a new one straight away.

      You lack the zeal and unquestioning loyalty of the cerberii to your liege, but you are no old dog and learning tricks is what you are good at.
  fate-esculap:
    name: "Fate: Esculap"
    public: false
    tags: []
    roles: [esculap]
    description: |-
      It has been many years since you swore yourself to use your skills to heal and treat the sick. Since then, you have seen how the feckless bickering of the town leaves them broken and scarred, and how they all seem to expect you to fix it.

      Your task is not an easy one, many cling to the assumption that treatment comes easy. The sanctuary was built on a brutal regime of profit driven healing, not charity.

      Organise your serpents, delegating healing and preparation of tonics and medicines. Set reasonable but also profitable prices for each treatment, or your beloved sanctuary may go under. If all else fails, human organs will always fetch a high price, and there are plenty to go around.
  fate-serpent:
    name: "Fate: Serpent"
    public: false
    tags: []
    roles: [serpent]
    description: |-
      Trained in the art of healing, your mentor and boss the Esculap both guides you and pays you for your help around the Sanctuary. There is a lot of work to do running the sanctuary, help them as best you can.

      Stay up to date with the prices for each treatment as prescribed by your mentor. Consistent profits are what keeps the sanctuary running, and those who cannot pay should be turned away. Run errands, craft tonics and heal those the Esculap is too busy for. Anything in service of your beloved Sanctuary.
  fate-merchant:
    name: "Fate: Merchant"
    public: false
    tags: []
    roles: [merchant]
    description: |-
      You have been granted an official monopoly on the import and export of goods to and from Ravenheart. Since then, your depot and storefront has grown to be very lucrative, and you have enjoyed a steady stream of profits. You were even able to finance an automated turret, it will gun down anyone in the depot except you, in case things go awry.

      You have still yet to recoup the initial costs of setting up here and are very eager to do so as soon as possible. If you plan on turning a profit from this venture, you can't afford to offer fair prices. Your monopoly allows you to set whatever prices you want, and as the only supplier, the people will have no choice but to accept.

      Your dockers live on your payroll, they are reliant on you and will follow your demands out of fear of ending up destitute. Make sure to remind them of who pays their salaries.

      You have an automated vendor that people can buy from, even when you are away. Make use of it for the more mundane goods you offer.

      Your only loyalty is to your own profits. The people here are only as good to you as their ability to make you money, and you couldn't care less for their own internal squabbling unless it threatens your bottom line.
  fate-docker:
    name: "Fate: Docker"
    public: false
    tags: []
    roles: [docker]
    description: |-
      You work for the merchant and are wholly reliant on them for your survival. You aren't originally from these parts; you were hired and brought here when the merchant first established themselves. Since then, you have become more accustomed to the locals of Ravenheart, but you can't relate to them the same way you can to your fellow dockers.

      Do your best not to attract the ire of your boss. To lose your job would leave you stuck here, destitute and aimless. When you are being ordered around the depot, see what sort of entertainment there is to be had in town with your fellow dockers. The merchant has learned to accept you getting into the occasional bar fight as long as you get back in time to haul freight.
  fate-banneret:
    name: "Fate: Banneret"
    public: false
    tags: []
    roles: [banneret]
    description: |-
      You are a distant relative of the Baron, continually overlooked until your assignment here. Managing the factory, you must keep those working here on track to harvest as much {tag:godflesh} as possible. Fulfilling the Baron's quotas are your only way to get out of this stinking place and get an assignment more befitting your noble stature.

      Crack the whip and see to it that your geschef maintains maximum productivity amongst the workers with the occasional rough housing. Coordinate your progress in producing {tag:squeeze} with both the meister and merchant, they are the other two main links in the logistical chain that sees godflesh harvested, processed, exported and taxed.

      Migrants are continually arriving in Ravenheart, seeking shelter from the terrors further South. See that their ultimate destination is the factory floor, replacing the regular casualties that occur here. You will likely need to coordinate this effort with the captain and garrison. Those who refuse to work to earn their keep in Ravenheart need to be made examples of.
  fate-geschef:
    name: "Fate: Geschef"
    public: false
    tags: []
    roles: [geschef]
    description: |-
      You were once a worker on the factory floor, until the last geschef tried to prove how easy harvesting {tag:godflesh} was to the workers without proper protective equipment. Now it is your job to beat a satisfactory quota out of any would-be slackers.

      Make an effort to take regular head counts and keep track of how much each worker produces. Someone making significantly less than their peers is a clear sign of slacking and should be treated as such.

      Don't be afraid to put the boot to any who show signs of insubordination, injury is a normal part of this line of work and the workers organizing a strike would be the fastest way for you to end up with your head on a spike.
  fate-refugee:
    name: "Fate: Refugee"
    public: false
    tags: []
    roles: [refugee]
    description: |-
      You fled to Ravenheart from the South, seeking safety. Now the local authorities have found a way for you to earn your keep, harvesting and processing {tag:godflesh}. The work is hard and dangerous, while your pay is almost nonexistent.

      Meet your quotas, feign gratefulness for what little you earn and don't fuck up. Maybe then they will reassign you to a job breaking your back in the fields or mines.

      Escape is always an option, but as the strung-up corpses of ungrateful refugees who refused to work outside the factory demonstrates, it comes with its own risks. For now, just hope you can make it another day without losing any fingers.
  fate-sheriff:
    name: "Fate: Sheriff"
    public: false
    tags: []
    roles: [sheriff]
    description: |-
      Once a member of the guard, you haven't stepped foot in the cerberon for years. Your rigorous training in unquestioning loyalty to the Baron has decayed, and in its stead a new fondness for the townsfolk around you has grown.

      Your work leaves you continually conflicted, having to watch as the guards drag away someone you know because they let slip their true thoughts on the Baron. If you try to intervene it will likely be the end for you, but just how much can you tolerate of his abuse of the people?

      Walk this tightrope carefully, protecting those dear to you, while saving your own neck. Your people need you, good luck.
  fate-soiler:
    name: "Fate: Soiler"
    public: false
    tags: []
    roles: [soiler]
    description: |-
      Working the soilery, you provide food for the town and rear {tag:arelitz}. Years of ensuring the townsfolk don't go hungry has led to many taking the steady supply of food for granted. Few realise just how quickly things would fall apart in your absence.

      Sell your produce to any who can pay. Your most common customers are the inn staff and keep servants, both seeking to satisfy the appetites of those they serve. As the sole source of food in the fortress, you have a lot of leverage in how much people pay for food, exploit it.
  fate-mortus:
    name: "Fate: Mortus"
    public: false
    tags: []
    roles: [mortus]
    description: |-
      Some days you simply stare into the shifting metal and curdling machinery. All things in life seem to have lost their meaning, except for the mistress.

      The Lifeweb demands continual donations, and it is your duty to find donors. Ostracized and feared, the people have learnt that coming with you peacefully is rarely a good idea. As such, taking donors by force is often required if not expected.

      Your loyalty is solely to the Lifeweb, providing her with a steady flow of blood is all you care for anymore. As for providing for yourself, you are under the employment of the Baron, as your work is vital to the upkeep of his barony. Seek to arrange a liveable wage through him, supplemented with the belongings of donors fed to the Lifeweb.
  fate-innkeeper:
    name: "Fate: Innkeeper"
    public: false
    tags: []
    roles: [innkeeper]
    description: |-
      Overseeing the inn your family has run for generations, you strive to provide quality food and drink while earning a tidy profit. Your informal authority within the walls of your establishment is near absolute, and you reserve the right to deny service to any who cause trouble, short of nobles and the garrison.

      Running the only place in town that reliably serves hot food allows you to charge extortionate prices if you so choose, much to the dismay of the townsfolk.
  fate-inn-staff:
    name: "Fate: Inn Staff"
    public: false
    tags: []
    roles: [inn-staff]
    description: |-
      Eternally overworked, you rarely get a chance to get out of the inn for recreational time. Running between the kitchen and dining room, serving drinks and food, working the inn is both the coziest and most stressful job in Ravenheart. Perhaps tonight is the night you sneak out, and have some fun instead?
  lore:
    name: Lore
    public: true
    tags: []
    description: |-
      Humanity retreated into the caves after the Long Night. Evergreen was once beautiful and lush, but for unknown reasons, the surface froze and became barren, destroying its ecosystems.

      Far from the sun, electric lights illuminate Ravenheart, an ethereal castle ruled by its Baron. The only source of power is the Lifeweb — a revolutionary invention which turns human blood into electricity. While the nobility enjoy electrical appliances in the Keep and the merchant sells weird wares and lost technology, the life of a common Ravenhearter is medieval. Most of them use fire for light and simple tools for their work. They are superstitious and mostly illiterate. The Post-Christian Church is the official faith of Ravenheart, though some keep to the Old Ways in secret. Most of their days are spent working hard, but there is time for merry every once in a while. The current year is 1098.
  godking:
    name: God-King
    public: false
    tags: []
    description: |-
      Ravenheart's liege is God-King Enoch II, a mercurial and unpredictable ruler. Usually, he is quite calm and allows Ravenheart to do whatever it pleases. Wartime is a different matter however — and as of this year, he is busy trading howitzer blows with a rival state several mountain ranges south of Ravenheart. The Arbiter represents his interests in court and arranges the royal tithe if such a thing becomes necessary.

      He is accepted by the Post-Christian Church as an aspect or son of God. He took the place of Jesus who never came back, according to Post-Christian interpretations. His title is holy, as is his family, all members of which are considered godlike. Speaking out against him or disobeying his orders means certain death at the hands of his Tribunal.
  sanctuary:
    name: Sanctuary
    public: true
    description: |-
      The Sanctuary remains outside Ravenheart's feudal structure. Its plaster walls are stocked with near-modern medical equipment. There is a set of {tag:surgical-equipment} laid out in the operating theatre, which anyone in that room may use.

      The Sanctuary operates independently from the Baron. Although he could try to gain control over it, it would be unprecedented and pretty pointless. So the Esculap does whatever he wants within his walls.

      Due to the cost of medical procedures, the Esculap only treats people who can pay, or people of noble blood. You should only expect medical treatment if you can pay for it.
  production:
    name: Producing Resources
    public: true
    tags:
      - Prospecting
      - Soilery
    # [PLAYER TEXT — Bascinet to rewrite]
    description: ""
  mining:
    name: Mining
    public: false
    tags:
      - Prospecting
      - Pickaxe
    roles: [prospector, slave]
    description: |-
      Mining yields resources and precious metals, which can be inlayed by smiths into the lucrative trinkets. To mine, you must have a Pickaxe. The Prospecting skill boosts both your resource and precious metal yield.

      In the Black Hills the same day's work is called Gather. It needs no pickaxe, it still pays a few resources, and what you turn up beside them is something to eat rather than ore.
  combat:
    name: Combat
    public: true
    tags: []
    description: |-
      The nitty-gritty of combat is as important as the fighters' skills. Even a master fencer would struggle against a peasant in plate armor, and just a few horse archers can take out a whole squad of footpads. Different weapons excel in different circumstances, like how much space you have, whether you're alone or in formation, and whether your opponent is armored.

      **Melee**
      - Polearms are ubiquitous. Their reach means you can keep the opponent away and decide when the battle starts. They come in stabby, crushy, and pokey varieties.
      - Blunt weapons are useful even against armored targets, but won't help find weak spots.
      - Precision weapons, like swords held by the blade (halfswording) or daggers, are useful against armored opponents if you can wrestle them down to the ground.
      - Hidden weapons are useful in social environments.
      - Cutting and stabbing weapons really hurt unarmored people.
      - Axes can break shields or drag them out of position.

      **Ranged**
      - Bows and slingshots are quiet and really hurt unarmored targets. Very big bows can crack or penetrate armor.
      - Crossbows take time to reload but are better against armored opponents.
      - Firearms beat everything.

      Shields are very useful. For armor, there's a few important traits: material, concealability, weight, and donning time. Some items can be worn under regular clothes. Certain items, like plate, will make a long trek through the forest difficult but make you a veritable tank in combat. However, it also has the downside of being hard to equip, so if you're at a feast and someone pulls out a dagger, you'd better have a padded jack or brigandine underneath.

      **Energy Shields**
      - Stop projectiles.
      - Reduce, but don't stop, melee damage.
      - Do nothing against needles or syringes.
      - Worn on the belt or the wrist.
  lifewebbasic:
    name: Lifeweb
    public: true
    tags: []
    description: |-
      The Lifeweb is an ancient piece of machinery below the Fortress. It produces electricity, powering Ravenheart and keeping the darkness away in exchange for human blood.

      The Lifeweb is tended by the Mortii. The Mortii are rejects, outcasts, exiles, hunchbacks, and convicts.
  respawning:
    name: Respawning
    public: true
    tags:
      - Chaplain
      - Mortus
      - Dead
    description: |-
      You can't respawn, except as a Special role, until someone buries your body or engraves your name. Special roles include late-join events.
  # Both Tribunal seats' own brief, reached by `roles:` the way elevatorkey
  # reaches the Baron. The key is `tribune` and one of the roles is too; they
  # are separate namespaces.
  tribune:
    name: Tribune
    public: false
    tags: []
    roles: [tribune, tribunal-ordinator]
    description: |-
      You are a member of the Tribunal. You are a fearless veteran soldier, the best on Evergreen. You are stoic, competent, capable, and mature. When interacting with the citizens of the shit-dirt barony of Ravenheart, you are expected to represent the God-King — do not lower yourself to them. They are animals in the mud, after all.
  courtstructure:
    name: Court Structure
    public: false
    tags: []
    description: |-
      The Baron's rule is absolute. He has a small council including the Hand, the Meister, the Censor, and any other courtier he might assign.

      The Hand's the voice, the organizer, the executor. He outranks everyone except the Baron.
      The Meister collects taxes and provides medical attention.
      The Censor commands the Cerberon.

      The rest of the court, the Baron's family included, live their lives.
  cerberon:
    name: Cerberon
    public: false
    tags: []
    description: |-
      The Cerberon, along with the sheriff and the Order of the Silver Cross, is Ravenheart's single line of defense. It's led by the Censor.

      Every Cerberus has a {tag:disabler} (takes several shots; useful against unarmed people, but not someone who can run up to you and take it out of your hands), but otherwise relies on their armory. The Censor and the Incarn both have a key. The Fortress's yard also has an automated machine-gun turret. It shoots anything that moves. The switch to enable it is in the Censor's office.

      All Cerberi are expected to be, at minimum, functioning men. They are all loyal to the Baron. The Censor can freely fire, hire, and equip more Cerberi. Consider buying firearms from the Merchant.

      Cerberi also carry a {tag:radio-bracelet-cerberon}, which connects to the Censor's {tag:radio-system-cerberon}.
  postchristianity:
    name: Post-Christianity
    public: true
    tags: []
    description: |-
      Post-Christianity believes in God and Christ. Its doctrines are non-specific, as different people practice in different ways. However, there's a few commonalities:

      - The virtues are as important now as they ever were. The world is a dark place, but it still has room for goodness.
      - Christ never returned. The Earth was ruined, and we were left behind. It is our responsibility to redeem ourselves and await the afterlife.
      - There is a heaven, so we can endure anything that happens here — just remain pure.
      - There is also a hell, so we must protect others from descending into the spiritual darkness that's consumed the rest of the world.
  caving:
    name: Caving
    public: true
    tags: []
    description: |-
      The caverns around Ravenheart host all sorts of ancient dangers and treasures.

      The two underground regions are the caves and the depths. The caves are familiar to Ravenheart's more intrepid residents, while the depths descend inhospitably deep.

      Each movement from a location to another within the caves has a chance to trigger an encounter. These encounters vary significantly; you could find useful tools and valuables, or you could run into grave danger. Hunkering down in a single location reduces your chances of running into an unwanted encounter. Dangerous encounters triggered during a turn are deliberated at the end of the turn. You can still move locations after triggering one, but if you trigger more negative encounters, it will make your chance of survival far lower. Trigger 10 in one turn and whatever is down there has you: you can't move at all until the turn ends.

      You can do three things in the caves:

      - Roll encounters,
      - Use Gambits as normal, specifying whether you'd like to hunt a specific beast, scavenge for an item, or search a specific room.
      - Fulfill Quests, dangerous but rewarding opportunities that randomly appear in cave locations. This is where the true treasure can be found.

      You can also harvest {tag:cave-fungus} in just about every location (by doing a Gambit, or just through the encounter roll). The caves hold many secrets, requiring certain character traits or knowledge to gain access to.

  # The Merchant Update filled this in — it was an empty stub for as long as
  # the seat was unfinished. Reached by both The Company roles, so the
  # Dockers read it too: they are the ones hauling the goods. The canonical
  # numbers are docs/systemdocs/DEPOT.md §3-4; this is the player-facing
  # half and only carries the bands, never the full table.
  merchant:
    name: The Merchant's Depot
    public: false
    tags: []
    description: |-
      Your terminal is at the Depot. Anyone standing there can press it, but only your License, or your ring on your finger, unlocks it. Once it's open you see every ware the Company ships, grouped, each with its price with the Meister's tax on it, and you order as many as the terminal can pay for.

      The terminal keeps its own obols, apart from any account. Feed it coin from your pocket, and take coin back out whenever you like, except what's promised to orders still waiting on the train.

      Nothing is paid when you order. The cargo train runs every other day on its own; when it comes in, it takes the cost of everything on order out of the terminal in one go, with the Meister's tax on top, and sets the goods down on the Railway in crates. A mount comes loose. Until the train comes, any order can be changed or cancelled from the Pending orders tab.

      Selling is loading the train. When it leaves it takes every crate on the Railway, and any mount or ⬢ lying there, and pays the terminal what it was all worth, less the Meister's tax. A crate is worth everything packed in it. Anything else left loose on the platform stays where it is, so pack it first; the packing bench is in your Cargo Bay.

      Prices hold to bands: a brew sells for close to what it cost to make plus a margin, smithed gear pays better the more skill and turns went into it, cave loot and bulk goods hold their price, and body parts stay cheap on purpose.

      Crates are heavy. Nobody carries more than one at a time, or three with a Cart on, and hauling them wears people out unless they're built for it. Your Dockers are. You aren't.

      Customers don't come into the Depot: the way from the Storefront is locked to you and your Dockers. They deal with you across the Merchant's Counter, which opens onto both, and you can hand things to each other across it.

      There's a vendor on your Counter, on the Storefront side, and it sells while you're asleep. Your License is what opens it: unlock the front, put things on the shelf, set a price on each, and lock it again. After that anybody who walks in can feed it coins and take what they can pay for, and what they spend waits inside for you to withdraw.

      Three things to know before you stock it. Only one customer can be at the vendor at a time, and they get five minutes — that's what stops somebody standing there pocketing the coins the last person fed in. Coins left in the slot when that time runs out stay in the slot: they don't come to you, and the next customer can spend them or walk off with them, so tell your regulars to take their change. And the room sees what comes out of it, so anybody standing at the Counter knows what your customers are buying.

  charon:
    name: Charon
    public: false
    secret: true
    tags: []
    description: |-
      The Charon is a one-way spaceship. It'll take its passengers out into space, where a passenger liner called the Leviathan is allegedly waiting for refugees.
  # GM-only. The `gamemaster` flag is not a property of any Character — the
  # documents page resolves it against the Discord GM role at request time,
  # the same check that gates /gm. Filtered server-side, so a player's browser
  # never receives this text at all.
  cavingmonsters:
    name: Caving Monsters
    public: false
    tags: []
    flags:
      - gamemaster
    description: |-
      Some monsters to use in caving.

      **Nekkers**

      Weak, quadrupedal, ape-like scavengers. They eat corpses and can often be seen on the surface after battles, competing with the vultures. Killing one leaves a {tag:nekker-corpse}, which a {tag:butcher} can cut {tag:nekker-pheromones} out of.

      **Gragas**

      Dangerous, strong, hulking cave dwellers. Extremely slow, in part due to their overburdened leg muscles, which barely support them.

      Can be easily escaped. Killing them leaves a {tag:graga-corpse}, which a {tag:butcher} cuts a {tag:graga-sac} out of; that goes into {tag:graga-sweat}. The Merchant can sell Graga Sacs.

      **Skinless**

      Explorers and citizens of the caves. They travel alone or in packs, eventually returning to their communities in the **Aberrant Pits**. They rarely venture up into the Caverns. They used to be people. They can be talked down.

      Killing them leaves a {tag:skinless-corpse}; a {tag:butcher} cuts the {tag:skinless-brain} out of it, and that brain is the one ingredient in the {tag:dreamers-draught}. The Merchant can sell them. Note what that means: the Draught has a price, and the price is that somebody chose not to talk one down.

      **Aberrants**

      Horrors. Drop Aberrant Hearts.

  # The Demoness threat's own brief (db/lib/threats.js). Assigned by the
  # Demoness tag, which is also what unlocks the hidden Demoness tag
  # category — so the paper and the powers arrive together.
  demoness:
    name: Demoness
    public: false
    secret: true
    tags:
      - Demoness
    description: |-
      You are a being from the Caves. You have been alive for a long time, but your memory is fuzzy.

      You don't need to eat. Instead, you live for the thrill of enslaving souls, manipulating people, and causing pain. You will become unhappy if you don't.

      You can Break souls — see {tag:demoness}. If you have {tag:slavemaster}, they become {tag:broken-enslaved} instead of merely {tag:broken}.

      You find normal crosses tacky and boring. Fire scares you somewhat — it definitely hurts. The Silver Cross, on the other hand, terrifies you. If you touch it, your powers are disabled for the rest of the day.

      There may be people in the area who want to use your power. They'll take your treasured independence — the demented, servile idiots.

  # THE VAMPIRE (docs/systemdocs/VAMPIRE.md). Bascinet's text, from
  # E:\Bascinet\V3\Vampires\Vampire document.docx; the edits are the {tag:…}
  # tokens and "3 days" as a digit. Secret like the Demoness brief: the Vampire
  # and Thrall tags hand them out, and otherwise only the host reads them.
  vampire:
    name: Vampire
    public: false
    secret: true
    tags:
      - Vampire
    description: |-
      Creature of the night, you have exchanged your mortal soul for eternal life. To sustain yourself, you must feed on the blood of mortals, lest your thirst overwhelm you. Temper yourself against needless slaughter, your connection to this mortal coil is frail as it is.

      Vampires possess two main attributes, blood and humanity.

      Your blood level will continually drain as time passes and must be quenched by submitting a hostile gambit against a mortal in the same location as you. Pick your targets wisely and strike without delay. If you go too long without sating your thirst, your monstrous nature will force your hand, and you will no longer have the luxury of choice as to who you victimise.

      Your humanity is your connection to the mortal world around you, and your capacity to control yourself. Two main things can cause you to lose your sense of humanity, murder and bloodlust.

      Slaying a mortal, regardless of your reason, will cause you to lose humanity. The manner in which you kill is important, to kill in self defence is significantly less severe than to kill wantonly.

      Entering a bloodfrenzy ({tag:bloodcrazed}) occurs when you go too long without feeding and causes a major loss in your humanity. Avoid this at all costs.

      Your humanity gradually recovers over time, however if you lose all sense of humanity, you will irreversibly give in to your bestial nature ({tag:bestial}).

      Vampires possess many powerful abilities. In your character sheet the blood menu shows what abilities are available to you, and how much blood they will cost. You can unlock more abilities as well as other boons with tag points.

      Enthralling someone ({tag:thrall}) will make them dependent on you to survive, you will have to repeatedly let them taste your eternal lifeforce, or they will perish. Have them complete your bidding, and reward them for their efforts.
  thrall:
    name: Thrall
    public: false
    secret: true
    tags:
      - Thrall
    description: |-
      Ensnared by the promise of eternal life, you cannot turn back now!

      As a {tag:thrall}, you must taste eternal vigour from your vampiric master once every 3 days ({tag:vampire-blood-addict}). If you do not, you will perish. You are encouraged to serve them for your own self-preservation, but you can choose to sacrifice yourself to betray them if you would like.
  # Bascinet's text, from E:\Bascinet\V3\Skill Documents\Farming.docx.
  # Reached by the Soilery skill (the farming skill), and by the Soiler's
  # doc_elements, which pointed at this key while it was still a stub. The
  # seed-bag sentence and the stable's feed were brought in line with the
  # Soilery Rework doc (Soilery/Soilery Rework.docx).
  farming:
    name: Farming
    public: false
    tags:
      - Soilery
    description: |-
      Growing food is an arduous process and can only be done in the soilery.

      Plant crops with the farm action. Each one that doesn't wither comes in as {tag:foodstuffs} when the turn is pushed, and the work leaves you {tag:exhausted}.

      The soilery has a stable where you can keep {tag:arelitz}. Leaving Foodstuffs for them will nourish them to produce eggs, and eventually, more arelitz.

  # Referenced by roles via doc_elements but not yet written. Stubs keep the
  # reference resolvable (same posture as Guard Duty above) — fill in the
  # description when the content is ready.
  armory:
    name: The Armory
    public: false
    tags: []
    description: ""
  inn:
    name: The Inn
    public: false
    tags: []
    description: ""
  squeeze:
    name: Squeeze
    public: false
    tags: []
    roles: [banneret, baron, merchant, hand, meister]
    description: |-
      A pink substance with similar but less exotic properties to the {tag:skinless-brain}. These are very valuable across Earth.

      The Baron highly values the Banneret's work on the Squeeze, as it singlehandedly funds Ravenheart's warchest. Squeeze has no use for anyone in Ravenheart, but without its production, Ravenheart wouldn't be able to grow at all. Its production is very dangerous.

      Squeeze sells for 7 ¢ at the Merchant's Depot. The Merchant has, in the past, traditionally taken 1 or 2 ¢ per, leaving the Banneret with 5 or 6 per cube.
  economy:
    name: Economy
    public: true
    tags: []
    roles: [meister, baron, hand]
    description: |-
      Ravenheart's economy functions in a simple way. Crafters and producers sell their goods at the depot's Dropbox, which is automatically collected into the seller's account. A sell tax, set by the Meister, is automatically withheld. Interesting goods can be bought from the Merchant.

      Everyone's accounts are backed by the treasury in the Keep, so if everyone draws at the same time, the Keep will be unable to pay its dues.
  godardfactory:
    name: Godard Factory
    public: false
    tags: []
    description: |-
      Godard's beauty days are over, but it still functions. The Banneret's lineage, one of the Baron's cadet houses, has (usually grudgingly) employed refugees to extract {tag:godflesh} from the refuse pit and refine it into {tag:squeeze}, which is then shipped off to the merchant. It is generally unknown what Squeeze does or why it's so valuable. Unfortunately, due to the working conditions, most refugees don't stay for long and usually try to make it to the town. They're easily replaced, so it doesn't matter.

      Anyone with a hatchet or chainsaw equipped can obtain Godflesh by pressing the Harvest Godflesh button from the character panel while in the refuse pit. You can only do it once per turn. To turn it into {tag:squeeze}, press Refine while in the factory. You must have Godflesh in your inventory or somewhere in the factory. You will then obtain eight Squeeze cubes. Crate these up and load them into a cart!

      Extracting is dangerous, because the Godflesh is a living thing with swarming mouths that try to eat you. You run a risk of getting wounded. On the upside, working at the Factory gives you a chance of social mobility — a good Banneret will pay you much more than the average commoner would make, if only to keep you around.

  # Granted two ways on purpose: by the Elevator Key tag, so anyone who ends up
  # holding one learns what it opens, and by role to the Baron (whose secret it
  # is) and the Tribune (who is not given a key but is told the way in). The
  # Ordinator needs no role entry — they carry the key, so the tag covers them.
  elevatorkey:
    name: Elevator Key
    public: false
    secret: true
    tags:
      - Elevator Key
    roles: [tribune, baron]
    description: |-
      The elevator connects the Keep to the Refuse Pit.

  # THE THANATI (docs/systemdocs/THANATI.md). Bascinet's text, verbatim; the
  # only edits are the {tag:…} tokens, which the source wrote as {Name}.
  cultist:
    name: Cultist
    public: false
    tags:
      - Thanati
    description: |-
      This reality is flawed to its core! Lord Tzchernobog will deliver a new, perfect reality once this one has come to an end, when the last human observer has passed into nothingness.

      You and your fellow cultists must obey the instructions of your leader and ultimately, Tzchernobog. You can see who your fellow cultists are with the Recall Comrades button.

      Secrecy is your greatest strength. Ever since the arrival of the Inquisitor, the cults position has been tenuous. The capture of one of you will result in your exposure, death is preferable to what the sadistic inquisition will do to you.

      You may retrieve your {tag:black-robes} and {tag:thanati-mask} at any time while in Ravenheart, by spending an action. You must wear them to perform rites, and use cursed items. Be careful, they give away your position as a heretic when worn.

      You can see your fellow members by using the **Recall Comrades** button.

      You can craft Flesh of Tzchernobog using 1 resource. Consume it in order to conduct rites.

      You can craft the {tag:grimoire} using 1 {tag:blank-book}. It will detail the available rites and their words of corruption.

      Seek to meet up with your cult leader and commence the initial rite. It will let you hear the bidding of Lord Tzchernobog.

      Your cult has a hideout somewhere in Ravenheart, here you can stockpile resources and items. You may also purchase illicit goods here, see the Thanati Network document for more information.

      Victory is to complete all, or as many objectives as possible. From there, you will be rewarded, even if you die.
  rites:
    name: Rites
    public: false
    tags:
      - Thanati
    description: |-
      The list of rites and their words can be obtained by crafting a {tag:grimoire}, which takes 1 {tag:blank-book}. To fulfill a rite, consume a {tag:flesh-of-tzchernobog} to gain {tag:dark-inspiration} and then prepare the ingredients — hold them or set them on the ground where you plan to commence the rite. You must then chant the Word of the Circle in a conversation or in the room. To account for time zones, you have twelve hours to meet the requirements after beginning. Once completed, you have an extra minute for any other cultists who wish to join in the chanting.
  cult-leader:
    name: Cult Leader
    public: false
    tags:
      - Thanati Leader
    description: |-
      You have emerged as the leader of Ravenheart's cell of Thanati. They will follow your every order, and you must lead them to accomplish the Dark Lords instructions.

      You are the brains behind all the cults schemes. If you are captured, the entire cult will be in jeopardy. Have your underlings perform the riskiest of tasks instead.

      You oversee management of the cults resources and stockpile. Equip your cultists however you see fit.

      Your presence is required for the most important rites. Good luck.
  # Readable by the cult and by the clergy — the Church's seats and the
  # Order's — through `roles:`, the same way elevatorkey reaches the Baron.
  thanati:
    name: Thanati
    public: false
    tags:
      - Thanati
    roles: [bishop, chaplain, inquisitor, practicus, preacher]
    description: |-
      The Thanati are a violent death cult, seeking to bring an end to this reality. In their eyes it is flawed and broken, and must be torn down so that their lord, Tzchernobog can rebuild it anew. Only when the last human observer ceases to exist can this reality end.

      In recent times, the local Thanati cell was expanding throughout Ravenheart, threatening to upend the entire region. As such, the inquisition was dispatched to purge Ravenheart of the sin that had come to fester beneath the surface.

      Thanati cultists can be identified by their dark robes, heretical chants and burning hatred for the Post-Christian church. Due to the presence of the inquisition, the members have gone into hiding, however they are far from idle. The cult will conduct secretive sigils in the dark corners of the fortress, communing with their dark lord.

      **Common Thanati Chants:**

      "Crudux Cruo!"

      "Geroxe bibox malax!"

      "Geroxe Cruo!"

      "Maranax infirmux!"

      These chants allegedly commune with Tzchernobog, granting his servants strength as they conduct his bidding.
  thanati-network:
    name: Underground Thanati Network
    public: false
    tags:
      - Thanati
    description: |-
      The Thanati have cells established all over the planet, and maintain close logistical connections. Cultists may access the network while in their hideout, exchanging resources for equipment. Generally, only the cult leader is permitted to handle the ordering of equipment.
  # The Grimoire's body is GENERATED, never authored here: /documents expands
  # the {grimoire} marker from db/lib/rites.js and this game's rolled Words of
  # the Circle (web/lib/grimoire.js). Unlocked by holding the Grimoire tag.
  grimoire:
    name: Grimoire
    public: false
    tags:
      - Grimoire
    description: "{grimoire}"
